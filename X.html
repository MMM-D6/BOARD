<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X</title>
<style>
:root{
  --bg:#eef1f3; --grid:#dfe4e8; --card:#ffffff; --ink:#1b2227; --muted:#6a767e; --line:#d3dadf;
  --accent:#1f5f8a; --accent-bg:#e2eef7; --warn:#2b4a9b; --warn-bg:#e3e9fa;
  --bar:#f8fafb; --shadow:0 1px 2px rgba(20,30,40,.08),0 2px 8px rgba(20,30,40,.06);
  --tint:rgba(40,60,80,.055); --tint-line:rgba(40,60,80,.16);
  --fr:rgba(40,65,88,.20); --frbg:rgba(255,255,255,.38); --tw:rgba(31,95,138,.45);
  --glass:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.30));
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 .6px rgba(40,65,88,.13),inset 0 -1px 1px rgba(40,65,88,.04),0 1px 2px rgba(15,30,45,.06),0 3px 8px -4px rgba(15,30,45,.12);
  --cy:#fff6c8; --co:#ffe6cc; --cr:#ffdede; --cp:#ece2fa; --cb:#dcebfa; --cg:#ddf3e4; --cn:#eceff1;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14191d; --grid:#1d252b; --card:#1d252b; --ink:#e2e7ea; --muted:#94a1a9; --line:#2f3a42;
  --accent:#7cb6de; --accent-bg:#1c3446; --warn:#a9bdf2; --warn-bg:#1f2a47;
  --bar:#181e23; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  --tint:rgba(255,255,255,.06); --tint-line:rgba(255,255,255,.16);
  --fr:rgba(255,255,255,.16); --frbg:rgba(255,255,255,.025); --tw:rgba(124,182,222,.55);
  --glass:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 .6px rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.25),0 3px 8px -4px rgba(0,0,0,.4);
  --cy:#3a3520; --co:#3d2e1f; --cr:#3d2426; --cp:#30283f; --cb:#1f3042; --cg:#1f3a2c; --cn:#2a3036}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--f);font-size:14px;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{resize:vertical;width:100%}

/* the bar floats over the canvas with no background of its own */
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:transparent;pointer-events:none}
#top>*{pointer-events:auto}
#top .sp{pointer-events:none}
#file{font-size:12px;letter-spacing:.02em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#top .sp{flex:1}
#zoom{min-width:54px;font-variant-numeric:tabular-nums;color:var(--muted)}

#canvas{flex:1;position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:20px 20px;touch-action:none}
#canvas.panning{cursor:grabbing}
#canvas.linking{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
/* pages: a light frame with its title above; only the title and the corner take the mouse */
#frames{position:absolute;left:0;top:0}
.frame{position:absolute;border:1.5px solid var(--fr);border-radius:12px;background:var(--frbg);pointer-events:none}
.frame.sel{border-color:var(--accent)}
.frame .fr-t{position:absolute;z-index:4;left:4px;bottom:100%;margin-bottom:6px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);white-space:nowrap;pointer-events:auto;cursor:move;user-select:none;padding:2px 0}
.frame.sel .fr-t{color:var(--accent)}
.frame .fr-rs{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;cursor:nwse-resize;pointer-events:auto}
/* twin badge: ◈ goes back to the source, the number steps to the next place */
.card .twin{position:absolute;right:4px;bottom:100%;margin-bottom:2px;display:flex;align-items:center;gap:3px;font-size:10px;line-height:14px;
  font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--muted);opacity:.65;cursor:pointer;white-space:nowrap}
.card .twin:hover{opacity:1;color:var(--accent)}
.card.isTwin{box-shadow:inset 3px 0 0 var(--tw),var(--shadow)}
.card.isTwin.sel{box-shadow:inset 3px 0 0 var(--tw),0 0 0 2px var(--accent-bg),var(--shadow)}
#links path{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.6}
.empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none;text-align:center;line-height:1.8}
#marq{position:absolute;border:1px solid var(--accent);background:rgba(125,125,125,.13);border-radius:2px;pointer-events:none;z-index:15}
#linkBar{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--card);padding:4px 12px;border-radius:6px;font-size:13px;z-index:10}

.card{position:absolute;width:max-content;min-width:96px;max-width:250px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px 4px;box-shadow:var(--shadow);user-select:none}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg),var(--shadow)}
.card.open{z-index:5}
/* the card being edited or resized always sits on top of its neighbours */
.card.editing,.card.rzing{z-index:7}
.card.c-y{background:var(--cy)}.card.c-o{background:var(--co)}.card.c-r{background:var(--cr)}
.card.c-p{background:var(--cp)}.card.c-b{background:var(--cb)}.card.c-g{background:var(--cg)}.card.c-n{background:var(--cn)}
/* invisible resize grip in the bottom-right corner; double-click it to go back to the default size */
.card .rz{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:2}
.card.linkfrom{outline:2px dashed var(--accent)}
.card .row{display:flex;gap:7px;align-items:flex-start}
.card input[type=checkbox]{margin-top:3px;accent-color:var(--accent);flex:none}
/* a note card has no checkbox, so its extras line up with the card edge */
.card.note .chips,.card.note div.res{margin-left:0}
.card .t{flex:1;min-width:0;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap;outline:none;min-height:21px}
.card .t[contenteditable=true]{user-select:text;cursor:text;background:var(--tint);border-radius:4px;padding:0 3px}
.card .t:empty::before{content:"（空）";color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:5px 0 0 20px}
.chip{font-size:11px;line-height:18px;padding:0 6px;border-radius:9px;background:var(--tint);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.blk{background:var(--warn-bg);color:var(--warn)}
.chip.crit{border:1px solid var(--line);background:transparent;white-space:normal}
.chip.res{display:inline-flex;align-items:center;gap:3px;height:17px;line-height:1;padding:0 5px;background:var(--accent-bg);color:var(--accent);cursor:pointer}
.chip.res .ar{font-size:8px;line-height:1}
.ts{font-size:10px;line-height:12px;color:var(--muted);opacity:.8;margin-top:2px;display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
/* resistance notes, inside the card */
div.res{margin:7px 0 2px 20px;display:flex;flex-direction:column;gap:5px;cursor:default}
.ri{font-size:12.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:8px;padding:4px 9px;user-select:text;background:var(--glass);
  -webkit-backdrop-filter:blur(6px) saturate(140%);backdrop-filter:blur(6px) saturate(140%);box-shadow:var(--glass-edge)}
.resIn{font-size:12.5px;padding:4px 9px;line-height:1.5;border:0;border-radius:8px;background:var(--glass);box-shadow:var(--glass-edge)}
.rh{font-size:10.5px;color:var(--muted)}

#menu{position:fixed;z-index:50;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:4px;display:none;max-height:80vh;overflow-y:auto}
#menu .mi{display:flex;justify-content:space-between;gap:14px;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
#menu .mi:hover{background:var(--accent-bg)}
#menu .mi.danger{color:var(--warn)}
#menu .sepl{height:1px;background:var(--line);margin:4px 2px}
#menu .k{color:var(--muted);font-size:12px}
#menu .mhd{padding:4px 10px 2px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#menu .mrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px 8px 3px 10px;max-width:320px}
#menu .mrow .ml{min-width:30px;color:var(--muted);font-size:12px}
#menu .mb{min-width:22px;height:22px;padding:0 5px;border:1px solid var(--line);border-radius:5px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
#menu .mb:hover{border-color:var(--muted)}
#menu .mb.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#menu .mb.sw{width:22px;padding:0}
#menu .mb{white-space:nowrap}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;z-index:60}
#dlg .box{background:var(--card);border-radius:10px;padding:16px;width:min(380px,92vw);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#dlg .box h3{margin:0;font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* notebook button on each card: a tiny Notes-style pad, shown on hover, stays faintly when the card has notes */
.card .nbk{position:absolute;top:7px;right:6px;width:14px;height:14px;padding:0;border:0;border-radius:3px;cursor:pointer;opacity:0;z-index:3;
  background:transparent url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 14 14%22%3E%3Crect x=%221.5%22 y=%221.5%22 width=%2211%22 height=%2211%22 rx=%222.6%22 fill=%22%23fff%22 stroke=%22%239aa6af%22 stroke-width=%22.9%22/%3E%3Cpath d=%22M1.5 4.6V4.1A2.6 2.6 0 0 1 4.1 1.5h5.8a2.6 2.6 0 0 1 2.6 2.6v.5z%22 fill=%22%23f5c400%22/%3E%3Cpath d=%22M4 7h6M4 9.3h4.2%22 stroke=%22%23b5bec5%22 stroke-width=%22.9%22 stroke-linecap=%22round%22/%3E%3C/svg%3E") center/100% 100% no-repeat;transition:opacity .15s,transform .15s}
.card:hover .nbk{opacity:.55}.card .nbk.has{opacity:.6}.card .nbk:hover{opacity:1;transform:scale(1.12)}
.card.editing .nbk{opacity:0;pointer-events:none}
.card .row{padding-right:10px}
/* the notebook, laid out like Apple Notes on the Mac: folders | note list | note */
#nb{position:fixed;inset:0;z-index:45;display:grid;grid-template-columns:var(--nb-sw,212px) 300px 1fr;overflow:hidden;color:var(--nb-ink);background:var(--nb-bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:13px;animation:nbIn .16s ease-out;-webkit-font-smoothing:antialiased}
#nb.noside{--nb-sw:0px}#nb.noside .nb-side{visibility:hidden}
@keyframes nbIn{from{opacity:0}to{opacity:1}}
#nb button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;border-radius:6px}
#nb svg{display:block}
/* sidebar */
#nb .nb-side{background:var(--nb-side);border-right:.5px solid var(--nb-sep);display:flex;flex-direction:column;min-width:0;overflow:hidden;
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
#nb .nb-side-top{height:52px;flex:none}
#nb .nb-acct{padding:6px 18px 4px;font-size:11px;font-weight:600;color:var(--nb-mute)}
#nb .nb-fd{display:flex;align-items:center;gap:7px;margin:0 10px;padding:5px 8px;border-radius:6px;cursor:default;white-space:nowrap}
#nb .nb-fd svg{width:16px;height:16px;flex:none;color:var(--nb-acc)}
#nb .nb-fd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#nb .nb-fd i{font-style:normal;color:var(--nb-mute);font-variant-numeric:tabular-nums}
#nb .nb-fd.on{background:var(--nb-fsel)}
/* right part: toolbar over list + note */
#nb .nb-main{grid-column:2/4;display:grid;grid-template-columns:300px 1fr;grid-template-rows:52px 1fr;min-width:0;min-height:0}
#nb .nb-tb{grid-column:1/3;display:flex;align-items:center;gap:2px;padding:0 12px 0 8px;border-bottom:.5px solid var(--nb-sep);background:var(--nb-bg)}
#nb .nb-tb .ic{width:32px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--nb-icon)}
#nb .nb-tb .ic:hover{background:var(--nb-hover)}
#nb .nb-tb .ic svg{width:18px;height:18px}
#nb .nb-tb .gap{width:254px;flex:none}
#nb .nb-tb .sp{flex:1}
#nb .nb-q{display:flex;align-items:center;gap:5px;width:190px;height:26px;padding:0 8px;border-radius:7px;background:var(--nb-field);margin:0 8px 0 4px;color:var(--nb-mute)}
#nb .nb-q svg{width:13px;height:13px;flex:none}
#nb .nb-q input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:13px;color:var(--nb-ink);padding:0}
#nb .nb-q input:focus-visible{outline:none}
#nb .nb-q:focus-within{box-shadow:0 0 0 3px var(--nb-ring)}
#nb .nb-done{color:var(--nb-acc);font-size:14px;font-weight:600;padding:4px 8px}
#nb .nb-done:hover{background:var(--nb-hover)}
/* note list */
#nb .nb-list{overflow:auto;border-right:.5px solid var(--nb-sep);padding:4px 10px 20px;background:var(--nb-bg)}
#nb .nb-gh{font-size:12px;font-weight:700;color:var(--nb-ink);padding:14px 8px 6px}
#nb .nb-it{padding:9px 10px 9px 12px;border-radius:7px;cursor:default;position:relative}
#nb .nb-it+.nb-it::before{content:"";position:absolute;left:12px;right:10px;top:0;border-top:.5px solid var(--nb-sep)}
#nb .nb-it.on,#nb .nb-it.on+.nb-it{}
#nb .nb-it.on::before,#nb .nb-it.on+.nb-it::before{border-color:transparent}
#nb .nb-it.on{background:var(--nb-isel)}
#nb .nb-it b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
#nb .nb-it .ln{display:flex;gap:8px;white-space:nowrap;overflow:hidden}
#nb .nb-it .dt{color:var(--nb-ink);opacity:.85;flex:none;font-variant-numeric:tabular-nums}
#nb .nb-it .pv{color:var(--nb-mute);overflow:hidden;text-overflow:ellipsis}
#nb .nb-it .fl{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--nb-mute);font-size:12px}
#nb .nb-it .fl svg{width:12px;height:12px}
#nb .nb-it mark{background:var(--nb-mark);color:inherit;border-radius:2px}
#nb .nb-empty{padding:40px 12px;text-align:center;color:var(--nb-mute)}
/* note */
#nb .nb-note{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--nb-bg)}
#nb .nb-date{flex:none;text-align:center;font-size:12px;color:var(--nb-mute);padding:16px 0 2px}
#nb .nb-ed{flex:1;overflow:auto;padding:8px max(36px,calc((100% - 720px)/2)) 30vh;font-size:16px;line-height:1.55;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:var(--nb-acc)}
#nb .nb-ed::first-line{font-size:26px;font-weight:700;line-height:1.35}
#nb .nb-ed:empty::before{content:"标题";color:var(--nb-mute);font-size:26px;font-weight:700;pointer-events:none}
#nb .nb-ed::selection{background:var(--nb-mark)}
#nb .nb-src{flex:none;text-align:center;font-size:11.5px;color:var(--nb-mute);padding:0 0 6px}
#nb .nb-src a{color:inherit;text-decoration:none;border-bottom:.5px dotted currentColor;cursor:pointer}
:root{--nb-bg:#ffffff;--nb-side:rgba(240,240,242,.92);--nb-ink:#1d1d1f;--nb-mute:#86868b;--nb-icon:#6e6e73;--nb-sep:rgba(0,0,0,.1);--nb-acc:#e0a800;--nb-hover:rgba(0,0,0,.05);
  --nb-fsel:rgba(0,0,0,.08);--nb-isel:#fbe7a2;--nb-mark:rgba(255,214,10,.45);--nb-field:rgba(0,0,0,.055);--nb-ring:rgba(224,168,0,.35)}
@media (prefers-color-scheme:dark){:root{--nb-bg:#1e1e1e;--nb-side:rgba(42,42,44,.92);--nb-ink:#f2f2f7;--nb-mute:#8d8d93;--nb-icon:#a1a1a6;--nb-sep:rgba(255,255,255,.1);--nb-acc:#ffcc1a;
  --nb-hover:rgba(255,255,255,.07);--nb-fsel:rgba(255,255,255,.1);--nb-isel:rgba(255,204,26,.28);--nb-mark:rgba(255,204,26,.38);--nb-field:rgba(255,255,255,.08);--nb-ring:rgba(255,204,26,.35)}}
@media (max-width:900px){#nb{--nb-sw:0px}#nb .nb-side{visibility:hidden}}
/* draft search: a Spotlight-style box over a soft veil */
#sx{position:fixed;inset:0;z-index:60;background:rgba(20,30,40,.18);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:flex;justify-content:center;align-items:flex-start;padding-top:13vh}
#sx .sx-box{width:min(640px,calc(100vw - 32px));max-height:68vh;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(248,250,252,.84));-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 0 0 .6px rgba(40,65,88,.18),inset 0 1px 0 rgba(255,255,255,.95),0 24px 60px -16px rgba(15,30,45,.45),0 2px 8px rgba(15,30,45,.08);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
#sx .sx-in{border:0;outline:none;background:transparent;font-size:19px;padding:16px 20px 14px;color:var(--ink);border-bottom:.6px solid rgba(40,65,88,.12);border-radius:0}
#sx .sx-in:focus-visible{outline:none}
#sx .sx-list{overflow:auto;padding:6px}
#sx .sx-it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 12px;border-radius:9px;cursor:pointer}
#sx .sx-it.on{background:rgba(217,163,0,.16)}
#sx .sx-t{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sx .sx-d{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#sx .sx-c{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sx .sx-s{grid-column:1/-1;font-size:13px;line-height:1.5;color:var(--ink);opacity:.82;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sx mark{background:rgba(245,196,0,.45);color:inherit;border-radius:2px;padding:0 1px}
#sx .sx-none{padding:22px;text-align:center;color:var(--muted);font-size:13px}
#sx .sx-foot{padding:7px 16px;font-size:11px;color:var(--muted);border-top:.6px solid rgba(40,65,88,.1)}
@media (prefers-color-scheme:dark){#sx{background:rgba(0,0,0,.35)}#sx .sx-box{background:linear-gradient(180deg,rgba(40,48,55,.92),rgba(28,34,40,.88));
  box-shadow:inset 0 0 0 .6px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.1),0 24px 60px -16px rgba(0,0,0,.8)}
  #sx .sx-in{border-bottom-color:rgba(255,255,255,.1)}#sx .sx-foot{border-top-color:rgba(255,255,255,.08)}#sx .sx-it.on{background:rgba(229,181,58,.18)}}
/* small glass "+" used for adding a child card and for saving a template */

ity=%22.55%22 stroke-width=%22.9%22 stroke-linecap=%22round%22 filter=%22url(%23g)%22/%3E%3C/svg%3E") center/100% 100% no-repeat;

<script>
'use strict';
/* ---------- data ---------- */
const now=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function blank(){return{app:'priority-machine',schema:3,tasks:{},deleted:{},templates:[],frames:[],view:{x:40,y:40,z:1}}}
let D=blank();
/* open: cards whose resistance list is expanded; resIn: card with the input open */
/* multi: cards picked with Shift (click or drag a box); empty when only one card is selected */
const ui={sel:null,multi:new Set(),editing:null,linking:null,open:new Set(),resIn:null,resDraft:'',busy:false};

function newTask(text,parent,x,y){const t={id:uid(),text:text||'',parent:parent||null,x,y,note:true,done:false,blk:'',crit:'',res:[],fold:false,createdAt:now(),updatedAt:now(),history:[]};D.tasks[t.id]=t;return t}
function seed(){
  const T=(text,parent,extra)=>{const t=newTask(text,parent,0,0);Object.assign(t,extra||{});return t.id};
  const m=T('2026-10-08 导师会议');
  T('会前一页纸',m,{crit:'已完成 / 想问的 / 接下来两周交什么，各至少 2 条'});
  T('会后记录：要点和约定的下次交付',m);
  const th=T('论文第四章：practice-based research（第一人称）');
  for(const s of['引言：practice-based research 的特点','Initial exploration','Prototyping','Digital interface','Physical draping','Synthetical reflection']){const k=T(s,th);T('切砖',k,{crit:'拆成 3 到 6 块，每块有完成标准'})}
  T('第一篇文章：身体与服装的关系可解构');
  const w=T('第一次 Workshop');
  const mt=T('材料和人台',w);
  T('买材料',mt,{blk:'等学院回复 bench fee 怎么报销'});
  T('做一套标准化人台',mt,{blk:'同上'});
  T('写完整计划（流程草案已有）',w);T('准备文件',w);T('联系参与者',w);T('开 workshop',w);
  const b=T('底座');T('定一个固定的睡眠窗口',b);T('定每周的运动时段',b);
}

/* ---------- persistence: bound file + local backup ---------- */
let fileHandle=null,saveTimer=null,dirty=false,lastSaved=null;
const LS='priority-machine-backup';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('priority-machine',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(_){}}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(_){return null}}
function backup(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(_){}}
/* Saving: every change is written to the bound file about 1 second later; on top of
   that a safety save runs every 5 minutes, and Ctrl+S saves at once. */
const AUTOSAVE_MS=5*60*1000;let needPerm=false,writing=null;
function fileLabel(){const el=$('#file');
  if(!fileHandle){el.textContent='local only';el.title='还没绑定数据文件，改动只存在浏览器里。在「文件 ▾」里绑定';return}
  const n=fileHandle.name.replace(/\.json$/i,'');
  if(needPerm){el.textContent=n+' · offline';el.title='Chrome 需要重新授权，点一下页面任意处恢复自动保存';return}
  el.textContent=n+(dirty?' · unsaved':lastSaved?' · saved '+hm(lastSaved):'');el.title=fileHandle.name+'：每次改动约 1 秒后自动保存，另外每 5 分钟保存一次'}
function fileStatus(){if(!fileHandle)return'还没有文件，改动只存在浏览器里';
  return fileHandle.name+(needPerm?' · 需要重新连接':dirty?' · 未保存':lastSaved?' · 已保存 '+hm(lastSaved):'')}
/* ---------- twins (分身) ----------
   A twin is another place where the same card shows up. Every twin keeps a full copy of the
   content (text, notes, criteria, blocked reason, checkbox, task/note) but has its own position,
   size, colour, font size and place in a tree. After every change the copies are brought in
   step: whichever member changed since the last sync is copied to the others. */
const CF=['text','res','crit','blk','note','done','nb','nbAt'];
const tkey=t=>t.ref||t.id;
const sigOf=t=>JSON.stringify(CF.map(k=>t[k]===undefined?null:t[k]));
let twinSig={};
function twinGroups(){const g={};for(const t of Object.values(D.tasks)){const k=tkey(t);(g[k]=g[k]||[]).push(t)}
  for(const k in g){if(g[k].length<2)delete g[k];else g[k].sort((a,b)=>(a.ref?1:0)-(b.ref?1:0)||(a.createdAt||'').localeCompare(b.createdAt||''))}return g}
function syncTwins(){const g=twinGroups();const next={};
  for(const k in g){const ms=g[k],sg=ms.map(sigOf);
    if(sg.every(x=>x===sg[0])){next[k]=sg[0];continue}
    const ch=ms.filter((m,i)=>sg[i]!==twinSig[k]);const pool=ch.length?ch:ms;
    const src=pool.reduce((a,b)=>(b.updatedAt||'')>(a.updatedAt||'')?b:a);
    for(const m of ms){if(m===src)continue;for(const f of CF){if(src[f]===undefined)delete m[f];else m[f]=JSON.parse(JSON.stringify(src[f]))}}
    next[k]=sigOf(src)}
  twinSig=next}
function touch(){syncTwins();dirty=true;backup();clearTimeout(saveTimer);saveTimer=setTimeout(writeFile,1000)}
async function writeFile(force){if(!fileHandle||needPerm||(!dirty&&!force))return false;
  if(writing){await writing;if(!dirty&&!force)return true}
  let okk=false;writing=(async()=>{try{const snapshot=JSON.stringify(D,null,1);const w=await fileHandle.createWritable();await w.write(snapshot);await w.close();dirty=false;lastSaved=new Date();okk=true}
    catch(e){showReconnect()}finally{fileLabel()}})();
  await writing;writing=null;return okk}
function showReconnect(){if(!fileHandle)return;needPerm=true;const b=$('#reconnect');b.hidden=false;b.textContent='重新连接 '+fileHandle.name;fileLabel()}
setInterval(()=>{if(fileHandle&&!needPerm)writeFile(true)},AUTOSAVE_MS);
/* after a browser restart Chrome asks for file permission again; ask on the first click */
document.addEventListener('pointerdown',()=>{if(needPerm&&fileHandle)reconnect()},true);
async function saveNow(){if(!fileHandle)return bindNew();if(needPerm)return reconnect();if(await writeFile(true))toast('已保存到 '+fileHandle.name)}
const canFS='showSaveFilePicker' in window;
/* new files are named with year and month, e.g. 26-10-X.json */
function stampName(){const d=new Date();return pad(d.getFullYear()%100)+'-'+pad(d.getMonth()+1)+'-X.json'}
async function bindNew(){if(!canFS)return toast('这个浏览器不支持绑定文件，请用 Chrome 或 Edge，或者用导出');try{const opt={suggestedName:stampName(),types:[{description:'X 文件',accept:{'application/json':['.json']}}]};if(fileHandle)opt.startIn=fileHandle;fileHandle=await showSaveFilePicker(opt);await idbSet('handle',fileHandle);needPerm=false;dirty=true;await writeFile();$('#reconnect').hidden=true;toast('已保存到 '+fileHandle.name)}catch(_){}}
async function bindOpen(){if(!canFS)return toast('这个浏览器不支持绑定文件，请用 Chrome 或 Edge，或者用导入');try{const[h]=await showOpenFilePicker({types:[{description:'X 文件',accept:{'application/json':['.json']}}]});const inc=norm(JSON.parse(await(await h.getFile()).text()));fileHandle=h;needPerm=false;await idbSet('handle',h);if(await askChoice('打开这个文件','用文件里的内容替换现在的画布，还是和现在的内容合并？',['用文件替换','合并'])==='用文件替换')D=inc;else D=merge(D,inc);$('#reconnect').hidden=true;dirty=true;writeFile();render();toast('已打开 '+h.name)}catch(e){if(e&&e.name!=='AbortError')toast('打开失败：'+e.message)}}
let reconnecting=false,renderAfterDrag=false;
async function reconnect(){if(reconnecting)return;reconnecting=true;try{if(await fileHandle.requestPermission({mode:'readwrite'})==='granted'){needPerm=false;const inc=norm(JSON.parse(await(await fileHandle.getFile()).text()));D=merge(D,inc);$('#reconnect').hidden=true;dirty=true;await writeFile();if(drag)renderAfterDrag=true;else render();toast('已连接，自动保存恢复')}}catch(e){toast('连接失败：'+e.message)}finally{reconnecting=false;fileLabel()}}
function norm(o){const b=blank();if(!o||typeof o!=='object')return b;for(const k of Object.keys(b))if(o[k]!==undefined)b[k]=o[k];
  for(const t of Object.values(b.tasks)){t.history=t.history||[];t.blk=t.blk||'';t.crit=t.crit||'';t.res=t.res||[];t.fold=false;t.x=+t.x||0;t.y=+t.y||0;delete t.doneAt;delete t.cur;delete t.est;delete t.energy;delete t.tags}
  if(!Array.isArray(b.templates))b.templates=[];if(!Array.isArray(b.frames))b.frames=[];
  if(!b.view||typeof b.view!=='object')b.view={x:40,y:40,z:1};b.view.z=Math.min(1.5,Math.max(.3,+b.view.z||1));
  migrateSidebar(o,b);return b}
/* older files kept notes in a sidebar. Notes tied to a task move into that card;
   loose notes and parked thoughts become cards under one "暂存" card. Ids are
   derived from the old ids so migrating the same file twice never duplicates. */
function migrateSidebar(o,b){const notes=(o.notes||[]).filter(n=>!b.deleted[n.id]),park=(o.parking||[]).filter(n=>!b.deleted[n.id]);if(!notes.length&&!park.length)return;
  const loose=[...park];
  for(const n of notes){const t=n.taskId&&b.tasks[n.taskId];if(t){if(!t.res.find(r=>r.id===n.id))t.res.push({id:n.id,text:n.text,createdAt:n.createdAt,updatedAt:n.updatedAt||n.createdAt});t.res.sort((a,c)=>a.createdAt<c.createdAt?-1:1)}else loose.push(n)}
  const todo=loose.filter(n=>!b.tasks['m-'+n.id]&&!b.deleted['m-'+n.id]);if(!todo.length)return;
  const all=Object.values(b.tasks);const RID='m-stash';
  if(!b.tasks[RID]&&!b.deleted[RID]){const x=all.length?Math.min(...all.map(t=>t.x)):0,y=all.length?Math.max(...all.map(t=>t.y))+140:0;
    b.tasks[RID]={id:RID,text:'暂存（从旧侧栏迁移过来的想法）',parent:null,x,y,done:false,blk:'',crit:'',res:[],fold:false,createdAt:'2000-01-01T00:00:00.000Z',updatedAt:'2000-01-01T00:00:00.000Z',history:[]}}
  const root=b.tasks[RID];let y=root?root.y:0;
  todo.sort((a,c)=>(a.createdAt||'')<(c.createdAt||'')?-1:1);
  for(const n of todo){b.tasks['m-'+n.id]={id:'m-'+n.id,text:n.text,parent:root?RID:null,x:(root?root.x:0)+GX,y,done:false,blk:'',crit:'',res:[],fold:false,createdAt:n.createdAt||now(),updatedAt:n.updatedAt||n.createdAt||now(),history:[]};y+=70}}
function merge(A,B){const R=JSON.parse(JSON.stringify(A));R.deleted=Object.assign({},A.deleted,B.deleted);
  const newer=(a,b)=>!a?b:!b?a:((b.updatedAt||b.createdAt||'')>(a.updatedAt||a.createdAt||'')?b:a);
  for(const[id,t]of Object.entries(B.tasks||{}))R.tasks[id]=newer(R.tasks[id],t);
  for(const[id,at]of Object.entries(R.deleted))if(R.tasks[id]&&(R.tasks[id].updatedAt||'')<=at)delete R.tasks[id];
  for(const t of Object.values(R.tasks))if(t.parent&&!R.tasks[t.parent])t.parent=null;
  const tp=new Map();for(const x of[...(A.templates||[]),...(B.templates||[])])if(!R.deleted[x.id])tp.set(x.id,x);R.templates=[...tp.values()];
  const fm=new Map();for(const f of[...(A.frames||[]),...(B.frames||[])]){if(R.deleted[f.id]&&(f.updatedAt||'')<=R.deleted[f.id])continue;const o=fm.get(f.id);if(!o||(f.updatedAt||'')>(o.updatedAt||''))fm.set(f.id,f)}R.frames=[...fm.values()];
  return R}

/* ---------- undo ---------- */
const undoStack=[],redoStack=[];
function snap(){undoStack.push(JSON.stringify(D));if(undoStack.length>80)undoStack.shift();redoStack.length=0}
function restore(s){D=JSON.parse(s);if(nbId){nb.hidden=true;nbId=null}ui.editing=null;ui.resIn=null;if(ui.sel&&!D.tasks[ui.sel])ui.sel=null;for(const m of[...ui.multi])if(!D.tasks[m])ui.multi.delete(m);if(ui.multi.size<2)ui.multi.clear();touch();render()}
function undo(){const s=undoStack.pop();if(!s)return toast('没有可以撤销的了');redoStack.push(JSON.stringify(D));restore(s)}
function redo(){const s=redoStack.pop();if(!s)return toast('没有可以还原的了');undoStack.push(JSON.stringify(D));restore(s)}
function mutate(fn){snap();fn();touch();render()}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function hm(d){d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())}
function stamp(iso){if(!iso)return'';const d=new Date(iso);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm(d)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
const kids=id=>Object.values(D.tasks).filter(t=>t.parent===id).sort((a,b)=>a.y-b.y||a.x-b.x);
/* folding was removed: every card is always visible */
function hidden(t){return false}
function descendants(id){const out=[];const st=[id];while(st.length){const c=st.pop();for(const k of kids(c)){out.push(k.id);st.push(k.id)}}return out}
function hist(t,ev,v){t.history.push({at:now(),ev,v});t.updatedAt=now()}
const cardEl=id=>document.querySelector('.card[data-id="'+id+'"]');
const W=250,GX=290,GY=14,GAP=GX-W;
/* card width: a resized card keeps its own width, everything else is 250 */
const cw=t=>{if(!t)return W;if(t.w)return t.w;const e=cardEl(t.id);return e?e.offsetWidth:W};
/* tidy measures cards collapsed, so an open resistance list never stretches the layout */
let measureClosed=false;
const H=id=>{const e=cardEl(id);return e?e.offsetHeight:56};
/* first free y in a column, so new cards never land on top of existing ones */
function freeY(x,y){const boxes=Object.values(D.tasks).filter(t=>!hidden(t)&&t.x<x+W&&t.x+cw(t)>x).map(t=>[t.y,t.y+H(t.id)]);
  let moved=true,n=0;while(moved&&n++<500){moved=false;for(const[a,b]of boxes)if(y<b+8&&y+52>a-8){y=b+GY;moved=true}}return y}
function delTask(id){for(const d of[id,...descendants(id)]){delete D.tasks[d];D.deleted[d]=now();ui.open.delete(d)}if(ui.resIn&&!D.tasks[ui.resIn])ui.resIn=null;if(ui.sel&&!D.tasks[ui.sel])ui.sel=null}

function applyView(){$('#world').style.transform='translate('+D.view.x+'px,'+D.view.y+'px) scale('+D.view.z+')';const g=20*D.view.z;cv.style.backgroundSize=g+'px '+g+'px';cv.style.backgroundPosition=D.view.x+'px '+D.view.y+'px';const zl=$('#zoom');if(zl)zl.textContent=Math.round(D.view.z*100)+'%';placeBar()}

/* replacing the cards removes the focused element, and Chrome fires focusout for it;
   the rendering flag tells the focusout handlers to ignore that */
let rendering=false;
/* ---------- pages (页面) ---------- */
const frameEl=id=>document.querySelector('.frame[data-f="'+id+'"]');
function renderFrames(){$('#frames').innerHTML=(D.frames||[]).map(f=>'<div class="frame'+(ui.frame===f.id?' sel':'')+'" data-f="'+f.id+'" style="left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px"><div class="fr-t" title="拖动移动整页 · 双击改名 · 右键更多">'+esc(f.title||'页面')+'</div><div class="fr-rs"></div></div>').join('')}
function paintFrames(){document.querySelectorAll('.frame').forEach(el=>el.classList.toggle('sel',el.dataset.f===ui.frame))}
function paintFrame(f){const el=frameEl(f.id);if(el)Object.assign(el.style,{left:f.x+'px',top:f.y+'px',width:f.w+'px',height:f.h+'px'})}
/* a card belongs to the page its top-centre sits in */
function inFrame(f){return Object.values(D.tasks).filter(t=>{const cx=t.x+cw(t)/2,cy=t.y+Math.min(H(t.id)/2,40);return cx>=f.x&&cx<=f.x+f.w&&cy>=f.y&&cy<=f.y+f.h})}
function boxOf(ids){let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;for(const id of ids){const t=D.tasks[id];if(!t)continue;x1=Math.min(x1,t.x);y1=Math.min(y1,t.y);x2=Math.max(x2,t.x+cw(t));y2=Math.max(y2,t.y+H(id))}return x1>x2?null:{x:x1,y:y1,w:x2-x1,h:y2-y1}}
function growFrame(f,ids,pad){const b=boxOf(ids);if(!b)return;pad=pad||36;const x2=Math.max(f.x+f.w,b.x+b.w+pad),y2=Math.max(f.y+f.h,b.y+b.h+pad);
  f.x=Math.min(f.x,b.x-pad);f.y=Math.min(f.y,b.y-pad);f.w=Math.round(x2-f.x);f.h=Math.round(y2-f.y);f.updatedAt=now()}
function newFrame(p,ids){const n=(D.frames||[]).length+1;let f;
  mutate(()=>{f={id:uid(),x:Math.round(p.x),y:Math.round(p.y),w:640,h:440,title:'页面 '+n,updatedAt:now()};
    if(ids&&ids.length){const b=boxOf(ids);f.x=Math.round(b.x-50);f.y=Math.round(b.y-50);f.w=Math.round(b.w+100);f.h=Math.round(b.h+100)}D.frames.push(f)});
  ui.frame=f.id;select(null);renderFrames()}
async function renameFrame(f){const v=await ask('页面名称',f.title||'','比如：本周、论文、生活');if(v!==null)mutate(()=>{f.title=v;f.updatedAt=now()})}
function delFrame(f,withCards){mutate(()=>{if(withCards)for(const t of inFrame(f))if(D.tasks[t.id])delTask(t.id);D.frames=D.frames.filter(z=>z!==f);D.deleted[f.id]=now()});ui.frame=null}
function focusFrame(f){const r=cv.getBoundingClientRect();const z=Math.min(1,Math.max(ZMIN,Math.min((r.width-80)/f.w,(r.height-110)/f.h)));
  glide((r.width-f.w*z)/2-f.x*z,(r.height-f.h*z)/2-f.y*z+16,z);ui.frame=f.id;select(null);renderFrames()}

  '-',

/* smooth camera move */
function glide(x,y,z){const a={...D.view},t0=performance.now(),T=260;cancelAnimationFrame(glide._r);
  const step=n=>{const k=Math.min(1,(n-t0)/T),e=1-Math.pow(1-k,3);D.view={x:a.x+(x-a.x)*e,y:a.y+(y-a.y)*e,z:a.z+(z-a.z)*e};applyView();if(k<1)glide._r=requestAnimationFrame(step);else touch()};
  glide._r=requestAnimationFrame(step)}
function focusCards(ids){const b=boxOf(ids);if(!b)return;const r=cv.getBoundingClientRect();let z=D.view.z;
  if(b.w*z>r.width*.8||b.h*z>r.height*.8)z=Math.max(ZMIN,Math.min(r.width*.8/b.w,r.height*.8/b.h));
  glide(r.width/2-(b.x+b.w/2)*z,r.height/2-(b.y+b.h/2)*z,z)}
/* move cards (with their branches) or put twins of them into a page or the middle of the view */
/* 创建分身 puts the cards on an internal clipboard; paste puts a twin wherever you want it
   (right-click on empty canvas, or Ctrl+V at the mouse). The clipboard stays filled, so the
   same card can be pasted into several places. */
let CLIP=null,MOUSE={x:innerWidth/2,y:innerHeight/2};
window.addEventListener('pointermove',e=>{MOUSE={x:e.clientX,y:e.clientY}},true);
function makeTwin(ids){const b=boxOf(ids);if(!b)return;
  CLIP=ids.map(i=>{const t=D.tasks[i];return{key:tkey(t),dx:t.x-b.x,dy:t.y-b.y,w:t.w,h:t.h,color:t.color,fs:t.fs}});
  toast((ids.length>1?ids.length+' 张卡片的分身':'分身')+'已复制，到需要的位置右键粘贴，或按 Ctrl+V')}
function pasteTwin(p){if(!CLIP)return;const made=[];
  mutate(()=>{for(const it of CLIP){const src=Object.values(D.tasks).find(t=>tkey(t)===it.key);if(!src)continue;
    const n=newTask('',null,Math.round(p.x+it.dx),Math.round(p.y+it.dy));n.ref=it.key;
    for(const k of CF){if(src[k]===undefined)delete n[k];else n[k]=JSON.parse(JSON.stringify(src[k]))}
    for(const k of['w','h','color','fs'])if(it[k])n[k]=it[k];made.push(n.id)}});
  if(!made.length){CLIP=null;return toast('原来的卡片已经不在了')}
  /* a twin pasted into a page stretches the page if it sticks out (same undo step) */
  for(const f of D.frames||[])if(p.x>=f.x&&p.x<=f.x+f.w&&p.y>=f.y&&p.y<=f.y+f.h){growFrame(f,made);touch();renderFrames()}
  ui.multi=new Set(made);ui.sel=made[0];if(made.length<2)ui.multi.clear();paintSel();toast('分身已粘贴')}
function gotoTwin(id,back){const k=tkey(D.tasks[id]),list=TWM[k];if(!list||list.length<2)return toast('没有其他位置');
  const nx=back?list[0]:list[(list.indexOf(id)+1)%list.length];select(nx);focusCards([nx])}
function unlinkTwin(id){const t=D.tasks[id];const k=tkey(t);mutate(()=>{if(t.ref)delete t.ref;else for(const o of Object.values(D.tasks))if(o.ref===k){o.ref=undefined;delete o.ref}t.updatedAt=now()});toast('已脱离，成为独立卡片')}
function twinMenu(id){const k=tkey(D.tasks[id]),list=TWM[k]||[id];return[{head:'分身 '+(list.indexOf(id)+1)+'/'+list.length},
  {l:'跳到下一处',f:()=>gotoTwin(id)},{l:'回到源头',f:()=>gotoTwin(id,true)},
  {l:'选中全部出现位置',f:()=>{ui.multi=new Set(list);ui.sel=id;paintSel();focusCards(list)}},
  '-',{l:'脱离为独立卡片',f:()=>unlinkTwin(id)},{l:'删除这一处',danger:true,f:()=>confirmDelete(id)}]}
/* ---------- notebook (笔记本) ----------
   Every card owns one note. The window works like Apple Notes on the Mac: folders on the
   left (all drafts, then one per page), the notes list in the middle grouped by date, and the
   note itself on the right. The first line is the title. Typing saves as you go; one visit to
   a note is one undo step. */
const FOLDER_SVG='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1.8 4.2c0-.8.6-1.4 1.4-1.4h3l1.4 1.5h5.2c.8 0 1.4.6 1.4 1.4v6.4c0 .8-.6 1.4-1.4 1.4H3.2c-.8 0-1.4-.6-1.4-1.4z"/><path d="M1.8 6.2h12.4"/></svg>';
const nb=$('#nb'),nbEd=nb.querySelector('.nb-ed'),nbQ=nb.querySelector('.nb-q input'),nbList=nb.querySelector('.nb-list');
let nbId=null,nbSnapped=false,nbFolder='all';
function nbDate(iso){const d=iso?new Date(iso):new Date();return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm(d)}
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x.getTime()};
function nbGroup(iso){if(!iso)return'更早';const d=new Date(iso),n=(dayStart(Date.now())-dayStart(d))/864e5;
  return n<=0?'今天':n===1?'昨天':n<7?'过去 7 天':n<30?'过去 30 天':d.getFullYear()+'年'+(d.getMonth()+1)+'月'}
function nbShort(iso){if(!iso)return'';const d=new Date(iso),n=(dayStart(Date.now())-dayStart(d))/864e5;
  return n<=0?hm(d):n===1?'昨天':n<7?'星期'+'日一二三四五六'[d.getDay()]:d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
/* which page a note lives in: the first page holding any place of that card */
function nbPageOf(t){const ids=TWM[tkey(t)]||[t.id];for(const f of D.frames||[]){const m=new Set(inFrame(f).map(x=>x.id));if(ids.some(i=>m.has(i)))return f}return null}
function nbItems(){const list=drafts();if(nbId&&D.tasks[nbId]&&!list.some(t=>tkey(t)===tkey(D.tasks[nbId])))list.push(D.tasks[nbId]);
  return list.map(t=>({t,f:nbPageOf(t)}))}
function nbFolders(items){const fs=(D.frames||[]).slice().sort((a,b)=>a.y-b.y||a.x-b.x);
  const row=(id,name,n)=>'<div class="nb-fd'+(nbFolder===id?' on':'')+'" data-f="'+id+'">'+FOLDER_SVG+'<span>'+esc(name)+'</span><i>'+n+'</i></div>';
  nb.querySelector('.nb-folders').innerHTML=row('all','全部草稿',items.filter(x=>x.t.nb).length)+fs.map(f=>row(f.id,f.title||'页面',items.filter(x=>x.f===f&&x.t.nb).length)).join('')+
    (fs.length?row('none','未分页',items.filter(x=>!x.f&&x.t.nb).length):'')}
function nbRenderList(){const items=nbItems();nbFolders(items);
  if(nbFolder!=='all'&&nbFolder!=='none'&&!(D.frames||[]).some(f=>f.id===nbFolder))nbFolder='all';
  const q=nbQ.value.trim().toLowerCase(),terms=q?q.split(/\s+/):[];
  let vis=items.filter(x=>nbFolder==='all'||(nbFolder==='none'?!x.f:x.f&&x.f.id===nbFolder));
  if(terms.length)vis=vis.filter(x=>{const h=((x.t.nb||'')+'\n'+(x.t.text||'')).toLowerCase();return terms.every(w=>h.includes(w))});
  vis.sort((a,b)=>(b.t.nbAt||'9').localeCompare(a.t.nbAt||'9'));
  let html='',last='';const cur=nbId&&D.tasks[nbId]?tkey(D.tasks[nbId]):null;
  for(const x of vis){const t=x.t,g=t.nb?nbGroup(t.nbAt):'今天';if(g!==last){html+='<div class="nb-gh">'+g+'</div>';last=g}
    const lines=(t.nb||'').split('\n'),title=lines[0].trim()||'新备忘录',pv=lines.slice(1).join(' ').trim()||'没有其他文本';
    html+='<div class="nb-it'+(tkey(t)===cur?' on':'')+'" data-id="'+t.id+'"><b>'+hl(title,terms)+'</b><div class="ln"><span class="dt">'+(t.nbAt?nbShort(t.nbAt):'')+'</span><span class="pv">'+hl(pv,terms)+'</span></div>'+
      (nbFolder==='all'?'<div class="fl">'+FOLDER_SVG+esc(x.f?x.f.title||'页面':(t.text||'').split('\n')[0]||'卡片')+'</div>':'')+'</div>'}
  nbList.innerHTML=html||'<div class="nb-empty">'+(terms.length?'没有找到':'没有备忘录')+'</div>'}
function nbShow(t,find){nbId=t.id;nbSnapped=false;
  nb.querySelector('.nb-date').textContent=nbDate(t.nbAt);
  nb.querySelector('.nb-src').innerHTML='来自卡片 <a title="回到画布上的这张卡片">'+esc((t.text||'（空）').split('\n')[0])+'</a>';
  nbEd.textContent=t.nb||'';nbEd.scrollTop=0;nbEd.focus();const r=document.createRange();r.selectNodeContents(nbEd);r.collapse(false);
  if(find){const w=document.createTreeWalker(nbEd,NodeFilter.SHOW_TEXT);let n;const f=find.toLowerCase();while(n=w.nextNode()){const i=n.data.toLowerCase().indexOf(f);if(i>=0){r.setStart(n,i);r.setEnd(n,i+find.length);break}}}
  const sl=getSelection();sl.removeAllRanges();sl.addRange(r);
  if(find&&!r.collapsed){const b=r.getBoundingClientRect(),eb=nbEd.getBoundingClientRect();nbEd.scrollTop+=b.top-eb.top-eb.height/3}
  nbRenderList()}

function closeNb(keep){if(nb.hidden)return;if(nb.contains(document.activeElement))document.activeElement.blur();nb.hidden=true;const id=nbId;nbId=null;nbQ.value='';if(!keep){renderCanvas();if(id&&D.tasks[id])select(id)}}

nbList.addEventListener('click',e=>{const it=e.target.closest('.nb-it');if(it&&it.dataset.id!==nbId&&D.tasks[it.dataset.id])nbShow(D.tasks[it.dataset.id])});

  if(e.key==='Enter'){e.preventDefault();const it=nbList.querySelector('.nb-it');if(it)nbShow(D.tasks[it.dataset.id],nbQ.value.trim().split(/\s+/)[0])}

nb.querySelector('.nb-src').addEventListener('click',e=>{if(!e.target.closest('a'))return;const id=nbId;closeNb();if(id&&D.tasks[id]){select(id);focusCards([id])}});

nb.querySelector('.nb-tb').addEventListener('click',async e=>{const b=e.target.closest('.ic');if(!b)return;const a=b.dataset.a;
  if(a==='side')nb.classList.toggle('noside');
  else if(a==='export')exportDrafts();
  else if(a==='trash'){const t=D.tasks[nbId];if(!t||!t.nb)return;if(await askChoice('清空草稿','清空「'+(t.nb.split('\n')[0]||'新备忘录')+'」这份草稿？卡片本身保留，可以用 Ctrl+Z 撤回。',['取消','清空'])==='清空'){mutate(()=>{t.nb='';t.nbAt=now();t.updatedAt=now()});nb.hidden=false;nbShow(D.tasks[t.id])}}
  else if(a==='new'){/* a new card at the middle of the view; its text follows the note's title until you rename the card */
    const r=cv.getBoundingClientRect(),c=toWorld(r.left+r.width/2,r.top+r.height/2);let t;
    mutate(()=>{t=newTask('新备忘录',null,Math.round(c.x-60),Math.round(freeY(c.x-60,c.y)));t.autoT=true});nb.hidden=false;nbShow(D.tasks[t.id])}});
nb.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeNb()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();nbQ.focus();nbQ.select()}});
/* every draft in the file as one Markdown file, newest first */
function exportDrafts(){const items=drafts().map(t=>({t,f:nbPageOf(t)})).sort((a,b)=>(b.t.nbAt||'').localeCompare(a.t.nbAt||''));
  if(!items.length)return toast('这个文件里还没有草稿');const d=new Date(),out=[];
  const full=iso=>{const x=new Date(iso);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())+' '+hm(x)};
  out.push('# X 草稿合集','','导出时间：'+full(d.toISOString())+'　共 '+items.length+' 份','');
  for(const{t,f}of items){const lines=t.nb.split('\n');out.push('---','','## '+(lines[0].trim()||'新备忘录'),'');
    out.push('> 卡片：'+((t.text||'（空）').split('\n')[0])+(f?'　页面：'+(f.title||'页面'):'')+(t.nbAt?'　最后编辑：'+full(t.nbAt):''),'');
    const body=lines.slice(1).join('\n').replace(/^\n+/,'');if(body)out.push(body,'')}
  const b=new Blob([out.join('\n')],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=pad(d.getFullYear()%100)+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'-X-drafts.md';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('已导出 '+items.length+' 份草稿')}
/* ---------- draft search ----------
   Looks through every notebook (and the card it belongs to). Several words narrow it down.
   With nothing typed it lists drafts, newest first. Twins share one notebook, so each
   draft appears once. Opening a result jumps to the first match inside the draft. */
const sx=$('#sx'),sxIn=sx.querySelector('.sx-in'),sxList=sx.querySelector('.sx-list');let sxRes=[],sxOn=0;
function drafts(){const seen=new Set(),out=[];for(const t of Object.values(D.tasks)){if(!t.nb||!t.nb.trim())continue;const k=tkey(t);if(seen.has(k))continue;seen.add(k);
  const g=TWM[k];out.push(g?D.tasks[g[0]]||t:t)}return out}
const escRe=w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hl(text,terms){let h=esc(text);for(const w of terms)h=h.replace(new RegExp(escRe(esc(w)),'gi'),m=>'<mark>'+m+'</mark>');return h}
function runSearch(){const q=sxIn.value.trim().toLowerCase(),terms=q?q.split(/\s+/):[];
  sxRes=drafts().map(t=>{const body=t.nb,title=body.split('\n')[0],hay=(body+'\n'+t.text).toLowerCase();
    if(terms.some(w=>!hay.includes(w)))return null;let score=0;for(const w of terms){score+=hay.split(w).length-1;if(title.toLowerCase().includes(w))score+=5;if((t.text||'').toLowerCase().includes(w))score+=2}
    let snip=body.split('\n').slice(1).join(' ').trim();if(terms.length){const i=body.toLowerCase().indexOf(terms[0]);if(i>=0){const a=Math.max(0,i-30);snip=(a?'…':'')+body.slice(a,i+90).replace(/\n/g,' ')}}
    return{t,title,snip,score}}).filter(Boolean).sort((a,b)=>b.score-a.score||(b.t.nbAt||'').localeCompare(a.t.nbAt||''));
  sxOn=0;
  sxList.innerHTML=sxRes.length?sxRes.map((r,i)=>'<div class="sx-it'+(i===0?' on':'')+'" data-i="'+i+'"><div class="sx-t">'+hl(r.title||'（无标题）',terms)+'</div><div class="sx-d">'+(r.t.nbAt?stamp(r.t.nbAt):'')+'</div><div class="sx-c">'+hl((r.t.text||'（空）').split('\n')[0],terms)+'</div>'+(r.snip?'<div class="sx-s">'+hl(r.snip,terms)+'</div>':'')+'</div>').join('')
    :'<div class="sx-none">'+(drafts().length?'没有找到包含这些词的草稿':'还没有草稿。选中卡片按 N 打开笔记本开始写')+'</div>'}
function openSearch(){if(ui.editing){commitEdit();renderCanvas()}hideMenu();sx.hidden=false;sxIn.value='';runSearch();sxIn.focus()}
function closeSearch(){sx.hidden=true;if(nbId&&!nb.hidden)nbEd.focus()}
function pickSearch(i){const r=sxRes[i];if(!r)return;const q=sxIn.value.trim().split(/\s+/)[0]||'';closeSearch();openNb(r.t.id,q)}
function markOn(i){sxOn=Math.max(0,Math.min(sxRes.length-1,i));sxList.querySelectorAll('.sx-it').forEach((el,j)=>el.classList.toggle('on',j===sxOn));const el=sxList.querySelector('.sx-it.on');el&&el.scrollIntoView({block:'nearest'})}
sxIn.addEventListener('input',runSearch);
sxIn.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;
  if(e.key==='ArrowDown'){e.preventDefault();markOn(sxOn+1)}else if(e.key==='ArrowUp'){e.preventDefault();markOn(sxOn-1)}
  else if(e.key==='Enter'){e.preventDefault();pickSearch(sxOn)}else if(e.key==='Escape'){e.preventDefault();closeSearch()}});
sxList.addEventListener('click',e=>{const it=e.target.closest('.sx-it');if(it)pickSearch(+it.dataset.i)});
sxList.addEventListener('mousemove',e=>{const it=e.target.closest('.sx-it');if(it&&+it.dataset.i!==sxOn)markOn(+it.dataset.i)});
sx.addEventListener('pointerdown',e=>{if(e.target===sx)closeSearch()});
/* ---------- floating toolbar ---------- */
const FS=[12,13,14,15,16,18,20,22,24,28];
const fbar=$('#fbar');
function updateBar(){const ids=selIds();if(!ids.length||ui.linking){fbar.hidden=true;return}
  const ts=ids.map(i=>D.tasks[i]);const same=f=>ts.every(t=>f(t)===f(ts[0]))?f(ts[0]):null;
  const col=same(t=>t.color||''),fs=same(t=>t.fs||14);
  const html=COLS.map(([k,n,v])=>'<span class="dot'+(col===k?' on':'')+'" data-c="'+k+'" title="'+n+'" style="background:'+v+'"></span>').join('')+
    '<span class="sep"></span><select title="字号">'+(fs===null?'<option value="">—</option>':'')+FS.map(v=>'<option value="'+v+'"'+(fs===v?' selected':'')+'>'+v+'</option>').join('')+'</select>'+
    '<span class="sep"></span>'+D.templates.map(x=>'<span class="tp'+(ts.every(t=>(t.color||'')===(x.color||'')&&(t.fs||0)===(x.fs||0))?' on':'')+'" data-t="'+x.id+'" title="套用：'+esc(tplLabel(x))+'（右键删除）" style="background:'+tplBg(x)+'">'+esc(x.name)+'</span>').join('')+
    '<button class="gplus" data-a="tpl" title="把'+(ts.length>1?'第一张':'这张')+'卡片的字号和底色存为模板"></button>';
  /* only rebuild when something changed, so a click that is in progress is never lost */
  if(html!==fbar._html){fbar.innerHTML=html;fbar._html=html}fbar.hidden=false;placeBar()}
function placeBar(){if(fbar.hidden)return;const ids=selIds();if(!ids.length)return;let L=1e9,T=1e9,B=-1e9;
  for(const id of ids){const el=cardEl(id);if(!el)continue;const r=el.getBoundingClientRect();L=Math.min(L,r.left);T=Math.min(T,r.top);B=Math.max(B,r.bottom)}
  if(L===1e9){fbar.hidden=true;return}const w=fbar.offsetWidth,h=fbar.offsetHeight;const badge=ids.some(id=>{const el=cardEl(id);return el&&el.querySelector('.twin')});let top=T-h-(badge?24:10);if(top<8)top=B+10;
  fbar.style.left=Math.max(8,Math.min(L,innerWidth-w-8))+'px';fbar.style.top=Math.min(top,innerHeight-h-8)+'px'}
function styleSel(fn){const ids=selIds();if(!ids.length)return;mutate(()=>{for(const i of ids){const t=D.tasks[i];fn(t);t.updatedAt=now()}})}
fbar.addEventListener('pointerdown',e=>{e.stopPropagation();hideMenu();if(ui.editing){commitEdit();renderCanvas()}if(!e.target.matches('select'))e.preventDefault()});
fbar.addEventListener('click',e=>{const d=e.target.closest('.dot'),tp=e.target.closest('.tp'),pl=e.target.closest('[data-a=tpl]');
  if(d){const k=d.dataset.c;styleSel(t=>{if(k)t.color=k;else delete t.color})}
  else if(tp){const x=D.templates.find(x=>x.id===tp.dataset.t);if(x)styleSel(t=>{if(x.color)t.color=x.color;else delete t.color;if(x.fs)t.fs=x.fs;else delete t.fs})}
  else if(pl){const t=D.tasks[selIds()[0]];if(t)saveTpl(t)}});
fbar.addEventListener('change',e=>{if(!e.target.matches('select')||!e.target.value)return;const v=+e.target.value;styleSel(t=>{if(v===14)delete t.fs;else t.fs=v})});
fbar.addEventListener('contextmenu',async e=>{e.preventDefault();const tp=e.target.closest('.tp');if(!tp)return;const x=D.templates.find(x=>x.id===tp.dataset.t);if(!x)return;
  if(await askChoice('删除模板','删除模板「'+x.name+'」？已经套用的卡片不变。',['取消','删除'])==='删除')mutate(()=>{D.templates=D.templates.filter(y=>y!==x);D.deleted[x.id]=now()})});

let TWM={};

  const g=twinGroups();TWM={};for(const k in g)TWM[k]=g[k].map(t=>t.id);
  renderFrames();
  const vis=Object.values(D.tasks).filter(t=>!hidden(t));

  $('#hint').hidden=vis.length>0;$('#linkBar').hidden=!ui.linking;applyView();drawLinks();
  if(ui.editing){const el=cardEl(ui.editing);const tx=el&&el.querySelector('.t');if(tx){tx.focus();const r=document.createRange();r.selectNodeContents(tx);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}}
  else if(ui.resIn){const ta=cardEl(ui.resIn)&&cardEl(ui.resIn).querySelector('.resIn');if(ta){ta.value=ui.resDraft;ta.focus();ta.selectionStart=ta.selectionEnd=ta.value.length}}

function drawLinks(){let p='';
  for(const t of Object.values(D.tasks)){if(!t.parent||hidden(t))continue;const a=cardEl(t.parent),b=cardEl(t.id);if(!a||!b)continue;const P=D.tasks[t.parent];
    const ha=Math.min(a.offsetHeight/2,40),hb=Math.min(b.offsetHeight/2,40);
    const x1=P.x+a.offsetWidth,y1=P.y+ha,x2=t.x,y2=t.y+hb,mx=(x1+x2)/2;
    p+='<path d="M'+x1+' '+y1+' C'+mx+' '+y1+','+mx+' '+y2+','+x2+' '+y2+'"/>'}
  $('#links').innerHTML=p}

const selIds=()=>ui.multi.size?[...ui.multi].filter(id=>D.tasks[id]):ui.sel&&D.tasks[ui.sel]?[ui.sel]:[];

/* ---------- resistance inside a card ---------- */
function openRes(id){ui.open.add(id);ui.resIn=id;ui.resDraft='';select(id);renderCanvas()}
function closeResIn(){if(!ui.resIn)return;const id=ui.resIn;ui.resIn=null;ui.resDraft='';const t=D.tasks[id];if(t&&!(t.res||[]).length)ui.open.delete(id);renderCanvas()}
function saveRes(id,v,keepOpen){const t=D.tasks[id];if(!t)return;ui.busy=true;if(!keepOpen)ui.resIn=null;ui.resDraft='';
  mutate(()=>{t.res=t.res||[];t.res.push({id:uid(),text:v,createdAt:now(),updatedAt:now()});t.updatedAt=now()});if(makeRoom(id)){touch();render()}ui.busy=false}
/* a card that grew (new resistance note) pushes the cards below it in the same column down,
   together with their branches, so nothing ends up covered */
function makeRoom(id){const t=D.tasks[id],el=cardEl(id);if(!t||!el)return false;
  const below=Object.values(D.tasks).filter(o=>o.id!==id&&o.y>t.y&&o.x<t.x+cw(t)&&o.x+cw(o)>t.x);if(!below.length)return false;
  const d=t.y+el.offsetHeight+GY-Math.min(...below.map(o=>o.y));if(d<=0)return false;
  const ids=new Set();for(const o of below){ids.add(o.id);for(const k of descendants(o.id))ids.add(k)}
  for(const k of descendants(id))ids.delete(k);for(const k of ids)D.tasks[k].y+=d;return true}
function toggleRes(id){if(ui.open.has(id)||ui.resIn===id){ui.open.delete(id);if(ui.resIn===id)ui.resIn=null}else ui.open.add(id);renderCanvas()}
const cards=$('#cards');
cards.addEventListener('input',e=>{placeBar();if(e.target.matches('.resIn'))ui.resDraft=e.target.value});
cards.addEventListener('keydown',e=>{const ta=e.target.closest('.resIn');if(!ta)return;if(e.isComposing||e.keyCode===229)return;

  else if(e.key==='Escape'){e.preventDefault();const v=ta.value.trim();ui.busy=true;if(v)saveRes(id,v,false);else closeResIn();ui.busy=false}});

/* ---------- canvas interaction ---------- */
const cv=$('#canvas');let drag=null,dragMoved=false;
const toWorld=(cx,cy)=>{const r=cv.getBoundingClientRect();return{x:(cx-r.left-D.view.x)/D.view.z,y:(cy-r.top-D.view.y)/D.view.z}};
function stopLinking(){ui.linking=null;cv.classList.remove('linking');renderCanvas()}
/* middle button drags the canvas from anywhere, even on top of a card */
cv.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault()});
cv.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
cv.addEventListener('pointerdown',e=>{
  if(e.button===1){e.preventDefault();hideMenu();dragMoved=false;drag={pan:true,sx:e.clientX,sy:e.clientY,ox:D.view.x,oy:D.view.y,moved:false};cv.classList.add('panning');return}
  if(e.button!==0)return;hideMenu();dragMoved=false;
  const fe=e.target.closest('.fr-t,.fr-rs');
  if(fe&&!ui.linking){const f=D.frames.find(z=>z.id===fe.closest('.frame').dataset.f);if(!f)return;e.preventDefault();if(ui.editing){commitEdit();renderCanvas()}
    select(null);ui.frame=f.id;paintFrames();
    drag=fe.matches('.fr-rs')?{fr:f,rs:true,sx:e.clientX,sy:e.clientY,ow:f.w,oh:f.h,moved:false}
      :{fr:f,sx:e.clientX,sy:e.clientY,ox:f.x,oy:f.y,moved:false,mem:inFrame(f).map(t=>[t.id,t.x,t.y])};return}
  if(ui.frame){ui.frame=null;paintFrames()}
  const card=e.target.closest('.card');
  const twb=e.target.closest('.twin');
  if(card&&twb&&!ui.linking){e.preventDefault();if(ui.editing){commitEdit();renderCanvas()}gotoTwin(card.dataset.id,e.target.dataset.tw==='src');return}
  if(card&&e.target.closest('.nbk')&&!ui.linking){e.preventDefault();if(ui.editing){commitEdit();renderCanvas()}openNb(card.dataset.id);return}
  if(card&&e.target.closest('.addk')&&!ui.linking){e.preventDefault();if(ui.editing){commitEdit();renderCanvas()}addChild(card.dataset.id);return}
  if(card&&e.target.closest('.rz')&&!ui.linking){const id=card.dataset.id;if(ui.editing&&ui.editing!==id){commitEdit();renderCanvas()}select(id);const el=cardEl(id);
    drag={rz:id,sx:e.clientX,sy:e.clientY,ow:el.offsetWidth,oh:el.offsetHeight,moved:false};el.classList.add('rzing');e.preventDefault();return}
  if(card){const id=card.dataset.id;
    if(ui.linking){const child=D.tasks[ui.linking];if(id!==child.id){if(descendants(child.id).includes(id))toast('不能绑定到自己的子任务下面');else{mutate(()=>{child.parent=id;hist(child,'parent',id);D.tasks[id].fold=false});tidyBranch(id,true)}}stopLinking();return}
    if(e.target.matches('input')||e.target.isContentEditable)return;
    if(e.shiftKey){if(ui.editing){commitEdit();renderCanvas()}toggleMulti(id);return}
    if(e.target.closest('.res')){if(ui.sel!==id)select(id);return}
    if(ui.editing&&ui.editing!==id){commitEdit();renderCanvas()}
    const group=ui.multi.size>1&&ui.multi.has(id);
    if(group)ui.sel=id;else select(id);const t=D.tasks[id];
    /* dragging a card carries its whole branch (and the other picked cards); hold Alt to move only the cards themselves */
    const mv=new Set();for(const g of group?selIds():[id]){mv.add(g);if(!e.altKey)for(const d of descendants(g))mv.add(d)}mv.delete(id);
    drag={id,group,sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y,moved:false,sub:[...mv].map(d=>[d,D.tasks[d].x,D.tasks[d].y])};return}
  if(ui.linking){stopLinking();return}
  if(ui.editing){commitEdit();renderCanvas()}
  if(e.shiftKey){const r=cv.getBoundingClientRect();const m=document.createElement('div');m.id='marq';cv.appendChild(m);
    drag={box:m,sx:e.clientX,sy:e.clientY,r,base:new Set(selIds()),moved:false};e.preventDefault();return}
  if(ui.sel||ui.multi.size)select(null);
  drag={pan:true,sx:e.clientX,sy:e.clientY,ox:D.view.x,oy:D.view.y,moved:false};cv.classList.add('panning')});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<4)return;dragMoved=true;
  if(drag.pan){drag.moved=true;D.view.x=drag.ox+dx;D.view.y=drag.oy+dy;applyView();return}
  if(drag.fr){if(!drag.moved){snap();drag.moved=true}const f=drag.fr;
    if(drag.rs){f.w=Math.max(200,Math.round(drag.ow+dx/D.view.z));f.h=Math.max(140,Math.round(drag.oh+dy/D.view.z))}
    else{f.x=Math.round(drag.ox+dx/D.view.z);f.y=Math.round(drag.oy+dy/D.view.z);
      for(const[id,x,y]of drag.mem){const t=D.tasks[id];if(!t)continue;t.x=Math.round(x+dx/D.view.z);t.y=Math.round(y+dy/D.view.z);const el=cardEl(id);if(el){el.style.left=t.x+'px';el.style.top=t.y+'px'}}drawLinks();placeBar()}
    paintFrame(f);return}
  if(drag.box){drag.moved=true;const r=drag.r,x1=Math.min(drag.sx,e.clientX),y1=Math.min(drag.sy,e.clientY),x2=Math.max(drag.sx,e.clientX),y2=Math.max(drag.sy,e.clientY);
    Object.assign(drag.box.style,{left:x1-r.left+'px',top:y1-r.top+'px',width:x2-x1+'px',height:y2-y1+'px'});
    const a=toWorld(x1,y1),b=toWorld(x2,y2);const hit=new Set(drag.base);
    for(const t of Object.values(D.tasks))if(t.x<b.x&&t.x+cw(t)>a.x&&t.y<b.y&&t.y+H(t.id)>a.y)hit.add(t.id);
    ui.multi=hit;ui.sel=hit.size?[...hit].pop():null;paintSel();return}
  if(drag.rz){if(!drag.moved){snap();drag.moved=true}const t=D.tasks[drag.rz],el=cardEl(drag.rz);if(!t||!el)return;
    t.w=Math.max(160,Math.min(900,Math.round(drag.ow+dx/D.view.z)));el.style.width=t.w+'px';el.style.maxWidth='none';
    /* height only sticks when dragged past what the text needs, so widening never leaves a gap */
    const want=Math.round(drag.oh+dy/D.view.z);el.style.minHeight='';const nat=el.offsetHeight;
    if(want>nat+4){t.h=want;el.style.minHeight=want+'px'}else delete t.h;drawLinks();placeBar();return}
  if(!drag.moved){snap();drag.moved=true}
  const t=D.tasks[drag.id];t.x=Math.round(drag.ox+dx/D.view.z);t.y=Math.round(drag.oy+dy/D.view.z);
  for(const[d,x,y]of drag.sub){D.tasks[d].x=Math.round(x+dx/D.view.z);D.tasks[d].y=Math.round(y+dy/D.view.z)}
  for(const id of[drag.id,...drag.sub.map(s=>s[0])]){const el=cardEl(id);if(el){el.style.left=D.tasks[id].x+'px';el.style.top=D.tasks[id].y+'px'}}drawLinks();placeBar()});
window.addEventListener('pointerup',()=>{if(!drag)return;if(drag.pan)cv.classList.remove('panning');
  if(drag.fr){if(drag.moved){drag.fr.updatedAt=now();touch()}drag=null;return}
  if(drag.box){drag.box.remove();if(ui.multi.size<2){const one=[...ui.multi][0]||null;select(one)}drag=null;return}
  /* a plain click on one of several picked cards narrows the pick to that card */
  if(drag.group&&!drag.moved){const id=drag.id;drag=null;select(id);return}
  if(drag.rz){const el=cardEl(drag.rz);el&&el.classList.remove('rzing');const t=D.tasks[drag.rz];if(drag.moved&&t){t.updatedAt=now();touch()}drag=null;if(renderAfterDrag){renderAfterDrag=false;render()}return}
  if(drag.moved){const t=!drag.pan&&D.tasks[drag.id];if(t)t.updatedAt=now();touch()}drag=null;if(renderAfterDrag){renderAfterDrag=false;render()}});
/* mouse wheel zooms around the pointer, between 30% and 150% */
const ZMIN=.3,ZMAX=1.5;
function zoomAt(mx,my,z){const z0=D.view.z;z=Math.min(ZMAX,Math.max(ZMIN,z));if(z===z0)return;D.view.x=mx-(mx-D.view.x)*z/z0;D.view.y=my-(my-D.view.y)*z/z0;D.view.z=z;applyView();clearTimeout(cv._w);cv._w=setTimeout(touch,400)}
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();
  const dy=e.deltaMode===1?e.deltaY*33:e.deltaY;zoomAt(e.clientX-r.left,e.clientY-r.top,D.view.z*Math.exp(-dy*0.0015))},{passive:false});
cv.addEventListener('dblclick',e=>{const ft=e.target.closest('.fr-t');if(ft){const f=D.frames.find(z=>z.id===ft.closest('.frame').dataset.f);if(f)renameFrame(f);return}
  if(e.target.closest('.twin'))return;
  const card=e.target.closest('.card');
  if(card&&e.target.closest('.addk,.nbk'))return;
  if(card&&e.target.closest('.rz')){const t=D.tasks[card.dataset.id];if(t&&(t.w||t.h))mutate(()=>{delete t.w;delete t.h;t.updatedAt=now()});return}
  if(card){if(ui.editing===card.dataset.id)return;if(!e.target.matches('input,textarea')&&!e.target.closest('.res,.chip'))startEdit(card.dataset.id);return}const p=toWorld(e.clientX,e.clientY);newAt(p.x,p.y)});
cv.addEventListener('change',e=>{if(e.target.dataset.a==='done'){const id=e.target.closest('.card').dataset.id;e.target.blur();setCheck(id,e.target.checked);select(id)}});

function newAt(x,y){let t;mutate(()=>{t=newTask('',null,Math.round(x),Math.round(y))});select(t.id);startEdit(t.id)}
function setCheck(id,v){mutate(()=>{const t=D.tasks[id];t.done=v;t.updatedAt=now()})}
function startEdit(id){if(ui.resIn){ui.busy=true;closeResIn();ui.busy=false}select(id);ui.editing=id;renderCanvas()}
const isBlank=t=>!t.text&&!kids(t.id).length&&!t.crit&&!t.blk&&!(t.res||[]).length&&!t.history.length;
/* returns true if the card still exists afterwards */
function commitEdit(cancel){const id=ui.editing;if(!id)return false;ui.editing=null;const t=D.tasks[id];if(!t)return false;
  const tx=cardEl(id)&&cardEl(id).querySelector('.t');const v=tx?tx.innerText.replace(/\s+$/,''):t.text;
  if(cancel||!v){if(isBlank(t)){delete D.tasks[id];D.deleted[id]=now();if(ui.sel===id)select(null);touch();return false}return true}
  if(v!==t.text){snap();t.text=v;delete t.autoT;hist(t,'text');touch()}return true}
function addChild(id){let n;const p=D.tasks[id];snap();if(p.fold){p.fold=false;renderCanvas()}const ks=kids(id);const y=ks.length?Math.max(...ks.map(k=>k.y+H(k.id)))+GY:p.y;
  const nx=p.x+cw(p)+GAP;n=newTask('',id,nx,freeY(nx,y));touch();render();startEdit(n.id)}
function addSibling(id){let n;const t=D.tasks[id];const x=t.x;const y=freeY(x,t.y+H(id)+GY);mutate(()=>{n=newTask('',t.parent,x,y)});startEdit(n.id)}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(ui.editing){commitEdit();renderCanvas()}saveNow();return}
  if($('#dlg').style.display==='flex')return;
  if(e.target.closest&&e.target.closest('#nb,#sx'))return;
  if(!nb.hidden){if(e.key==='Escape'){e.preventDefault();closeNb()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();nbQ.focus();nbQ.select()}return}
  if(ui.editing){
    if(e.isComposing||e.keyCode===229)return;
    if(e.key==='Escape'){e.preventDefault();commitEdit(true);renderCanvas();return}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const id=ui.editing;const ok=commitEdit();renderCanvas();if(ok&&!(e.ctrlKey||e.metaKey))addSibling(id);return}
    if(e.key==='Tab'){e.preventDefault();const id=ui.editing;const ok=commitEdit();renderCanvas();if(ok)addChild(id);return}
    return}
  /* only real text fields swallow shortcuts; a focused checkbox or button must not */
  if(e.target.matches&&e.target.matches('textarea,input:not([type=checkbox]):not([type=file])'))return;
  if(e.key==='Tab')e.preventDefault();
  if(e.key==='Escape'){hideMenu();if(ui.linking)stopLinking();else if(ui.frame){ui.frame=null;paintFrames()}else if(ui.sel||ui.multi.size)select(null);return}
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){e.preventDefault();redo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();openSearch();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&CLIP){const r=cv.getBoundingClientRect();if(MOUSE.x>=r.left&&MOUSE.x<=r.right&&MOUSE.y>=r.top&&MOUSE.y<=r.bottom){e.preventDefault();pasteTwin(toWorld(MOUSE.x,MOUSE.y))}return}
  if(ui.frame&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();const f=D.frames.find(z=>z.id===ui.frame);if(f)delFrame(f,false);return}
  if(ui.multi.size>1&&!(e.ctrlKey||e.metaKey||e.altKey)){const ids=selIds();
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();confirmDeleteMany(ids)}return}
  if(!ui.sel||!D.tasks[ui.sel])return;const id=ui.sel;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'||e.key==='F2'){e.preventDefault();startEdit(id)}
  else if(e.key==='Tab'){e.preventDefault();addChild(id)}
  else if(e.key.toLowerCase()==='r'||e.code==='KeyR'){e.preventDefault();openRes(id)}
  else if(e.key.toLowerCase()==='n'||e.code==='KeyN'){e.preventDefault();openNb(id)}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();confirmDelete(id)}
});
async function confirmDeleteMany(ids){const all=new Set();for(const i of ids){all.add(i);for(const d of descendants(i))all.add(d)}
  const extra=all.size-ids.length;const c=await askChoice('删除 '+ids.length+' 张卡片',extra?'下面还有 '+extra+' 个子任务，会一起删除。':'确定删除选中的卡片？',['取消','删除']);
  if(c==='删除'){mutate(()=>{for(const i of ids)if(D.tasks[i])delTask(i)});select(null)}}
async function confirmDelete(id){const n=descendants(id).length;const c=await askChoice('删除任务',n?'这个任务下面还有 '+n+' 个子任务，会一起删除。':'确定删除这个任务？',['取消','删除']);if(c==='删除')mutate(()=>delTask(id))}

/* ---------- tidy: tree layout, each parent centred on its children ---------- */
function layout(roots,ox,oy){const memo={};measureClosed=true;
  const ks=t=>kids(t.id);
  const size=t=>{if(memo[t.id]!=null)return memo[t.id];const k=ks(t);let s=H(t.id);if(k.length)s=Math.max(s,k.reduce((a,c)=>a+size(c),0)+GY*(k.length-1));return memo[t.id]=s};
  const place=(t,x,y0)=>{t.x=x;const h=H(t.id),sz=size(t),k=ks(t);if(!k.length){t.y=Math.round(y0);return}
    const cb=k.reduce((a,c)=>a+size(c),0)+GY*(k.length-1);let cy=y0+(sz-cb)/2;for(const c of k){place(c,x+cw(t)+GAP,cy);cy+=size(c)+GY}
    const f=k[0],l=k[k.length-1];const mid=(f.y+H(f.id)/2+l.y+H(l.id)/2)/2;t.y=Math.round(Math.min(Math.max(mid-h/2,y0),y0+sz-h))};
  try{let y=oy;for(const r of roots){size(r);place(r,ox,y);y+=size(r)+36}}finally{measureClosed=false}}
function tidy(only){const pool=only?inFrame(only):Object.values(D.tasks);const roots=pool.filter(t=>!t.parent).sort((a,b)=>a.y-b.y||a.x-b.x);if(!roots.length)return;
  const fr=(only?[only]:D.frames||[]).map(f=>[f,inFrame(f).filter(t=>!t.parent).map(t=>t.id)]);
  mutate(()=>{renderCanvas();for(const r of roots){const x0=r.x,y0=r.y;layout([r],x0,y0);const dy=y0-r.y;for(const d of[r.id,...descendants(r.id)])D.tasks[d].y+=dy}
    renderCanvas();for(const[f,rs]of fr)if(rs.length)growFrame(f,rs.flatMap(i=>[i,...descendants(i)]))});toast('已整理，主卡片位置不变')}
/* lay out one branch, keeping its root card where it is */
function tidyBranch(id,quiet){const t=D.tasks[id];if(!t)return;const run=()=>{renderCanvas();const x0=t.x,y0=t.y;layout([t],x0,y0);const dy=y0-t.y;for(const d of[id,...descendants(id)])if(!hidden(D.tasks[d]))D.tasks[d].y+=dy};
  if(quiet){run();touch();render()}else mutate(run)}

/* ---------- menus ---------- */
const menu=$('#menu');let menuAct={};
function showMenu(x,y,items){menuAct={};menu.innerHTML=items.map((it,i)=>{if(it==='-')return'<div class="sepl"></div>';
    if(it.head)return'<div class="mhd" title="'+esc(it.head)+'">'+esc(it.head)+'</div>';
    if(it.row){menuAct[i]=it.row.map(b=>b.f);return'<div class="mrow"><span class="ml">'+esc(it.l)+'</span>'+it.row.map((b,j)=>'<span class="mb'+(b.sw?' sw':'')+(b.on?' on':'')+'" data-i="'+i+'" data-j="'+j+'" title="'+esc(b.t||'')+'"'+(b.sw||b.bg?' style="background:'+(b.sw||b.bg)+'"':'')+'>'+esc(b.l||'')+'</span>').join('')+'</div>'}
    menuAct[i]=it.f;return'<div class="mi'+(it.danger?' danger':'')+'" data-i="'+i+'"><span>'+esc(it.l)+'</span>'+(it.k?'<span class="k">'+esc(it.k)+'</span>':'')+'</div>'}).join('');
  menu.style.display='block';const w=menu.offsetWidth,h=menu.offsetHeight;menu.style.left=Math.max(4,Math.min(x,innerWidth-w-8))+'px';menu.style.top=Math.max(4,Math.min(y,innerHeight-h-8))+'px'}
function hideMenu(){menu.style.display='none'}
menu.addEventListener('click',e=>{const b=e.target.closest('.mb');if(b){const f=menuAct[b.dataset.i]&&menuAct[b.dataset.i][b.dataset.j];hideMenu();f&&f();return}
  const m=e.target.closest('.mi');if(!m)return;const f=menuAct[m.dataset.i];hideMenu();f&&f()});
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&!e.target.closest('#fileBtn'))hideMenu()});
window.addEventListener('blur',hideMenu);

document.addEventListener('contextmenu',e=>{
  const ri=e.target.closest('.ri'),card=e.target.closest('.card');
  if(e.target.matches('textarea'))return;
  const ft=e.target.closest('.fr-t,.fr-rs');if(ft){e.preventDefault();const f=D.frames.find(z=>z.id===ft.closest('.frame').dataset.f);if(!f)return;select(null);ui.frame=f.id;paintFrames();showMenu(e.clientX,e.clientY,frameMenu(f));return}
  if(card&&e.target.closest('.twin')){e.preventDefault();select(card.dataset.id);showMenu(e.clientX,e.clientY,twinMenu(card.dataset.id));return}
  if(ri){e.preventDefault();showMenu(e.clientX,e.clientY,resMenu(card.dataset.id,ri.dataset.r));return}
  if(card){e.preventDefault();if(ui.editing){commitEdit();renderCanvas()}const id=card.dataset.id;if(!D.tasks[id])return;
    if(ui.multi.size>1&&ui.multi.has(id)){showMenu(e.clientX,e.clientY,multiMenu(selIds()));return}
    select(id);showMenu(e.clientX,e.clientY,taskMenu(id));return}
  if(e.target.closest('#canvas')){e.preventDefault();if(ui.editing){commitEdit();renderCanvas()}const p=toWorld(e.clientX,e.clientY);showMenu(e.clientX,e.clientY,[
    ...(CLIP?[{l:'在此处粘贴分身',k:'Ctrl+V',f:()=>pasteTwin(p)}]:[]),
    {l:'在这里新建卡片',k:'双击',f:()=>newAt(p.x,p.y)},
    {l:'搜索草稿',k:'Ctrl+F',f:openSearch},
    {l:'导出全部草稿',f:exportDrafts},
    {l:'在这里新建页面',f:()=>newFrame(p)},
    ...(D.frames.length?[{l:'去页面',row:D.frames.slice().sort((a,b)=>a.y-b.y||a.x-b.x).map(f=>({l:f.title||'页面',t:'跳到这一页',f:()=>focusFrame(f)}))}]:[]),
    '-',
    {l:'整理',f:tidy},{l:'回到原点',f:home},
    ...(D.view.z!==1?[{l:'缩放回 100%',k:Math.round(D.view.z*100)+'%',f:()=>{const r=cv.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1)}}]:[]),
    '-',{l:'撤销',k:'Ctrl+Z',f:undo},{l:'还原',k:'Ctrl+Y',f:redo},'-',...fileItems()])}
});
/* colour and text size, kept simple: one row each */
const COLS=[['','默认','var(--card)'],['y','黄','var(--cy)'],['o','橙','var(--co)'],['r','红','var(--cr)'],['p','紫','var(--cp)'],['b','蓝','var(--cb)'],['g','绿','var(--cg)'],['n','灰','var(--cn)']];
function tplBg(x){const c=COLS.find(c=>c[0]===(x.color||''));return c?c[2]:'var(--card)'}
function tplLabel(x){return x.name+(x.fs?' '+x.fs:'')}
function applyTpl(t,x){mutate(()=>{if(x.color)t.color=x.color;else delete t.color;if(x.fs)t.fs=x.fs;else delete t.fs;t.updatedAt=now()})}
async function saveTpl(t){const v=await ask('模板名称','','比如：标题、步骤、提醒');if(!v)return;
  mutate(()=>{D.templates.push({id:uid(),name:v,color:t.color||'',fs:t.fs||0})});toast('已存为模板：'+v)}
function styleRows(t){return[...(t.w||t.h?[{l:'恢复默认大小',f:()=>mutate(()=>{delete t.w;delete t.h;t.updatedAt=now()})}]:[])]}
function fileItems(){return[{head:fileStatus()},{l:'保存',k:'Ctrl+S',f:saveNow},{l:'另存为…',f:bindNew},{l:'打开文件…',f:bindOpen},{l:'导入并合并…',f:()=>$('#impFile').click()},{l:'导出备份',f:exportJSON}]}
/* the card and everything under it as an indented outline, ready to paste into a chat with Claude */
function flowText(id){const d=new Date(),out=[];const root=D.tasks[id];
  out.push('下面是我在任务工具 X 里的一条流程（'+(root.parent?'某条流程中的一支':'从最前面的卡片开始')+'）。缩进表示上下级，从上到下是卡片在画布上的顺序。');
  out.push('[ ] 是没打勾的任务，[x] 是已打勾的任务，没有方框的是笔记。「标准」是完成标准，「卡住」是在等的东西，「阻力」是我记下的开始不了的原因，「笔记本」是我在这张卡片里写的草稿。');
  out.push('导出时间：'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm(d),'');
  const one=(t,dep)=>{const ind='  '.repeat(dep),sub=ind+'  ';const box=t.note?'':t.done?'[x] ':'[ ] ';
    const lines=(t.text||'（空）').split('\n');out.push(ind+'- '+box+lines[0]);for(const l of lines.slice(1))out.push(sub+l);
    if(t.nb&&t.nb.trim()){out.push(sub+'笔记本：');for(const l of t.nb.split('\n'))out.push(sub+'  '+l)}
    if(t.crit)out.push(sub+'标准：'+t.crit);if(t.blk)out.push(sub+'卡住：'+t.blk);
    for(const r of t.res||[])out.push(sub+'阻力（'+stamp(r.createdAt)+'）：'+r.text.replace(/\n/g,' '));
    for(const k of kids(t.id))one(k,dep+1)};
  one(root,0);return out.join('\n')}
async function copyFlow(id){const txt=flowText(id);let ok=false;
  try{await navigator.clipboard.writeText(txt);ok=true}catch(_){}
  if(!ok){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove()}
  toast(ok?'已复制整条流程，去 Claude 里粘贴就行':'复制没成功，改用下载');if(!ok)downloadFlow(id)}
function downloadFlow(id){const t=D.tasks[id];const b=new Blob([flowText(id)],{type:'text/markdown'});const a=document.createElement('a');const d=new Date();
  const nm=(t.text||'流程').split('\n')[0].replace(/[\\/:*?"<>|]/g,'').slice(0,30).trim()||'流程';
  a.href=URL.createObjectURL(b);a.download=pad(d.getFullYear()%100)+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'-'+nm+'.md';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
/* one menu for several cards: every change below applies to all of them in a single undo step */
function multiMenu(ids){const ts=ids.map(i=>D.tasks[i]);
  const each=fn=>()=>mutate(()=>{for(const t of ts){fn(t);t.updatedAt=now()}});
  return[{head:'已选 '+ts.length+' 张卡片'},
  ...(ts.some(t=>t.note)?[{l:'设为任务',f:each(t=>{if(t.note){delete t.note;hist(t,'task')}})}]:[]),
  ...(ts.some(t=>!t.note)?[{l:'取消任务',f:each(t=>{if(!t.note){t.note=true;t.done=false;hist(t,'note')}})}]:[]),
  ...(ts.some(t=>t.w||t.h)?[{l:'恢复默认大小',f:each(t=>{delete t.w;delete t.h})}]:[]),
  '-',
  {l:'创建分身',f:()=>makeTwin(ids)},
  {l:'放进新页面',f:()=>newFrame({x:0,y:0},ids)},
  '-',
  {l:'撤销',k:'Ctrl+Z',f:undo},{l:'还原',k:'Ctrl+Y',f:redo},
  '-',
  {l:'删除这 '+ts.length+' 张',k:'Delete',danger:true,f:()=>confirmDeleteMany(ids)}]}
/* card menu, top to bottom: share it, describe it, place it in the tree, undo, delete */
function taskMenu(id){const t=D.tasks[id];const nk=kids(id).length;return[
  {l:'复制整条流程给 Claude',f:()=>copyFlow(id)},
  {l:'下载整条流程（.md）',f:()=>downloadFlow(id)},
  '-',
  {l:'笔记本',k:'N',f:()=>openNb(id)},
  {l:'记一条阻力',k:'R',f:()=>openRes(id)},
  {l:t.crit?'修改完成标准':'写完成标准',f:async()=>{const v=await ask('完成标准',t.crit,'做到什么程度就算完');if(v!==null)mutate(()=>{t.crit=v;hist(t,'crit',v)})}},
  {l:t.blk?'修改卡住原因':'标记为卡住',f:async()=>{const v=await ask('卡在哪里',t.blk,'在等谁、等什么');if(v!==null)mutate(()=>{t.blk=v;hist(t,'blocked',v)})}},
  ...(t.blk?[{l:'解除卡住',f:()=>mutate(()=>{t.blk='';hist(t,'unblocked')})}]:[]),
  {l:t.note?'设为任务':'取消任务',f:()=>mutate(()=>{if(t.note)delete t.note;else{t.note=true;t.done=false}hist(t,t.note?'note':'task')})},
  '-',
  {l:'添加子卡片',k:'Tab',f:()=>addChild(id)},
  {l:'添加同级卡片',f:()=>addSibling(id)},
  {l:'绑定到父卡片…',f:()=>{ui.linking=id;cv.classList.add('linking');renderCanvas()}},
  ...(t.parent?[{l:'解除绑定',f:()=>mutate(()=>{t.parent=null;hist(t,'parent',null)})}]:[]),
  ...(nk?[{l:'整理这一支',f:()=>tidyBranch(id)}]:[]),
  ...styleRows(t),
  '-',
  {l:'创建分身',f:()=>makeTwin([id])},
  ...(TWM[tkey(t)]?[{l:'脱离分身',f:()=>unlinkTwin(id)}]:[]),
  '-',
  {l:'撤销',k:'Ctrl+Z',f:undo},{l:'还原',k:'Ctrl+Y',f:redo},
  '-',
  {l:'删除'+(nk?'（连同子卡片）':''),k:'Delete',danger:true,f:()=>confirmDelete(id)}]}
function resMenu(tid,rid){const t=D.tasks[tid];const r=t&&(t.res||[]).find(x=>x.id===rid);if(!r)return[];return[
  {l:'编辑这条阻力',f:async()=>{const v=await ask('编辑',r.text,'',true);if(v&&v!==r.text)mutate(()=>{r.text=v;r.updatedAt=now();t.updatedAt=now()})}},
  {l:'再记一条',f:()=>openRes(tid)},
  '-',{l:'删除这条',danger:true,f:()=>mutate(()=>{t.res=t.res.filter(x=>x!==r);t.updatedAt=now();if(!t.res.length)ui.open.delete(tid)})}]}
function home(){D.view={x:40,y:40,z:1};applyView();touch()}

/* ---------- top bar ---------- */
document.querySelectorAll('#top button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
$('#tidyBtn').addEventListener('mousedown',e=>e.preventDefault());$('#tidyBtn').addEventListener('contextmenu',e=>e.preventDefault());$('#tidyBtn').onclick=()=>{if(ui.editing){commitEdit();renderCanvas()}tidy()};
$('#reconnect').onclick=reconnect;
function exportJSON(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');const d=new Date();a.href=URL.createObjectURL(b);a.download=pad(d.getFullYear()%100)+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'-X-backup.json';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#impFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const inc=norm(JSON.parse(await f.text()));mutate(()=>{D=merge(D,inc)});toast('已合并：较新的条目覆盖较旧的')}catch(err){toast('这个文件读不了：'+err.message)}};
window.addEventListener('beforeunload',()=>{if(dirty&&fileHandle)writeFile()});

/* ---------- boot ---------- */
(async()=>{
  let loaded=false;try{const s=localStorage.getItem(LS);if(s){D=norm(JSON.parse(s));loaded=true}}catch(_){}
  const h=await idbGet('handle');
  if(h){fileHandle=h;try{const p=await h.queryPermission({mode:'readwrite'});if(p==='granted'){D=merge(D,norm(JSON.parse(await(await h.getFile()).text())));loaded=true}else showReconnect()}catch(_){showReconnect()}}
  if(!loaded&&!h){seed();render();layout(Object.values(D.tasks).filter(t=>!t.parent),0,0);undoStack.length=0;render();return}
  render();
})();
</script>
</body>
