function imgDims(c,max){
  const w=Math.min(max||430,Math.max(120,c.w));
  return {w:Math.round(w),h:Math.round(w*(c.ar||0.66))};
}
function hex6(col){
  if(!col)return null;
  const m=col.match(/rgba?\(([^)]+)\)/);
  if(m){const p=m[1].split(",").map(x=>parseFloat(x));
    if(p.length>3&&p[3]===0)return null;
    return p.slice(0,3).map(x=>Math.round(x).toString(16).padStart(2,"0")).join("")}
  const h=col.replace("#","");
  if(/^[0-9a-f]{6}$/i.test(h))return h.toLowerCase();
  if(/^[0-9a-f]{3}$/i.test(h))return h.split("").map(x=>x+x).join("").toLowerCase();
  return null;
}
const HLMAP=[["fff3a3","yellow"],["c8f0c6","green"],["cfe4ff","cyan"],["fbd3e8","magenta"]];
function nearestHL(h){
  if(!h)return null;
  const to=x=>[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];
  const a=to(h);let best=null,bd=1e9;
  HLMAP.forEach(([k,name])=>{const b=to(k);
    const d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
    if(d<bd){bd=d;best=name}});
  return bd<24000?best:"yellow";
}
function richRuns(html){
  const box=document.createElement("div");box.innerHTML=html||"";
  const out=[];
  const walk=(node,st)=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){if(n.nodeValue)out.push({...st,text:n.nodeValue});return}
      if(n.nodeType!==1)return;
      if(n.tagName==="BR"){out.push({...st,text:"\n"});return}
      const cs=n.style||{},s2={...st},tag=n.tagName;
      if(tag==="B"||tag==="STRONG"||cs.fontWeight==="bold"||+cs.fontWeight>=600)s2.bold=true;
      if(tag==="I"||tag==="EM"||cs.fontStyle==="italic")s2.italics=true;
      if(tag==="U"||(cs.textDecoration||"").includes("underline"))s2.underline={};
      if(tag==="S"||tag==="STRIKE"||tag==="DEL"||(cs.textDecoration||"").includes("line-through"))s2.strike=true;
      const col=hex6(cs.color);if(col)s2.color=col;
      const bg=hex6(cs.backgroundColor);
      if(bg)s2.highlight=nearestHL(bg);else if(cs.backgroundColor==="transparent")delete s2.highlight;
      const fs=parseFloat(cs.fontSize);if(fs)s2.size=Math.round(fs*1.5);
      walk(n,s2);
    });
  };
  walk(box,{});
  return out;
}
function paraFrom(c,D,extra){
  const {Paragraph,TextRun}=D;
  if(!c.rich)return null;
  const runs=richRuns(c.rich);
  if(!runs.length)return null;
  const paras=[];let cur=[];
  runs.forEach(r=>{
    r.text.split("\n").forEach((piece,i)=>{
      if(i){paras.push(cur);cur=[]}
      if(piece)cur.push(new TextRun({...r,text:piece}));
    });
  });
  if(cur.length)paras.push(cur);
  return paras.filter(p=>p.length).map(p=>new Paragraph({children:p,...(extra||{})}));
}
async function exportDocx(D,o,tree){
  const {Document,Packer,Paragraph,TextRun,ImageRun,HeadingLevel,AlignmentType}=D;
  // Word 内置标题最多到六级，超出的一律用第六级，不会丢内容
  const HL=[null,HeadingLevel.HEADING_1,HeadingLevel.HEADING_2,HeadingLevel.HEADING_3,
    HeadingLevel.HEADING_4,HeadingLevel.HEADING_5,HeadingLevel.HEADING_6];
  const hl=v=>HL[Math.min(Math.max(1,v),6)];
  const kids=[new Paragraph({text:o.title,heading:HeadingLevel.TITLE})];
  const emit=(n)=>{
    const c=n.c;
    if(o.img&&srcOf(c)){
      const d=imgDims(c);
      try{kids.push(new Paragraph({children:[new ImageRun({
        data:srcOf(c).split(",")[1],transformation:{width:d.w,height:d.h}})]}))}catch(e){}
    }
    if(n.isRef&&o.twinRef){                     // 只有勾选了才写成交叉引用
      const src=tree.byId[orig(c).id];
      if(src&&src!==n)kids.push(new Paragraph({children:[new TextRun({
        text:"\u25C8 "+t("twinSee")+" "+refLabel(src),italics:true,size:18,color:"777777"})]}));
      return;
    }
    if(orig(c).tb){                          // 表格：导出成 Word 真表格
      const g=orig(c).tb;
      try{
        const {Table,TableRow,TableCell,WidthType}=D;
        kids.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},
          rows:g.rows.map((row,ri)=>new TableRow({
            tableHeader:!!(g.head&&ri===0),
            children:row.map((cell,ci)=>new TableCell({
              children:[new Paragraph({
                alignment:(()=>{const f=g.fmt&&g.fmt[ri+","+ci];
                  if(!f||!f.al)return undefined;
                  return f.al==="center"?AlignmentType.CENTER
                    :f.al==="right"?AlignmentType.RIGHT:AlignmentType.LEFT})(),
                children:[new TextRun({text:String(cell||""),
                  bold:!!((g.head&&ri===0)||(g.headCol&&ci===0)||(g.fmt&&g.fmt[ri+","+ci]&&g.fmt[ri+","+ci].b))})]})]
            }))
          }))
        }));
        kids.push(new Paragraph({text:""}));
      }catch(e){
        g.rows.forEach(row=>kids.push(new Paragraph({text:row.join("　")})));
      }
      return;
    }
    const oc2=orig(c);
    const txt=(oc2.text||"").split(/\n+/).filter(z=>z.trim());
    const rich=oc2.rich?paraFrom(oc2,D,n.out?{heading:hl(n.out)}:null):null;
    if(rich&&rich.length){
      if(n.out){kids.push(rich[0]);rich.slice(1).forEach(p=>kids.push(p))}
      else rich.forEach(p=>kids.push(p));
    }
    else if(n.out){kids.push(new Paragraph({text:(txt[0]||snippet(oc2)),heading:hl(n.out)}));
      txt.slice(1).forEach(z=>kids.push(new Paragraph({text:z})))}
    else if(n.bib){
      kids.push(new Paragraph({
        indent:{left:360,hanging:360},          // 文献条目用悬挂缩进，与参考文献惯例一致
        children:[new TextRun({text:txt.join(" "),bold:true})]}));
    }
    else if(n.quote)txt.forEach(z=>kids.push(new Paragraph({
      indent:{left:560},
      children:[new TextRun({text:z,italics:true,color:"444444"})]})));
    else txt.forEach(z=>kids.push(new Paragraph({text:z})));
    if(o2u(c)){
      try{
        const {ExternalHyperlink}=D;
        kids.push(new Paragraph({children:[new ExternalHyperlink({
          children:[new TextRun({text:o2u(c),style:"Hyperlink",size:18})],link:o2u(c)})]}));
      }catch(e){
        kids.push(new Paragraph({children:[new TextRun({text:o2u(c),size:18,color:"2D6CDF"})]}));
      }
    }
    if(o.tags){const tg=cardTags(c);
      if(tg.length)kids.push(new Paragraph({children:[new TextRun({
        text:tg.map(x=>"#"+x).join("  "),italics:true,size:18,color:"888888"})]}))}
    if(o.refs){
      const r=relationsFor(c.id,tree.byId);
      r.out.forEach(({n:m,l})=>kids.push(new Paragraph({children:[new TextRun({
        text:"\u2192 "+t("relSee")+" "+refLabel(m)+"\uFF08"+relName(l)+"\uFF09"+(l.note?"  "+l.note.replace(/\n+/g," "):""),
        italics:true,size:18,color:"777777"})]})));
      r.inn.forEach(({n:m,l})=>{if(l.arrow!=="none"&&l.arrow!=="both")
        kids.push(new Paragraph({children:[new TextRun({
          text:"\u2190 "+t("relFrom")+" "+refLabel(m),italics:true,size:18,color:"999999"})]}))});
    }
  };
  if(o.byPageDoc){
    // 页面标题作为最高一级，页内卡片层级整体下移一级
    pageGroups(null).forEach((g,gi)=>{
      kids.push(new Paragraph({text:(gi+1)+"  "+g.title,heading:HeadingLevel.HEADING_1}));
      buildTree(g.cards,1,gi+1).flat.forEach(emit);
    });
  }else tree.flat.forEach(emit);
  const links=S.links.filter(l=>tree.byId[l.a]&&tree.byId[l.b]&&
    !(l.st&&S.outline!==false));
  if(o.table&&links.length){
    kids.push(new Paragraph({text:t("relTable"),heading:HeadingLevel.HEADING_1}));
    links.forEach(l=>{const a=tree.byId[l.a],b=tree.byId[l.b];if(!a||!b)return;
      kids.push(new Paragraph({children:[new TextRun({
        text:refLabel(a)+"  \u2192  "+refLabel(b)+"   \u00B7 "+relName(l)+(l.note?"   \u00B7 "+l.note.replace(/\n+/g," "):""),
        size:20})]}))});
  }
  const doc=new Document({sections:[{children:kids}]});
  const blob=await Packer.toBlob(doc);
  dl(blob,o.title+".docx");
}
const o2u=c=>orig(c).url||"";
function safeRich(html){
  const box=document.createElement("div");box.innerHTML=html||"";
  box.querySelectorAll("*").forEach(el=>{
    if(el.tagName==="A"){
      const href=el.getAttribute("href")||"";
      [...el.attributes].forEach(a=>el.removeAttribute(a.name));
      if(/^(https?|mailto|file):/i.test(href)){el.setAttribute("href",href);el.setAttribute("target","_blank")}
      return;
    }
    if(!["SPAN","B","I","U","S","STRIKE","DEL","STRONG","EM","BR","DIV","FONT"].includes(el.tagName)){
      el.replaceWith(...el.childNodes);return;
    }
    [...el.attributes].forEach(a=>{if(a.name!=="style")el.removeAttribute(a.name)});
  });
  return box.innerHTML;
}
function esc(x){return (x||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}

async function captureCanvas(scale,list){

  CULL.m=1e7;S.linkView="all";hoverId=null;sel=[];selLink=null;

  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1";
  const wrap=document.createElement("div");
  wrap.style.cssText=`position:relative;left:0;top:0;width:${W}px;height:${H}px;
    overflow:hidden;background:${S.bg}`;
  const inner=$("world").cloneNode(true);

    const okL=new Set(S.links.filter(l=>keep.has(l.a)&&keep.has(l.b)).map(l=>l.id));
    inner.querySelectorAll("[data-link]").forEach(el=>{if(!okL.has(el.dataset.link))el.remove()});
  }

  const svg=inner.querySelector("#links");

        width:W,height:H,windowWidth:W,windowHeight:H});

function selHTML(r,cap){
  const box=document.createElement("div");
  box.appendChild(r.cloneContents());
  let n=r.commonAncestorContainer;
  if(n.nodeType===3)n=n.parentNode;
  const chain=[];
  while(n&&n!==cap&&n.nodeType===1){
    if(["SPAN","A","B","I","U","S","STRIKE","DEL","STRONG","EM","FONT"].includes(n.tagName))chain.push(n);
    n=n.parentNode;

    box.appendChild(w);
  });

function wrapSelWith(css){

function applyTemplate(tpl){

      if(/<(span|b|i|u|s|strike|del|strong|em|font)\b/i.test(h))o.rich=h;else delete o.rich;

// 整体等比缩放：改的是文档的尺度，所以位置、宽度、页面框、连线粗细都要一起缩，
// 否则字变小了而间距不变，画布会变得空洞。锁定与手动调过的卡片一并参与，
// 它们与基准的相对差异因此得以保留。
function baseSize(){return ({...DEF,...S.textDef}).size||15}
function scaleRich(html,k){
  return (html||"").replace(/font-size:\s*([\d.]+)px/gi,
    (m,v)=>"font-size: "+Math.max(4,Math.round(parseFloat(v)*k*100)/100)+"px");
}
function scaleStyleObj(o,k){
  if(!o)return o;
  if(o.size)o.size=Math.max(4,Math.round(o.size*k*100)/100);
  return o;                                  // 行距是倍数、字距是 em，本身就是相对量，不缩
}
function rescaleAll(k){
  if(!(k>0)||Math.abs(k-1)<1e-6)return;
  snap();
  S.cards.forEach(c=>{
    c.x=Math.round(c.x*k);c.y=Math.round(c.y*k);
    c.w=Math.max(20,Math.round(c.w*k));
    if(c.h)c.h=Math.round(c.h*k);
    if(c.tb)c.tb.cols=c.tb.cols.map(w=>Math.max(30,Math.round(w*k)));
    if(c.s)scaleStyleObj(c.s,k);
    if(c.rich)c.rich=scaleRich(c.rich,k);
  });
  (S.frames||[]).forEach(f=>{
    f.x=Math.round(f.x*k);f.y=Math.round(f.y*k);
    f.w=Math.max(60,Math.round(f.w*k));f.h=Math.max(60,Math.round(f.h*k));
  });
  S.links.forEach(l=>{if(l.w)l.w=Math.max(.4,Math.round(l.w*k*100)/100)});
  if(S.linkDef&&S.linkDef.w)S.linkDef.w=Math.max(.4,Math.round(S.linkDef.w*k*100)/100);
  scaleStyleObj(S.textDef,k);
  if(S.lvStyle)Object.keys(S.lvStyle).forEach(lv=>scaleStyleObj(S.lvStyle[lv],k));
  (S.templates||[]).forEach(tp=>{
    if(tp.w)tp.w=Math.max(20,Math.round(tp.w*k));
    scaleStyleObj(tp.s,k);
  });
  if(S.imgMax)S.imgMax=Math.max(60,Math.round(S.imgMax*k));
  // 世界坐标整体乘以 k，把缩放同步除掉，屏幕上看起来没有跳变
  cam.z=cam.z/k;tgt.z=tgt.z/k;
  Object.keys(size).forEach(id=>delete size[id]);
  mapCam=null;
  applyCam();render();save();
  toast(t("scaleDone")+" "+Math.round(k*100)+"%");
}

function setAlign(v){

function cmd(name){

    const r=tbRect(),c=card(r.id),tb=orig(c).tb;

    applyCellFmt(key,allOn?null:true);

function selBg(){
  const r=textSel();if(!r)return null;
  let n=r.startContainer;if(n.nodeType===3)n=n.parentNode;
  const cap=n.closest?n.closest(".cap"):null;
  while(n&&n!==cap){
    const bg=getComputedStyle(n).backgroundColor;
    const h=hex6(bg);
    if(h&&!/rgba\(0, 0, 0, 0\)/.test(bg))return h;
    n=n.parentNode;
  }
  return null;
}

let hits=[],hitIdx=-1;
function findQ(){return $("findq").value.trim().toLowerCase()}
function showFind(on){
  const f=$("find");
  if(on){f.classList.add("on");syncFindMode();$("findq").focus();$("findq").select()}
  else{f.classList.remove("on");$("findq").value="";runFind()}

$("findm").onclick=()=>{S.findMode=S.findMode==="tag"?"all":"tag";syncFindMode();runFind();save();$("findq").focus()};
function runFind(){
  const q=findQ().replace(/^#/,"");
  hits=!q?[]:S.cards.filter(c=>S.findMode==="tag"
    ? cardTags(c).some(x=>x.includes(q))
    : ((orig(c).text||"").toLowerCase().includes(q)||(orig(c).url||"").toLowerCase().includes(q)
       ||cardTags(c).some(x=>x.includes(q))));
  if(S.findMerge){                       // 合并同一内容，只保留源或第一处
    const seen=new Set();
    hits=hits.filter(c=>{const k=orig(c).id;if(seen.has(k))return false;seen.add(k);return true});
  }
  if(!hits.some(c=>c===S.cards[hitIdx]))hitIdx=-1;
  document.body.classList.toggle("finding",!!q);
  paintFind();
  $("findn").textContent=q?(hits.length?(Math.max(0,hits.indexOf(S.cards[hitIdx]))+1)+" / "+hits.length:t("noHit")):"";
}
function paintFind(){

  document.querySelectorAll(".card").forEach(el=>{
    const on=ids.includes(el.dataset.id);

    el.classList.toggle("nomatch",!!q&&!on);
  });
}
function stepHit(d){
  if(!hits.length)return;
  let i=hits.indexOf(S.cards[hitIdx]);
  i=(i+d+hits.length*2)%hits.length;
  const c=hits[i];hitIdx=S.cards.indexOf(c);
  sel=[c.id];paintSel();focusCard(c);runFind();
}

$("findq").addEventListener("keydown",e=>{

    else stepHit(e.shiftKey?-1:1)}
  if(e.key==="Escape"){e.preventDefault();$("findq").value="";runFind();

});

/* ================= 页面地图 ================= */
let mapOn=false,mapHit=[],mapSel=null,mapHov=null;
// 地图有自己的相机，页面多到看不清时可以在地图里放大和平移
let mapCam=null;                            // {cx,cy,z}，为空表示自动全览
function fitMapCam(W,H){
  const b=mapBounds();
  const z=Math.min(W/b.w,H/b.h);
  return {cx:b.x+b.w/2,cy:b.y+b.h/2,z};
}
function mapFit(){mapCam=null;drawMap()}
function mapZoom(f,px,py){
  const box=$("mapc").parentNode,W=box.clientWidth,H=box.clientHeight;
  const m=mapCam||fitMapCam(W,H);
  const base=fitMapCam(W,H).z;
  const nz=clamp(m.z*f,base*0.9,base*60);   // 下限略低于全览，避免缩不回去
  // 以光标处的世界点为锚，缩放前后保持不动
  const wx=(px-W/2)/m.z+m.cx, wy=(py-H/2)/m.z+m.cy;
  mapCam={z:nz,cx:wx-(px-W/2)/nz,cy:wy-(py-H/2)/nz};
  if(nz<=base*1.001)mapCam=null;            // 回到全览就交还自动模式
  drawMap();
}
function applyMapSize(){
  if(S.mapW)$("map").style.width=S.mapW+"px";
  if(S.mapH)$("mapc").parentNode.style.height=S.mapH+"px";
}
function toggleMap(){
  mapOn=!mapOn;S.map=mapOn;
  if(mapOn)applyMapSize();
  $("map").classList.toggle("on",mapOn);
  if(mapOn){drawMap();$("mapq").placeholder=t("mapFind")}else $("mapq").value="";
  save();
}
function mapBounds(){
  const fs=S.frames||[];
  if(!fs.length)return bbox()||{x:-500,y:-400,w:1000,h:800};
  let x=Infinity,y=Infinity,x2=-Infinity,y2=-Infinity;
  fs.forEach(f=>{x=Math.min(x,f.x);y=Math.min(y,f.y);
    x2=Math.max(x2,f.x+f.w);y2=Math.max(y2,f.y+f.h)});
  const b2=bbox();
  if(b2){x=Math.min(x,b2.x);y=Math.min(y,b2.y);
    x2=Math.max(x2,b2.x+b2.w);y2=Math.max(y2,b2.y+b2.h)}
  const pad=Math.max(200,(x2-x)*.04);
  return {x:x-pad,y:y-pad,w:x2-x+pad*2,h:y2-y+pad*2};
}
function drawMap(){
  if(!mapOn)return;
  const cv=$("mapc"),box=cv.parentNode;
  const W=box.clientWidth,H=box.clientHeight,dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  const m=mapCam||fitMapCam(W,H);
  const k=m.z, ox=W/2-m.cx*k, oy=H/2-m.cy*k;
  const X=v=>v*k+ox, Y=v=>v*k+oy;
  const dark=isDark(S.bg);
  const q=($("mapq").value||"").trim().toLowerCase();

  mapHit=[];
  const fs=(S.frames||[]).slice().sort((a,b2)=>a.x-b2.x||a.y-b2.y);
  let nHit=0;
  // 页面底色与选中态
  fs.forEach((f,i)=>{
    const hit=q&&(f.title||"").toLowerCase().includes(q);
    if(q&&hit)nHit++;
    const isSel=mapSel===f.id, isHov=mapHov===f.id;
    const fx=X(f.x),fy=Y(f.y),fw=f.w*k,fh=f.h*k;
    if(q&&!hit)g.globalAlpha=.26;
    // 选中与悬停用底色浓淡区分，不用彩色，保持整体质感
    if(isSel){g.fillStyle=dark?"rgba(255,255,255,.14)":"rgba(30,34,40,.10)";g.fillRect(fx,fy,fw,fh)}
    else if(isHov){g.fillStyle=dark?"rgba(255,255,255,.07)":"rgba(30,34,40,.05)";g.fillRect(fx,fy,fw,fh)}
    else if(hit){g.fillStyle=dark?"rgba(255,255,255,.09)":"rgba(0,0,0,.055)";g.fillRect(fx,fy,fw,fh)}
    g.strokeStyle=(isSel||hit)?(dark?"#EDEDEA":"#111")
      :isHov?(dark?"rgba(235,235,230,.8)":"rgba(40,45,52,.7)")
      :(dark?"rgba(200,200,195,.45)":"rgba(60,66,72,.4)");
    g.lineWidth=isSel?2:(hit||isHov?1.6:1);
    g.strokeRect(fx,fy,fw,fh);
    g.globalAlpha=1;
    mapHit.push({f,x:fx,y:fy,w:fw,h:fh,i});
  });
  // 卡片：按真实比例铺在页面之上，密度即内容分布
  g.fillStyle=dark?"rgba(235,235,230,.34)":"rgba(40,45,55,.26)";
  const vx=-ox/k, vy=-oy/k, vx2=(W-ox)/k, vy2=(H-oy)/k;   // 地图当前可见的世界范围
  const step=S.cards.length>20000?Math.ceil(S.cards.length/20000):1;
  for(let i=0;i<S.cards.length;i+=step){
    const c=S.cards[i];
    const ch=hOf(c)||100;
    if(c.x+c.w<vx||c.x>vx2||c.y+ch<vy||c.y>vy2)continue;
    g.fillRect(X(c.x),Y(c.y),Math.max(1,c.w*k),Math.max(1,ch*k));
  }
  // 卡片盖住了框线，补画一遍，保证页面边界清晰
  fs.forEach(f=>{
    const hit=q&&(f.title||"").toLowerCase().includes(q);
    const isSel=mapSel===f.id,isHov=mapHov===f.id;
    if(q&&!hit)g.globalAlpha=.26;
    g.strokeStyle=(isSel||hit)?(dark?"#EDEDEA":"#111")
      :isHov?(dark?"rgba(235,235,230,.8)":"rgba(40,45,52,.7)")
      :(dark?"rgba(200,200,195,.45)":"rgba(60,66,72,.4)");
    g.lineWidth=isSel?2:(hit||isHov?1.6:1);
    g.strokeRect(X(f.x),Y(f.y),f.w*k,f.h*k);
    g.globalAlpha=1;
  });
  $("mapn").textContent=q?(nHit+"/"+fs.length):(fs.length+"");
  $("map")._m={k,ox,oy};
  const base=fitMapCam(W,H).z;
  $("mapfit").style.display=(mapCam&&k>base*1.02)?"":"none";
  // 放大后只画视野内的部分，页面再多也不会变慢
  $("mapz").textContent=k>base*1.02?Math.round(k/base*100)+"%":"";
}
function mapToWorld(ev){
  const m=$("map")._m;if(!m)return null;
  const r=$("mapc").getBoundingClientRect();
  return {x:(ev.clientX-r.left-m.ox)/m.k, y:(ev.clientY-r.top-m.oy)/m.k};
}
function mapAt(ev){
  const r=$("mapc").getBoundingClientRect();
  const lx=ev.clientX-r.left,ly=ev.clientY-r.top;
  // 命中多个时取最小的那个，避免大页面盖住嵌在里面的小页面
  const hits=mapHit.filter(h=>lx>=h.x&&lx<=h.x+h.w&&ly>=h.y&&ly<=h.y+h.h);
  if(!hits.length)return null;
  return hits.sort((a,b)=>a.w*a.h-b.w*b.h)[0];
}
$("mapc").addEventListener("wheel",e=>{
  e.preventDefault();e.stopPropagation();
  const r=$("mapc").getBoundingClientRect();
  mapZoom(Math.exp(-e.deltaY*0.0022),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
$("mapc").addEventListener("dblclick",e=>{e.stopPropagation();mapFit()});
$("mapc").addEventListener("pointerdown",e=>{
  e.stopPropagation();
  const hit=mapAt(e);
  const box=$("mapc").parentNode;
  const W=box.clientWidth,H=box.clientHeight;
  const start={x:e.clientX,y:e.clientY};
  const m0=mapCam?{...mapCam}:fitMapCam(W,H);
  let moved=false;
  const mv=ev=>{
    const dx=ev.clientX-start.x, dy=ev.clientY-start.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<4)return;
    moved=true;box.classList.add("drag");
    mapCam={z:m0.z,cx:m0.cx-dx/m0.z,cy:m0.cy-dy/m0.z};
    drawMap();
  };
  const up=()=>{
    removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    box.classList.remove("drag");
    if(moved)return;                       // 拖过就只是平移地图，不跳转
    if(hit){
      mapSel=hit.f.id;
      const cs=inFrame(hit.f);
      boxTo({x:hit.f.x,y:hit.f.y,w:hit.f.w,h:hit.f.h},120,1.4);
      if(cs.length)focusIdx=S.cards.indexOf(cs[0]);
    }else{
      const p=mapToWorld(e);
      if(p){mapSel=null;camTo(-p.x*tgt.z,-p.y*tgt.z,tgt.z)}
    }

// ---- 多级菜单：每一层有自己的元素，深层不会顶掉浅层 ----
const MEXTRA={};
const MAXLV=8;
let owners=[],subT;
function levelEl(i){
  if(i===0)return $("menu");
  if(i===1)return $("submenu");
  if(!MEXTRA[i]){const d=document.createElement("div");d.className="menu";document.body.appendChild(d);MEXTRA[i]=d}
  return MEXTRA[i];
}
function levelOpen(i){const e=(i===0)?$("menu"):(i===1?$("submenu"):MEXTRA[i]);
  return e&&e.classList.contains("on")?e:null}
function closeFrom(i){
  clearTimeout(subT);
  for(let k=MAXLV;k>=i;k--){
    const e=(k===0)?$("menu"):(k===1?$("submenu"):MEXTRA[k]);
    if(e)e.classList.remove("on");
    owners[k]=null;
  }
  for(let k=0;k<i;k++){
    const e=levelOpen(k);
    if(e)e.querySelectorAll(".mi.open").forEach(b=>{
      if(!owners[k+1]||b!==owners[k+1].btn)b.classList.remove("open")});
  }
}
function closeMenus(){closeFrom(0)}
function keepSub(){clearTimeout(subT)}
const inBox=(x,y,r,p)=>x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p;
// 用指针坐标判断，而不是依赖 mouseenter / mouseleave
addEventListener("pointermove",e=>{
  if(!levelOpen(1))return;
  let inside=false,deepest=0;
  for(let k=0;k<=MAXLV;k++){
    const el=levelOpen(k);if(!el)continue;
    deepest=k;
    if(inBox(e.clientX,e.clientY,el.getBoundingClientRect(),8)){inside=true;break}
    const o=owners[k];
    if(o){                                   // 父项与本层之间的通道
      const r=el.getBoundingClientRect();
      const bridge={left:Math.min(o.rect.right,r.left)-16,right:Math.max(o.rect.right,r.left)+16,
        top:Math.min(o.rect.top,r.top)-12,bottom:Math.max(o.rect.bottom,r.bottom)+12};
      if(inBox(e.clientX,e.clientY,bridge,0)){inside=true;break}
    }
  }
  if(inside)keepSub();else{clearTimeout(subT);subT=setTimeout(()=>closeFrom(1),320)}
},true);
function place(el,x,y){
  el.classList.add("on");el.style.left="0px";el.style.top="0px";el.scrollTop=0;
  const r=el.getBoundingClientRect();
  el.style.left=Math.max(6,Math.min(x,innerWidth-r.width-8))+"px";
  el.style.top=Math.max(6,Math.min(y,innerHeight-r.height-8))+"px";
}
function build(el,items,level){
  const lv=level||0;
  el.innerHTML="";
  items.forEach(it=>{
    if(it==="-"){const d=document.createElement("div");d.className="msep";el.appendChild(d);return}
    if(it.head){const d=document.createElement("div");d.className="mhd";d.textContent=it.head;el.appendChild(d);return}
    const b=document.createElement("button");b.className="mi"+(it.danger?" dz":"");
    b.innerHTML=`<span>${it.check?"✓ ":""}${it.label}</span>`+(it.key?`<span class="k">${it.key}</span>`:"")+(it.sub?`<span class="k">›</span>`:"");
    if(it.sub&&it.sub.length){
      const open=()=>{
        keepSub();
        if(owners[lv+1]&&owners[lv+1].btn===b&&levelOpen(lv+1))return;
        closeFrom(lv+1);
        el.querySelectorAll(".mi.open").forEach(z=>z.classList.remove("open"));
        b.classList.add("open");
        const r=b.getBoundingClientRect();
        const child=levelEl(lv+1);
        build(child,it.sub,lv+1);
        place(child,r.right+2,r.top-6);
        let cr=child.getBoundingClientRect();
        if(cr.right>innerWidth-6)place(child,Math.max(6,r.left-cr.width-2),r.top-6);
        owners[lv+1]={btn:b,rect:b.getBoundingClientRect()};
      };
      b.onmouseenter=open;
      b.onclick=e=>{e.stopPropagation();open()};
    }else{
      b.onmouseenter=()=>{keepSub();closeFrom(lv+1)};
      b.onclick=()=>{closeMenus();it.on&&it.on()};
    }
    el.appendChild(b);
  });
}

    $("pop").classList.remove("on");
  if(!e.target.closest("#bar")){endSizeEdit(false);closePops()}
  else if(!e.target.closest("#szi"))endSizeEdit(false);
},true);

/* ================= import ================= */
function readJSON(f,merge){
  const r=new FileReader();
  r.onerror=()=>alert(t("badFile")+"\n"+t("errRead"));
  r.onload=async()=>{
    let d;
    try{d=JSON.parse(r.result)}
    catch(err){alert(t("badFile")+"\n"+t("errParse"));return}
    if(!d||!Array.isArray(d.cards)){alert(t("badFile")+"\n"+t("errShape"));return}
    let stage="snapshot",n=0;
    try{
      snap();
      stage="absorb";      n=await absorb(d,merge);
      stage="select";      sel=[];selLink=null;
      if(!merge){LANG=S.lang||LANG;fileName=f.name;fileHandle=null;fileOK=false}
      stage="render";      render();
      stage="fit";         fit(true);
      stage="save";        save();
      toast((merge?t("mergedIn"):t("savedTo"))+" "+n);
    }catch(err){
      console.error("import failed at stage: "+stage,err);
      const frame=((err&&err.stack)||"").split("\n").slice(0,4).join("\n");
      alert(t("errImport")+"\n["+stage+"] "+((err&&err.message)||err)+"\n\n"+frame);
      try{render()}catch(e){}
    }
  };
  r.readAsText(f);
}
$("jsonfile").onchange=e=>{const f=e.target.files[0];if(f)readJSON(f,false);e.target.value=""};
$("mergefile").onchange=e=>{const f=e.target.files[0];if(f)readJSON(f,true);e.target.value=""};

/* ================= boot ================= */
(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  const saved=await loadState();
  if(saved&&saved.cards){S={...S,...migrate(saved)};S.links=S.links||[];S.frames=S.frames||[];
    if(!S.lvMigrated){S.linkView="all";S.lvMigrated=true}
    S.linkDef={...DEFLINK,...(saved.linkDef||{})};S.textDef={...DEF,...(saved.textDef||{})}}
  LANG=S.lang||"en";
  await migrateInline(S.cards);
  await loadImgs(S.cards);
  try{const h=await kvGet(FH);
    if(h){fileHandle=h;fileName=h.name;
      if(h.queryPermission){const p=await h.queryPermission({mode:"readwrite"});fileOK=(p==="granted")}}}catch(e){}
  await loadRecents();
  await loadGlobalTpl();
  await loadBackups();
  const wantOpen=QS.get("open");
  if(wantOpen)setTimeout(()=>openRecent(wantOpen).catch(()=>toast(t("noPerm"))),300);
  applyCam();render();
  if(S.work&&!lock)$("find").classList.add("on");
  if(S.map){mapOn=true;$("map").classList.add("on");applyMapSize();setTimeout(drawMap,300)}
  syncFindMode();refreshTagList();
  if(S.cards.length)fit(true);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();drawLinks()});
  setTimeout(()=>{measure();drawLinks()},800);
})();
</script>
