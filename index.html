// 正文块的交互，画布上的稿子与专注模式共用同一套。
// 单击只选中这一段（跟画布上单击选中一张卡片一样，不进入编辑）；
// 双击才真正进入编辑，退出编辑（失焦）后回到"已选中但未编辑"的状态。
function bindBody(root,getDoc){
  const doc=()=>typeof getDoc==="function"?getDoc():getDoc;
  // 右键点在一个已经多选的段落上时，要保住这份多选。
  // 不这么做的话：右键会让 contenteditable 拿到焦点，focusin 立刻把 sel 打回一段，
  // 于是菜单永远只认得"这一段"，多选剪切根本用不了。
  let ctxKeep=false;
  root.addEventListener("pointerdown",e=>{
    const blk=e.target.closest(".blk");
    ctxKeep=e.button===2&&!!blk&&sel.length>1&&sel.includes(blk.dataset.id);
  },true);
  root.addEventListener("input",e=>{
    const el=e.target.closest(".cap");if(!el)return;
    const c=card(el.dataset.id);if(!c||isLocked(c.id))return;
    const o=orig(c);
    o.text=el.innerText;
    if(el.querySelector("span,b,i,u,a,mark,strong,em"))o.rich=el.innerHTML;else delete o.rich;
    verStash(o);
    clearTimeout(wrT);wrT=setTimeout(()=>{save();refreshDocMeta()},320);
  });
  // 正文就是一份可以直接打字的稿子：点哪里光标就落在哪里，不必先"进入编辑"。
  // 这里只负责别让点击冒泡去触发画布的框选与拖动，光标定位交给浏览器自己做。
  root.addEventListener("pointerdown",e=>{
    if(lock||e.button!==0)return;
    const wrap=e.target.closest(".wrap");if(!wrap)return;
    const blk=wrap.closest(".blk");if(!blk)return;
    e.stopPropagation();
    const id=blk.dataset.id;
    // Shift / Ctrl(⌘) 点选：整段整段地挑，跟画布上多选卡片是同一个意思。
    // 必须 preventDefault：不然浏览器会把它当成"扩展文字选区"，光标一落进去，
    // focusin 立刻把 sel 打回一段，多选永远选不起来。
    if(e.shiftKey||e.metaKey||e.ctrlKey){
      e.preventDefault();
      const d=doc();
      if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
      editing=false;
      if(e.shiftKey&&sel.length&&d){
        const ids=d.ids,a=ids.indexOf(sel[sel.length-1]),b=ids.indexOf(id);
        if(a>=0&&b>=0){
          const lo=Math.min(a,b),hi=Math.max(a,b);
          sel=[...new Set([...sel,...ids.slice(lo,hi+1)])];
        }else sel=[...new Set([...sel,id])];
      }else sel=sel.includes(id)?sel.filter(z=>z!==id):[...sel,id];
      selLink=null;paintSel();syncBar();syncFmtBars();
      return;
    }
    const cap=wrap.querySelector(".cap");
    if(cap&&cap.isContentEditable)return;               // 可编辑：交给浏览器放置光标/划选
    sel=[id];selLink=null;editing=false;paintSel();syncBar();
  });
  // 稿子范围内的双击一律拦住冒泡：stage 那边是"双击空白画布新建卡片"，
  // 它不认识 .cap/.blk 已经算一张卡片，不拦就会凭空多建一张出来。
  // 引文投影可以在自己的引用框里上下调序。做成"真的把它拿起来"：
  // 长按到时间，这一条**离开文字流**（改成 box 内的绝对定位、加阴影浮起来），
  // 原地留一个同高的虚线占位；拖动时占位跟着走到手指所指的位置，
  // 其余几条自然让开；松手就落进占位所在的位置。
  //
  // 上一版是"边拖边把它 insertBefore 来 insertBefore 去"，
  // 元素在脚下反复重排，判定又只在指针正好压住某一条时才生效——
  // 快一点、偏一点就没反应，还会一路误触到别的内容，完全没有"拿起来"的手感。
  //
  // 为什么仍然要长按：这一块的文字是可以选中的（引文就是拿来抄的），
  // 一按下就拖会把划字变得没法用。按住 340ms 才拿起；在这之前一旦移动超过 5px，
  // 就当成划字，调序取消。拿起的那一刻清掉文字选区，并把 .fb 标成 reorder
  // （光标变成 grabbing、其余条目不再有 hover 反应），让"进入调序"这件事看得见。
  let refDrag=null,refT=null,refArm=null;
  const dropSelection=()=>{
    const s2=getSelection();
    if(s2&&s2.rangeCount&&!s2.isCollapsed&&s2.removeAllRanges)s2.removeAllRanges();
  };
  const refDrop=(commit)=>{
    clearTimeout(refArm);refArm=null;
    if(!refT)return false;
    clearTimeout(refT);refT=null;
    if(!refDrag)return false;
    const {el,box,ph}=refDrag;refDrag=null;
    el.classList.remove("lift","armed");
    el.style.cssText=el.dataset.css0||"";
    delete el.dataset.css0;
    box.classList.remove("reorder");
    if(commit&&ph&&ph.parentElement===box)box.insertBefore(el,ph);
    if(ph&&ph.parentElement)ph.remove();
    box.style.position="";
    if(commit)commitRefOrder(box);else redrawDocs();
    return true;
  };
  root.addEventListener("pointerdown",e=>{
    if(lock||e.button!==0)return;
    const ref=e.target.closest(".ref");if(!ref)return;
    const box=ref.parentElement;
    if(!box||box.querySelectorAll(":scope > .ref").length<2)return;   // 只有一条，没得排
    const sx=e.clientX,sy=e.clientY;
    // 画布上的稿子整体带缩放，屏幕像素要换算回内容像素才对得上 offsetTop
    const br=box.getBoundingClientRect();
    const scale=(box.offsetHeight&&br.height/box.offsetHeight)||1;
    clearTimeout(refT);clearTimeout(refArm);
    refArm=setTimeout(()=>ref.classList.add("armed"),140);
    refT=setTimeout(()=>{
      const r0=ref.getBoundingClientRect();
      const top0=(r0.top-br.top)/scale+box.scrollTop;
      const h=r0.height/scale;
      const ph=document.createElement("div");
      ph.className="refph";ph.style.height=h+"px";
      box.insertBefore(ph,ref);
      ref.dataset.css0=ref.style.cssText||"";
      box.style.position="relative";
      box.classList.add("reorder");
      ref.classList.add("lift");
      Object.assign(ref.style,{position:"absolute",left:"0",right:"0",
        top:top0+"px",margin:"0",pointerEvents:"none"});
      refDrag={el:ref,box,ph,h,top0,scale,maxTop:Math.max(0,box.offsetHeight-h)};
      dropSelection();
    },340);
    const mv=ev=>{
      if(!refDrag){
        // 还没拿起来：动了就说明这一下是划字，长按取消，选区留给浏览器自己处理
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>5){
          clearTimeout(refT);refT=null;
          clearTimeout(refArm);ref.classList.remove("armed");
        }
        return;
      }
      ev.preventDefault();
      // 按住不放的这段时间里浏览器可能已经起了一小段选区，而且鼠标没松就会一直延长。
      // 光在拿起的那一刻清一次不够（CSS 的 user-select 只挡新的、挡不住已经在跑的那一次），
      // 所以拖动过程中每一帧都清一次：调序时屏幕上不该出现任何蓝色选区。
      dropSelection();
      const D=refDrag;
      // 只跟纵向，而且夹在框内：它不会跑出这个引用框，也就不会误触别的段落
      const top=Math.max(0,Math.min(D.maxTop,D.top0+(ev.clientY-sy)/D.scale));
      D.el.style.top=top+"px";
      // 落点按**指针**算，不按浮起来那一条的位置算：后者被夹在框内，
      // 拖到最底下时它的中线可能差零点几个像素够不到最后一条的中线，
      // 于是"怎么拖都放不到末尾"。指针是人瞄准的东西，也不受夹取影响。
      const bx=D.box.getBoundingClientRect();
      const py=(ev.clientY-bx.top)/D.scale+D.box.scrollTop;
      const sibs=[...D.box.children].filter(z=>z!==D.el&&z!==D.ph&&z.classList.contains("ref"));
      // 指针正好压在某一条的中线上时，按拖动方向决定归属：往下拖就归后一位、
      // 往上拖就归前一位。不加这半个像素的偏置，"正好拖到最后一条的中间"
      // 会被判成留在原处，手感就是"怎么都放不到末尾"。
      const eps=(ev.clientY-sy)>=0?0.5:-0.5;
      let at=sibs.length;
      for(let i=0;i<sibs.length;i++){
        if(py+eps<sibs[i].offsetTop+sibs[i].offsetHeight/2){at=i;break}
      }
      const want=sibs[at]||null;
      if(D.ph.nextElementSibling!==want||want===null&&D.box.lastElementChild!==D.ph){
        D.box.insertBefore(D.ph,want);
      }
    };
    const up=()=>{
      removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
      removeEventListener("keydown",esc,true);
      const was=refDrop(true);
      clearTimeout(refT);refT=null;
      clearTimeout(refArm);refArm=null;ref.classList.remove("armed");
      if(was)dropSelection();          // 落下之后不留一片选中的字
    };
    const esc=ev=>{
      if(ev.key!=="Escape")return;
      ev.preventDefault();ev.stopPropagation();
      removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
      removeEventListener("keydown",esc,true);
      clearTimeout(refArm);refArm=null;ref.classList.remove("armed");
      refDrop(false);                       // 中途反悔：放回原处，什么都不改
    };
    refT=refT||1;                            // 让 refDrop 知道这一轮是活的
    addEventListener("pointermove",mv);addEventListener("pointerup",up);
    addEventListener("keydown",esc,true);
  });

  // 点编号：输入一个新编号，把这一整节搬过去
  root.addEventListener("click",e=>{
    const nb=e.target.closest(".gut .num");if(!nb)return;
    e.stopPropagation();e.preventDefault();
    if(lock)return;
    const d=doc();if(!d)return;
    const v=prompt(t("numAsk"),nb.textContent.trim());
    if(v===null)return;
    wrMoveToNumber(d,nb.dataset.id,v);
  });
  root.addEventListener("dblclick",e=>{if(!lock)e.stopPropagation()});
  root.addEventListener("focusin",e=>{
    const el=e.target.closest(".cap");if(!el)return;
    if(ctxKeep&&sel.includes(el.dataset.id)){ctxKeep=false;syncFmtBars();return}
    sel=[el.dataset.id];editing=true;selLink=null;paintSel();syncBar();syncFmtBars();
  });
  // 失焦只是退出"正在打字"的状态，段落本身仍然保持可编辑
  root.addEventListener("focusout",e=>{
    const cap=e.target.closest(".cap");if(!cap)return;
    const to=e.relatedTarget||document.activeElement;
    if(to&&to.closest&&(to.closest("#bar")||to.closest("#pop")||to.closest(".fmtbar")))return;
    editing=false;paintSel();
  });
  root.addEventListener("keyup",e=>{if(e.target.closest(".cap"))syncFmtBars()});
  root.addEventListener("mouseup",e=>{if(e.target.closest(".cap"))setTimeout(syncFmtBars,0)});
  root.addEventListener("keydown",e=>{
    const cap=e.target.closest(".cap");if(!cap)return;
    e.stopPropagation();
    if(e.key==="Escape"){cap.blur();editing=false;syncBar();return}
    const d=doc(),c=card(cap.dataset.id);
    if(!d||!c||lock||isLocked(c.id))return;
    // 回车 = **段内换行**。写东西的时候绝大多数回车都是在同一段里继续写，
    // 让它去切分段落，等于每敲一次回车就多出一张卡片，稿子很快就碎掉。
    // 要真的切成下一段，用 Shift/⌘/Ctrl+回车；右键菜单里的"在下方插入空白段落"
    // 也是一条路。（这两个键的分工在 2026-08 调过来了，早先是反的。）
    if(e.key==="Enter"){
      e.preventDefault();
      if(e.shiftKey||e.metaKey||e.ctrlKey){wrSplitAtCaret(d,c,cap);return}
      // 显式插一个 <br>：交给浏览器默认行为的话，不同浏览器可能插 <div>，
      // 结构不统一，重绘之后换行会走样。safeRich 的白名单里 BR 是允许的，
      // .cap 又是 white-space:pre-wrap，所以纯文本段落里的 "\n" 一样存得住。
      document.execCommand("insertLineBreak");
      cap.dispatchEvent(new Event("input",{bubbles:true}));
      return;
    }
    // 段首按退格 = 并回上一段，空段落则直接从稿子里移出（不删源卡片）
    if(e.key==="Backspace"&&caretAtStart(cap)){
      const i=d.ids.indexOf(c.id);
      if(i>0){e.preventDefault();wrMergeBack(d,c,cap,i)}
    }
  });
  root.addEventListener("click",e=>{
    const d=doc();
    const fh=e.target.closest(".fh");
    if(fh){
      if(!d)return;
      d.open=d.open||{};d.open[fh.dataset.id]=!d.open[fh.dataset.id];
      fh.closest(".fold").classList.toggle("on",!!d.open[fh.dataset.id]);
      save();return;
    }
    const blk=e.target.closest(".blk");
    const v=e.target.closest(".vv");
    if(v&&blk){const c=card(blk.dataset.id);if(c){verUse(c,v.dataset.v);redrawDocs(d)}return}
  });
}
/* ---- 类 Word 的自由编辑 ---- */
// 光标是否正停在这一段的最开头（判断"退格要不要并回上一段"）
function caretAtStart(cap){
  const s=getSelection();
  if(!s||!s.rangeCount||!s.isCollapsed)return false;
  const r=s.getRangeAt(0);
  if(!cap.contains(r.startContainer))return false;
  const probe=document.createRange();
  probe.selectNodeContents(cap);
  probe.setEnd(r.startContainer,r.startOffset);
  return probe.toString().length===0;
}
// 把光标之后的内容切出来，返回 {text,html}；原节点只留下光标之前的部分
function cutAfterCaret(cap){
  const s=getSelection();
  if(!s||!s.rangeCount)return {text:"",html:""};
  const r=s.getRangeAt(0);
  if(!r.collapsed)r.deleteContents();
  const tail=document.createRange();
  tail.selectNodeContents(cap);
  tail.setStart(r.endContainer,r.endOffset);
  const box=document.createElement("div");
  box.appendChild(tail.extractContents());
  return {text:box.innerText,html:box.innerHTML};
}
// 在稿子里造一张只属于这份稿子的新卡片。
// 它带着 wrIn 标记，所以不会在画布上再冒出一份"看起来像重复添加"的文字框。
function wrNewBlock(d,proto){
  const p=orig(proto||{})||{};
  return {id:uid(),x:Math.round(d.x),y:Math.round(d.y),w:p.w||520,
    text:"",s:{...(p.s||{})},wrIn:d.id};
}
// 回车：从光标处切成下一张卡片
function wrSplitAtCaret(d,c,cap){
  const o=orig(c);
  const tail=cutAfterCaret(cap);
  snap();
  syncCap(c,cap);                                  // 光标之前的部分留在原卡片
  verStash(o);
  const n=wrNewBlock(d,c);
  n.text=tail.text;
  if(/<(span|a|b|i|u|s|strike|del|strong|em|font)\b/i.test(tail.html))n.rich=tail.html;
  invalidateIndex();S.cards.push(n);
  const i=d.ids.indexOf(c.id);
  d.ids.splice(i<0?d.ids.length:i+1,0,n.id);
  save();redrawDocs();
  focusBlock(n.id,"start");
}
// 段首退格：把这一段并回上一段。空段落直接移出稿子。
function wrMergeBack(d,c,cap,i){
  const prevId=d.ids[i-1],prev=card(prevId);
  if(!prev||isLocked(prevId)){toast(t("lockedNote"));return}
  const o=orig(c),po=orig(prev);
  const mine=(o.text||"").length?(o.rich||esc(o.text||"")):"";
  snap();
  const at=(po.text||"").length;
  if(mine){
    const pcap=hostCap(prevId);
    const html=(po.rich||esc(po.text||""))+mine;
    po.rich=html;
    const box=document.createElement("div");box.innerHTML=html;
    po.text=box.innerText;
    if(!/<(span|a|b|i|u|s|strike|del|strong|em|font)\b/i.test(html))delete po.rich;
    verStash(po);
    if(pcap)pcap.innerHTML=html;
  }
  d.ids.splice(i,1);
  // 只活在这份稿子里的空段落顺手清掉；来自画布的卡片只是移出，绝不删源
  if(docOnly(c)&&!(o.text||"").trim()&&!wrKids(c.id).length){
    invalidateIndex();S.cards=S.cards.filter(z=>z.id!==c.id);
  }
  save();redrawDocs();
  focusBlock(prevId,at);
}
// 把光标放到某一段的指定位置："start" / "end" / 字符偏移量
function focusBlock(id,where){
  requestAnimationFrame(()=>{
    const cap=hostCap(id);if(!cap||!cap.isContentEditable)return;
    cap.focus();
    const s=getSelection(),r=document.createRange();
    r.selectNodeContents(cap);
    if(where==="start")r.collapse(true);
    else if(where==="end"||typeof where!=="number")r.collapse(false);
    else{
      let left=where,done=false;
      const walk=document.createTreeWalker(cap,NodeFilter.SHOW_TEXT);
      let n;
      while((n=walk.nextNode())){
        const len=n.nodeValue.length;
        if(left<=len){r.setStart(n,left);r.collapse(true);done=true;break}
        left-=len;
      }
      if(!done)r.collapse(false);
    }
    s.removeAllRanges();s.addRange(r);
  });
}
// 稿子里某张卡片的正文节点。走 hostOfCard 的两个 Map，不现查 DOM。
function hostCap(id){
  const h=hostOfCard(id);
  if(!h)return null;
  return h.classList&&h.classList.contains("cap")?h:(h.querySelector?h.querySelector(".cap"):null);
}
// 划选一段自由文字，把它单独变成一张卡片。
// 前后剩下的部分各自也成为独立的一段，顺序不变。
function wrSelToCard(d,c,cap){
  const s=getSelection();
  if(!s||!s.rangeCount||s.isCollapsed){toast(t("needTextSel"));return}
  const r=s.getRangeAt(0);
  if(!cap.contains(r.startContainer)||!cap.contains(r.endContainer)){toast(t("needTextSel"));return}
  const grab=range=>{const b=document.createElement("div");
    b.appendChild(range.cloneContents());return {text:b.innerText,html:b.innerHTML}};
  const before=document.createRange();
  before.selectNodeContents(cap);before.setEnd(r.startContainer,r.startOffset);
  const after=document.createRange();
  after.selectNodeContents(cap);after.setStart(r.endContainer,r.endOffset);
  const parts=[grab(before),grab(r),grab(after)].filter(p=>p.text.trim().length);
  if(parts.length<2){toast(t("wrAlreadyCard"));return}
  snap();
  const o=orig(c);
  const put=(target,p)=>{
    target.text=p.text;
    if(/<(span|a|b|i|u|s|strike|del|strong|em|font)\b/i.test(p.html))target.rich=p.html;
    else delete target.rich;
  };
  put(o,parts[0]);verStash(o);
  let i=d.ids.indexOf(c.id);if(i<0)i=d.ids.length-1;
  const made=[];
  parts.slice(1).forEach((p,k)=>{
    const n=wrNewBlock(d,c);put(n,p);
    invalidateIndex();S.cards.push(n);
    d.ids.splice(i+1+k,0,n.id);made.push(n.id);
  });
  save();redrawDocs();
  toast(t("wrMadeCards").replace("{n}",made.length));
}
// 在稿子的任意位置插入一张空白段落，插入后光标立刻落进去。
// 新卡片带 wrIn 标记，只活在这份稿子里——早先它会同时摆到画布上，
// 于是同一段内容在写作框内外各出现一次，看起来就像"重复添加"。
function wrInsertAt(d,i){
  if(lock||!d)return;
  snap();
  const n=wrNewBlock(d);
  invalidateIndex();S.cards.push(n);
  d.ids.splice(Math.max(0,Math.min(i,d.ids.length)),0,n.id);
  save();redrawDocs();
  focusBlock(n.id,"start");
}
// 把剪贴板里的卡片粘成分身，挂到某一段下面的折叠引用框里：
// 只新增分身、不动源卡片的位置，跟"引用和分身"原有的语义一致。
function wrPasteTwin(hostId,d){
  if(lock)return;
  if(!CLIP||!CLIP.items.length){toast(t("clipEmpty"));return}
  const host=card(hostId);if(!host)return;
  snap();
  // 折叠框里的分身是投影，不是画布上的一张卡片：带 wrIn 标记，只活在这份稿子里。
  // 它不在画布上占位置，删掉它也不会动到任何外部卡片。
  let made=0;
  wrOrderItems(CLIP.items).forEach(it=>{     // 折叠框里的分身也按结构顺序排
    const src=it.src;
    if(!src||!S.cards.some(z=>z.id===src))return;     // 分身必须指向仍然存在的源
    made++;
    invalidateIndex();
    S.cards.push({id:uid(),x:Math.round(d?d.x:0),y:Math.round(d?d.y:0),
      w:it.w||280,s:{...(it.s||{})},ref:src,wrUnder:hostId,
      wrIn:d?d.id:"?",lock:"text"});
  });
  if(!made){toast(t("clipEmpty"));return}
  if(d){d.open=d.open||{};d.open[hostId]=true}
  save();redrawDocs();
  toast(t("sentTwin"));
}
// 把剪贴板里的内容拷贝进稿子的正文顺序里：跟画布上"复制、再到别处粘贴"是
// 同一份剪贴板（CLIP），但落地的是内容的独立拷贝（wrIn 标记），不是原卡片的
// 另一份投影——直接复用 CLIP.items 里已经算好的 snap（跟 pasteClip() 粘到画布上
// 是同一份数据、同一个道理），源卡片的位置、内容都不受影响。想要那种"跟着源卡片
// 一起变"的活引用，走 wrPasteTwin（分身，挂在折叠框里）。
function wrClonesFromClip(d){
  // 顺序按结构连线重排一次，不用剪贴板里的先后（那只是框选时的创建顺序）
  return wrOrderItems(CLIP.items).map(it=>{
    const n={...it.snap,id:uid(),x:Math.round(d.x),y:Math.round(d.y),w:it.w,
      s:{...it.s},wrIn:d.id};
    delete n.ref;delete n.lock;
    if(it.bg)n.bg=it.bg;else delete n.bg;
    invalidateIndex();S.cards.push(n);
    return n.id;
  });
}
function wrPasteMain(d,i){
  if(lock||!d)return;
  if(!CLIP||!CLIP.items.length){toast(t("clipEmpty"));return}
  snap();
  const made=wrClonesFromClip(d);
  d.ids.splice(Math.max(0,Math.min(i,d.ids.length)),0,...made);
  save();redrawDocs();
  toast(t("wrAdded").replace("{n}",made.length).replace("{d}",d.title));
}
// 光标停在文字中间时的"就地粘贴"：跟 Word 里把光标放在两个字之间再粘贴一样，
// 把这一段从光标处切开（复用 wrSplitAtCaret 同一套 cutAfterCaret / syncCap），
// 剪贴板里的内容拷贝插进切开的缝隙中间，光标之后的内容另起一段接在插入内容后面。
// 这样"粘贴可编辑文本卡片"就有了一个具体的插入点，不必只能贴在整段的前面或后面。
function wrPasteAtCaret(d,c,cap){
  if(lock||!d||isLocked(c.id))return;
  if(!CLIP||!CLIP.items.length){toast(t("clipEmpty"));return}
  const o=orig(c);
  const tail=cutAfterCaret(cap);            // 光标之后的内容先切出来
  snap();
  syncCap(c,cap);                           // 光标之前的部分留在原卡片
  verStash(o);
  let i=d.ids.indexOf(c.id);if(i<0)i=d.ids.length-1;
  let at=i+1;
  const made=wrClonesFromClip(d);
  d.ids.splice(at,0,...made);at+=made.length;
  let tailId=null;
  if(tail.text.trim()||/<(span|a|b|i|u|s|strike|del|strong|em|font)\b/i.test(tail.html)){
    const n=wrNewBlock(d,c);
    n.text=tail.text;
    if(/<(span|a|b|i|u|s|strike|del|strong|em|font)\b/i.test(tail.html))n.rich=tail.html;
    invalidateIndex();S.cards.push(n);
    d.ids.splice(at,0,n.id);tailId=n.id;
  }
  save();redrawDocs();
  if(tailId)focusBlock(tailId,"start");
  toast(t("wrAdded").replace("{n}",made.length).replace("{d}",d.title));
}
// 写作页里所有右键的入口：按落点决定给哪一份菜单。
// 折叠框那一块是"看不见但确实存在的粘贴区"——在那里右键就能把剪贴板里的卡片
// 粘成一个分身投影，这是原来那个"+"按钮的替代。
function wrContextMenu(e,d){
  const ref=e.target.closest(".ref");
  if(ref){wrRefMenu(e.clientX,e.clientY,ref.dataset.id,d);return}
  const fold=e.target.closest(".fold");
  if(fold){wrFoldMenu(e.clientX,e.clientY,fold.dataset.id,d);return}
  const blk=e.target.closest(".blk");
  if(blk){
    const c=card(blk.dataset.id);
    if(c){wrBlockMenu(e.clientX,e.clientY,c,+blk.dataset.i,d);return}
  }
  docMenu(e.clientX,e.clientY,d);
}
// 折叠的引用区：这里只放分身投影，所以粘贴一律按分身处理
function wrFoldMenu(x,y,hostId,d){
  const items=[];
  if(CLIP)items.push({label:t("wrRefPaste"),on:()=>wrPasteTwin(hostId,d)});
  else items.push({head:t("clipEmpty")});
  const kids=wrKids(hostId);
  if(kids.length)items.push("-",{label:t("wrRefsClear"),danger:true,on:()=>{
    snap();const ids=new Set(kids.map(k=>k.id));
    invalidateIndex();S.cards=S.cards.filter(z=>!ids.has(z.id));
    save();redrawDocs();toast(t("wrRefsCleared").replace("{n}",kids.length));
  }});
  menuAt(x,y,items);
}
// 引用条目本身：它是投影，不是内容。所以这里不给任何编辑项，
// 只给"跳到原文所在的位置"和"把这条投影撤掉"——后者不动外面的任何卡片。
function wrRefMenu(x,y,twinId,d){
  const twin=card(twinId);if(!twin)return;
  const src=orig(twin);
  menuAt(x,y,[
    {head:snippet(src,26)||t("wrUntitled")},
    {label:t("wrRefGoto"),on:()=>{
      const id=src.id;
      if(wrOpenState())closeWrite();
      sel=[id];selLink=null;paintSel();focusOn([card(id)]);
    }},
    "-",
    ...(CLIP?[{label:t("wrRefPaste"),on:()=>wrPasteTwin(twin.wrUnder,d)}]:[]),
    {label:t("wrRefDrop"),danger:true,on:()=>{
      snap();invalidateIndex();S.cards=S.cards.filter(z=>z.id!==twinId);
      save();redrawDocs();toast(t("wrRefDropped"));
    }}
  ]);
}
// 内容变了就重画：画布上的稿子和专注模式都刷一遍，两边始终一致
function redrawDocs(){
  renderDocs();
  if(wrOpenState())drawWrite();
}
// 卡片数与字数不再占用顶栏，所以打字之后只需要把大纲侧栏跟上。
// 注意别在这里重绘正文：正在打字的节点一旦被重建，光标就没了。
function refreshDocMeta(){
  if(wrOpenState())wrSideSoon();
  syncWordCount();
}
function wrBind(){
  bindBody($("wrmain"),()=>wrDoc());
  $("wrside").addEventListener("click",e=>{
    const b=e.target.closest(".wrnav");if(!b)return;
    scrollBlockInto($("wrmain"),$("wrmain").querySelector(`.blk[data-i="${b.dataset.i}"]`));
  });
  // 正文区里的右键：段落、折叠框、引用条目、空白处各有各的菜单，
  // 由 wrContextMenu 统一分派，跟画布上内嵌的稿子走的是同一个函数
  $("wrmain").addEventListener("contextmenu",e=>{
    const d=wrDoc();if(!d)return;
    e.preventDefault();e.stopPropagation();
    wrContextMenu(e,d);
  });
  // 稿子名就地改，跟画布上改页面标题一样
  const ti=$("wrtitle");
  ti.addEventListener("keydown",e=>{
    e.stopPropagation();
    if(e.key==="Enter"){e.preventDefault();ti.blur()}
    if(e.key==="Escape"){const d=wrDoc();if(d)ti.textContent=d.title;ti.blur()}
  });
  ti.addEventListener("blur",()=>{
    const d=wrDoc();if(!d)return;
    const v=ti.textContent.trim();
    if(v&&v!==d.title){snap();d.title=v;save();renderDocs()}else ti.textContent=d.title;
  });
}
// 按删除键移出一个被选中的段：跟右键菜单里的"从稿子里移除"是同一件事，
// 只在按键时触发。哪份稿子由 DOM 上最近的 .doc 决定；专注模式下就是当前稿子。
function wrRemoveSel(selBlk){
  const id=selBlk.dataset.id;
  const docEl=selBlk.closest(".doc");
  const d=docEl?docs().find(z=>z.id===docEl.dataset.id):wrDoc();
  if(!d)return;
  const i=d.ids.indexOf(id);
  if(i<0)return;
  wrDropAt(d,i);
}
// 把第 i 段从这份稿子里移出。**永远不动画布上的源卡片**——写作页里的任何删改
// 都只影响这份稿子本身，这是整个写作页的基本原则。
// 现在 d.ids 里的段落全部带 wrIn 标记（不管是稿子内部新建的，还是从画布导入/粘贴时
// 拷贝进来的），本来就没有稿子之外的身份，所以移出的同时直接从 S.cards 里删掉，
// 留着只会变成永远找不到的孤儿；画布上真正的源卡片（如果这段内容是从哪张卡片
// 拷贝来的）是完全独立的另一个对象，不会被这里牵连。
// 写作页里的"剪切"：**搬运，不是拷贝**。
// 走剪贴板的话粘出来是一份新的独立拷贝，版本、挂在它下面的引文投影全都留在原地丢了；
// 而这里要的只是"把这几段挪到别处去"，所以只记下 id，等粘贴那一刻直接在 d.ids 里
// 重新排位——层级、版本、底色、引文投影一样不动，因为压根没有新建任何东西。
// 剪切当下也不改数据：中途反悔什么都没损失。
let WRCUT=null;                                  // {doc:稿子id, ids:[段落id]}
function wrCutBlocks(d,ids){
  if(!d)return;
  const set=new Set(ids||[]);
  const ordered=d.ids.filter(id=>set.has(id));   // 一律按稿子里的先后，不按点选顺序
  if(!ordered.length)return;
  WRCUT={doc:d.id,ids:ordered};
  toast(t("wrCutReady").replace("{n}",ordered.length));
}
function wrCutPaste(d,i){
  if(!WRCUT||!d)return;
  const ids=WRCUT.ids.filter(id=>card(id));      // 中途被删掉的就不搬了
  if(!ids.length){WRCUT=null;return}
  const from=docs().find(z=>z.id===WRCUT.doc);
  const set=new Set(ids);
  snap();
  // 插入点要换算成"移走之后"的位置，否则同一份稿子里往后挪会差几位
  let at=Math.max(0,Math.min(i,d.ids.length));
  if(from&&from.id===d.id)at=d.ids.slice(0,at).filter(id=>!set.has(id)).length;
  if(from)from.ids=from.ids.filter(id=>!set.has(id));
  if(from&&from.id!==d.id){                      // 跨稿子：连同挂在它下面的投影一起改换门庭
    ids.forEach(id=>{
      const c=card(id);if(c&&c.wrIn)c.wrIn=d.id;
      wrKids(id).forEach(k=>{if(k.wrIn)k.wrIn=d.id});
    });
  }
  d.ids.splice(at,0,...ids);
  const n=ids.length;
  WRCUT=null;sel=ids.slice();selLink=null;
  save();redrawDocs();paintSel();
  toast(t("wrCutMoved").replace("{n}",n));
}
function wrDropAt(d,i){
  const id=d.ids[i];if(!id)return;
  const c=card(id);
  snap();d.ids.splice(i,1);
  if(c&&docOnly(c)){
    const drop=new Set([id,...wrKids(id).map(k=>k.id)]);
    invalidateIndex();S.cards=S.cards.filter(z=>!drop.has(z.id));
  }
  sel=[];selLink=null;save();redrawDocs();
  toast(t("wrRemoved"));
}
function wrBlockMenu(x,y,c,i,d){
  const o=orig(c),vs=verList(o);
  d=d||wrDoc();
  const items=[{head:snippet(o,26)||t("wrUntitled")}];
  // 划选一段自由文字，把它单独立成一张卡片——这是"边写边把想法固化成卡片"的入口
  const cap=hostCap(c.id);
  const s=getSelection();
  const hasSel=cap&&d&&!lock&&!isLocked(c.id)&&s&&s.rangeCount&&!s.isCollapsed&&cap.contains(s.anchorNode);
  // 光标停在文字中间（没有划选）时，右键点的就是这个具体位置——
  // 剪贴板里的卡片可以直接插进光标这个缝隙，而不是只能贴在整段的最前面或最后面
  const caretHere=cap&&d&&!lock&&!isLocked(c.id)&&s&&s.rangeCount&&s.isCollapsed&&cap.contains(s.anchorNode);
  if(hasSel)
    items.push({label:t("wrSelToCard"),on:()=>wrSelToCard(d,c,cap)},"-");
  if(d)items.push({label:t("wrInsertAbove"),on:()=>wrInsertAt(d,i)},
    {label:t("wrInsertBelow"),on:()=>wrInsertAt(d,i+1)},"-");
  items.push({label:t("wrVerNew"),on:()=>{verNew(c,true);redrawDocs()}});
  items.push({label:t("wrVerBlank"),on:()=>{verNew(c,false);redrawDocs()}});
  if(vs.length>1){
    items.push({label:t("wrVerPick"),sub:[{head:t("wrVerPick")},
      ...vs.map((v,k)=>({label:verLabel(v,k)+"　"+new Date(v.t).toLocaleDateString(),
        check:v.id===o.verOn,on:()=>{verUse(c,v.id);redrawDocs()}}))]});
    items.push({label:t("wrVerName"),on:()=>{
      const v=vs.find(z=>z.id===o.verOn);if(!v)return;
      const n=prompt(t("wrVerName"),v.name||"");
      if(n!==null){snap();v.name=n.trim();save();redrawDocs()}}});
    items.push({label:t("wrVerDel"),danger:true,on:()=>{verDel(c,o.verOn);redrawDocs()}});
  }
  items.push("-",{label:t("wrVerCopy"),on:()=>verToClip(c,o.verOn)});
  // 剪切：右键落在一个已经多选的段落上，就整批剪；否则只剪这一段
  const cutIds=(sel.length>1&&sel.includes(c.id))?sel.slice():[c.id];
  if(d)items.push("-",{label:cutIds.length>1
      ?t("wrCutN").replace("{n}",cutIds.length):t("wrCut"),
    on:()=>wrCutBlocks(d,cutIds)});
  if(WRCUT&&d)items.push(
    {label:t("wrCutBefore"),on:()=>wrCutPaste(d,i)},
    {label:t("wrCutAfter"),on:()=>wrCutPaste(d,i+1)});
  if(CLIP&&d)items.push("-",
    ...(caretHere?[{label:t("wrPasteHere"),on:()=>wrPasteAtCaret(d,c,cap)}]:[]),
    {label:t("wrPasteBefore"),on:()=>wrPasteMain(d,i)},
    {label:t("wrPasteAfter"),on:()=>wrPasteMain(d,i+1)},
    {label:CLIP.mode==="twin"?t("wrPasteRef"):t("wrPasteRefCopy"),on:()=>wrPasteTwin(c.id,d)});
  items.push("-",{label:isLocked(c.id)?t("unlockAll"):t("lockText"),
    on:()=>{setCardLock([c.id],isLocked(c.id)?null:"text");redrawDocs()}});
  // 正文段落**没有**"在画布上找到它"这一项，这是刻意的，不要再加回来。
  // 稿子里的段落是内容的独立拷贝（见 wrCloneCard 那一大段），画布上根本没有
  // 对应的实体：它自己的 x/y 是拷贝时随手写的稿子左上角，高度也从没量过
  // （hOf 在没有实测高度时退回拿宽度当高度），拿它去取景，镜头只会落在
  // 稿子旁边一块空地上——就是"定位有点偏"的由来。曾经试过给拷贝记一个
  // c.wrFrom 指回源卡片再据此取景，但那等于给"两边是独立的"这条设计开一个后门：
  // 源卡片改名、移动、删除之后这条线索或对或错，用户却分不清，
  // 而这一段内容本来就跟那张卡片再无关系了。所以直接不提供。
  // **折叠框里的引文分身是另一回事**：它是活的投影（c.ref 指回源），
  // 定位到原文正是它存在的意义，那一项在 wrRefMenu 里，不要连坐删掉。
  items.push("-",
    {label:t("wrRemove"),on:()=>{if(!d)return;wrDropAt(d,i)}});
  menuAt(x,y,items);
}

/* ---- 用编号调位置 ---- */
// 稿子里每个标题左边都有编号（1、2.1……）。点一下编号、输入一个新编号，
// 这一**整节**就搬到那个位置去——比一段一段剪切粘贴快得多，也是写论文时
// 最自然的调结构方式（"把 3.2 挪到 2.1"）。
//
// 三条规矩，改动时不要破坏：
// ① 搬的是**整节**：标题连同它下面的正文、以及所有更低级的子标题一起走。
//    只搬标题会把正文丢在原地，稿子立刻错乱。
// ② 目标编号的**位数决定层级**："3" 是一级、"2.1" 是二级。所以把 3 移到 2.1
//    会顺带把它降成二级标题，子标题跟着同样的位移，节内结构保持不变。
// ③ 编号是**算出来的**，不是存下来的（wrNums 现数现算）。所以这里不能去"改编号"，
//    只能算出"要得到这个编号，该插在哪一位"，然后搬过去。
//    做法是把这一节抽出来，在剩下的段落上逐个位置试插，看哪一位算出来正好是目标编号。

// 这一节覆盖的范围 [a,b)：从标题本身到下一个同级或更高级标题之前
function wrSectionRange(list,i){
  const lv=wrLevelOf(list[i]);
  if(!lv)return [i,i+1];
  let j=i+1;
  while(j<list.length){
    const l2=wrLevelOf(list[j]);
    if(l2&&l2<=lv)break;
    j++;
  }
  return [i,j];
}
const numKey=s2=>String(s2||"").trim().replace(/[．。]/g,".").replace(/\s+/g,"");
const numOk=s2=>/^\d+(\.\d+)*$/.test(s2);
// 两个编号比大小：逐段比，"2" < "2.1" < "3"
function numCmp(a,b){
  const x=String(a).split("."),y=String(b).split(".");
  for(let i=0;i<Math.max(x.length,y.length);i++){
    const u=+(x[i]||0),v=+(y[i]||0);
    if(u!==v)return u<v?-1:1;
  }
  return 0;
}
function wrMoveToNumber(d,id,raw){
  const want=numKey(raw);
  if(!numOk(want)){toast(t("numBad"));return}
  const i=d.ids.indexOf(id);
  if(i<0)return;
  const list=d.ids.map(card).filter(Boolean);
  if(list.length!==d.ids.length)return;          // 有段落找不到卡片，先不动，免得越理越乱
  const lv0=wrLevelOf(list[i]);
  if(!lv0)return;                                // 只有标题才有编号可言
  const nowNum=wrNums(list)[i];
  const [a,b]=wrSectionRange(list,i);
  const block=d.ids.slice(a,b);
  const rest=d.ids.slice(0,a).concat(d.ids.slice(b));
  const lvNew=Math.min(want.split(".").length,6);
  const shift=lvNew-lv0;
  // 试着插在每一个位置，看哪一位能算出目标编号。位置数最多是段落数，
  // 每次 wrNums 是一遍线性扫描——稿子几百段的量级完全够用。
  const probe=k=>{
    const ids=rest.slice(0,k).concat(block,rest.slice(k));
    const cs=ids.map(card);
    const saved=block.map(z=>{const c=card(z);return c?c.level:null});
    block.forEach(z=>{const c=card(z);if(c&&c.level)c.level=Math.max(1,Math.min(6,c.level+shift))});
    const n=wrNums(cs)[k];
    block.forEach((z,q)=>{const c=card(z);if(c&&saved[q]!=null)c.level=saved[q]});
    return n;
  };
  // 取**最后一个**能算出目标编号的位置，不是第一个：
  // "把第三章移到 2"，第一个匹配位是"紧跟在第一章标题后面"（第一章的正文还没开始），
  // 那会把它插进第一章的肚子里；最后一个匹配位才是"第一章整节讲完之后"，
  // 也就是人说这句话时真正的意思。
  let at=-1,best=-1;
  for(let k=0;k<=rest.length;k++){
    const n=probe(k);
    if(!n)continue;
    if(n===want)at=k;
    else if(numCmp(n,want)<0)best=k;               // 还没超过目标的最后一个位置
  }
  if(at<0)at=best>=0?best:0;
  const landed=probe(at)||"";
  if(at===a&&landed===nowNum){toast(t("numSame"));return}
  snap();
  block.forEach(z=>{const c=card(z);if(c&&c.level)c.level=Math.max(1,Math.min(6,c.level+shift))});
  d.ids=rest.slice(0,at).concat(block,rest.slice(at));
  sel=[id];selLink=null;
  save();redrawDocs();paintSel();syncFmtBars();
  toast(landed===want?t("numMoved").replace("{n}",landed)
    :t("numNoRoom").replace("{n}",landed));
}

/* ---- 字数统计 ---- */
// 中日韩按"字"算，拉丁文按"词"算，两者相加就是通常说的字数——
// 中英混排的稿子里，只数字符或者只数空格分词都会算得离谱。
// 数的是纯文本（o.text），不碰 rich：格式标签不该算进字数。
const WC_CJK=/[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\u3040-\u30FF\uAC00-\uD7AF]/g;
function wcOf(str){
  const t0=(str||"").trim();
  if(!t0)return {words:0,chars:0};
  const cjk=(t0.match(WC_CJK)||[]).length;
  // 去掉 CJK 之后剩下的按空白分词；标点单独出现的不算一个词
  const rest=t0.replace(WC_CJK," ").split(/\s+/).filter(z=>/[\p{L}\p{N}]/u.test(z)).length;
  return {words:cjk+rest,chars:[...t0.replace(/\s+/g,"")].length};
}
// 一份稿子的字数：只数它自己的段落。折叠框里的引文是别人的话、
// 其他版本是没被采用的稿子，都不该算进"我写了多少"。
function wcDoc(d){
  let words=0,chars=0,paras=0;
  (d&&d.ids||[]).forEach(id=>{
    const c=card(id);if(!c)return;
    const r=wcOf(orig(c).text);
    if(r.words)paras++;
    words+=r.words;chars+=r.chars;
  });
  return {words,chars,paras};
}
// 划选优先：选区落在哪一份稿子里，那一份就显示选中的字数。
// 用 anchorNode 找宿主，而不是"当前打开的稿子"——画布上可以同时摆好几份。
function wcSelection(){
  const s2=getSelection();
  if(!s2||!s2.rangeCount||s2.isCollapsed)return null;
  const txt=s2.toString();
  if(!txt.trim())return null;
  let n=s2.anchorNode;
  if(n&&n.nodeType===3)n=n.parentElement;
  const host=n&&n.closest&&n.closest("#wrmain,.doc");
  return {host,...wcOf(txt)};
}
function syncWordCount(){
  const sel2=wcSelection();
  document.querySelectorAll(".fmtbar .fwc").forEach(el=>{
    const inFocus=!!el.closest("#wrbar");
    const docEl=el.closest(".doc");
    const host=inFocus?document.getElementById("wrmain"):docEl;
    const d=inFocus?wrDoc():(docEl?docs().find(z=>z.id===docEl.dataset.id):null);
    if(sel2&&host&&sel2.host===host){
      el.textContent=t("wcSel")+" "+sel2.words.toLocaleString();
      el.classList.add("on");
      el.title=t("wcSelHint");
      return;
    }
    el.classList.remove("on");
    const r=d?wcDoc(d):{words:0,chars:0,paras:0};
    el.textContent=r.words.toLocaleString()+" "+t("wcWords");
    el.title=t("wcTitle")+"\n"+t("wcDetail")
      .replace("{w}",r.words.toLocaleString())
      .replace("{c}",r.chars.toLocaleString())
      .replace("{p}",r.paras.toLocaleString());
  });
}
// 划选随时在变，但重算很便宜；仍然并到一帧里做，免得拖选时每个 mousemove 都算一遍
let wcRaf=0;
function wcSoon(){
  if(wcRaf)return;
  wcRaf=requestAnimationFrame(()=>{wcRaf=0;syncWordCount()});
}

/* ---- 导出：所见即所得 ---- */
// 稿子里看到的标题编号（侧栏与正文那一份，wrNums 算的）要能一起导出去。
// 三种格式共用这一个函数，编号规则只有一份，不会出现"稿子里是 2.3、
// Word 里却是 2.1"这种对不上的事。opt.nums 关掉就一个编号都不加。
function wrNumMap(d,opt){
  const list=d.ids.map(card).filter(Boolean);
  const nums=wrNums(list);
  const m=new Map();
  if(!opt||opt.nums!==false)list.forEach((c,i)=>{if(nums[i])m.set(c.id,nums[i])});
  return m;
}
function wrHTML(d,opt){
  const list=d.ids.map(card).filter(Boolean);
  let h=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(d.title)}</title>
  <style>@page{size:A4;margin:22mm 20mm}
   body{margin:0;font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;color:#111}
   .pg{max-width:720px;margin:0 auto}
   h1.doc{font-size:22pt;margin:0 0 24pt}
   .blk{margin:0 0 12pt}
   .vers{margin:4pt 0 12pt 12pt;padding-left:10pt;border-left:2pt solid #ddd}
   .vh,.rh{font:400 8pt/1.6 monospace;letter-spacing:.1em;color:#999;text-transform:uppercase}
   .vt{font-size:10pt;color:#555;margin:2pt 0 6pt}
   .refs{margin:4pt 0 12pt 14pt;font-size:10pt;color:#666}
   .num{margin-right:.5em;font-variant-numeric:tabular-nums}
   /* 标题用真的 h1-h6 标签，Word 与 PDF 目录才认得出层级；
      字号字体仍然按卡片自己的样式内联覆盖，所见即所得不受影响 */
   h1,h2,h3,h4,h5,h6{margin:0;font-weight:inherit}
  </style></head><body><div class="pg"><h1 class="doc">${esc(d.title)}</h1>`;
  const nm=wrNumMap(d,opt);
  list.forEach(c=>{
    const o=orig(c),lv=wrLevelOf(c);
    const wrapS=o.bg?`background:${esc(o.bg)};padding:8pt 10pt;`:"";
    const n=nm.get(c.id);
    // 编号只加在标题前面，跟稿子里看到的那一份是同一个来源
    const inner=(n?`<span class="num">${esc(n)}</span>`:"")
      +(o.rich?safeRich(o.rich):esc(o.text||"").replace(/\n/g,"<br>"));
    const so=wrStyleObj(o,lv);
    const css=Object.keys(so).map(k=>
      k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())+":"+so[k]).join(";");
    // **标题要落成真正的 h1-h6，不能只是"字大一点的段落 + 一个数字"。**
    // Word 打开 .doc 时是按标签认层级的：用 div 的话，导出的文稿在 Word 里
    // 没有任何大纲结构，导航窗格是空的，也生成不了目录——看起来像"有层级"，
    // 其实只是文本加数字。PDF 的书签同理。
    const tag=lv?"h"+Math.min(lv,6):"div";
    h+=`<div class="blk"><div style="${wrapS}"><${tag} style="${css}">${inner}</${tag}></div></div>`;
    if(opt.vers){
      const vs=verList(o);
      if(vs.length>1){
        h+=`<div class="vers"><div class="vh">${esc(t("wrExpVers"))}</div>`;
        vs.forEach((v,k)=>{if(v.id===o.verOn||!String(v.text||"").trim())return;
          h+=`<div class="vt"><b>${esc(verLabel(v,k))}</b>　${esc(String(v.text).slice(0,900))}</div>`});
        h+=`</div>`;
      }
    }
    if(opt.refs){
      const kids=wrKids(c.id);
      if(kids.length)h+=`<div class="refs"><div class="rh">${esc(t("wrExpRefs"))}</div>`
        +kids.map(k=>`<div>${esc(snippet(orig(k),500))}</div>`).join("")+`</div>`;
    }
  });
  return h+`</div></body></html>`;
}
// Word 导出。真正的 .docx 要靠 CDN 上的 docx 库，断网、被墙、CDN 抽风都会失败——
// 早先失败就只弹一句报错，等于"写作页导不出 Word"。现在跟画布那边一个规矩：
// 库拿不到就退回写一份 .doc（HTML 外壳 + application/msword），Word 一样打得开，
// 样式、编号、底色全都在。**导出 Word 这件事必须永远有结果**，不能取决于能不能联网。
async function wrExportWord(d,opt){
  // **任何一步出问题都必须落到 .doc**，不能只弹一句"导出未完成"。
  // 失败的方式不止"网络连不上"一种：CDN 半截返回、拿到的 window.docx 缺东少西、
  // Packer 自己抛错……所以整段都包起来，连拿到库之后的构建也算在内。
  try{
    const D=await loadDocx();
    if(D&&D.Document&&D.Packer&&D.Paragraph&&D.HeadingLevel){
      await wrExportDocx(D,d,opt);return;
    }
  }catch(e){}
  dl(new Blob(["\uFEFF"+wrHTML(d,opt)],{type:"application/msword"}),safeName(d.title)+".doc");
  toast(t("wrExpDocFallback"));
}
async function wrExportDocx(D,d,opt){
  const {Document,Packer,Paragraph,TextRun,HeadingLevel}=D;
  const HL=[null,HeadingLevel.HEADING_1,HeadingLevel.HEADING_2,HeadingLevel.HEADING_3,
    HeadingLevel.HEADING_4,HeadingLevel.HEADING_5,HeadingLevel.HEADING_6];
  const kids=[new Paragraph({text:d.title,heading:HeadingLevel.TITLE})];
  const nm=wrNumMap(d,opt);
  d.ids.map(card).filter(Boolean).forEach(c=>{
    const o=orig(c),lv=wrLevelOf(c);
    const n=nm.get(c.id),pre=n?n+" ":"";
    // 带格式的段落走 paraFrom（保住加粗、颜色、荧光笔），编号交给它当前缀插进去
    const rich=o.rich?paraFrom(o,D,lv?{heading:HL[Math.min(lv,6)]}:null,pre):null;
    if(rich&&rich.length)rich.forEach(p=>kids.push(p));
    else{
      const txt=(o.text||"").split(/\n+/).filter(z=>z.trim());
      if(lv){kids.push(new Paragraph({text:pre+(txt[0]||""),heading:HL[Math.min(lv,6)]}));
        txt.slice(1).forEach(z=>kids.push(new Paragraph({text:z})))}
      else txt.forEach(z=>kids.push(new Paragraph({text:z})));
    }
    if(opt.vers)verList(o).forEach((v,k)=>{
      if(v.id===o.verOn||!String(v.text||"").trim())return;
      kids.push(new Paragraph({indent:{left:420},children:[new TextRun({
        text:verLabel(v,k)+"　"+v.text,italics:true,color:"777777",size:19})]}));
    });
    if(opt.refs)wrKids(c.id).forEach(k=>kids.push(new Paragraph({indent:{left:560},
      children:[new TextRun({text:"\u25C8 "+snippet(orig(k),500),color:"888888",size:19})]})));
  });
  const blob=await Packer.toBlob(new Document({sections:[{children:kids}]}));
  dl(blob,safeName(d.title)+".docx");
}
// 稿子的导出面板。原先用的 .ph/.pb/.hd2/.fmt/.fb2 这些类名在 .pop 里根本不存在，
// 而且从头到尾没调 place()，浮层没有定位，所以看起来一团糟、也点不动。
// 现在改用面板本来就有的那套（.hd/.sec/.pair/.opt/.go），并按坐标定位。
// 格式上补了 HTML 与 Markdown：Word 依赖 CDN 上的 docx 库，断网时至少还有出路。
function openWrExport(d,x,y){
  if(!d)return;
  const p=$("pop");
  p.classList.remove("wide");
  const FMTS=[["docx","fmtWord"],["pdf","fmtPdfDoc"],["html","fmtHtml"],["md","fmtMd"]];
  p.innerHTML=`
    <div class="hd"><b>${esc(t("wrDocExport"))}</b><button id="wex">\u00D7</button></div>
    <div class="sec">${esc(t("fmt"))}</div>
    <div class="grid" id="wfmt">${FMTS.map(([k,lb],i)=>
      `<button data-f="${k}" class="${i?"":"on"}">${esc(t(lb))}</button>`).join("")}</div>
    <div class="sec">${esc(t("expOpts"))}</div>
    <label class="opt"><input type="checkbox" id="wv"> ${esc(t("wrExpVersOpt"))}</label>
    <label class="opt"><input type="checkbox" id="wr2"> ${esc(t("wrExpRefsOpt"))}</label>
    <label class="opt"><input type="checkbox" id="wn" checked> ${esc(t("wrExpNumsOpt"))}</label>
    <p class="note" id="wnote"></p>
    <button class="go" id="wgo">${esc(t("expGo"))}</button>`;
  const mx=(x==null?innerWidth/2-126:x),my=(y==null?90:y);
  place(p,Math.min(mx,innerWidth-268),Math.min(my,Math.max(10,innerHeight-330)));
  p.classList.add("on");
  let fmt="docx";
  const note=p.querySelector("#wnote");
  const syncNote=()=>{note.textContent=fmt==="docx"?t("wrExpDocxNote")
    :fmt==="pdf"?t("wrExpPdfNote"):t("wrExpFileNote")};
  syncNote();
  p.querySelector("#wfmt").onclick=e=>{
    const b=e.target.closest("button[data-f]");if(!b)return;
    fmt=b.dataset.f;
    p.querySelectorAll("#wfmt button").forEach(z=>z.classList.toggle("on",z===b));
    syncNote();
  };
  p.querySelector("#wex").onclick=()=>p.classList.remove("on");
  p.querySelector("#wgo").onclick=async()=>{
    const opt={vers:p.querySelector("#wv").checked,refs:p.querySelector("#wr2").checked,
      nums:p.querySelector("#wn").checked};
    p.classList.remove("on");
    try{
      if(fmt==="docx")await wrExportWord(d,opt);
      else if(fmt==="pdf")printHTML(wrHTML(d,opt),d.title);
      else if(fmt==="html")dl(new Blob([wrHTML(d,opt)],{type:"text/html;charset=utf-8"}),
        safeName(d.title)+".html");
      else dl(new Blob([wrMD(d,opt)],{type:"text/markdown;charset=utf-8"}),
        safeName(d.title)+".md");
    }catch(e){toast(((e&&e.message)||"")+" "+t("errShot"))}
  };
}
// Markdown 版正文：不依赖任何外部库，断网也导得出来，
// 也方便直接倒进别的笔记软件——跟存档包里的分页 Markdown 是同一个思路。
function wrMD(d,opt){
  let out="# "+(d.title||"")+"\n\n";
  const nm=wrNumMap(d,opt);
  d.ids.map(card).filter(Boolean).forEach(c=>{
    const o=orig(c),lv=wrLevelOf(c);
    const txt=(o.text||"").trim();
    const n=nm.get(c.id);
    if(lv)out+="#".repeat(Math.min(lv+1,6))+" "+(n?n+" ":"")+txt+"\n\n";
    else if(txt)out+=txt+"\n\n";
    if(opt.vers)verList(o).forEach((v,k)=>{
      if(v.id===o.verOn||!String(v.text||"").trim())return;
      out+="> **"+verLabel(v,k)+"** "+String(v.text).replace(/\n+/g," ")+"\n\n";
    });
    if(opt.refs)wrKids(c.id).forEach(k=>{
      out+="> \u25C8 "+snippet(orig(k),500).replace(/\n+/g," ")+"\n\n";
    });
  });
  return out;
}

/* ================= menus ================= */
// ---- 多级菜单：每一层有自己的元素，深层不会顶掉浅层 ----
const MEXTRA={};
const MAXLV=8;
let owners=[],subT;
function levelEl(i){
  if(i===0)return $("menu");
  if(i===1)return $("submenu");
  if(!MEXTRA[i]){const d=document.createElement("div");d.className="menu";document.body.appendChild(d);MEXTRA[i]=d}
  return MEXTRA[i];
}
function levelOpen(i){const e=(i===0)?$("menu"):(i===1?$("submenu"):MEXTRA[i]);
  return e&&e.classList.contains("on")?e:null}
function closeFrom(i){
  clearTimeout(subT);
  for(let k=MAXLV;k>=i;k--){
    const e=(k===0)?$("menu"):(k===1?$("submenu"):MEXTRA[k]);
    if(e)e.classList.remove("on");
    owners[k]=null;
  }
  for(let k=0;k<i;k++){
    const e=levelOpen(k);
    if(e)e.querySelectorAll(".mi.open").forEach(b=>{
      if(!owners[k+1]||b!==owners[k+1].btn)b.classList.remove("open")});
  }
}
function closeMenus(){closeFrom(0)}
function keepSub(){clearTimeout(subT)}
const inBox=(x,y,r,p)=>x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p;
// 用指针坐标判断，而不是依赖 mouseenter / mouseleave
addEventListener("pointermove",e=>{
  if(!levelOpen(1))return;
  let inside=false,deepest=0;
  for(let k=0;k<=MAXLV;k++){
    const el=levelOpen(k);if(!el)continue;
    deepest=k;
    if(inBox(e.clientX,e.clientY,el.getBoundingClientRect(),8)){inside=true;break}
    const o=owners[k];
    if(o){                                   // 父项与本层之间的通道
      const r=el.getBoundingClientRect();
      const bridge={left:Math.min(o.rect.right,r.left)-16,right:Math.max(o.rect.right,r.left)+16,
        top:Math.min(o.rect.top,r.top)-12,bottom:Math.max(o.rect.bottom,r.bottom)+12};
      if(inBox(e.clientX,e.clientY,bridge,0)){inside=true;break}
    }
  }
  if(inside)keepSub();else{clearTimeout(subT);subT=setTimeout(()=>closeFrom(1),320)}
},true);
function place(el,x,y){
  el.classList.add("on");el.style.left="0px";el.style.top="0px";el.scrollTop=0;
  const r=el.getBoundingClientRect();
  el.style.left=Math.max(6,Math.min(x,innerWidth-r.width-8))+"px";
  el.style.top=Math.max(6,Math.min(y,innerHeight-r.height-8))+"px";
}
function build(el,items,level){
  const lv=level||0;
  el.innerHTML="";
  items.forEach(it=>{
    if(it==="-"){const d=document.createElement("div");d.className="msep";el.appendChild(d);return}
    if(it.head){const d=document.createElement("div");d.className="mhd";d.textContent=it.head;el.appendChild(d);return}
    const b=document.createElement("button");b.className="mi"+(it.danger?" dz":"");
    b.innerHTML=`<span>${it.check?"✓ ":""}${it.label}</span>`+(it.key?`<span class="k">${it.key}</span>`:"")+(it.sub?`<span class="k">›</span>`:"");
    if(it.sub&&it.sub.length){
      const open=()=>{
        keepSub();
        if(owners[lv+1]&&owners[lv+1].btn===b&&levelOpen(lv+1))return;
        closeFrom(lv+1);
        el.querySelectorAll(".mi.open").forEach(z=>z.classList.remove("open"));
        b.classList.add("open");
        const r=b.getBoundingClientRect();
        const child=levelEl(lv+1);
        build(child,it.sub,lv+1);
        place(child,r.right+2,r.top-6);
        let cr=child.getBoundingClientRect();
        if(cr.right>innerWidth-6)place(child,Math.max(6,r.left-cr.width-2),r.top-6);
        owners[lv+1]={btn:b,rect:b.getBoundingClientRect()};
      };
      b.onmouseenter=open;
      b.onclick=e=>{e.stopPropagation();open()};
    }else{
      b.onmouseenter=()=>{keepSub();closeFrom(lv+1)};
      b.onclick=()=>{closeMenus();it.on&&it.on()};
    }
    el.appendChild(b);
  });
}
function menuAt(x,y,items){closeFrom(0);build($("menu"),items,0);place($("menu"),x,y)}
// 点到菜单以外的任何地方就关掉它。原先只有 #stage 的 pointerdown 负责关闭，
// 而专注模式下 #stage 是隐藏的，于是在写作页内部点空白关不掉菜单，
// 非得点到页面外才行。这里在捕获阶段统一处理，所有视图一视同仁。
addEventListener("pointerdown",e=>{
  if(!levelOpen(0))return;
  for(let k=0;k<=MAXLV;k++){
    const el=levelOpen(k);
    if(el&&el.contains(e.target))return;          // 点在某一层菜单上：交给它自己处理
  }
  closeMenus();
},true);

function viewItems(x,y){

function recentItems(){
  if(!RECENTS.length)return [{label:t("recentNone")}];
  const now=Date.now();
  return RECENTS.slice(0,10).map(r=>({
    label:r.name+"   "+ago(now-r.ts),
    check:!!(fileName&&r.name===fileName),
    on:()=>openRecent(r.id),
    sub:null
  })).concat(["-",{label:t("recentNewWin"),sub:RECENTS.slice(0,10).map(r=>({
    label:r.name,on:()=>openRecent(r.id,true)}))}]);
}
function ago(ms){
  const m=Math.round(ms/60000);
  if(m<1)return t("agoNow");
  if(m<60)return m+t("agoMin");
  const h=Math.round(m/60);
  if(h<24)return h+t("agoHour");
  return Math.round(h/24)+t("agoDay");
}

function targets(){return sel.map(card).filter(Boolean)}
function newStyle(){
  const lv=(S.lvStyle&&S.lvStyle[0])||null;

function curStyle(){if(styleMode==="default")return {...DEF,...S.textDef};
  const c=targets()[0];return {...DEF,...S.textDef,...(c?.s||{})}}
function applyCardStyle(c){
  const el=hostOfCard(c.id);if(!el)return;
  const isCap=!!(el.classList&&el.classList.contains("cap"));
  const cap=isCap?el:el.querySelector(".cap");
  if(!cap)return;
  if(isCap){
    // 写作页里没有外层卡片容器，底色作用在 .cap 的外层 .wrap 上
    const wrap=el.closest(".wrap");
    if(wrap){
      if(c.bg){wrap.style.background=c.bg;wrap.style.padding="12px 14px";wrap.style.borderRadius="3px"}
      else{wrap.style.background="";wrap.style.padding="";wrap.style.borderRadius=""}
    }
  }else{
    if(c.bg){el.style.background=c.bg;el.style.padding="14px";el.style.borderRadius="3px"}
    else{el.style.background="";el.style.padding="";el.style.borderRadius=""}
  }
  const s={...DEF,...S.textDef,...(c.s||{})};
  Object.assign(cap.style,{fontFamily:famCSS(s.family),fontSize:s.size+"px",fontWeight:s.weight,
    lineHeight:s.lh,letterSpacing:s.spacing+"em",textAlign:s.align,color:s.color,
    fontStyle:s.italic?"italic":"normal"});
  const lb=el.querySelector?el.querySelector(".lvl"):null;if(lb)lb.style.color=s.color;
  const tw=el.querySelector?el.querySelector(".tags"):null;
  if(tw){tw.style.color=s.color;tw.style.fontSize=Math.max(9,s.size*.78)+"px"}
}
function setStyle(k,v){
  if(styleMode==="default"){S.textDef={...DEF,...S.textDef,[k]:v};render();save();return}
  const cs=targets().filter(c=>!isLocked(c.id));
  if(!cs.length)return;
  cs.forEach(c=>{c.s={...DEF,...S.textDef,...(c.s||{})};c.s[k]=v;c.sMan=true;applyCardStyle(c)});
  measure();drawLinksSoon();save();
}

function readJSON(f,merge){
  const r=new FileReader();
  r.onerror=()=>alert(t("badFile")+"\n"+t("errRead"));
  r.onload=async()=>{
    let d;
    try{d=JSON.parse(r.result)}
    catch(err){alert(t("badFile")+"\n"+t("errParse"));return}
    if(!d||!Array.isArray(d.cards)){alert(t("badFile")+"\n"+t("errShape"));return}
    let stage="snapshot",n=0;
    try{
      snap();
      stage="absorb";      n=await absorb(d,merge);
      stage="select";      sel=[];selLink=null;
      if(!merge){LANG=S.lang||LANG;fileName=f.name;fileHandle=null;fileOK=false}
      stage="render";      render();
      stage="fit";         fit(true);
      stage="save";        save();
      toast((merge?t("mergedIn"):t("savedTo"))+" "+n);
    }catch(err){
      console.error("import failed at stage: "+stage,err);
      const frame=((err&&err.stack)||"").split("\n").slice(0,4).join("\n");
      alert(t("errImport")+"\n["+stage+"] "+((err&&err.message)||err)+"\n\n"+frame);
      try{render()}catch(e){}
    }
  };
  r.readAsText(f);
}
$("jsonfile").onchange=e=>{const f=e.target.files[0];if(f)readJSON(f,false);e.target.value=""};
$("mergefile").onchange=e=>{const f=e.target.files[0];if(f)readJSON(f,true);e.target.value=""};

  if(saved&&saved.cards){S={...S,...migrate(saved)};
    (S.links||[]).forEach(l=>{if(l)delete l.dash});S.links=S.links||[];S.frames=S.frames||[];S.sheets=S.sheets||[];
    if(!S.lvMigrated){S.linkView="all";S.lvMigrated=true}
    S.linkDef={...DEFLINK,...(saved.linkDef||{})};S.textDef={...DEF,...(saved.textDef||{})}}
  LANG=S.lang||"en";
  await migrateInline(S.cards);

  try{const h=await kvGet(FH);
    if(h){fileHandle=h;fileName=h.name;
      if(h.queryPermission){const p=await h.queryPermission({mode:"readwrite"});fileOK=(p==="granted")}}}catch(e){}
  await loadRecents();
  await loadGlobalTpl();
  await loadBackups();
  const wantOpen=QS.get("open");
  if(wantOpen)setTimeout(()=>openRecent(wantOpen).catch(()=>toast(t("noPerm"))),300);
  applyCam();render();
  if(S.work&&!lock)$("find").classList.add("on");
  if(S.map){mapOn=true;$("map").classList.add("on");applyMapSize();setTimeout(drawMap,300)}
  syncFindMode();refreshTagList();
  if(S.cards.length)fit(true);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();drawLinks()});
  setTimeout(()=>{measure();drawLinks()},800);
})();
