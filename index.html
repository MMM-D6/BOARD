<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;
    font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background:#F4F4F2;color:#111}
  [contenteditable]{outline:none}
  button,select,input{font:inherit;color:inherit}

  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:default}
  #stage.pan{cursor:grabbing}
  #world{position:absolute;left:50%;top:50%;transform-origin:0 0;--iz:1}
  #links{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none}
  #links path.ln,#links path.hit{fill:none}
  #links path.hit{stroke:transparent;stroke-width:16px;pointer-events:stroke;cursor:pointer}

  .frame{position:absolute;border:calc(1.5px * var(--iz)) solid var(--fr);
    border-radius:calc(4px * var(--iz));background:var(--frbg);pointer-events:none}
  .frame .ttl{position:absolute;left:0;bottom:100%;margin-bottom:calc(5px * var(--iz));
    font:500 calc(12px * var(--iz))/1.2 "IBM Plex Sans","PingFang SC",sans-serif;
    color:var(--fr);white-space:pre;pointer-events:auto;cursor:move;padding:calc(2px * var(--iz)) 0}
  .frame.sel{border-color:var(--frame)}
  .frame.sel .ttl{color:var(--frame)}
  .frame .fr-rs{position:absolute;right:calc(-5px * var(--iz));bottom:calc(-5px * var(--iz));
    width:calc(11px * var(--iz));height:calc(11px * var(--iz));border-radius:50%;background:#fff;
    border:calc(1px * var(--iz)) solid var(--frame);cursor:nwse-resize;pointer-events:auto;display:none}
  .frame.sel .fr-rs{display:block}
  body.lock .frame .fr-rs{display:none !important}
  .card{position:absolute;user-select:none}
  .card img{width:100%;height:auto;display:block;border-radius:2px;pointer-events:none;
    box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .card .cap{margin-top:10px;white-space:pre-wrap;word-break:break-word;min-height:1em}
  .card .cap:empty:before{content:attr(data-ph);opacity:.28}
  .card .cap[contenteditable=true]{user-select:text;cursor:text;
    box-shadow:0 0 0 calc(1px * var(--iz)) rgba(0,0,0,.18);border-radius:2px}
  .card.sel .ring{position:absolute;inset:calc(-7px * var(--iz));pointer-events:none;
    border:calc(1px * var(--iz)) solid var(--frame)}
  .card.multi .ring{border-style:dashed}
  .card .hnd{position:absolute;width:calc(8px * var(--iz));height:calc(8px * var(--iz));
    background:#fff;border-radius:50%;border:calc(1px * var(--iz)) solid var(--frame);
    box-shadow:0 calc(1px * var(--iz)) calc(2px * var(--iz)) rgba(0,0,0,.22);
    transform:translate(-50%,-50%);display:none;z-index:5}
  .card.sel .hnd{display:block}
  .card.multi .hnd{display:none}
  .card .hnd:hover{background:var(--frame)}
  .card .hnd.nw,.card .hnd.se{cursor:nwse-resize}
  .card .hnd.ne,.card .hnd.sw{cursor:nesw-resize}
  .card .hnd.n,.card .hnd.s{cursor:ns-resize}
  .card .hnd.e,.card .hnd.w{cursor:ew-resize}
  .card .port{position:absolute;width:calc(30px * var(--iz));height:calc(30px * var(--iz));
    transform:translate(-50%,-50%);opacity:0;cursor:crosshair;z-index:3;pointer-events:none;
    display:flex;align-items:center;justify-content:center;transition:opacity .12s}
  .card .port:before{content:"";width:calc(9px * var(--iz));height:calc(9px * var(--iz));
    border-radius:50%;background:var(--frame);border:calc(1.5px * var(--iz)) solid #fff;
    box-shadow:0 0 calc(2px * var(--iz)) rgba(0,0,0,.25);transition:transform .12s}
  .card:hover .port{opacity:.9;pointer-events:auto}
  .card .port:hover{opacity:1}
  .card .port:hover:before{transform:scale(1.45)}

  /* presentation lock */
  body.lock .port,body.lock .hnd,body.lock .ring{display:none !important}
  body.lock .card{cursor:zoom-in}
  body:not(.lock) .card img{cursor:zoom-in}
  body.lock .card .cap:empty:before{content:""}

  .menu{position:fixed;z-index:80;min-width:190px;padding:5px;border-radius:10px;
    max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;
    background:var(--panel);color:var(--pfg);border:1px solid var(--pline);
    box-shadow:0 14px 40px rgba(0,0,0,.18);display:none;font-size:13px}
  .menu.on{display:block}
  .mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:none;background:none;
    border-radius:6px;cursor:pointer;text-align:left;white-space:nowrap}
  .mi:hover,.mi.open{background:var(--phi)}
  .mi .k{margin-left:auto;opacity:.4;font:400 10.5px/1 "IBM Plex Mono",monospace}
  .mi.dz{color:#C0392B}
  .msep{height:1px;background:var(--pline);margin:4px 5px}
  .mhd{font:400 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
    opacity:.42;padding:8px 9px 5px}

  .pop{position:fixed;z-index:90;width:252px;padding:12px 13px 14px;border-radius:11px;
    background:var(--panel);color:var(--pfg);border:1px solid var(--pline);
    box-shadow:0 16px 44px rgba(0,0,0,.2);display:none;font-size:12.5px}
  .pop.on{display:block}
  .pop.wide{width:312px}
  .pop .sec{font:400 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
    opacity:.4;margin:14px 0 7px}
  .pop .sec:first-of-type{margin-top:10px}
  .pop .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pop .grid button,.pop .pair button{height:32px;border:1px solid var(--pline);background:none;
    border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap;padding:0 4px}
  .pop .grid button.on,.pop .pair button.on{background:var(--pfg);color:var(--panel);border-color:var(--pfg)}
  .pop .grid button:disabled,.pop .pair button:disabled{opacity:.3;cursor:default}
  .pop .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pop .trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .pop .opt{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;cursor:pointer}
  .pop .opt input{accent-color:var(--pfg);width:14px;height:14px;margin:0}
  .pop .go{width:100%;height:36px;margin-top:16px;border:none;border-radius:8px;cursor:pointer;
    background:var(--pfg);color:var(--panel);font-size:13px;letter-spacing:.02em}
  .pop .go:hover{opacity:.88}
  .pop .hd{display:flex;align-items:center;margin:0 0 10px}
  .pop .hd b{font:500 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.02em}
  .pop .hd button{margin-left:auto;border:none;background:none;cursor:pointer;opacity:.45;font-size:15px;padding:0 2px}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0}
  .row label{width:46px;opacity:.55;font-size:11.5px;flex:none}
  .row input[type=range]{flex:1;accent-color:var(--pfg);height:18px}
  .row .val{width:34px;text-align:right;font:400 11px/1 "IBM Plex Mono",monospace;opacity:.6}
  .row select{flex:1;height:29px;border-radius:6px;border:1px solid var(--pline);background:none;padding:0 6px}
  .seg{display:flex;flex:1;gap:3px}
  .seg button{flex:1;height:28px;border:1px solid var(--pline);background:none;border-radius:6px;cursor:pointer;font-size:12px}
  .seg button.on{background:var(--pfg);color:var(--panel);border-color:var(--pfg)}
  .sw{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .sw button{width:20px;height:20px;border-radius:50%;border:1px solid var(--pline);cursor:pointer;padding:0}
  .sw input[type=color]{width:22px;height:22px;padding:0;border:1px solid var(--pline);border-radius:50%;background:none;cursor:pointer}

  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    font-size:13px;opacity:.32;line-height:2;pointer-events:none;z-index:5}
  body.hidecur,body.hidecur *{cursor:none !important}
  .card.lk .ring{border-style:dashed}
  .card.lk .hnd{display:none !important}
  #find{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:70;display:none;
    align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--panel);
    color:var(--pfg);border:1px solid var(--pline);box-shadow:0 8px 26px rgba(0,0,0,.13)}
  #find.on{display:flex}
  #find .m{border:1px solid var(--pline);background:none;border-radius:6px;height:22px;
    padding:0 8px;font-size:11px;cursor:pointer;opacity:.75}
  #find input{width:214px;height:24px;border:none;background:none;font-size:13px}
  #find input::placeholder{opacity:.35}
  #find .n{font:400 11px/1 "IBM Plex Mono",monospace;opacity:.45;min-width:44px;text-align:right}
  #find .x{border:none;background:none;cursor:pointer;opacity:.4;font-size:15px;padding:0 2px}
  body.lock #find{display:none !important}
  body.finding .card.nomatch{opacity:.12}
  .card.hit .ring{position:absolute;inset:calc(-8px * var(--iz));border-radius:3px;pointer-events:none;
    border:calc(1.5px * var(--iz)) dashed var(--sel);opacity:.7}
  .card .cap a{color:inherit;text-decoration:underline;text-underline-offset:2px;
    text-decoration-thickness:1px;cursor:pointer}
  .card .cap a:hover{text-decoration-thickness:2px}
  .card .lnk{position:absolute;left:0;bottom:calc(-21px * var(--iz));
    width:calc(16px * var(--iz));height:calc(16px * var(--iz));opacity:.45;cursor:pointer;
    display:flex;align-items:center;justify-content:center;pointer-events:auto}
  .card .lnk svg{width:100%;height:100%;display:block}
  .card .lnk:hover{opacity:1}
  body.lock .card .lnk{opacity:.4}
  .card .twin{position:absolute;right:0;top:calc(-16px * var(--iz));opacity:.5;cursor:pointer;
    font:500 calc(9.5px * var(--iz))/1 "IBM Plex Mono",monospace;letter-spacing:.08em;

  body.lock .card .lvl{display:none}

  .pop .chips{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow:auto;margin:4px 0 2px}

  .pop .ti{width:100%;height:30px;border:1px solid var(--pline);background:none;

  .pop .note{font-size:11px;opacity:.42;margin:8px 0 0;line-height:1.5}
  #man{position:fixed;inset:0;z-index:120;display:none;background:rgba(0,0,0,.28);
    backdrop-filter:blur(3px)}
  #man.on{display:flex;align-items:center;justify-content:center}
  #man .win{width:min(920px,92vw);height:min(660px,88vh);display:flex;border-radius:13px;
    overflow:hidden;background:var(--panel);color:var(--pfg);border:1px solid var(--pline);
    box-shadow:0 24px 70px rgba(0,0,0,.3)}
  #man .side{width:250px;flex:none;border-right:1px solid var(--pline);overflow:auto;padding:10px 8px 24px}
  #man .side .ltr{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;opacity:.35;
    padding:12px 10px 6px}
  #man .side button{display:block;width:100%;text-align:left;border:none;background:none;
    padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}

  #man .side button.on{background:var(--pfg);color:var(--panel)}
  #man .side button i{font-style:normal;opacity:.3;font-size:10px;margin-left:6px;
    font-family:"IBM Plex Mono",monospace}
  #man .body{flex:1;overflow:auto;padding:26px 30px 40px}
  #man .body h3{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:.01em}

  #man .body p{margin:0 0 11px;font-size:13.5px;line-height:1.75}
  #man .body ul{margin:0 0 11px;padding-left:18px;font-size:13.5px;line-height:1.75}
  #man .body li{margin:3px 0}
  #man .body kbd{font:400 11.5px/1 "IBM Plex Mono",monospace;border:1px solid var(--pline);
    border-radius:4px;padding:2px 5px;margin:0 1px}
  #man .body .tip{border-left:2px solid var(--pline);padding:2px 0 2px 12px;opacity:.72;
    font-size:12.5px;line-height:1.7;margin:14px 0 0}
  #man .cx{position:absolute;right:calc(50% - min(460px,46vw) + 14px);top:calc(50% - min(330px,44vh) + 10px);

  #bar{position:fixed;z-index:75;display:none;align-items:center;gap:1px;padding:4px 5px;

    backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
    white-space:nowrap;font-size:12.5px;color:var(--pfg);
    transition:background-color .16s,border-color .16s}
  #bar:not(:hover):not(.open){background:var(--glassSoft);border-color:transparent}

  #bar.on{display:flex}
  #bar .cell{position:relative;display:flex;align-items:center}
  #bar .ctl{height:26px;display:flex;align-items:center;gap:5px;padding:0 8px;border:none;

    transition:background-color .12s,opacity .16s}
  #bar .ctl:hover{background:var(--phi)}

  #bar .pp{position:absolute;top:100%;left:0;margin-top:7px;z-index:6;display:none;padding:7px;

function normUrl(u){
  u=(u||"").trim();
  if(!u)return "";
  if(/^(https?|mailto|file):/i.test(u))return u;
  if(/^10\.\d{4,}\//.test(u))return "https://doi.org/"+u;   // 直接粘 DOI 也认
  return "https://"+u.replace(/^\/+/,"");
}
function shortUrl(u){
  const x=(u||"").replace(/^https?:\/\//i,"").replace(/^www\./i,"");

}

// 在页面里找一块空位，避免叠在已有内容上
function freeSpotIn(f,w,h){
  const inside=inFrame(f);
  const x=f.x+24;
  let y=f.y+30;
  if(inside.length)y=Math.max(y,Math.max(...inside.map(z=>z.y+hOf(z)))+36);
  if(y+h>f.y+f.h){                       // 页面装不下就把页面撑高
    f.h=Math.round(y+h-f.y+30);
  }
  return {x:Math.round(Math.min(x,f.x+f.w-w-16)),y:Math.round(y)};
}
function sendTo(target,mode){
  const cs=sel.map(card).filter(Boolean).filter(z=>!isLocked(z.id));
  if(!cs.length)return;
  snap();
  const ns=[];
  cs.forEach(c=>{
    const h=hOf(c)||120;
    const p=target==="view"
      ? (()=>{const v=toW(innerWidth/2,innerHeight/2);return {x:Math.round(v.x-c.w/2),y:Math.round(v.y-h/2)}})()
      : freeSpotIn(target,c.w,h);
    if(mode==="twin"){
      const n={id:uid(),ref:orig(c).id,x:p.x,y:p.y,w:c.w,s:{...(c.s||{})}};
      if(c.bg)n.bg=c.bg;
      S.cards.push(n);ns.push(n.id);
    }else{
      c.x=p.x;c.y=p.y;ns.push(c.id);
    }
  });
  sel=ns;render();save();

  }catch(e){let a=5381;for(let i=0;i<str.length;i++)a=((a<<5)+a+str.charCodeAt(i))>>>0;
    return "f"+a.toString(16)+str.length.toString(16)}
}

const SCHEMA=3;                         // 数据结构版本，只增不减
function migrate(d){
  if(!d||typeof d!=="object")return d;
  const from=+d.v||1;
  if(from>SCHEMA)console.warn("file written by a newer version:",from);
  if(from<2){                            // 1 -> 2 连线显示默认值修正
    if(!d.lvMigrated){d.linkView="all";d.lvMigrated=true}
  }
  if(from<3){                            // 2 -> 3 页面、模板字段补全
    d.frames=Array.isArray(d.frames)?d.frames:[];
    d.templates=Array.isArray(d.templates)?d.templates:[];
  }
  d.v=Math.max(from,SCHEMA);
  return d;
}

let dbP=null;
function idb(){
  if(dbP)return dbP;
  dbP=new Promise(r=>{
    let q;try{q=indexedDB.open(DB,1)}catch(e){return r(null)}
    q.onupgradeneeded=()=>{try{q.result.createObjectStore("kv")}catch(e){}};
    q.onsuccess=()=>{q.result.onclose=()=>{dbP=null};r(q.result)};
    q.onerror=()=>{dbP=null;r(null)};
    q.onblocked=()=>r(null);
  });
  return dbP;
}
function kvGet(k){return new Promise(async r=>{const db=await idb();if(!db)return r(null);
  try{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
function kvPut(k,v){return new Promise(async r=>{
  const db=await idb();if(!db)return r(0);
  try{
    const tx=db.transaction("kv","readwrite");
    tx.objectStore("kv").put(v,k);
    tx.oncomplete=()=>r(1);tx.onerror=()=>r(0);tx.onabort=()=>r(0);
  }catch(e){r(0)}
})}

      groups:(data.groups||[]).filter(g=>g&&Array.isArray(g.ids))

function bbox(list){
  const cs=list||S.cards;
  if(!cs.length)return null;
  let x=Infinity,y=Infinity,xe=-Infinity,ye=-Infinity;
  for(const c of cs){
    const cx=+c.x||0,cy=+c.y||0,cw=+c.w||0,ch=hOf(c)||0;
    if(cx<x)x=cx; if(cy<y)y=cy;
    if(cx+cw>xe)xe=cx+cw; if(cy+ch>ye)ye=cy+ch;
  }
  if(!isFinite(x))return null;
  return{x,y,w:xe-x,h:ye-y};
}

  camTo(-(b.x+b.w/2)*z,-(b.y+b.h/2)*z,z,now);
}

const OF=20000;
function anchor(c,side){
  const h=hOf(c),w=c.w;
  return{t:{x:c.x+w/2,y:c.y},b:{x:c.x+w/2,y:c.y+h},
    l:{x:c.x,y:c.y+h/2},r:{x:c.x+w,y:c.y+h/2}}[side];

function autoSides(a,b){
  const ah=hOf(a),bh=hOf(b);
  const ac={x:a.x+a.w/2,y:a.y+ah/2},bc={x:b.x+b.w/2,y:b.y+bh/2};
  return Math.abs(bc.x-ac.x)>Math.abs(bc.y-ac.y)
    ?[bc.x>ac.x?"r":"l",bc.x>ac.x?"l":"r"]
    :[bc.y>ac.y?"b":"t",bc.y>ac.y?"t":"b"];
}
const H=s=>s==="l"||s==="r";
function pathOf(p1,p2,s1,s2,kind){
  const o=OF,a={x:p1.x+o,y:p1.y+o},b={x:p2.x+o,y:p2.y+o};
  if(kind==="straight")return `M${a.x} ${a.y} L${b.x} ${b.y}`;
  if(kind==="elbow"){
    if(H(s1)&&H(s2)){const m=(a.x+b.x)/2;return `M${a.x} ${a.y} L${m} ${a.y} L${m} ${b.y} L${b.x} ${b.y}`}
    if(!H(s1)&&!H(s2)){const m=(a.y+b.y)/2;return `M${a.x} ${a.y} L${a.x} ${m} L${b.x} ${m} L${b.x} ${b.y}`}
    return H(s1)?`M${a.x} ${a.y} L${b.x} ${a.y} L${b.x} ${b.y}`:`M${a.x} ${a.y} L${a.x} ${b.y} L${b.x} ${b.y}`;
  }
  const d=Math.max(40,(H(s1)?Math.abs(b.x-a.x):Math.abs(b.y-a.y))*.5);
  const c1=H(s1)?{x:a.x+(s1==="r"?d:-d),y:a.y}:{x:a.x,y:a.y+(s1==="b"?d:-d)};
  const c2=H(s2)?{x:b.x+(s2==="r"?d:-d),y:b.y}:{x:b.x,y:b.y+(s2==="b"?d:-d)};
  return `M${a.x} ${a.y} C${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`;
}

      tri.setAttribute("d",`M${a.x} ${a.y}L${w1.x} ${w1.y}L${w2.x} ${w2.y}Z`);
      tri.setAttribute("fill",col);tri.style.fill=col;tri.style.stroke="none";
      g.appendChild(tri);
    };
    const ar=l.arrow===undefined?"end":l.arrow;
    if(ar==="end"||ar==="both")tip(len,-1);
    if(ar==="both")tip(0,1);
  });
  svg.appendChild(g);
}
function drawMarks(svg,list){

      tx.setAttribute("stroke",S.bg);tx.setAttribute("stroke-width",3.5*iz);

/* ================= drag and resize ================= */
function startMove(e,onClick){
  if(lock)return;
  snap();
  const list=freeSel().map(card).filter(Boolean).map(o=>({o,x:o.x,y:o.y}));
  if(!list.length){if(sel.length)toast(t("lockedNote"));return}
  const sx=e.clientX,sy=e.clientY;let moved=false;
  const mv=ev=>{
    let dx=(ev.clientX-sx)/cam.z,dy=(ev.clientY-sy)/cam.z;
    if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
    if(ev.shiftKey){Math.abs(dx)>Math.abs(dy)?dy=0:dx=0}
    list.forEach(({o,x,y})=>{o.x=Math.round(x+dx);o.y=Math.round(y+dy);
      const el=nodes.get(o.id);
      if(el){el.style.left=o.x+"px";el.style.top=o.y+"px"}});
    drawLinksSoon();
  };
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    if(!moved){undo.pop();onClick&&onClick()}
    else{save();if(S.autoNum)render()}};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}
function startResize(e,c,dir){
  if(isLocked(c.id))return;
  snap();
  const d=dir||"se";
  const sx=e.clientX,sy=e.clientY,ow=c.w,ox=c.x,oy=c.y,oh=hOf(c)||c.w;
  const right=ox+ow,bottom=oy+oh;
  const el=nodes.get(c.id);if(!el)return;
  const mv=ev=>{
    const dx=(ev.clientX-sx)/cam.z,dy=(ev.clientY-sy)/cam.z;
    let w=ow;
    if(d.includes("e"))w=ow+dx;
    else if(d.includes("w"))w=ow-dx;
    else if(d==="s")w=ow*Math.max(.08,(oh+dy)/oh);
    else if(d==="n")w=ow*Math.max(.08,(oh-dy)/oh);
    c.w=Math.round(clamp(w,60,4000));
    if(d.includes("w"))c.x=Math.round(right-c.w);
    el.style.width=c.w+"px";el.style.left=c.x+"px";
    measure();
    if(d.includes("n")){c.y=Math.round(bottom-(hOf(c)||c.w));el.style.top=c.y+"px"}
    drawLinksSoon();
  };
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    measure();drawLinks();save()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}

/* ================= images ================= */
function shrink(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const max=1600,k=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      const png=/png/i.test(file.type);
      cb(cv.toDataURL(png?"image/png":"image/jpeg",.88),cv.width,cv.height)};
    im.src=fr.result};
  fr.readAsDataURL(file);
}
async function addImage(d,w,h,p,quiet){

  const W=Math.round(w*Math.min(1,cap/Math.max(w,h)));

  const c={id:uid(),ih:r.h,...(r.ok?{}:{src:d}),ar:h/w,x:Math.round(p.x-W/2),y:Math.round(p.y-W*(h/w)/2),w:W,text:"",s:newStyle()};
  S.cards.push(c);if(!quiet){sel=[c.id];selLink=null}render();save();return c;
}
function addImages(files,p){
  const list=[...files].filter(f=>f.type.startsWith("image/"));
  if(!list.length||lock)return;snap();
  list.forEach((f,i)=>shrink(f,(d,w,h)=>addImage(d,w,h,{x:p.x+(i%4)*30,y:p.y+i*24},list.length>1)));
}

function startMarquee(e){
  const add=e.shiftKey,base=add?[...sel]:[];
  if(!add&&(sel.length||selLink)){sel=[];selLink=null;paintSel()}
  const sx=e.clientX,sy=e.clientY,box=$("marq");let moved=false;
  const mv=ev=>{
    const x=Math.min(sx,ev.clientX),y=Math.min(sy,ev.clientY);
    const w=Math.abs(ev.clientX-sx),h=Math.abs(ev.clientY-sy);
    if(w+h>4)moved=true;

      if(isLocked(c.id))return false;
      const ch=hOf(c);
      return c.x+c.w>a.x&&c.x<b.x&&c.y+ch>a.y&&c.y<b.y;
    }).map(c=>c.id);
    sel=[...new Set([...base,...expand(hit)])];

  };

    box.style.display="none";

  if(e.ctrlKey||e.metaKey||(!pad&&!e.shiftKey)){zoomAt(Math.exp(-e.deltaY*.0022),e.clientX,e.clientY)}
  else camTo(tgt.x-e.deltaX,tgt.y-e.deltaY,tgt.z,true);

addEventListener("keyup",e=>{if(e.key===" "){spaceDown=false;stage.classList.remove("space")}});

addEventListener("keydown",e=>{
  if(sizeKey(e))return;
  const k=e.key.toLowerCase();
  if(e.key==="Escape"&&$("man").classList.contains("on")){$("man").classList.remove("on");return}
  if(e.key===" "&&!editing&&!e.target.isContentEditable&&!lock){spaceDown=true;stage.classList.add("space")}
  if((e.metaKey||e.ctrlKey)&&k==="s"){e.preventDefault();saveNow();return}
  if((e.metaKey||e.ctrlKey)&&k==="f"&&!lock){e.preventDefault();showFind(true);return}
  if(editing||e.target.isContentEditable){
    if(sizeEdit)return;
    if(e.key==="Escape"){document.activeElement.blur();return}
    if((e.metaKey||e.ctrlKey)&&["b","i","u"].includes(k)){
      e.preventDefault();cmd(k==="b"?"bold":k==="i"?"italic":"underline");return;
    }
    if((e.metaKey||e.ctrlKey)&&e.shiftKey&&k==="x"){e.preventDefault();cmd("strikeThrough");return}
    setTimeout(syncBar,0);                      // 撤销后同步按钮状态
    return;
  }
  if(lock){
    if(e.key==="Escape"){setLock(false);return}
    if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "){e.preventDefault();step(1)}
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();step(-1)}
    if(k==="f")fit();
    return;
  }
  if((e.metaKey||e.ctrlKey)&&k==="z"){e.preventDefault();e.shiftKey?applyUndo(redo,undo):applyUndo(undo,redo);return}
  if((e.metaKey||e.ctrlKey)&&k==="a"){e.preventDefault();sel=S.cards.map(c=>c.id);paintSel();return}
  if((e.metaKey||e.ctrlKey)&&k==="d"){e.preventDefault();dupe();return}
  if((e.metaKey||e.ctrlKey)&&k==="g"){e.preventDefault();e.shiftKey?ungroup():makeGroup();return}
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&k==="c"){e.preventDefault();clipCards("twin");return}
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&k==="v"){e.preventDefault();pasteClip(toW(mouse.x,mouse.y));return}
  if(e.key==="Escape"){closeMenus();sel=[];selLink=null;linkFrom=null;stage.style.cursor="";toast("");paintSel()}
  if(e.key==="Backspace"||e.key==="Delete"){if(sel.length||selLink){e.preventDefault();del()}}
  if(k==="f")fit();
  if(k==="z"&&!e.metaKey&&!e.ctrlKey)focusSel();
  if(k==="0")camTo(tgt.x,tgt.y,1);
  if(k==="t"&&sel.length)syncBar();
  if(sel.length&&e.key.startsWith("Arrow")){e.preventDefault();const d=e.shiftKey?10:1;
    freeSel().map(card).filter(Boolean).forEach(c=>{if(e.key==="ArrowUp")c.y-=d;if(e.key==="ArrowDown")c.y+=d;
      if(e.key==="ArrowLeft")c.x-=d;if(e.key==="ArrowRight")c.x+=d});
    render();save()}
});

/* ================= edits ================= */
function del(){
  if(lock)return;snap();
  if(selLink){S.links=S.links.filter(l=>l.id!==selLink);selLink=null}
  const kill=freeSel();
  if(kill.length){
    // 源被删除时把第一个分身扶正，内容不丢
    kill.forEach(id=>{
      const o=S.cards.find(z=>z.id===id);
      if(!o||o.ref)return;
      const kids=S.cards.filter(z=>z.ref===o.id&&!kill.includes(z.id));
      if(!kids.length)return;
      const heir=kids[0];
      const n={...o,id:heir.id,x:heir.x,y:heir.y,w:heir.w,s:heir.s};delete n.ref;
      S.cards[S.cards.indexOf(heir)]=n;
      kids.slice(1).forEach(z=>z.ref=heir.id);
    });
    S.links=S.links.filter(l=>!kill.includes(l.a)&&!kill.includes(l.b));
    S.cards=S.cards.filter(c=>!kill.includes(c.id));sel=[]}
  else if(sel.length)toast(t("lockedNote"));
  cleanGroups();render();save();
}
function dupe(){if(!sel.length||lock)return;snap();
  const ns=[];freeSel().map(card).filter(Boolean).forEach(c=>{
    const n={...JSON.parse(JSON.stringify(c)),id:uid(),x:c.x+30,y:c.y+30};S.cards.push(n);ns.push(n.id)});
  sel=ns;render();save();
}
function order(dir){if(!sel.length)return;snap();
  const picked=S.cards.filter(c=>sel.includes(c.id)),rest=S.cards.filter(c=>!sel.includes(c.id));
  S.cards=dir>0?[...rest,...picked]:[...picked,...rest];render();save();
}
function align(mode){
  if(freeSel().length<2){if(sel.length)toast(t("lockedNote"));return}
  snap();
  const cs=freeSel().map(card).filter(Boolean),hh=hOf;
  const mn=f=>cs.reduce((a,c)=>Math.min(a,f(c)),Infinity);
  const mx=f=>cs.reduce((a,c)=>Math.max(a,f(c)),-Infinity);
  if(mode==="left"){const v=mn(c=>c.x);cs.forEach(c=>c.x=v)}
  if(mode==="right"){const v=mx(c=>c.x+c.w);cs.forEach(c=>c.x=v-c.w)}
  if(mode==="cx"){const v=cs.reduce((a,c)=>a+c.x+c.w/2,0)/cs.length;cs.forEach(c=>c.x=Math.round(v-c.w/2))}
  if(mode==="top"){const v=mn(c=>c.y);cs.forEach(c=>c.y=v)}
  if(mode==="bottom"){const v=mx(c=>c.y+hh(c));cs.forEach(c=>c.y=Math.round(v-hh(c)))}
  if(mode==="cy"){const v=cs.reduce((a,c)=>a+c.y+hh(c)/2,0)/cs.length;cs.forEach(c=>c.y=Math.round(v-hh(c)/2))}
  if(mode==="rowgap"){cs.sort((a,b)=>a.x-b.x);let x=cs[0].x;cs.forEach(c=>{c.x=Math.round(x);x+=c.w+40})}
  if(mode==="colgap"){cs.sort((a,b)=>a.y-b.y);let y=cs[0].y;cs.forEach(c=>{c.y=Math.round(y);y+=hh(c)+40})}
  render();save();
}
function sizeImages(all){
  const cap=S.imgMax||360;
  const list=(all?S.cards:freeSel().map(card).filter(Boolean)).filter(c=>srcOf(c));
  if(!list.length)return;
  snap();
  list.forEach(c=>{if(isLocked(c.id))return;
    const ar=c.ar||1;
    c.w=Math.round(ar>=1?cap/ar:cap);
  });
  render();save();
}
const LVSCALE={1:[2.1,700],2:[1.55,600],3:[1.22,500]};
function levelStyle(v){
  if(S.lvStyle&&S.lvStyle[v])return {...S.lvStyle[v]};
  const base={...DEF,...S.textDef};
  if(!v)return {size:base.size,weight:base.weight,spacing:base.spacing};
  const [k,w]=LVSCALE[v];
  return {size:Math.round(base.size*k),weight:w,
    spacing:Math.max(-0.02,+(base.spacing-(v===1?0.02:v===2?0.012:0.006)).toFixed(3))};
}
function setRole(r){
  const cs=targets().filter(c=>!isLocked(c.id));if(!cs.length)return;
  snap();
  cs.forEach(c=>{
    if(c.role===r)delete c.role;else c.role=r;
    if(c.role==="apx"&&!c.level){c.level=1;c.s={...DEF,...S.textDef,...(c.s||{}),...levelStyle(1)}}
  });
  render();save();
}
function setLevel(v){
  const cs=targets().filter(c=>!isLocked(c.id));if(!cs.length)return;
  snap();
  const ls=levelStyle(v);
  cs.forEach(c=>{
    delete c.role;c.sMan=false;
    if(v)c.level=v;else delete c.level;
    c.s={...DEF,...S.textDef,...(c.s||{}),...ls};
  });
  render();save();
}
function makeGroup(){
  const ids=expand(sel).filter(i=>!isLocked(i));
  if(ids.length<2)return;
  snap();
  S.groups=(S.groups||[]).filter(g=>!g.ids.some(i=>ids.includes(i)));
  S.groups.push({id:uid(),ids,locked:false});
  sel=ids;render();save();
}
function ungroup(){
  const gs=[...new Set(sel.map(i=>groupOf(i)).filter(Boolean))];
  if(!gs.length)return;snap();
  S.groups=S.groups.filter(g=>!gs.includes(g));render();save();
}
function setGroupLock(v){
  const gs=[...new Set(sel.map(i=>groupOf(i)).filter(Boolean))];
  if(!gs.length)return;snap();
  gs.forEach(g=>g.locked=v);render();save();
}
function toast(x){const e=$("toast");if(!x){e.classList.remove("on");return}
  e.textContent=x;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}

  <p>画布内容自动存在浏览器本地，关掉页面不会丢。要生成一份真正的文件，用右键菜单的<b>另存为</b>选择位置和文件名。</p>
  <p>绑定文件之后，每次改动都会在一秒左右自动写回同一个文件，不需要反复操作。也可以随时按 <kbd>Ctrl/Cmd</kbd> + <kbd>S</kbd> 立刻保存。菜单里的保存项会显示当前文件名，方便确认写的是哪一份。</p>
  <p>文件名自动带日期前缀，格式为 <b>年-月-日</b>，例如 <i>26-08-07-notes.json</i>。重新另存为时前缀会更新成当天日期，不会层层叠加。</p>
  <p><b>绑定与解绑</b>：菜单保存区顶部始终显示当前绑定的文件名，工作模式下右下角也会显示。开新画布用<b>新建画布</b>，它会先把当前内容写回原文件再解绑，因此不会误覆盖。<b>解除文件绑定</b>可随时停止自动写回。清空画布会自动解绑。</p>
  <p>另有一道保险：画布为空时自动写回会暂停，避免把空白状态覆盖进已有文件。</p>
  <p class="tip">Chrome 和 Edge 支持直接写回原文件，另存为时会从上次的位置打开。Safari 与 Firefox 不支持，会退回成下载同名文件的方式。</p>`],

 ["部分导出","BUFENDAOCHU",`
  <p>导出面板顶部的<b>范围</b>可选整个画布或仅选中内容。选中状态下打开面板时会自动切到仅选中。</p>
  <p>和编组配合使用最顺手：把一章的材料编成一组，点组内任意一张即选中整组，右键<b>导出…</b>就能单独导出这一章，四种格式都支持。</p>
  <p>格式列表里还有<b>画布文件</b>一项，把选中部分导出成独立的 json，可以拆分大文件，或分享某一部分给别人。导出的片段只包含两端都在选中范围内的连线。</p>`],

 ["多窗口与最近打开","DUOCHUANGKOU",`
  <p>可以像 Word 那样同时开多个文件：右键菜单的<b>文件 → 新建窗口</b>会开一个独立窗口，各自绑定各自的文件，内容互不干扰。系统任务栏上每个窗口是一项，右键任务栏图标即可在窗口之间切换。</p>
  <p>之所以能互不干扰，是因为每个窗口在浏览器本地有独立的存储位置，由地址栏里的窗口编号区分。不要手动去掉那个编号，否则两个窗口会写到同一处。</p>
  <p><b>最近打开</b>在文件子菜单里，按时间倒序列出最近十个文件，附带距上次使用多久。点击直接在当前窗口打开；子项<b>在新窗口打开</b>则另开一个窗口，适合对照两份笔记。</p>
  <p class="tip">首次从最近列表打开某个文件时，浏览器会请求一次访问授权，点允许即可，之后不再询问。若文件被移动或删除，会提示无法访问，该项可忽略。</p>`],

 ["备份策略","BEIFEN",`
  <p>三层保险，从近到远：浏览器本地自动保存是第一层，绑定的工作文件是第二层，把该文件放进 iCloud、Dropbox 或 OneDrive 的同步目录是第三层，顺带获得云端历史版本。</p>
  <p>重要节点建议手动<b>另存为</b>一个带日期的副本，比如 <i>notes-0410.json</i>，作为里程碑快照。</p>
  <p>本地存储已申请持久化权限，浏览器不会在磁盘紧张时自动清理这份数据，但仍不建议只依赖它。</p>`],

 ["合并导入","HEBINGDAORU",`
  <p>右键菜单的<b>合并导入…</b>把另一个 json 并入当前画布，不覆盖已有内容。</p>
  <p>并入的内容会整体放在现有内容右侧，间隔一百二十像素，保持其内部的相对布局、连线、编组和标签。所有编号会重新生成，因此不会和已有内容冲突，同一个文件重复并入也不会互相覆盖。</p>
  <p class="tip">适合把分散在多个小文件里的笔记逐步汇拢成一个总库，也适合从他人处接收片段。并入后按 <kbd>Ctrl/Cmd</kbd> + <kbd>Z</kbd> 可整体撤销。</p>`],

 ["编组","BIANZU",`
  <p>多选之后右键选择<b>编组</b>，或按 <kbd>Ctrl/Cmd</kbd> + <kbd>G</kbd>。编组后点击组内任意一张即选中整组，拖动时组内相对位置保持不变。</p>
  <p>取消编组用 <kbd>Shift</kbd> + <kbd>Ctrl/Cmd</kbd> + <kbd>G</kbd>，或从右键菜单选择。</p>
  <p class="tip">适合把一篇文献的图、摘要、评注绑在一起整体挪动。</p>`],

 ["标签","BIAOQIAN",`
  <p>两种录入方式，可以混用，系统会自动去重。</p>
  <ul>
    <li>在卡片正文里直接写 <b>#方法论</b>，自动识别，中英文都支持</li>
    <li>右键选<b>标签…</b>，在面板里输入，逗号或空格分隔</li>
  </ul>
  <p>标签面板下半部分列出画布上所有已有标签及使用次数，点击即可加减，避免同一概念出现多种写法。多选卡片时可批量打同一组标签。</p>
  <p>标签显示在文字下方，点击任意标签直接跳到该标签的检索结果。演示模式下自动隐藏。</p>
  <p class="tip">建议分两层用：主题词（#具身认知）靠正文顺手写，流程状态（#待读 #已精读）用面板批量改。</p>`],

 ["层级标题","CENGJI",`
  <p>右键菜单的<b>层级</b>可把卡片设为一级、二级、三级标题，默认是正文。设定后会自动套用一套排印规则：字号依次为基准的 2.1、1.55、1.22 倍，字重 700、600、500，字距递减。</p>
  <p>倍数相对<b>默认文字格式</b>里设的基准字号计算，改基准后重新点一次层级即可刷新。设完之后仍可单独微调，不会被覆盖。</p>
  <p>层级决定导出文档的标题结构和章节编号，是导出功能的骨架。</p>`],

 ["撤销与重做","CHEXIAO",`
  <p><kbd>Ctrl/Cmd</kbd> + <kbd>Z</kbd> 撤销，加 <kbd>Shift</kbd> 重做。保留最近 40 步。</p>
  <p class="tip">删除、批量对齐、统一图片尺寸这类一次影响很多卡片的操作都可以撤销，放心用。</p>`],

 ["导出","DAOCHU",`
  <p>右键菜单的<b>导出…</b>提供四种格式：</p>
  <ul>
    <li><b>Word</b>：真正的 docx，图片以二进制嵌入，标题映射到 Word 内置样式，导航窗格和自动目录可用</li>
    <li><b>PDF 文档</b>：与 Word 同结构，A4 排版，走打印窗口另存为 PDF，文字可选中可检索</li>
    <li><b>PDF 画面</b>：整块画布按当前布局渲染成整页图，保留连线和位置关系</li>
    <li><b>JPG</b>：同上但直接下载图片，可选 1x 到 3x 倍率</li>
  </ul>
  <p>文档类导出可勾选是否包含图片、标签、交叉引用、附录关系表。</p>
  <p class="tip">画面类导出的取景是所有卡片的外接矩形加留白，与当前视角无关，导出前不必调整视图。</p>`],

 ["导入","DAORU",`
  <p>右键菜单的<b>导入文件…</b>打开之前保存的 json，会替换当前画布内容。打开后建议立刻执行一次<b>另存为</b>重新绑定，之后才能继续自动写回。</p>
  <p>如果想保留当前内容并把另一个文件加进来，用<b>合并导入…</b>而不是这一项。</p>`],

 ["底色","DISE",`
  <p>右键菜单的<b>画布底色</b>提供七种。选深色时，界面面板和默认文字颜色会自动切换成浅色系，不需要手动调。</p>`],

 ["对齐与分布","DUIQI",`
  <p>选中两张以上卡片后，右键菜单出现<b>对齐与分布</b>：左对齐、水平居中、右对齐、顶对齐、垂直居中、底对齐，以及横向和纵向等距排列。</p>
  <p class="tip">导出前用等距排列把同一层级的卡片理成整齐的行或列，导出顺序会更符合预期。</p>`],

 ["大文件与性能","DAWENJIAN",`
  <p>程序按承载数千张卡片设计，采取了三项措施：</p>
  <ul>
    <li>只渲染视野内及周边一屏的卡片，其余不进入页面，卡片总数不影响流畅度</li>
    <li>连线同样只绘制视野内的，并且每帧最多重绘一次</li>
    <li>图片单独存放并按内容去重，画布数据本身只有几十 KB，同一张图重复使用不会多占空间</li>
  </ul>
  <p>因此可以放心把整个博士阶段的笔记放进一个文件。真正的上限来自图片总量，几百张图属于正常范围。</p>
  <p class="tip">若某天感觉迟滞，先看图片数量而非卡片数量，必要时用<b>导入图片尺寸</b>统一压缩显示尺寸，或把已完结的章节用部分导出拆成独立文件归档。</p>`],

 ["复制","FUZHI",`
  <p><kbd>Ctrl/Cmd</kbd> + <kbd>D</kbd> 复制选中卡片，副本偏移三十像素放置。锁定组内的卡片会被跳过。</p>`],

 ["工作模式","GONGZUOMOSHI",`
  <p>右键菜单勾选后，顶部常驻一条搜索条，适合做文献笔记时反复检索。这个开关随文件保存，下次打开保持。</p>
  <p>不开启时界面完全空白，需要搜索时按 <kbd>Ctrl/Cmd</kbd> + <kbd>F</kbd> 临时唤出。</p>`],

 ["交叉引用","JIAOCHAYINYONG",`
  <p>导出文档时勾选此项，每条连线都会在正文中生成对应的引用行：起点卡片下方出现「→ 参见 §2.1（摘要）」，终点卡片下方出现「← 来自 §1.3」。</p>
  <p>连线颜色被译成关系类型：灰为一般关联，红为对立，蓝为延伸，绿为印证。所以调线色时最好按语义而非按美观。</p>
  <p class="tip">画布是图结构，文档是线性结构。交叉引用让每条边在文中出现两次，从任意一处都能追下去，不打乱叙述顺序。</p>`],

 ["放大居中","JUJIAO",`
  <p>选中一张或多张卡片后按 <kbd>Z</kbd>，镜头框住整个选区，最大放到 100%，不会放过头。多选时按外接矩形取景，适合快速看清一组卡片的整体关系。</p>
  <p>再按一次 <kbd>Z</kbd> 即退回原来的视角和缩放，所以放大是零成本的动作，看完就回，不会打断原本的浏览位置。右键菜单里也有<b>放大居中</b>入口。</p>
  <p>编辑模式下点击卡片<b>不会</b>移动镜头。单击只做选中和起拖，双击只做文字编辑，镜头完全由你用 <kbd>Z</kbd> 控制。</p>
  <p class="tip">演示锁定模式是另一套逻辑：那里点击卡片会直接放大聚焦，双击空白处回总览，方向键逐个浏览。</p>`],

 ["框选","KUANGXUAN",`
  <p>空白处按住左键拖出选框，范围内卡片全部选中。按住 <kbd>Shift</kbd> 拖动则在已有选择上追加。</p>
  <p>可以和 <kbd>Shift</kbd> 点选混用：先框一片，再点掉不要的，或再框另一片加进来。锁定组会被自动跳过。</p>`],

 ["快捷键","KUAIJIEJIAN",`
  <ul>
    <li><kbd>Ctrl/Cmd</kbd> + <kbd>V</kbd> 粘贴图片　<kbd>Ctrl/Cmd</kbd> + <kbd>S</kbd> 保存</li>
    <li><kbd>Ctrl/Cmd</kbd> + <kbd>F</kbd> 搜索　<kbd>Ctrl/Cmd</kbd> + <kbd>A</kbd> 全选</li>
    <li><kbd>Ctrl/Cmd</kbd> + <kbd>Z</kbd> 撤销　<kbd>Ctrl/Cmd</kbd> + <kbd>D</kbd> 复制</li>
    <li><kbd>Ctrl/Cmd</kbd> + <kbd>G</kbd> 编组　加 <kbd>Shift</kbd> 取消编组</li>
    <li><kbd>T</kbd> 文字样式　<kbd>F</kbd> 适应画面　<kbd>0</kbd> 缩放归位</li>
    <li><kbd>Delete</kbd> 删除　<kbd>Esc</kbd> 取消选择或退出演示</li>
    <li>方向键微移一像素，加 <kbd>Shift</kbd> 移十像素</li>
  </ul>`],

 ["分级统一","FENJITONGYI",`
  <p>工具条第二行右侧用来统一某一层级的排印。做法是：先把一张卡片调成你想要的样子，再选择层级（正文 / H1 / H2 / H3），点<b>统一该层级</b>，画布上该层级的所有卡片一并采用这套字体、字号、字重、字距、行距和颜色。</p>
  <p><b>跳过手动调整过的</b>默认勾选。凡是你单独动过格式的卡片会被保护，不会被批量覆盖，适合保留特意做了标记或强调的那几张。取消勾选则是全部统一，无一例外。</p>
  <p>统一之后该层级的样式会被记住，之后新设为这个层级的卡片自动采用它；统一"正文"同时也决定新建卡片的起始格式。</p>
  <p class="tip">原先菜单里的默认文字格式已并入此处。想改新卡片的默认样式，就调好一张正文卡片然后统一正文层级。</p>`],

 ["局部文字格式","JUBUWENZI",`
  <p>选中一张卡片后，上方会浮出一条窄工具条。它作用于<b>你划选的那段文字</b>，而不是整个文字框。</p>
  <p>工具条从左到右依次是：</p>
  <ul>
    <li><b>B / I / U / S</b>：粗体、斜体、下划线、删除线，按钮会随光标位置亮起显示当前状态。编辑时也可用 <kbd>Ctrl/Cmd</kbd> + <kbd>B</kbd> / <kbd>I</kbd> / <kbd>U</kbd>，删除线为 <kbd>Ctrl/Cmd</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd></li>
    <li><b>字号</b>：点数字直接敲新值，回车生效，方向键上下微调；右侧小三角展开常用档位。它不会夺走文字选区，所以划选一段文字后再调字号，改的就是那一段</li>
    <li><b>文字颜色 / 荧光笔</b>：点色块即以当前颜色套用，右侧小三角展开色板换色。换过之后按钮记住新颜色，之后连续标记只需一击。荧光笔在同色文字上再点一次即取消</li>
    <li><b>清除</b>：去掉划选部分的全部格式，包括粗斜体、下划线、颜色、字号和底色</li>
  </ul>
  <p>双击进入编辑后划选文字再点按钮，只改那一段。如果没有划选任何文字，粗体、斜体、字号、颜色会退回作用于整张卡片，等同于文字样式面板；高亮则必须划选，因为整框高亮没有意义。</p>
  <p>这些局部格式会写进导出的 Word 和 PDF 文档：粗斜体、下划线、颜色、字号都保留，高亮会映射到 Word 内置的荧光笔颜色。</p>
  <p><b>撤销</b>：编辑状态下按 <kbd>Ctrl/Cmd</kbd> + <kbd>Z</kbd> 可逐步回退加粗、高亮、改色、改字号等每一次操作，再按 <kbd>Shift</kbd> 组合可重做。退出编辑后，同样的快捷键回退的是卡片级别的改动。</p>
  <p>编辑时还可以直接用 <kbd>Ctrl/Cmd</kbd> + <kbd>B</kbd> / <kbd>I</kbd> / <kbd>U</kbd> 加粗、斜体、下划线。</p>
  <p><b>卡片底色</b>在工具栏上有独立控件（段落图标右侧的小方块）：点方块直接以当前颜色套用，右侧小三角展开色板换色，换过之后按钮记住新颜色，连续标记只需一击，支持多选批量。给整张卡片铺一层底色，用来区分内容类别，比如引文一种颜色、评注另一种。十三种可选，除纯白和深色外都是半透明的极淡色（透明度 3% 到 10%），叠在任何画布底色上都不抢眼。它与荧光笔和文字颜色是三个层次——文字颜色改字本身，荧光笔标记局部字句，卡片底色标识整张卡片的性质。底色会跟随导出到 Word 与 PDF 文档。</p>
  <p class="tip">工具条可在右键菜单的<b>文字工具条</b>关闭。粘贴进卡片的内容一律转为纯文本，不会把网页的杂乱格式带进来。</p>`],

 ["卡片模板","KAPIANMUBAN",`
  <p>把一张调好的卡片存成模板，之后一键复用。模板记住的是：<b>字体、字号、字重、字距、行距、对齐、文字颜色、卡片底色、卡片宽度</b>，不记内容。</p>
  <p>如果你的格式是用划选文字的方式设的（存在正文内部而非卡片属性里），存模板时也会被识别并吸收。套用模板时会清掉正文里的局部字体、字号、颜色，让模板真正生效，加粗、斜体、高亮这类标记则保留。</p>
  <p><b>保存</b>：选中一张卡片，右键 → 卡片模板 → 存为模板，填个名字即可，比如"报告正文""引文块""批注"。</p>
  <p><b>一键套用</b>：工具栏上有一个模板按钮，显示当前模板名，选中一张或多张卡片后点它即可套用；右侧小三角展开列表换模板，也可以从那里直接存新模板。</p>
  <p><b>右键菜单</b>：右键 → 卡片模板 → 选中某个模板，有三种用法。<b>套用到选中卡片</b>支持多选，一次统一一批；<b>用它新建卡片</b>直接在视野中央生成一张空白卡并进入编辑；<b>设为新建卡片默认</b>让之后所有新卡片都采用这套格式。</p>
  <p><b>存在哪里</b>：保存时可选两处。<b>本文件</b>随画布文件一起走，导出 json 时带着，换电脑打开或发给别人都在，适合这个项目专用的格式。<b>通用</b>存在浏览器本地，所有文件共享，但不会跟着文件走，适合你个人长期的排版习惯。同一套模板可以两处都存一份。</p>
  <p class="tip">和分级统一的分工：分级统一按层级批量刷格式，适合整理已有内容；模板是预设，适合新建内容时保持一致。</p>`],

 ["链接","LIANJIE",`
  <p>每张卡片可以挂一个来源链接。右键选<b>添加链接</b>，粘贴网址即可。卡片左下角出现一个小圆圈箭头图标，点它在新标签页打开，鼠标悬停显示完整网址。图标是固定尺寸的，画布缩放时不会跟着变大变小。</p>
  <p>三种形式都认：PDF 的直接网址、Google Scholar 的条目链接、以及直接粘贴的 DOI（会自动补成 doi.org 链接）。没写 https 前缀也会自动补全。</p>
  <p>链接内容纳入全文检索，所以可以直接搜域名找回某个来源，比如输入 scholar 就能筛出所有来自 Google Scholar 的条目。</p>
  <p>导出 Word 和 PDF 文档时，链接会作为可点击的超链接附在该段之后。分身共享源的链接。演示模式下链接依然可点，方便当场打开原文。</p>
  <p class="tip">建议配合标签使用：链接解决"去哪里找原文"，标签解决"这是什么类型的材料"。</p>`],

 ["分身","FENSHEN",`
  <p>分身不是复制，而是<b>同一条内容在多处出现</b>。内容只有一个源，分身是它的投影：文字和图片共享，位置、尺寸、字号各自独立。改任意一处的文字，所有位置同步更新。</p>
  <p><b>用途</b>：想法之间距离太远时，与其拉一条横跨画布的连线，不如在需要的地方放一个分身。既保持了上下文，又不会让连线变成乱麻。</p>
  <p><b>创建与放置</b>：选中卡片后右键<b>把分身放入剪贴板</b>（或按 Ctrl/Cmd + Shift + C），然后移动到目标位置，在空白处右键<b>在此处粘贴分身</b>（或 Ctrl/Cmd + Shift + V 粘贴在鼠标处）。跨多少距离都不用拖动。多选时相对位置会保持。</p>
  <p>另有<b>移动到…</b>可以直接把选中卡片送到某个页面或视野中央，由程序在该页面里找一块空位放置，页面装不下会自动撑高。</p>
  <p><b>串联与溯源</b>：有分身的卡片右上角出现菱形标记，写着「2/4」表示这是四处出现中的第二处。点标记跳到下一处，按住 <kbd>Shift</kbd> 点跳回源头，右键标记打开分身菜单，可以一次选中全部出现位置。顺着标记点下去，就能走完一条信息在画布上的完整轨迹。</p>
  <p><b>与检索的关系</b>：分身共享源的文字和标签，所以天然进入检索结果。回车逐个跳转时，跳的是这条信息的所有出现位置。菜单里的<b>检索时合并分身</b>可以切换：关注内容时合并成一条，巡视位置时展开为多条。</p>
  <p><b>与导出的关系</b>：分身不重复正文，而是在它所在的位置生成一行「同一条目，另见 §2.1」，接入交叉引用体系；编号也只算源，同一段不会被编两次号。</p>
  <p><b>脱离</b>：右键分身选<b>脱离为独立卡片</b>，它会就地固化成一张普通卡片，此后与源各改各的。删除源时，第一个分身会自动继承内容成为新的源，内容不会丢。</p>
  <p class="tip">分身和编组、页面互不冲突：编组管一起移动，页面管输出单元，分身管同一内容的多处呈现。</p>`],

 ["存档与长期保存","CUNDANG",`

  <p><b>与分级标题的关系</b>：两者分工。页面负责顶层切分，标题负责页面内部的层级，编号仍然只由标题决定，页面不参与编号，避免两套层级打架。</p>
  <p class="tip">页面和编组不重复：编组回答"这些要一起移动"，是编辑期的便利；页面回答"这些属于同一个输出单元"，是产出期的结构。一个页面里可以有多个编组。</p>`],

 ["连线备注","LIANXIANBEIZHU",`

 ["连线","LIANXIAN",`

function manSorted(){return [...MANUAL].sort((a,b)=>a[1].localeCompare(b[1]))}
function openManual(){
  const box=$("man"),side=$("manside");
  side.innerHTML="";
  let letter="";
  manSorted().forEach(([term,py],i)=>{
    if(py[0]!==letter){letter=py[0];
      const h=document.createElement("div");h.className="ltr";h.textContent=letter;side.appendChild(h)}
    const b=document.createElement("button");
    b.innerHTML=term+'<i>'+py.toLowerCase()+'</i>';
    b.dataset.i=i;
    b.onclick=()=>showManual(i);
    side.appendChild(b);
  });
  box.classList.add("on");
  showManual(0);
}
function showManual(i){
  const list=manSorted(),it=list[i];if(!it)return;
  $("manbody").innerHTML=`<h3>${it[0]}</h3><div class="py">${it[1].toLowerCase()}</div>${it[2]}`;
  $("manbody").scrollTop=0;
  $("manside").querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
}
$("manx").onclick=()=>$("man").classList.remove("on");
$("man").addEventListener("pointerdown",e=>{if(e.target.id==="man")$("man").classList.remove("on")});

/* ================= ZIP 打包（无压缩，纯自写，不依赖任何库） ================= */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}
  return t})();
function crc32(u8){let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0}
const enc=new TextEncoder();
function dosTime(d){
  return {t:((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()/2))&0xFFFF,
          d:(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF};
}
function zipMake(files){
  const now=dosTime(new Date()),parts=[],central=[];
  let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name);
    const data=typeof f.data==="string"?enc.encode(f.data):f.data;
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true);lh.setUint16(10,now.t,true);lh.setUint16(12,now.d,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,now.t,true);ch.setUint16(14,now.d,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length;
  });
  let cdSize=0;central.forEach(x=>cdSize+=x.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);
  end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/zip"});
}
function dataURLtoBytes(u){
  const i=u.indexOf(",");const b=atob(u.slice(i+1));
  const out=new Uint8Array(b.length);

const RELMAP={"#8A8A85":"relPlain","#111111":"relPlain","#EFEFEC":"relPlain",
  "#C0392B":"relAgainst","#2D6CDF":"relCite","#1F8A70":"relSupport"};
function snippet(c0,n){
  const c=orig(c0);

  if(!s)return srcOf(c)?"[image]":"[empty]";
  return s.length>(n||28)?s.slice(0,n||28)+"…":s;

function band(cs){
  const rows=[],tol=70;
  [...cs].sort((a,b)=>a.y-b.y||a.x-b.x).forEach(c=>{
    const r=rows.find(r=>Math.abs(r.y-c.y)<tol);
    if(r){r.items.push(c);r.y=Math.min(r.y,c.y)}else rows.push({y:c.y,items:[c]})});
  rows.sort((a,b)=>a.y-b.y);
  return rows.flatMap(r=>r.items.sort((a,b)=>a.x-b.x));
}
function columns(cs){
  // 按横向间隙聚成列，列内从上到下，列间从左到右
  const sorted=[...cs].sort((a,b)=>a.x-b.x),cols=[],GAP=90;
  sorted.forEach(c=>{
    const col=cols.find(k=>c.x<=k.right+GAP);
    if(col){col.items.push(c);col.right=Math.max(col.right,c.x+c.w)}
    else cols.push({left:c.x,right:c.x+c.w,items:[c]});
  });
  cols.sort((a,b)=>a.left-b.left);
  return cols.flatMap(k=>k.items.sort((a,b)=>a.y-b.y||a.x-b.x));
}
function colCount(cs){
  const sorted=[...cs].sort((a,b)=>a.x-b.x),cols=[],GAP=90;
  sorted.forEach(c=>{const col=cols.find(k=>c.x<=k.right+GAP);
    if(col)col.right=Math.max(col.right,c.x+c.w);else cols.push({right:c.x+c.w,n:0})});
  return cols.length;
}
function flow(cs){
  if(!cs.length)return [];
  const m=S.readOrder||"auto";
  if(m==="col")return columns(cs);
  if(m==="row")return band(cs);
  const n=colCount(cs);                       // 自动判断：分出多列且每列不止一张，按列读
  return (n>=2&&cs.length/n>=2)?columns(cs):band(cs);
}
function docOrder(list){
  const all=list||S.cards;
  const main=all.filter(c=>c.role!=="apx"),apx=all.filter(c=>c.role==="apx");
  const frames=(S.frames||[]).slice().sort((a,b)=>
    S.readOrder==="row"?(a.y-b.y||a.x-b.x):(a.x-b.x||a.y-b.y));
  const seq=[];
  frames.forEach(f=>{
    const inside=main.filter(c=>frameOf(c)===f);
    if(inside.length)seq.push(...flow(inside));
  });
  seq.push(...flow(main.filter(c=>!frameOf(c))));
  return [...seq,...flow(apx)];
}
function buildTree(list){
  const order=docOrder(list),stack=[],roots=[];
  order.forEach(c=>{
    const apx=c.role==="apx",aside=c.role==="aside";
    const isRef=!!c.ref;
    const lv=(aside||isRef)?0:(apx?1:(c.level||0));
    const node={c,lv,apx,aside,isRef,children:[],num:"",sec:""};
    if(lv===0){const p=stack[stack.length-1];(p?p.node.children:roots).push(node);node.parent=p?p.node:null}
    else{
      while(stack.length&&stack[stack.length-1].lv>=lv)stack.pop();
      const p=stack[stack.length-1];(p?p.node.children:roots).push(node);
      node.parent=p?p.node:null;stack.push({lv,node});
    }
  });
  const counters=[0,0,0];let apxN=0;
  const walk=(list)=>list.forEach(n=>{
    if(n.apx){apxN++;n.num=String.fromCharCode(64+apxN);n.sec=n.num;counters[1]=counters[2]=0}
    else if(n.lv){counters[n.lv-1]++;for(let i=n.lv;i<3;i++)counters[i]=0;
      n.num=counters.slice(0,n.lv).join(".");n.sec=n.num}
    else n.sec=n.parent?n.parent.sec:"";
    walk(n.children);
  });
  walk(roots);
  const flat=[];const flatten=l=>l.forEach(n=>{flat.push(n);flatten(n.children)});flatten(roots);
  const byId={};flat.forEach(n=>{byId[n.c.id]=n;
    if(!n.isRef&&!byId[orig(n.c).id])byId[orig(n.c).id]=n});
  return {roots,flat,byId};
}
function secTag(n){
  if(!n)return "";

    if(l.b===id&&byId[l.a])inn.push({n:byId[l.a],l});
  });
  return {out,inn};
}

function hex6(col){
  if(!col)return null;
  const m=col.match(/rgba?\(([^)]+)\)/);
  if(m){const p=m[1].split(",").map(x=>parseFloat(x));
    if(p.length>3&&p[3]===0)return null;
    return p.slice(0,3).map(x=>Math.round(x).toString(16).padStart(2,"0")).join("")}

function nearestHL(h){
  if(!h)return null;
  const to=x=>[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];
  const a=to(h);let best=null,bd=1e9;
  HLMAP.forEach(([k,name])=>{const b=to(k);
    const d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
    if(d<bd){bd=d;best=name}});
  return bd<24000?best:"yellow";
}
function richRuns(html){
  const box=document.createElement("div");box.innerHTML=html||"";
  const out=[];
  const walk=(node,st)=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){if(n.nodeValue)out.push({...st,text:n.nodeValue});return}
      if(n.nodeType!==1)return;
      if(n.tagName==="BR"){out.push({...st,text:"\n"});return}
      const cs=n.style||{},s2={...st},tag=n.tagName;
      if(tag==="B"||tag==="STRONG"||cs.fontWeight==="bold"||+cs.fontWeight>=600)s2.bold=true;
      if(tag==="I"||tag==="EM"||cs.fontStyle==="italic")s2.italics=true;
      if(tag==="U"||(cs.textDecoration||"").includes("underline"))s2.underline={};
      if(tag==="S"||tag==="STRIKE"||tag==="DEL"||(cs.textDecoration||"").includes("line-through"))s2.strike=true;
      const col=hex6(cs.color);if(col)s2.color=col;
      const bg=hex6(cs.backgroundColor);
      if(bg)s2.highlight=nearestHL(bg);else if(cs.backgroundColor==="transparent")delete s2.highlight;
      const fs=parseFloat(cs.fontSize);if(fs)s2.size=Math.round(fs*1.5);
      walk(n,s2);
    });
  };
  walk(box,{});
  return out;
}
function paraFrom(c,D,extra){
  const {Paragraph,TextRun}=D;

  const runs=richRuns(c.rich);
  if(!runs.length)return null;
  const paras=[];let cur=[];
  runs.forEach(r=>{
    r.text.split("\n").forEach((piece,i)=>{
      if(i){paras.push(cur);cur=[]}
      if(piece)cur.push(new TextRun({...r,text:piece}));
    });
  });
  if(cur.length)paras.push(cur);
  return paras.filter(p=>p.length).map(p=>new Paragraph({children:p,...(extra||{})}));
}

function selHTML(r,cap){

  if(n.nodeType===3)n=n.parentNode;

    if(["SPAN","A","B","I","U","S","STRIKE","DEL","STRONG","EM","FONT"].includes(n.tagName))chain.push(n);

function wrapSelWith(css){

    arr.forEach(tpl=>list.push({label:tpl.name,sub:[
      {head:tpl.name},
      {label:t("tplApply"),on:()=>applyTemplate(tpl)},
      {label:t("tplNew"),on:()=>newFromTemplate(tpl,p||toW(innerWidth/2,innerHeight/2))},
      {label:t("tplDefault"),on:()=>{S.textDef={...S.textDef,...tpl.s};save();toast(t("tplIsDefault"))}},
      "-",
      {label:t("tplDel"),danger:true,on:()=>delTemplate(tpl,global)}
    ]}));
  };
  section(mine,t("tplInFile"),false);
  section(all,t("tplGlobal"),true);
  if(!mine.length&&!all.length&&!sel.length)list.push({label:t("tplEmpty")});
  return list;
}
function setCardBg(v){

function afterInline(){

function cmd(name){
  if(!ensureSel()){                                 // 没划选就作用于整张卡片
    const c=barCard();if(!c)return;
    const cur={...DEF,...S.textDef,...(c.s||{})};
    cardSnapStyle(()=>{
      if(name==="bold")setStyle("weight",+cur.weight>=600?400:700);
      if(name==="italic")setStyle("italic",!cur.italic);
      if(name==="underline")toast(t("needTextSel"));
    });

function selBg(){
  const r=textSel();if(!r)return null;
  let n=r.startContainer;if(n.nodeType===3)n=n.parentNode;
  const cap=n.closest?n.closest(".cap"):null;
  while(n&&n!==cap){
    const bg=getComputedStyle(n).backgroundColor;
    const h=hex6(bg);
    if(h&&!/rgba\(0, 0, 0, 0\)/.test(bg))return h;
    n=n.parentNode;
  }
  return null;
}
function setHighlight(v){

  document.execCommand("hiliteColor",false,v==="none"?"transparent":v);
  afterInline();

function alSvg(v){
  return `<svg width="14" height="11" viewBox="0 0 14 11" fill="currentColor">`+
    [13,8,11].map((w,i)=>{const x=v==="left"?0:v==="right"?14-w:(14-w)/2;
      return `<rect x="${x}" y="${i*4.2}" width="${w}" height="1.7" rx=".8"/>`}).join("")+`</svg>`;
}
function closePops(){
  const b=$("bar");if(!b)return;
  b.querySelectorAll(".pp.on").forEach(p=>p.classList.remove("on"));
  b.querySelectorAll(".ctl.on").forEach(x=>{if(x.querySelector(".car"))x.classList.remove("on")});
  b.classList.remove("open");
}
const lastInk=()=>S.lastInk||INK[0];
const lastBg=()=>S.lastBg||CARDBG[2];
const lastHL=()=>S.lastHL||HLS[0];
function curInk(){
  const r=textSel()||(validRange()?keepRange:null);
  if(r){let n=r.startContainer;if(n.nodeType===3)n=n.parentNode;
    const h=hex6(getComputedStyle(n).color);if(h)return "#"+h}
  const c=barCard();
  return c?({...DEF,...S.textDef,...(c.s||{})}).color:DEF.color;
}
function curFamily(){
  const c=barCard();if(!c)return DEF.family;
  const r=textSel()||(validRange()?keepRange:null);
  if(r){
    let n=r.startContainer;if(n.nodeType===3)n=n.parentNode;
    const ff=getComputedStyle(n).fontFamily;
    const first=x=>(x||"").split(",")[0].replace(/["']/g,"").trim();
    const hit=FONTS.find(f=>first(ff)===first(f[1]));
    if(hit)return hit[0];
  }
  return ({...DEF,...S.textDef,...(c.s||{})}).family;
}
function unifyLevel(lv,excludeManual){
  const c=barCard();if(!c)return;
  const st={...DEF,...S.textDef,...(c.s||{})};
  snap();
  S.lvStyle=S.lvStyle||{};
  S.lvStyle[lv]={...st};
  if(lv===0)S.textDef={...S.textDef,...st};
  let n=0;
  S.cards.forEach(z=>{
    if(isLocked(z.id))return;
    const zl=z.role?0:(z.level||0);
    if(zl!==lv)return;
    if(excludeManual&&z.sMan&&z.id!==c.id)return;
    z.s={...st};z.sMan=false;n++;
  });
  render();save();
  toast(t("unifyDone")+" "+n);
}
function syncBar(){
  const b=$("bar"),c=barCard();
  if(lock||!c||S.bar===false){b.classList.remove("on");closePops();return}
  if(!b.children.length)buildBar();
  const els=sel.map(id=>nodes.get(id)).filter(Boolean);
  if(!els.length){b.classList.remove("on");return}
  const rs=els.map(e=>e.getBoundingClientRect());
  const r={left:Math.min(...rs.map(z=>z.left)),right:Math.max(...rs.map(z=>z.right)),
    top:Math.min(...rs.map(z=>z.top))};
  r.width=r.right-r.left;
  b.classList.add("on");
  const bw=b.offsetWidth||300;
  b.style.left=clamp(r.left+r.width/2-bw/2,8,innerWidth-bw-8)+"px";
  // 始终贴在卡片上沿之上；上方空间不足时钉在视口顶部，不跟随卡片下沿浮动，
  // 否则改字号导致卡片变高时工具条会在指针下方乱跳
  const top=r.top-b.offsetHeight-12;
  b.style.top=(top<8?8:top)+"px";
  const szi=b.querySelector("#szi");
  const cs2=curSize();
  if(szi&&!sizeEdit)szi.textContent=cs2;
  const st={...DEF,...S.textDef,...(c.s||{})};
  const fb=b.querySelector("#fbtn");
  if(fb)fb.textContent=famName(curFamily());
  const isw=b.querySelector("#inksw");
  if(isw)isw.style.background=lastInk();
  const hsw=b.querySelector("#hlsw");
  if(hsw)hsw.style.background=lastHL();
  const bsw=b.querySelector("#bgsw");
  if(bsw){bsw.style.background=lastBg();
    bsw.classList.toggle("act",!!(c&&c.bg))}
  const tl=b.querySelector("#tpllab");
  if(tl){const tp=curTpl();
    const nm=tp?tp.name:t("tplShort");
    tl.textContent=nm.length>8?nm.slice(0,8)+"\u2026":nm;
    const mb=b.querySelector(".tplbtn");if(mb)mb.style.opacity=tp?"":"0.5";}
  const par=b.querySelector("#parlab");
  if(par)par.innerHTML=alSvg(st.align||"left");
  try{
    b.querySelector('[data-k="b"]').classList.toggle("on",document.queryCommandState("bold"));
    b.querySelector('[data-k="i"]').classList.toggle("on",document.queryCommandState("italic"));
    b.querySelector('[data-k="u"]').classList.toggle("on",document.queryCommandState("underline"));
    b.querySelector('[data-k="s"]').classList.toggle("on",document.queryCommandState("strikeThrough"));
  }catch(e){}
}

/* ================= tags ================= */
const TAGRE=/#([\p{L}\p{N}_\-]{1,40})/gu;
function cardTags(c0){
  const c=orig(c0);
  const out=new Set((c.tags||[]).map(x=>x.toLowerCase()));
  (c.text||"").replace(TAGRE,(m,g)=>{out.add(g.toLowerCase());return m});
  return [...out];
}

let hits=[],hitIdx=-1;
function findQ(){return $("findq").value.trim().toLowerCase()}
function showFind(on){
  const f=$("find");
  if(on){f.classList.add("on");syncFindMode();$("findq").focus();$("findq").select()}
  else{f.classList.remove("on");$("findq").value="";runFind()}
  if(!on&&S.work&&!lock){f.classList.add("on")}
}
function syncFindMode(){
  $("findm").textContent=S.findMode==="tag"?t("modeTag"):t("modeAll");
  $("findq").placeholder=S.findMode==="tag"?t("searchTagPh"):t("searchPh");
}
$("findm").onclick=()=>{S.findMode=S.findMode==="tag"?"all":"tag";syncFindMode();runFind();save();$("findq").focus()};
function runFind(){
  const q=findQ().replace(/^#/,"");
  hits=!q?[]:S.cards.filter(c=>S.findMode==="tag"
    ? cardTags(c).some(x=>x.includes(q))
    : ((orig(c).text||"").toLowerCase().includes(q)||(orig(c).url||"").toLowerCase().includes(q)
       ||cardTags(c).some(x=>x.includes(q))));
  if(S.findMerge){                       // 合并同一内容，只保留源或第一处
    const seen=new Set();
    hits=hits.filter(c=>{const k=orig(c).id;if(seen.has(k))return false;seen.add(k);return true});
  }
  if(!hits.some(c=>c===S.cards[hitIdx]))hitIdx=-1;
  document.body.classList.toggle("finding",!!q);
  paintFind();
  $("findn").textContent=q?(hits.length?(Math.max(0,hits.indexOf(S.cards[hitIdx]))+1)+" / "+hits.length:t("noHit")):"";
}
function paintFind(){
  const q=findQ(),ids=hits.map(c=>c.id);
  document.querySelectorAll(".card").forEach(el=>{
    const on=ids.includes(el.dataset.id);
    el.classList.toggle("hit",!!q&&on);
    el.classList.toggle("nomatch",!!q&&!on);
  });
}
function stepHit(d){
  if(!hits.length)return;
  let i=hits.indexOf(S.cards[hitIdx]);
  i=(i+d+hits.length*2)%hits.length;
  const c=hits[i];hitIdx=S.cards.indexOf(c);
  sel=[c.id];paintSel();focusCard(c);runFind();
}
$("findq").addEventListener("input",runFind);
$("findq").addEventListener("keydown",e=>{
  e.stopPropagation();
  if(e.key==="Enter"){e.preventDefault();if(hits.length&&hitIdx<0)hitIdx=S.cards.indexOf(hits[0]),focusCard(hits[0]),sel=[hits[0].id],paintSel(),runFind();
    else stepHit(e.shiftKey?-1:1)}
  if(e.key==="Escape"){e.preventDefault();$("findq").value="";runFind();
    if(!S.work)showFind(false);else $("findq").blur()}
});
$("findx").onclick=()=>{$("findq").value="";runFind();if(!S.work)showFind(false)};

// ---- 多级菜单：每一层有自己的元素，深层不会顶掉浅层 ----
const MEXTRA={};
const MAXLV=8;
let owners=[],subT;
function levelEl(i){
  if(i===0)return $("menu");
  if(i===1)return $("submenu");
  if(!MEXTRA[i]){const d=document.createElement("div");d.className="menu";document.body.appendChild(d);MEXTRA[i]=d}
  return MEXTRA[i];
}
function levelOpen(i){const e=(i===0)?$("menu"):(i===1?$("submenu"):MEXTRA[i]);
  return e&&e.classList.contains("on")?e:null}
function closeFrom(i){
  clearTimeout(subT);
  for(let k=MAXLV;k>=i;k--){
    const e=(k===0)?$("menu"):(k===1?$("submenu"):MEXTRA[k]);
    if(e)e.classList.remove("on");
    owners[k]=null;
  }
  for(let k=0;k<i;k++){
    const e=levelOpen(k);
    if(e)e.querySelectorAll(".mi.open").forEach(b=>{
      if(!owners[k+1]||b!==owners[k+1].btn)b.classList.remove("open")});
  }
}
function closeMenus(){closeFrom(0)}
function keepSub(){clearTimeout(subT)}
const inBox=(x,y,r,p)=>x>=r.left-p&&x<=r.right+p&&y>=r.top-p&&y<=r.bottom+p;
// 用指针坐标判断，而不是依赖 mouseenter / mouseleave
addEventListener("pointermove",e=>{
  if(!levelOpen(1))return;
  let inside=false,deepest=0;
  for(let k=0;k<=MAXLV;k++){
    const el=levelOpen(k);if(!el)continue;
    deepest=k;
    if(inBox(e.clientX,e.clientY,el.getBoundingClientRect(),8)){inside=true;break}
    const o=owners[k];
    if(o){                                   // 父项与本层之间的通道
      const r=el.getBoundingClientRect();
      const bridge={left:Math.min(o.rect.right,r.left)-16,right:Math.max(o.rect.right,r.left)+16,
        top:Math.min(o.rect.top,r.top)-12,bottom:Math.max(o.rect.bottom,r.bottom)+12};
      if(inBox(e.clientX,e.clientY,bridge,0)){inside=true;break}
    }
  }
  if(inside)keepSub();else{clearTimeout(subT);subT=setTimeout(()=>closeFrom(1),320)}
},true);
function place(el,x,y){
  el.classList.add("on");el.style.left="0px";el.style.top="0px";el.scrollTop=0;
  const r=el.getBoundingClientRect();
  el.style.left=Math.max(6,Math.min(x,innerWidth-r.width-8))+"px";
  el.style.top=Math.max(6,Math.min(y,innerHeight-r.height-8))+"px";
}
function build(el,items,level){
  const lv=level||0;
  el.innerHTML="";
  items.forEach(it=>{
    if(it==="-"){const d=document.createElement("div");d.className="msep";el.appendChild(d);return}
    if(it.head){const d=document.createElement("div");d.className="mhd";d.textContent=it.head;el.appendChild(d);return}
    const b=document.createElement("button");b.className="mi"+(it.danger?" dz":"");
    b.innerHTML=`<span>${it.check?"✓ ":""}${it.label}</span>`+(it.key?`<span class="k">${it.key}</span>`:"")+(it.sub?`<span class="k">›</span>`:"");
    if(it.sub&&it.sub.length){
      const open=()=>{
        keepSub();
        if(owners[lv+1]&&owners[lv+1].btn===b&&levelOpen(lv+1))return;
        closeFrom(lv+1);
        el.querySelectorAll(".mi.open").forEach(z=>z.classList.remove("open"));
        b.classList.add("open");
        const r=b.getBoundingClientRect();
        const child=levelEl(lv+1);
        build(child,it.sub,lv+1);
        place(child,r.right+2,r.top-6);
        let cr=child.getBoundingClientRect();
        if(cr.right>innerWidth-6)place(child,Math.max(6,r.left-cr.width-2),r.top-6);
        owners[lv+1]={btn:b,rect:b.getBoundingClientRect()};
      };
      b.onmouseenter=open;
      b.onclick=e=>{e.stopPropagation();open()};
    }else{
      b.onmouseenter=()=>{keepSub();closeFrom(lv+1)};
      b.onclick=()=>{closeMenus();it.on&&it.on()};
    }
    el.appendChild(b);
  });
}

  const c=targets()[0];return {...DEF,...S.textDef,...(c?.s||{})}}
function applyCardStyle(c){
  const el=nodes.get(c.id);if(!el)return;
  if(c.bg){el.style.background=c.bg;el.style.padding="14px";el.style.borderRadius="3px"}
  else{el.style.background="";el.style.padding="";el.style.borderRadius=""}
  const cap=el.querySelector(".cap");if(!cap)return;
  const s={...DEF,...S.textDef,...(c.s||{})};
  Object.assign(cap.style,{fontFamily:famCSS(s.family),fontSize:s.size+"px",fontWeight:s.weight,
    lineHeight:s.lh,letterSpacing:s.spacing+"em",textAlign:s.align,color:s.color,
    fontStyle:s.italic?"italic":"normal"});
  const lb=el.querySelector(".lvl");if(lb)lb.style.color=s.color;
  const tw=el.querySelector(".tags");
  if(tw){tw.style.color=s.color;tw.style.fontSize=Math.max(9,s.size*.78)+"px"}
}
function setStyle(k,v){
  if(styleMode==="default"){S.textDef={...DEF,...S.textDef,[k]:v};render();save();return}
  const cs=targets().filter(c=>!isLocked(c.id));
  if(!cs.length)return;
  cs.forEach(c=>{c.s={...DEF,...S.textDef,...(c.s||{})};c.s[k]=v;c.sMan=true;applyCardStyle(c)});
  measure();drawLinksSoon();save();
}
addEventListener("pointerdown",e=>{
  if(!e.target.closest("#pop")&&!e.target.closest("#menu")&&!e.target.closest("#submenu"))
    $("pop").classList.remove("on");
  if(!e.target.closest("#bar")){endSizeEdit(false);closePops()}
  else if(!e.target.closest("#szi"))endSizeEdit(false);
},true);

/* ================= import ================= */
function readJSON(f,merge){
  const r=new FileReader();
  r.onerror=()=>alert(t("badFile")+"\n"+t("errRead"));
  r.onload=async()=>{
    let d;
    try{d=JSON.parse(r.result)}
    catch(err){alert(t("badFile")+"\n"+t("errParse"));return}
    if(!d||!Array.isArray(d.cards)){alert(t("badFile")+"\n"+t("errShape"));return}
    let stage="snapshot",n=0;
    try{
      snap();
      stage="absorb";      n=await absorb(d,merge);
      stage="select";      sel=[];selLink=null;
      if(!merge){LANG=S.lang||LANG;fileName=f.name;fileHandle=null;fileOK=false}
      stage="render";      render();
      stage="fit";         fit(true);
      stage="save";        save();
      toast((merge?t("mergedIn"):t("savedTo"))+" "+n);
    }catch(err){
      console.error("import failed at stage: "+stage,err);
      const frame=((err&&err.stack)||"").split("\n").slice(0,4).join("\n");
      alert(t("errImport")+"\n["+stage+"] "+((err&&err.message)||err)+"\n\n"+frame);
      try{render()}catch(e){}
    }
  };
  r.readAsText(f);
}
$("jsonfile").onchange=e=>{const f=e.target.files[0];if(f)readJSON(f,false);e.target.value=""};
$("mergefile").onchange=e=>{const f=e.target.files[0];if(f)readJSON(f,true);e.target.value=""};

/* ================= boot ================= */
(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  const saved=await loadState();
  if(saved&&saved.cards){S={...S,...migrate(saved)};S.links=S.links||[];S.groups=S.groups||[];S.frames=S.frames||[];
    if(!S.lvMigrated){S.linkView="all";S.lvMigrated=true}
    S.linkDef={...DEFLINK,...(saved.linkDef||{})};S.textDef={...DEF,...(saved.textDef||{})}}
  LANG=S.lang||"en";
  await migrateInline(S.cards);
  await loadImgs(S.cards);
  try{const h=await kvGet(FH);
    if(h){fileHandle=h;fileName=h.name;
      if(h.queryPermission){const p=await h.queryPermission({mode:"readwrite"});fileOK=(p==="granted")}}}catch(e){}
  await loadRecents();
  await loadGlobalTpl();
  await loadBackups();
  const wantOpen=QS.get("open");
  if(wantOpen)setTimeout(()=>openRecent(wantOpen).catch(()=>toast(t("noPerm"))),300);
  applyCam();render();
  if(S.work&&!lock)$("find").classList.add("on");
  syncFindMode();refreshTagList();
  if(S.cards.length)fit(true);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measure();drawLinks()});
  setTimeout(()=>{measure();drawLinks()},800);
})();
</script>
