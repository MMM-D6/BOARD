 ["结构连线","JIEGOULIANXIAN",`
  <p>连线有两种含义，右键某条连线，在<b>这条连线的含义</b>里切换：</p>
  <ul>
    <li><b>结构</b>：指向的是下级。这类连线决定文档大纲，画成实线、略粗、颜色更实。</li>
    <li><b>关联</b>：两者只是相关。这类连线不参与层级，画成虚线、略淡，导出时作为交叉引用出现。</li>
  </ul>
  <p>之所以要明确标记而不是靠样式约定，是因为这两者的语义完全不同：一个决定文档骨架，一个是横向参照。靠看线的样子去猜迟早会混。</p>
  <p>虚实由连线的身份决定，没有手动开关：<b>结构连线一律实线，关联连线一律虚线</b>。线型、粗细、箭头、颜色仍可自行设定。</p>
  <p>只有横跨大半个屏幕的超长连线例外，会退化为实线并大幅调淡，因为超长虚线的绘制代价极高。日常范围内的连线都是虚线，画布缩小后即使跨度大也会恢复虚线。</p>
  <p><b>大纲跟随连线</b>：只要画布上存在结构连线，编号和导出层级就由连线的树形关系决定，而不再依赖卡片的空间位置。所以你可以随意挪动卡片，编号不会乱。同级之间按位置从上到下、从左到右排序。</p>
  <p><b>方向由标题层级决定，不看你怎么画的</b>：一级标题永远是上级，二级在它之下，以此类推；没有标层级的卡片永远是末端内容。所以连线时完全不用管从哪头拉到哪头，也不需要箭头。只有两端层级相同时，才会退回到按连线本身的方向判断。</p>
  <p><b>批量转换</b>：右键页面标题的<b>本页的连线</b>，可以把这一页内部的连线一次全部设为结构连线或关联连线。只影响两端都在本页内的连线，跨页的连线不受影响。</p>
  <p>规则是：有下级的卡片、或自己标了层级的卡片算标题，参与编号；纯末端且没标层级的卡片算正文内容，挂在上级标题之下。没有被任何结构连线串起来的卡片，仍按原来的空间顺序接在文档后面，不会丢失。</p>
  <p><b>关联连线的含义是"这两处属于一起"</b>：导出时程序会把相连的内容拉到相邻位置，而不是写一行"另见某节"，也不重复输出。所以你在画布上把有关的两段连起来，导出的文档里它们就是挨着的。这比让读者跳去别处查看要顺畅得多。</p>
  <p>只有标题不会被拉动，因为那是文档骨架。可以在视图菜单里用<b>关联的内容排在一起</b>关掉这个行为。</p>
  <p>两类连线都不再产生"另见"：结构连线已经体现为层级，关联连线已经体现为相邻排列。</p>
  <p>右键空白处的<b>默认连线样式</b>里可以设定新连线默认是哪一种。整套机制可以在视图菜单里用<b>大纲跟随连线</b>关掉，关掉后回到按空间位置推断层级的老办法。</p>
  <p class="tip">这样画布本身就是一张思维导图，导出的 Word 文档结构与你在画布上看到的完全一致。</p>`],

 ["连线","LIANXIAN",`
  <p>鼠标悬停卡片时四边出现小圆点，从圆点拖到另一张卡片即可连线。也可用右键的<b>从这里连线</b>，再点目标。</p>
  <p>右键点在线上可调整：线型（曲线、折线、直线）、实线或虚线、粗细、箭头（无、单向、双向）、颜色、反转方向、删除。</p>

 ["锁定","SUODING",`
  <p>用来保护已经定稿的内容，避免整理其他材料时误碰。分两级，都在右键菜单的<b>锁定</b>子菜单里：</p>
  <ul>
    <li><b>仅锁定内容</b>：改不动文字、格式、层级，也删不掉，但仍可移动、缩放、连线。适合已经写定但位置还要调的内容。</li>
    <li><b>锁定内容与位置</b>：连位置和尺寸也钉住，缩放控制点不再出现，完全不动。适合已经排好版、不希望再有任何变化的部分。</li>
  </ul>
  <p><b>解锁同样分两级</b>：<b>解除位置锁定</b>降回仅锁内容，方便临时挪一挪；<b>完全解锁</b>则彻底放开。</p>
  <p><b>工具栏</b>上也有一个锁形按钮（在"清除"和"分级统一"之间）：点一下切换仅锁定内容，右侧小三角展开四种操作。图标会随状态变化，未锁是开口的锁，仅锁内容是闭合的锁，连位置也锁则多一个钉点，扫一眼就知道当前是哪一级。</p>
  <p>快捷键 <kbd>Ctrl/Cmd</kbd> + <kbd>L</kbd> 切换仅锁内容，加 <kbd>Shift</kbd> 切换锁内容与位置。</p>
  <p>锁定没有任何视觉标注，因为一旦动不了你自然就知道它锁着了。</p>
  <p><b>拖动的含义随锁定级别而变</b>：仅锁定内容时卡片还能移动，所以在卡片上拖动就是移动它；锁定内容与位置之后卡片挪不动了，此时拖动改为划选文字，方便复制引用。两者不会互相干扰。</p>
  <p>从空白处拖出的框选依然能选中锁定的卡片，因为选中本身不改变任何东西，真正的保护在每一项操作里各自判断。这样你才能框选一批锁定的内容一起解锁，或者把仅锁定内容的一批卡片一起挪走。</p>
  <p><b>只有结构连线随之锁定</b>：结构连线决定文档骨架，误删会改变章节结构，所以只要任意一端被锁，它就不能删除也不能改样式（仍可写备注）。<b>关联连线不受影响</b>，因为它只是横向参照，随时可以增删改，不该被锁定挡住。</p>
  <p><b>整页锁定</b>：右键页面标题的<b>锁定本页</b>，两级模式与解锁选项同样齐全，一次作用于页内全部卡片。需要改其中一张时单独解锁，改完再整页锁一次即可全部锁回，不必记住谁被解过。</p>
  <p><b>分身默认为仅锁定内容</b>。因为分身与源共享同一份内容，在分身上误改就是改到原文。默认锁上之后，你可以放心把分身摆到任何地方作为索引和线索，需要修改时到源头改，或先解锁再改。分身仍可自由移动和缩放，不影响布局。</p>
  <p class="tip">建议把已经写定的引文、原始摘录、关键论点设为仅锁定内容；整章排好版之后再整页升级为锁定内容与位置。</p>`],

];
function manSorted(){return [...MANUAL].sort((a,b)=>a[1].localeCompare(b[1]))}
function openManual(){
  const box=$("man"),side=$("manside");
  side.innerHTML="";
  let letter="";
  manSorted().forEach(([term,py],i)=>{
    if(py[0]!==letter){letter=py[0];
      const h=document.createElement("div");h.className="ltr";h.textContent=letter;side.appendChild(h)}
    const b=document.createElement("button");
    b.innerHTML=term+'<i>'+py.toLowerCase()+'</i>';
    b.dataset.i=i;
    b.onclick=()=>showManual(i);
    side.appendChild(b);
  });
  box.classList.add("on");
  showManual(0);
}
function showManual(i){
  const list=manSorted(),it=list[i];if(!it)return;
  $("manbody").innerHTML=`<h3>${it[0]}</h3><div class="py">${it[1].toLowerCase()}</div>${it[2]}`;
  $("manbody").scrollTop=0;
  $("manside").querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
}
$("manx").onclick=()=>$("man").classList.remove("on");
$("man").addEventListener("pointerdown",e=>{if(e.target.id==="man")$("man").classList.remove("on")});

/* ================= ZIP 打包（无压缩，纯自写，不依赖任何库） ================= */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}
  return t})();
function crc32(u8){let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0}
const enc=new TextEncoder();
function dosTime(d){
  return {t:((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()/2))&0xFFFF,
          d:(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF};
}
function zipMake(files){
  const now=dosTime(new Date()),parts=[],central=[];
  let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name);
    const data=typeof f.data==="string"?enc.encode(f.data):f.data;
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true);lh.setUint16(10,now.t,true);lh.setUint16(12,now.d,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,now.t,true);ch.setUint16(14,now.d,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+data.length;
  });
  let cdSize=0;central.forEach(x=>cdSize+=x.length);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);
  end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:"application/zip"});
}
function dataURLtoBytes(u){
  const i=u.indexOf(",");const b=atob(u.slice(i+1));
  const out=new Uint8Array(b.length);
  for(let k=0;k<b.length;k++)out[k]=b.charCodeAt(k);
  return out;
}
function extOf(u){return /^data:image\/png/i.test(u)?"png":"jpg"}
function safeName(x,i){
  const base=(x||"").replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g," ").trim().slice(0,40);
  // 存档包里的分页要带序号（01-引言.jpg）；单个文件导出不传 i，那就只用标题本身。
  // 早先无条件拼 String(i)，写作页导出的文件名一律是"undefined-稿子.docx"。
  if(i==null)return base||"untitled";
  return String(i).padStart(2,"0")+(base?"-"+base:"");
}

/* ================= document export ================= */
function snippet(c0,n){
  const c=orig(c0);
  const s=(c.text||"").replace(/\s+/g," ").trim();
  if(!s)return srcOf(c)?"[image]":"[empty]";
  return s.length>(n||28)?s.slice(0,n||28)+"…":s;
}
// 同理：按 y 升序后只与当前这一带比较
function band(cs){
  const rows=[],tol=70;
  let cur=null;
  [...cs].sort((a,b)=>a.y-b.y||a.x-b.x).forEach(c=>{
    if(cur&&Math.abs(c.y-cur.y)<tol)cur.items.push(c);
    else{cur={y:c.y,items:[c]};rows.push(cur)}
  });
  return rows.flatMap(r=>r.items.sort((a,b)=>a.x-b.x));
}
const GAP=90;
// 排序后线性扫描分列：只与当前这一列比较即可，因为已按 x 升序
function columns(cs){
  const sorted=[...cs].sort((a,b)=>a.x-b.x),cols=[];
  let cur=null;
  sorted.forEach(c=>{
    if(cur&&c.x<=cur.right+GAP){cur.items.push(c);cur.right=Math.max(cur.right,c.x+c.w)}
    else{cur={left:c.x,right:c.x+c.w,items:[c]};cols.push(cur)}
  });
  return cols.flatMap(k=>k.items.sort((a,b)=>a.y-b.y||a.x-b.x));
}
function colCount(cs){
  const sorted=[...cs].sort((a,b)=>a.x-b.x);
  let n=0,right=-Infinity;
  sorted.forEach(c=>{
    if(c.x>right+GAP)n++;
    right=Math.max(right===-Infinity?c.x+c.w:right,c.x+c.w);
  });
  return n;
}
function flow(cs){
  if(!cs.length)return [];
  const m=S.readOrder||"auto";
  if(m==="col")return columns(cs);
  if(m==="row")return band(cs);
  const n=colCount(cs);                       // 自动判断：分出多列且每列不止一张，按列读
  return (n>=2&&cs.length/n>=2)?columns(cs):band(cs);
}
function docOrder(list){
  const all=(list||S.cards).filter(c=>!docOnly(c));
  const main=all.filter(c=>c.role!=="apx"),apx=all.filter(c=>c.role==="apx");
  const {map,loose}=bucketByFrame(main);
  const frames=(S.frames||[]).slice().sort((a,b)=>
    S.readOrder==="row"?(a.y-b.y||a.x-b.x):(a.x-b.x||a.y-b.y));
  const seq=[];
  frames.forEach(f=>{
    const inside=map.get(f)||[];
    if(inside.length)seq.push(...flow(inside));
  });
  seq.push(...flow(loose));
  return [...seq,...flow(apx)];
}
// depth: 页面标题占用的层数，卡片层级整体下移这么多
// 结构连线（l.st）表示"下级"，据此可以直接把思维导图变成文档大纲。
// 普通连线只表示"相关"，导出时作为交叉引用，不参与层级与编号。
const structLinks=()=>S.links.filter(l=>l.st);
// 层级越浅越靠上：一级标题永远是上级，没标层级的正文永远是末端。
// 这样连线时不必在意方向，也不需要箭头。
function lvRank(c){
  if(!c)return 99;
  if(c.role==="apx")return 1;
  if(c.role==="bib")return 95;         // 文献条目：原文的母信息，比正文更靠上
  return c.level?c.level:99;
}
function structPair(l,deg){
  const A=card(l.a),B=card(l.b);
  if(!A||!B)return null;
  const ra=lvRank(A),rb=lvRank(B);
  if(ra<rb)return {p:A.id,k:B.id};
  if(rb<ra)return {p:B.id,k:A.id};
  // 两端层级相同（常见情形：标题没标 level，一堆正文用结构线接在它后面）。
  // 早先这里直接退回连线方向，于是"线是从正文画向标题的"就会把正文当成上级，
  // 整份大纲跟着翻过来。改为先看结构线的度数：谁被更多结构线连着，谁就是这一处的
  // 主心骨（思维导图里中心节点连线最多），这跟人摆卡片的直觉一致。
  if(deg){
    const da=deg.get(A.id)||0,db=deg.get(B.id)||0;
    if(da!==db)return da>db?{p:A.id,k:B.id}:{p:B.id,k:A.id};
  }
  // 度数也相同：按位置，上面/左边的作上级
  const pa=A.y*100000+A.x,pb=B.y*100000+B.x;
  if(pa!==pb)return pa<pb?{p:A.id,k:B.id}:{p:B.id,k:A.id};
  return {p:l.a,k:l.b};            // 实在分不出才回退到连线本身的方向
}
function outlineForest(list){
  const set=new Set((list||S.cards).map(c=>c.id));
  const ls=structLinks().filter(l=>set.has(l.a)&&set.has(l.b));
  if(!ls.length)return null;
  const kids=new Map(),hasParent=new Set();
  // 每张卡片被多少条结构线连着，用来判断"谁是这一处的主心骨"
  const deg=new Map();
  ls.forEach(l=>{deg.set(l.a,(deg.get(l.a)||0)+1);deg.set(l.b,(deg.get(l.b)||0)+1)});
  ls.forEach(l=>{
    const pr=structPair(l,deg);if(!pr)return;
    if(!kids.has(pr.p))kids.set(pr.p,[]);
    if(!kids.get(pr.p).includes(pr.k)){kids.get(pr.p).push(pr.k);hasParent.add(pr.k)}
  });
  const pos=c=>(c.y*100000+c.x);                 // 同级按位置排，上到下、左到右
  const seen=new Set();
  const build=(id,depth)=>{
    if(seen.has(id))return null;                 // 防环
    seen.add(id);
    const c=card(id);if(!c)return null;
    const ch=(kids.get(id)||[]).map(z=>card(z)).filter(Boolean)
      .sort((p,q)=>pos(p)-pos(q)).map(z=>build(z.id,depth+1)).filter(Boolean);
    return {c,depth,kids:ch};
  };
  const roots=(list||S.cards).filter(c=>set.has(c.id)&&!hasParent.has(c.id)&&kids.has(c.id))
    .sort((p,q)=>pos(p)-pos(q)).map(c=>build(c.id,1)).filter(Boolean);
  if(!roots.length)return null;
  return {roots,seen};
}
// 关联连线的语义：这两张卡片属于一处，导出时排在一起。
// 不再写成"另见"，也不重复输出，只是把它们的顺序拉到相邻。
function pullTogether(flat){
  if(S.relAdjacent===false)return flat;
  const rel=S.links.filter(l=>!l.st);
  if(!rel.length)return flat;
  const idx=new Map();flat.forEach((n,i)=>{if(!idx.has(n.c.id))idx.set(n.c.id,n)});
  const nbr=new Map();
  rel.forEach(l=>{
    const A=idx.get(l.a),B=idx.get(l.b);
    if(!A||!B||A===B)return;
    if(!nbr.has(A))nbr.set(A,[]);if(!nbr.has(B))nbr.set(B,[]);
    if(!nbr.get(A).includes(B))nbr.get(A).push(B);
    if(!nbr.get(B).includes(A))nbr.get(B).push(A);
  });
  if(!nbr.size)return flat;
  const out=[],done=new Set();
  flat.forEach(n=>{
    if(done.has(n))return;
    out.push(n);done.add(n);
    // 只把"标题以外"的相关内容拉过来，不去动文档骨架
    const queue=[...(nbr.get(n)||[])];
    while(queue.length){
      const m=queue.shift();
      if(done.has(m)||m.lv||m.apx)continue;
      out.push(m);done.add(m);
      (nbr.get(m)||[]).forEach(z=>{if(!done.has(z))queue.push(z)});
    }
  });
  flat.forEach(n=>{if(!done.has(n))out.push(n)});
  return out;
}
// 归在文献条目名下的原文，跟着条目走，不参与空间顺序也不单独出现
function attachBibKids(flat){
  const has=flat.some(n=>n.c.role==="bib");
  if(!has)return flat;
  const byBib=new Map();
  flat.forEach(n=>{
    const bid=orig(n.c).bib;
    if(bid){if(!byBib.has(bid))byBib.set(bid,[]);byBib.get(bid).push(n)}
  });
  if(!byBib.size)return flat;
  const moved=new Set();byBib.forEach(a=>a.forEach(n=>moved.add(n)));
  const out=[];
  flat.forEach(n=>{
    if(moved.has(n))return;                 // 稍后跟着它的条目一起出现
    out.push(n);
    const kids=byBib.get(n.c.id);
    if(kids){
      // 同一条文献名下的原文按位置排，保证顺序稳定
      kids.slice().sort((p,q)=>(p.c.y-q.c.y)||(p.c.x-q.c.x))
        .forEach(k=>{k.parent=n;out.push(k)});
    }
  });
  return out;
}
function buildTree(list,depth,prefix){
  const shift=depth||0;
  const forest=S.outline!==false?outlineForest(list):null;
  if(forest)return buildFromForest(forest,list,shift,prefix);
  const order=docOrder(list),stack=[],roots=[];
  order.forEach(c=>{
    const apx=c.role==="apx",aside=c.role==="aside",bib=c.role==="bib";
    const isRef=!!c.ref;
    const lv=(aside||bib||isRef)?0:(apx?1:(c.level||0));
    const node={c,lv,apx,aside,bib,isRef,children:[],num:"",sec:""};
    if(lv===0){const p=stack[stack.length-1];(p?p.node.children:roots).push(node);node.parent=p?p.node:null}
    else{
      while(stack.length&&stack[stack.length-1].lv>=lv)stack.pop();
      const p=stack[stack.length-1];(p?p.node.children:roots).push(node);
      node.parent=p?p.node:null;stack.push({lv,node});
    }
  });
  const counters=[];let apxN=0;
  const walk=(list)=>list.forEach(n=>{
    if(n.apx){apxN++;n.num=String.fromCharCode(64+apxN);n.sec=n.num;
      for(let i=1;i<counters.length;i++)counters[i]=0}
    else if(n.lv){
      counters[n.lv-1]=(counters[n.lv-1]||0)+1;
      counters.length=n.lv;                       // 更深的计数器归零
      n.num=(prefix?prefix+".":"")+counters.map(x=>x||0).join(".");
      n.sec=n.num;
    }
    else n.sec=n.parent?n.parent.sec:"";
    n.out=n.lv?n.lv+shift:0;                      // 输出到文档时的实际层级
    walk(n.children);
  });
  walk(roots);
  let flat=[];const flatten=l=>l.forEach(n=>{flat.push(n);flatten(n.children)});flatten(roots);
  flat.forEach(n=>{if(n.out===undefined)n.out=n.lv?n.lv+shift:0});
  flat=attachBibKids(pullTogether(flat));
  const byId={};flat.forEach(n=>{byId[n.c.id]=n;
    if(!n.isRef&&!byId[orig(n.c).id])byId[orig(n.c).id]=n});
  return {roots,flat,byId};
}
// 按结构连线搭出的树生成节点，编号与层级都来自树的深度
function buildFromForest(forest,list,shift,prefix){
  const roots=[];let flat=[];
  const mk=(t2,parent)=>{
    const c=t2.c;
    const apx=c.role==="apx",aside=c.role==="aside",bib=c.role==="bib",isRef=!!c.ref;
    // 有下级、或自己标了层级的算标题；文献条目始终是内容
    const isHead=!aside&&!bib&&!isRef&&(t2.kids.length>0||!!c.level);
    const lv=isHead?t2.depth:0;
    const node={c,lv,apx,aside,bib,isRef,children:[],num:"",sec:"",parent:parent||null};
    (parent?parent.children:roots).push(node);
    t2.kids.forEach(k=>mk(k,node));
    return node;
  };
  forest.roots.forEach(r=>mk(r,null));
  // 没被结构连线串起来的卡片，按原来的空间顺序接在后面
  const rest=(list||S.cards).filter(c=>!forest.seen.has(c.id));
  if(rest.length){
    const order=docOrder(rest),stack=[];
    order.forEach(c=>{
      const apx=c.role==="apx",aside=c.role==="aside",bib=c.role==="bib",isRef=!!c.ref;
      const lv=(aside||bib||isRef)?0:(apx?1:(c.level||0));
      const node={c,lv,apx,aside,bib,isRef,children:[],num:"",sec:""};
      if(lv===0){const p=stack[stack.length-1];(p?p.node.children:roots).push(node);
        node.parent=p?p.node:null}
      else{
        while(stack.length&&stack[stack.length-1].lv>=lv)stack.pop();
        const p=stack[stack.length-1];(p?p.node.children:roots).push(node);
        node.parent=p?p.node:null;stack.push({lv,node});
      }
    });
  }
  const counters=[];let apxN=0;
  const walk=l=>l.forEach(n=>{
    if(n.apx){apxN++;n.num=String.fromCharCode(64+apxN);n.sec=n.num;
      for(let i=1;i<counters.length;i++)counters[i]=0}
    else if(n.lv){
      counters[n.lv-1]=(counters[n.lv-1]||0)+1;
      counters.length=n.lv;
      n.num=(prefix?prefix+".":"")+counters.map(x=>x||0).join(".");
      n.sec=n.num;
    }
    else n.sec=n.parent?n.parent.sec:"";
    n.out=n.lv?n.lv+shift:0;
    walk(n.children);
  });
  walk(roots);
  const flatten=l=>l.forEach(n=>{flat.push(n);flatten(n.children)});
  flatten(roots);
  flat=attachBibKids(pullTogether(flat));
  const byId={};flat.forEach(n=>{byId[n.c.id]=n;
    if(!n.isRef&&!byId[orig(n.c).id])byId[orig(n.c).id]=n});
  return {roots,flat,byId};
}
function secTag(n){
  if(!n)return "";
  if(n.apx||(n.parent&&n.parent.apx))return t("apxLabel")+" "+(n.num||n.sec)+" ";

}

async function doExport(o){

  if(o.scope==="sel"&&!list){toast(t("needSel"));return}
  if(o.fmt==="json"){download(bundle(list),o.title+".json");return}
  if(o.fmt==="md"){

    dl(new Blob([docMD(o,tree)],{type:"text/markdown;charset=utf-8"}),o.title+".md");
    toast(t("expDone"));return;
  }
  if(o.fmt==="zip"){try{await exportArchive(o)}catch(e){toast(((e&&e.message)||"")+" "+t("errShot"))}return}
  if(o.fmt==="jpg"||o.fmt==="pdfview"){
    try{

        if(o.fmt==="jpg")await exportPageShots(o);else await exportPagePDF(o);
        toast(o.fmt==="jpg"?t("expDone"):t("expPrint"));

      if(o.fmt==="jpg"){cv.toBlob(b=>dl(b,o.title+".jpg"),"image/jpeg",.93);toast(t("expDone"))}

function imgDims(c,max){
  const w=Math.min(max||430,Math.max(120,c.w));
  return {w:Math.round(w),h:Math.round(w*(c.ar||0.66))};
}
function hex6(col){
  if(!col)return null;
  const m=col.match(/rgba?\(([^)]+)\)/);
  if(m){const p=m[1].split(",").map(x=>parseFloat(x));
    if(p.length>3&&p[3]===0)return null;
    return p.slice(0,3).map(x=>Math.round(x).toString(16).padStart(2,"0")).join("")}
  const h=col.replace("#","");
  if(/^[0-9a-f]{6}$/i.test(h))return h.toLowerCase();
  if(/^[0-9a-f]{3}$/i.test(h))return h.split("").map(x=>x+x).join("").toLowerCase();
  return null;
}
const HLMAP=[["fff3a3","yellow"],["c8f0c6","green"],["cfe4ff","cyan"],["fbd3e8","magenta"]];
function nearestHL(h){
  if(!h)return null;
  const to=x=>[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];
  const a=to(h);let best=null,bd=1e9;
  HLMAP.forEach(([k,name])=>{const b=to(k);
    const d=(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
    if(d<bd){bd=d;best=name}});
  return bd<24000?best:"yellow";
}
function richRuns(html){
  const box=document.createElement("div");box.innerHTML=html||"";
  const out=[];
  const walk=(node,st)=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){if(n.nodeValue)out.push({...st,text:n.nodeValue});return}
      if(n.nodeType!==1)return;
      if(n.tagName==="BR"){out.push({...st,text:"\n"});return}
      const cs=n.style||{},s2={...st},tag=n.tagName;
      if(tag==="B"||tag==="STRONG"||cs.fontWeight==="bold"||+cs.fontWeight>=600)s2.bold=true;
      if(tag==="I"||tag==="EM"||cs.fontStyle==="italic")s2.italics=true;
      if(tag==="U"||(cs.textDecoration||"").includes("underline"))s2.underline={};
      if(tag==="S"||tag==="STRIKE"||tag==="DEL"||(cs.textDecoration||"").includes("line-through"))s2.strike=true;
      const col=hex6(cs.color);if(col)s2.color=col;
      const bg=hex6(cs.backgroundColor);
      if(bg)s2.highlight=nearestHL(bg);else if(cs.backgroundColor==="transparent")delete s2.highlight;
      const fs=parseFloat(cs.fontSize);if(fs)s2.size=Math.round(fs*1.5);
      walk(n,s2);
    });
  };
  walk(box,{});
  return out;
}
// pre 是可选的前缀（写作页的标题编号用它）：作为一个独立的 TextRun 插在
// 第一段最前面，原有的富文本一个字都不动。不传就跟以前完全一样。
function paraFrom(c,D,extra,pre){
  const {Paragraph,TextRun}=D;
  if(!c.rich)return null;
  const runs=richRuns(c.rich);
  if(!runs.length)return null;
  const paras=[];let cur=[];
  runs.forEach(r=>{
    r.text.split("\n").forEach((piece,i)=>{
      if(i){paras.push(cur);cur=[]}
      if(piece)cur.push(new TextRun({...r,text:piece}));
    });
  });
  if(cur.length)paras.push(cur);
  const out=paras.filter(p=>p.length);
  if(pre&&out.length)out[0].unshift(new TextRun({text:pre}));
  return out.map(p=>new Paragraph({children:p,...(extra||{})}));
}
async function exportDocx(D,o,tree){
  const {Document,Packer,Paragraph,TextRun,ImageRun,HeadingLevel,AlignmentType}=D;
  // Word 内置标题最多到六级，超出的一律用第六级，不会丢内容
  const HL=[null,HeadingLevel.HEADING_1,HeadingLevel.HEADING_2,HeadingLevel.HEADING_3,
    HeadingLevel.HEADING_4,HeadingLevel.HEADING_5,HeadingLevel.HEADING_6];
  const hl=v=>HL[Math.min(Math.max(1,v),6)];
  const kids=[new Paragraph({text:o.title,heading:HeadingLevel.TITLE})];
  const emit=(n)=>{
    const c=n.c;
    if(o.img&&srcOf(c)){
      const d=imgDims(c);
      try{kids.push(new Paragraph({children:[new ImageRun({
        data:srcOf(c).split(",")[1],transformation:{width:d.w,height:d.h}})]}))}catch(e){}
    }
    if(orig(c).tb){                          // 表格：导出成 Word 真表格
      const g=orig(c).tb;
      try{
        const {Table,TableRow,TableCell,WidthType}=D;
        kids.push(new Table({width:{size:100,type:WidthType.PERCENTAGE},
          rows:g.rows.map((row,ri)=>new TableRow({
            tableHeader:!!(g.head&&ri===0),
            children:row.map((cell,ci)=>new TableCell({
              children:[new Paragraph({
                alignment:(()=>{const f=g.fmt&&g.fmt[ri+","+ci];
                  if(!f||!f.al)return undefined;
                  return f.al==="center"?AlignmentType.CENTER
                    :f.al==="right"?AlignmentType.RIGHT:AlignmentType.LEFT})(),
                children:[new TextRun({text:String(cell||""),
                  bold:!!((g.head&&ri===0)||(g.headCol&&ci===0)||(g.fmt&&g.fmt[ri+","+ci]&&g.fmt[ri+","+ci].b))})]})]
            }))
          }))
        }));
        kids.push(new Paragraph({text:""}));
      }catch(e){
        g.rows.forEach(row=>kids.push(new Paragraph({text:row.join("　")})));
      }
      return;
    }
    const oc2=orig(c);
    const txt=(oc2.text||"").split(/\n+/).filter(z=>z.trim());
    const rich=oc2.rich?paraFrom(oc2,D,n.out?{heading:hl(n.out)}:null):null;
    if(rich&&rich.length){
      if(n.out){kids.push(rich[0]);rich.slice(1).forEach(p=>kids.push(p))}
      else rich.forEach(p=>kids.push(p));
    }
    else if(n.out){kids.push(new Paragraph({text:(txt[0]||snippet(oc2)),heading:hl(n.out)}));
      txt.slice(1).forEach(z=>kids.push(new Paragraph({text:z})))}
    else if(n.bib){
      kids.push(new Paragraph({
        indent:{left:360,hanging:360},          // 文献条目用悬挂缩进，与参考文献惯例一致
        children:[new TextRun({text:txt.join(" "),bold:true})]}));
    }
    else txt.forEach(z=>kids.push(new Paragraph({text:z})));
    if(o2u(c)){
      try{
        const {ExternalHyperlink}=D;
        kids.push(new Paragraph({children:[new ExternalHyperlink({
          children:[new TextRun({text:o2u(c),style:"Hyperlink",size:18})],link:o2u(c)})]}));
      }catch(e){
        kids.push(new Paragraph({children:[new TextRun({text:o2u(c),size:18,color:"2D6CDF"})]}));
      }
    }
    if(o.tags){const tg=cardTags(c);
      if(tg.length)kids.push(new Paragraph({children:[new TextRun({
        text:tg.map(x=>"#"+x).join("  "),italics:true,size:18,color:"888888"})]}))}
  };
  if(o.byPageDoc){
    // 页面标题作为最高一级，页内卡片层级整体下移一级
    pageGroups(null).forEach((g,gi)=>{
      kids.push(new Paragraph({text:(gi+1)+"  "+g.title,heading:HeadingLevel.HEADING_1}));
      buildTree(g.cards,1,gi+1).flat.forEach(emit);
    });
  }else tree.flat.forEach(emit);
  const doc=new Document({sections:[{children:kids}]});
  const blob=await Packer.toBlob(doc);
  dl(blob,o.title+".docx");
}

function safeRich(html){
  const box=document.createElement("div");box.innerHTML=html||"";
  box.querySelectorAll("*").forEach(el=>{
    if(el.tagName==="A"){
      const href=el.getAttribute("href")||"";
      [...el.attributes].forEach(a=>el.removeAttribute(a.name));
      if(/^(https?|mailto|file):/i.test(href)){el.setAttribute("href",href);el.setAttribute("target","_blank")}
      return;
    }
    if(!["SPAN","B","I","U","S","STRIKE","DEL","STRONG","EM","BR","DIV","FONT"].includes(el.tagName)){
      el.replaceWith(...el.childNodes);return;
    }
    [...el.attributes].forEach(a=>{if(a.name!=="style")el.removeAttribute(a.name)});
  });
  return box.innerHTML;
}

async function captureCanvas(scale,list,rect){
  // rect 给定时按纸张边界精确截取，不再取内容外接框
  const b=rect||bbox(list);if(!b)throw new Error("empty");
  const keep=list?new Set(list.map(c=>c.id)):null;
  const prevMargin=CULL.m,prevView=S.linkView,prevHover=hoverId,prevSel=sel,prevSelL=selLink;
  CULL.m=1e7;S.linkView="all";hoverId=null;sel=[];selLink=null;
  syncCards();measure();drawLinks();
  const pad=rect?0:60,W=Math.round(b.w+pad*2),H=Math.round(b.h+pad*2);
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:0;top:0;width:0;height:0;overflow:hidden;z-index:-1";
  const wrap=document.createElement("div");
  wrap.style.cssText=`position:relative;left:0;top:0;width:${W}px;height:${H}px;
    overflow:hidden;background:${S.bg}`;
  const inner=$("world").cloneNode(true);
  inner.style.left="0";inner.style.top="0";
  inner.style.transform=`translate(${-b.x+pad}px,${-b.y+pad}px)`;
  inner.style.setProperty("--iz",1);
  inner.querySelectorAll(".card").forEach(el=>el.classList.remove("sel","hit","nomatch"));
  inner.querySelectorAll(".port,.hnd,.ring,.lvl").forEach(el=>el.remove());
  if(keep){
    inner.querySelectorAll(".card").forEach(el=>{if(!keep.has(el.dataset.id))el.remove()});
    const okL=new Set(S.links.filter(l=>keep.has(l.a)&&keep.has(l.b)).map(l=>l.id));
    inner.querySelectorAll("[data-link]").forEach(el=>{if(!okL.has(el.dataset.link))el.remove()});
  }
  wrap.appendChild(inner);host.appendChild(wrap);document.body.appendChild(host);
  // 连线原本挂在一张 40000 见方的巨型 SVG 上，导出前换成刚好覆盖取景范围的尺寸
  const svg=inner.querySelector("#links");
  if(svg){
    svg.setAttribute("width",W);svg.setAttribute("height",H);
    svg.setAttribute("viewBox",`${b.x-pad+OF} ${b.y-pad+OF} ${W} ${H}`);
    Object.assign(svg.style,{left:"0px",top:"0px",width:W+"px",height:H+"px",overflow:"visible"});
    svg.style.transform=`translate(${b.x-pad}px,${b.y-pad}px)`;
  }
  try{
    try{
      const h2i=await loadH2I();
      return await h2i.toCanvas(wrap,{pixelRatio:scale||2,backgroundColor:S.bg,
        width:W,height:H,cacheBust:false,skipFonts:false});
    }catch(e1){
      const h2c=await loadH2C();
      const cv=await h2c(wrap,{backgroundColor:S.bg,scale:scale||2,logging:false,useCORS:true,
        width:W,height:H,windowWidth:W,windowHeight:H});

    }
  }finally{host.remove();CULL.m=prevMargin;S.linkView=prevView;hoverId=prevHover;
    sel=prevSel;selLink=prevSelL;syncCards();measure();drawLinks()}
}

// 纯文本导出：不依赖任何程序也能读，作为最终保底

function bucketByFrame(all){
  const map=new Map(),loose=[];
  (S.frames||[]).forEach(f=>map.set(f,[]));
  all.forEach(c=>{const f=frameOf(c);if(f&&map.has(f))map.get(f).push(c);else loose.push(c)});
  return {map,loose};
}
function pageGroups(list){
  const all=list||S.cards;
  const {map,loose}=bucketByFrame(all);
  const out=[];
  (S.frames||[]).slice().sort((a,b)=>
    S.readOrder==="row"?(a.y-b.y||a.x-b.x):(a.x-b.x||a.y-b.y)).forEach(f=>{
    const inside=map.get(f)||[];
    if(inside.length)out.push({title:f.title||t("pageDefault"),cards:inside,frame:f});
  });

      const rows=g.rows.map(r=>"| "+r.map(esc2).join(" | ")+" |");

function lockSvg(mode){
  // 未锁：开口的锁；仅锁内容：闭合的锁；连位置也锁：闭合的锁加一个钉点
  const body=`<rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/>`;
  const shackle=mode?`<path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/>`
    :`<path d="M8 10.5V7.6a4 4 0 0 1 7.6-1.4"/>`;
  const pin=mode==="all"?`<circle cx="12" cy="15.4" r="1.5" fill="currentColor" stroke="none"/>`:"";
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}${shackle}${pin}</svg>`;
}
function alSvg(v){
  return `<svg width="14" height="11" viewBox="0 0 14 11" fill="currentColor">`+
    [13,8,11].map((w,i)=>{const x=v==="left"?0:v==="right"?14-w:(14-w)/2;
      return `<rect x="${x}" y="${i*4.2}" width="${w}" height="1.7" rx=".8"/>`}).join("")+`</svg>`;
}
function closePops(){

function curFamily(){

function unifyLevel(lv,excludeManual){
  const c=barCard();if(!c)return;
  const st={...DEF,...S.textDef,...(c.s||{})};
  snap();
  S.lvStyle=S.lvStyle||{};
  S.lvStyle[lv]={...st};
  if(lv===0)S.textDef={...S.textDef,...st};
  let n=0;
  S.cards.forEach(z=>{
    if(isLocked(z.id))return;
    const zl=z.role?0:(z.level||0);
    if(zl!==lv)return;
    if(excludeManual&&z.sMan&&z.id!==c.id)return;

  // 的完整子集，编辑那边的段落时浮动工具栏跟着弹出来会跟它叠在一起打架，所以这里隐藏。
  // 直接用"选中的 id 在不在 docsCapNodes 里"来判断就够了：送进稿子的都是内容的独立
  // 拷贝（见 wrImport / hostOfCard 的说明），一个 id 要么只活在画布上、要么只活在
  // 某份稿子里，不会两边都命中，所以不需要再去看 document.activeElement 猜当前上下文。
  if(wrOpenState()||sel.some(id=>docsCapNodes.has(id))){
    b.classList.remove("on");closePops();return;
  }
  if(!b.children.length)buildBar();
  const els=sel.map(id=>hostOfCard(id)).filter(Boolean);

  // 实在挤不下时压在卡片上，至少让它半透明，不完全遮住内容
  b.classList.toggle("overlap",above<8&&below+bh>innerHeight-8);

/* ================= tags ================= */
const TAGRE=/#([\p{L}\p{N}_\-]{1,40})/gu;
function cardTags(c0){
  const c=orig(c0);
  const out=new Set((c.tags||[]).map(x=>x.toLowerCase()));
  (c.text||"").replace(TAGRE,(m,g)=>{out.add(g.toLowerCase());return m});
  return [...out];
}
function allTags(){
  const m=new Map();
  S.cards.forEach(c=>cardTags(c).forEach(x=>m.set(x,(m.get(x)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}
function refreshTagList(){
  $("taglist").innerHTML=allTags().map(([x])=>`<option value="${x}">`).join("");
}
function setCardTags(c,list){
  const inText=new Set();(c.text||"").replace(TAGRE,(m,g)=>{inText.add(g.toLowerCase());return m});
  c.tags=[...new Set(list.map(x=>x.trim().replace(/^#/,"").toLowerCase()).filter(Boolean))]
    .filter(x=>!inText.has(x));
}
function openTags(x,y){
  $("pop").classList.remove("wide");
  const cs=targets().filter(c=>!isLocked(c.id));

  p.innerHTML=`
    <div class="hd"><b>${t("tagTitle")}${cs.length>1?" ("+cs.length+")":""}</b><button id="pcx">×</button></div>
    <input class="ti" id="tgi" placeholder="${t("tagsPh")}" value="${esc(cur.join(", "))}" spellcheck="false">
    <div class="mhd" style="padding:10px 0 2px">${t("allTags")}</div>
    <div class="chips" id="tgc">${allTags().map(([x,n])=>
      `<button data-v="${x}" class="${cur.includes(x)?"on":""}">${x} <span style="opacity:.45">${n}</span></button>`).join("")}</div>
    <p class="note">${t("tagHint")}</p>`;
  place(p,Math.min(x,innerWidth-270),Math.min(y,innerHeight-300));

  p.querySelector("#pcx").onclick=()=>p.classList.remove("on");
  inp.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"){e.preventDefault();apply()}});

function searchTag(x){

/* ================= search ================= */
let hits=[],hitIdx=-1;
function findQ(){return $("findq").value.trim().toLowerCase()}
function showFind(on){
  const f=$("find");
  if(on){f.classList.add("on");syncFindMode();$("findq").focus();$("findq").select()}
  else{f.classList.remove("on");$("findq").value="";runFind()}
  if(!on&&S.work&&!lock){f.classList.add("on")}
}
function syncFindMode(){
  $("findm").textContent=S.findMode==="tag"?t("modeTag"):t("modeAll");
  $("findq").placeholder=S.findMode==="tag"?t("searchTagPh"):t("searchPh");
}
$("findm").onclick=()=>{S.findMode=S.findMode==="tag"?"all":"tag";syncFindMode();runFind();save();$("findq").focus()};
function runFind(){
  const q=findQ().replace(/^#/,"");
  hits=!q?[]:S.cards.filter(c=>S.findMode==="tag"
    ? cardTags(c).some(x=>x.includes(q))
    : ((orig(c).text||"").toLowerCase().includes(q)||(orig(c).url||"").toLowerCase().includes(q)
       ||cardTags(c).some(x=>x.includes(q))));
  if(S.findMerge){                       // 合并同一内容，只保留源或第一处
    const seen=new Set();
    hits=hits.filter(c=>{const k=orig(c).id;if(seen.has(k))return false;seen.add(k);return true});
  }
  if(!hits.some(c=>c===S.cards[hitIdx]))hitIdx=-1;
  document.body.classList.toggle("finding",!!q);
  paintFind();
  $("findn").textContent=q?(hits.length?(Math.max(0,hits.indexOf(S.cards[hitIdx]))+1)+" / "+hits.length:t("noHit")):"";
}
function paintFind(){
  const q=findQ(),ids=hits.map(c=>c.id);
  document.querySelectorAll(".card").forEach(el=>{
    const on=ids.includes(el.dataset.id);
    el.classList.toggle("hit",!!q&&on);
    el.classList.toggle("nomatch",!!q&&!on);
  });
}
function stepHit(d){
  if(!hits.length)return;
  let i=hits.indexOf(S.cards[hitIdx]);
  i=(i+d+hits.length*2)%hits.length;
  const c=hits[i];hitIdx=S.cards.indexOf(c);
  sel=[c.id];paintSel();focusCard(c);runFind();
}
$("findq").addEventListener("input",runFind);
$("findq").addEventListener("keydown",e=>{
  e.stopPropagation();
  if(e.key==="Enter"){e.preventDefault();if(hits.length&&hitIdx<0)hitIdx=S.cards.indexOf(hits[0]),focusCard(hits[0]),sel=[hits[0].id],paintSel(),runFind();
    else stepHit(e.shiftKey?-1:1)}
  if(e.key==="Escape"){e.preventDefault();$("findq").value="";runFind();
    if(!S.work)showFind(false);else $("findq").blur()}
});
$("findx").onclick=()=>{$("findq").value="";runFind();if(!S.work)showFind(false)};
function setWork(v){
  S.work=v;save();
  const f=$("find");
  if(v&&!lock)f.classList.add("on");else if(!v)showFind(false);
}

/* ================= 页面地图 ================= */
let mapOn=false,mapHit=[],mapSel=null,mapHov=null;
// 地图有自己的相机，页面多到看不清时可以在地图里放大和平移
let mapCam=null;                            // {cx,cy,z}，为空表示自动全览
function fitMapCam(W,H){
  const b=mapBounds();
  const z=Math.min(W/b.w,H/b.h);
  return {cx:b.x+b.w/2,cy:b.y+b.h/2,z};
}
function mapFit(){mapCam=null;drawMap()}
function mapZoom(f,px,py){
  const box=$("mapc").parentNode,W=box.clientWidth,H=box.clientHeight;
  const m=mapCam||fitMapCam(W,H);
  const base=fitMapCam(W,H).z;
  const nz=clamp(m.z*f,base*0.9,base*60);   // 下限略低于全览，避免缩不回去
  // 以光标处的世界点为锚，缩放前后保持不动
  const wx=(px-W/2)/m.z+m.cx, wy=(py-H/2)/m.z+m.cy;
  mapCam={z:nz,cx:wx-(px-W/2)/nz,cy:wy-(py-H/2)/nz};
  if(nz<=base*1.001)mapCam=null;            // 回到全览就交还自动模式
  drawMap();
}
function applyMapSize(){
  if(S.mapW)$("map").style.width=S.mapW+"px";
  if(S.mapH)$("mapc").parentNode.style.height=S.mapH+"px";
}
function toggleMap(){
  mapOn=!mapOn;S.map=mapOn;
  if(mapOn)applyMapSize();
  $("map").classList.toggle("on",mapOn);
  if(mapOn){drawMap();$("mapq").placeholder=t("mapFind")}else $("mapq").value="";
  save();
}
function mapBounds(){
  const fs=S.frames||[];
  if(!fs.length)return bbox()||{x:-500,y:-400,w:1000,h:800};
  let x=Infinity,y=Infinity,x2=-Infinity,y2=-Infinity;
  fs.forEach(f=>{x=Math.min(x,f.x);y=Math.min(y,f.y);
    x2=Math.max(x2,f.x+f.w);y2=Math.max(y2,f.y+f.h)});
  const b2=bbox();
  if(b2){x=Math.min(x,b2.x);y=Math.min(y,b2.y);
    x2=Math.max(x2,b2.x+b2.w);y2=Math.max(y2,b2.y+b2.h)}
  const pad=Math.max(200,(x2-x)*.04);
  return {x:x-pad,y:y-pad,w:x2-x+pad*2,h:y2-y+pad*2};
}
function drawMap(){
  if(!mapOn)return;
  const cv=$("mapc"),box=cv.parentNode;
  const W=box.clientWidth,H=box.clientHeight,dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  const m=mapCam||fitMapCam(W,H);
  const k=m.z, ox=W/2-m.cx*k, oy=H/2-m.cy*k;
  const X=v=>v*k+ox, Y=v=>v*k+oy;
  const dark=isDark(S.bg);
  const q=($("mapq").value||"").trim().toLowerCase();

  mapHit=[];
  const fs=(S.frames||[]).slice().sort((a,b2)=>a.x-b2.x||a.y-b2.y);
  let nHit=0;
  // 页面底色与选中态
  fs.forEach((f,i)=>{
    const hit=q&&(f.title||"").toLowerCase().includes(q);
    if(q&&hit)nHit++;
    const isSel=mapSel===f.id, isHov=mapHov===f.id;
    const fx=X(f.x),fy=Y(f.y),fw=f.w*k,fh=f.h*k;
    if(q&&!hit)g.globalAlpha=.26;
    // 选中与悬停用底色浓淡区分，不用彩色，保持整体质感
    if(isSel){g.fillStyle=dark?"rgba(255,255,255,.14)":"rgba(30,34,40,.10)";g.fillRect(fx,fy,fw,fh)}
    else if(isHov){g.fillStyle=dark?"rgba(255,255,255,.07)":"rgba(30,34,40,.05)";g.fillRect(fx,fy,fw,fh)}
    else if(hit){g.fillStyle=dark?"rgba(255,255,255,.09)":"rgba(0,0,0,.055)";g.fillRect(fx,fy,fw,fh)}
    g.strokeStyle=(isSel||hit)?(dark?"#EDEDEA":"#111")
      :isHov?(dark?"rgba(235,235,230,.8)":"rgba(40,45,52,.7)")
      :(dark?"rgba(200,200,195,.45)":"rgba(60,66,72,.4)");
    g.lineWidth=isSel?2:(hit||isHov?1.6:1);
    g.strokeRect(fx,fy,fw,fh);
    g.globalAlpha=1;
    mapHit.push({f,x:fx,y:fy,w:fw,h:fh,i});
  });
  // 卡片：按真实比例铺在页面之上，密度即内容分布
  g.fillStyle=dark?"rgba(235,235,230,.34)":"rgba(40,45,55,.26)";
  const vx=-ox/k, vy=-oy/k, vx2=(W-ox)/k, vy2=(H-oy)/k;   // 地图当前可见的世界范围
  const step=S.cards.length>20000?Math.ceil(S.cards.length/20000):1;
  for(let i=0;i<S.cards.length;i+=step){
    const c=S.cards[i];
    const ch=hOf(c)||100;
    if(c.x+c.w<vx||c.x>vx2||c.y+ch<vy||c.y>vy2)continue;
    g.fillRect(X(c.x),Y(c.y),Math.max(1,c.w*k),Math.max(1,ch*k));
  }
  // 卡片盖住了框线，补画一遍，保证页面边界清晰
  fs.forEach(f=>{
    const hit=q&&(f.title||"").toLowerCase().includes(q);
    const isSel=mapSel===f.id,isHov=mapHov===f.id;
    if(q&&!hit)g.globalAlpha=.26;
    g.strokeStyle=(isSel||hit)?(dark?"#EDEDEA":"#111")
      :isHov?(dark?"rgba(235,235,230,.8)":"rgba(40,45,52,.7)")
      :(dark?"rgba(200,200,195,.45)":"rgba(60,66,72,.4)");
    g.lineWidth=isSel?2:(hit||isHov?1.6:1);
    g.strokeRect(X(f.x),Y(f.y),f.w*k,f.h*k);
    g.globalAlpha=1;
  });
  $("mapn").textContent=q?(nHit+"/"+fs.length):(fs.length+"");
  $("map")._m={k,ox,oy};
  const base=fitMapCam(W,H).z;
  $("mapfit").style.display=(mapCam&&k>base*1.02)?"":"none";
  // 放大后只画视野内的部分，页面再多也不会变慢
  $("mapz").textContent=k>base*1.02?Math.round(k/base*100)+"%":"";
}
function mapToWorld(ev){
  const m=$("map")._m;if(!m)return null;
  const r=$("mapc").getBoundingClientRect();
  return {x:(ev.clientX-r.left-m.ox)/m.k, y:(ev.clientY-r.top-m.oy)/m.k};
}
function mapAt(ev){
  const r=$("mapc").getBoundingClientRect();
  const lx=ev.clientX-r.left,ly=ev.clientY-r.top;
  // 命中多个时取最小的那个，避免大页面盖住嵌在里面的小页面
  const hits=mapHit.filter(h=>lx>=h.x&&lx<=h.x+h.w&&ly>=h.y&&ly<=h.y+h.h);
  if(!hits.length)return null;
  return hits.sort((a,b)=>a.w*a.h-b.w*b.h)[0];
}
$("mapc").addEventListener("wheel",e=>{
  e.preventDefault();e.stopPropagation();
  const r=$("mapc").getBoundingClientRect();
  mapZoom(Math.exp(-e.deltaY*0.0022),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
$("mapc").addEventListener("dblclick",e=>{e.stopPropagation();mapFit()});
$("mapc").addEventListener("pointerdown",e=>{
  e.stopPropagation();
  const hit=mapAt(e);
  const box=$("mapc").parentNode;
  const W=box.clientWidth,H=box.clientHeight;
  const start={x:e.clientX,y:e.clientY};
  const m0=mapCam?{...mapCam}:fitMapCam(W,H);
  let moved=false;
  const mv=ev=>{
    const dx=ev.clientX-start.x, dy=ev.clientY-start.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<4)return;
    moved=true;box.classList.add("drag");
    mapCam={z:m0.z,cx:m0.cx-dx/m0.z,cy:m0.cy-dy/m0.z};
    drawMap();
  };
  const up=()=>{
    removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    box.classList.remove("drag");
    if(moved)return;                       // 拖过就只是平移地图，不跳转
    if(hit){
      mapSel=hit.f.id;
      const cs=inFrame(hit.f);
      boxTo({x:hit.f.x,y:hit.f.y,w:hit.f.w,h:hit.f.h},120,1.4);
      if(cs.length)focusIdx=S.cards.indexOf(cs[0]);
    }else{
      const p=mapToWorld(e);
      if(p){mapSel=null;camTo(-p.x*tgt.z,-p.y*tgt.z,tgt.z)}
    }
    drawMap();
  };
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
});
$("mapfit").onclick=e=>{e.stopPropagation();mapFit()};
// 面板可以拉大，页面多时看得更清楚
$("mapgrip").addEventListener("pointerdown",e=>{
  e.preventDefault();e.stopPropagation();
  const el=$("map"),r=el.getBoundingClientRect();
  const sx=e.clientX,sy=e.clientY,w0=r.width,h0=$("mapc").parentNode.clientHeight;

    const w=clamp(w0-(ev.clientX-sx),260,Math.min(900,innerWidth-40));

  };

  addEventListener("pointermove",mv);addEventListener("pointerup",up);

$("mapc").addEventListener("pointermove",e=>{
  const hit=mapAt(e);
  const id=hit?hit.f.id:null;
  const tip=$("maptip");
  if(hit){
    tip.textContent=hit.f.title||t("pageDefault");

});
$("mapc").addEventListener("pointerleave",()=>{
  $("maptip").classList.remove("on");
  if(mapHov){mapHov=null;drawMap()}
});
$("mapq").addEventListener("input",drawMap);
$("mapq").addEventListener("keydown",e=>{
  e.stopPropagation();
  if(e.key==="Escape"){$("mapq").value="";drawMap();$("mapq").blur();return}
  if(e.key==="Enter"){
    const q=$("mapq").value.trim().toLowerCase();
    const f=(S.frames||[]).slice().sort((a,b)=>a.x-b.x||a.y-b.y)
      .find(z=>(z.title||"").toLowerCase().includes(q));
    if(f){mapSel=f.id;boxTo({x:f.x,y:f.y,w:f.w,h:f.h},120,1.4);drawMap()}
  }
});
$("mapx").onclick=()=>toggleMap();

/* ================= 线性写作 =================
   稿子是画布上的一个独立页面对象，可以有很多份、各自命名。
   S.docs = [{id,x,y,title,ids:[],mode:"iter"|"ctx",open:{}}]
   打开后与画布共享同一批卡片：这里改的就是卡片本身，不产生第二份内容。
   版本存在 c.vers，c.verOn 指向当前启用的那条，当前内容始终留在 c.text / c.rich，
   其余功能（检索、导出、画布、分身）因此完全不必知道版本的存在。
*/
const docs=()=>{if(!Array.isArray(S.docs))S.docs=[];return S.docs};
let wrId=null;
const wrDoc=()=>docs().find(d=>d.id===wrId)||null;
const wrCards=()=>{const d=wrDoc();return d?d.ids.map(card).filter(Boolean):[]};
const wrOpenState=()=>document.body.classList.contains("wr");
const wrLevelOf=c=>{const o=orig(c);return o.role==="apx"?1:(o.level||0)};
const wrKids=id=>S.cards.filter(c=>c.ref&&c.wrUnder===id);

function addDoc(p,title){
  const ctr=p||toW(innerWidth/2,innerHeight/2);
  const d={id:uid(),x:Math.round(ctr.x-170),y:Math.round(ctr.y-46),
    title:title||(t("wrDocNew")+" "+(docs().length+1)),ids:[],mode:"iter",open:{}};
  snap();docs().push(d);render();save();return d;
}
const DOCW=760;                              // 正文区在世界坐标里的宽度
const SIDEW=200;                             // 大纲侧栏宽度，专注模式与画布内嵌视图共用同一份布局
// 逐级编号，专注模式的侧栏与画布内嵌视图共用同一套计算，不留第二份
function wrNums(list){
  const nums=[],counters=[];
  list.forEach(c=>{
    const lv=wrLevelOf(c);
    if(!lv){nums.push("");return}
    counters[lv-1]=(counters[lv-1]||0)+1;counters.length=lv;
    nums.push(counters.map(x=>x||0).join("."));
  });
  return nums;
}
// 大纲侧栏的 HTML：专注模式与非专注的画布内嵌视图都用它，不再各写一份
function wrOutlineHTML(list,nums){
  let sh="";
  list.forEach((c,i)=>{
    const lv=wrLevelOf(c);if(!lv)return;
    sh+=`<button class="wrnav l${Math.min(lv,4)}" data-i="${i}">
      <span class="n">${nums[i]}</span><span class="t">${esc(snippet(orig(c),40)||t("wrUntitled"))}</span></button>`;
  });
  return sh||`<div class="wrempty">${esc(t("wrNoHead"))}</div>`;
}
// 把稿子直接画在画布上：正文就地可编辑，放大只是看得更清楚，不切换到别的界面。
// 非专注状态下同样显示大纲侧栏，正文本身固定高度、内部滚动，不再无限拉长。
function renderDocs(){
  const box=$("docs");if(!box)return;
  // 重建整页会把 .dbody 的滚动条冲回顶部——新建版本、粘贴、插入这些操作都带着重绘，
  // 稿子一长，用户就会被弹回最前面，体验很差。重建前先按 id 记下每份稿子当前的
  // 滚动位置，重建完再照原样补回去。
  const scrolls=new Map();
  box.querySelectorAll(".doc").forEach(el=>{
    const dbody=el.querySelector(".dbody");
    if(dbody&&dbody.scrollTop)scrolls.set(el.dataset.id,dbody.scrollTop);
  });
  box.innerHTML="";
  docs().forEach(d=>{
    const el=document.createElement("div");el.className="doc";el.dataset.id=d.id;
    Object.assign(el.style,{left:d.x+"px",top:d.y+"px",width:(DOCW+SIDEW)+"px"});
    const list=d.ids.map(card).filter(Boolean);
    const nums=wrNums(list);
    // 标题挂在左上角外侧，跟画布上页面框的标题同一个位置、同一种改法。
    // 卡片数与字数不再占用顶上的空间：需要时侧栏的大纲已经说明了结构。
    // 模式切换、专注、导出这些功能控件放进页面内部的工具栏，跟文字工具栏并排，
    // 不再摆在标题旁边的外侧——外侧只留标题这一样东西。
    el.innerHTML=`<div class="dttl">
        <span class="dt" spellcheck="false">${esc(d.title)}</span>
      </div>
      <div class="dwrap">
        <div class="dside">${wrOutlineHTML(list,nums)}</div>
        <div class="dmain">
          <div class="dbar">
            <div class="fmtbar"></div>
            <span class="dtool">
              <button data-m="iter" class="wb${d.mode!=="ctx"?" on":""}">${esc(t("wrIter"))}</button>
              <button data-m="ctx" class="wb${d.mode==="ctx"?" on":""}">${esc(t("wrCtx"))}</button>
              <button data-a="focus" class="wb">${esc(t("wrFocus"))}</button>
              <button data-a="exp" class="wb">${esc(t("expGo"))}</button>
            </span>
          </div>
          <div class="dbody">${docBodyHTML(d,nums)}</div>
        </div>
      </div>`;
    bindDoc(el,d);
    box.appendChild(el);
  });
  docsCapNodes.clear();
  box.querySelectorAll(".cap[data-id]").forEach(el=>docsCapNodes.set(el.dataset.id,el));
  box.querySelectorAll(".fmtbar").forEach(h=>buildFmtBar(h));
  if(selDoc&&!docs().some(z=>z.id===selDoc))selDoc=null;   // 稿子已被删掉
  paintDocSel();
  applyDocStyles();syncFmtBars();
  if(scrolls.size)scrolls.forEach((top,id)=>{
    const dbody=box.querySelector(`.doc[data-id="${id}"] .dbody`);
    if(dbody)dbody.scrollTop=top;
  });
}
function docMenu(x,y,d){
  menuAt(x,y,[
    {head:d.title},
    {label:t("wrFocus"),on:()=>openWrite(d.id)},
    {label:t("wrDocRename"),on:()=>{const v=prompt(t("wrDocRename"),d.title);
      if(v!==null){snap();d.title=v.trim()||d.title;render();save()}}},
    "-",
    // 空稿子没有"末尾"可言，菜单上就该只说"粘贴"
    ...(CLIP?[{label:d.ids.length?t("wrPasteEnd"):t("wrPasteHere"),
      on:()=>wrPasteMain(d,d.ids.length)}]:[]),
    ...(WRCUT?[{label:t("wrCutEnd"),on:()=>wrCutPaste(d,d.ids.length)}]:[]),
    {label:t("wrDocExport"),on:()=>openWrExport(d,x,y)},
    "-",
    {label:t("wrDocDel"),danger:true,on:()=>{snap();
      S.docs=docs().filter(z=>z!==d);if(wrId===d.id)closeWrite();render();save()}}
  ]);
}

/* ---- 版本 ---- */
const ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
const verLabel=(v,i)=>v.name||ROMAN[i]||String(i+1);
function verList(c){const o=orig(c);if(!Array.isArray(o.vers))o.vers=[];return o.vers}
function verSnapshot(o){return {id:uid(),name:"",text:o.text||"",rich:o.rich||"",
  s:{...(o.s||{})},bg:o.bg||"",t:Date.now()}}
function verStash(c){
  const o=orig(c),vs=verList(o);
  if(!o.verOn)return;
  const cur=vs.find(v=>v.id===o.verOn);
  if(cur){cur.text=o.text||"";cur.rich=o.rich||"";cur.s={...(o.s||{})};
    cur.bg=o.bg||"";cur.t=Date.now()}
}
function verApply(o,v){o.text=v.text;if(v.rich)o.rich=v.rich;else delete o.rich;
  if(v.s)o.s={...v.s};o.bg=v.bg||""}
function verNew(c,copy){
  const o=orig(c),vs=verList(o);
  snap();
  if(!vs.length){const f=verSnapshot(o);vs.push(f);o.verOn=f.id}
  verStash(o);
  const v=verSnapshot(o);
  if(!copy){v.text="";v.rich=""}
  vs.push(v);o.verOn=v.id;verApply(o,v);save();return v;
}
function verUse(c,id){
  const o=orig(c),v=verList(o).find(z=>z.id===id);if(!v)return;
  snap();verStash(o);o.verOn=v.id;verApply(o,v);save();
}
function verDel(c,id){
  const o=orig(c),vs=verList(o);
  if(vs.length<2)return;
  const i=vs.findIndex(z=>z.id===id);if(i<0)return;
  snap();vs.splice(i,1);
  if(o.verOn===id){const v=vs[Math.max(0,i-1)];o.verOn=v.id;verApply(o,v)}
  save();
}
// 把某一版复制成独立卡片放进剪贴板，可以粘到任何平铺页面。
// 只在明确点了菜单时发生，不做任何默认行为。
function verToClip(c,vid){
  const o=orig(c),v=verList(o).find(z=>z.id===vid)
    ||{text:o.text,rich:o.rich,s:o.s,bg:o.bg};
  const sn={...o,id:uid(),text:v.text||"",rich:v.rich||"",
    s:{...(v.s||o.s||{})},bg:v.bg||o.bg||""};
  // wrIn 一定要去掉：它是"只活在这份稿子里"的标记，留着的话粘到画布上的那张卡片
  // 会被 syncCards / docOrder 一并跳过——看起来就是"复制了却什么也没发生"。
  // wrUnder 同理（那是挂在某一段折叠框下的位置），h 是别处量出来的高度也不能带走。
  ["ref","vers","verOn","lock","bib","wrUnder","wrIn","h"].forEach(k=>delete sn[k]);
  if(!sn.rich)delete sn.rich;
  // 剪贴板条目要跟 clipCards 生成的形状一致：少了 w/s/bg，pasteClip 会拿 undefined
  // 去建卡片，粘出来的宽度和样式都是坏的。
  CLIP={mode:"copy",items:[{src:o.id,snap:sn,dx:0,dy:0,
    w:o.w||520,s:{...(sn.s||{})},bg:sn.bg||""}]};
  toast(t("wrVerCopied"));
}
function wrStyleObj(o,lv){
  const st={...DEF,...S.textDef,...(o.s||{})};
  return {fontFamily:famCSS(st.family),fontSize:st.size+"px",
    fontWeight:String(lv?600:st.weight),lineHeight:String(st.lh),
    letterSpacing:st.spacing+"em",textAlign:st.align,color:st.color,
    fontStyle:st.italic?"italic":"normal"};
}

/* ---- 稿子顶上的文字工具栏 ----
   写作页的长度是固定的，工具栏钉在最上方就不必为了改个颜色一路往上拉。
   它调用的是画布那一套完全相同的函数（cmd / setInkColor / setHighlight / setAlign /
   setSize / clearFmt），不另写第二份实现，所以两边的行为一定一致。
   两条铁律照旧：整条栏在捕获阶段 preventDefault，任何一次点击都不夺走文字选区；
   字号不是输入框，只用加减两个按钮改，避免输入框抢焦点把选区弄丢。 */
function buildFmtBar(host){
  if(!host||host._built)return;
  host._built=true;
  // preventDefault 与 stopPropagation 分两条监听器挂，不能合成一条：
  // 捕获阶段 stopPropagation 会让事件根本到不了控件自己，第七节的两条铁律在这里同样适用。
  // 滑块（字距、行距）例外，否则拖不动。
  host.addEventListener("pointerdown",e=>{
    stashRange();
    if(!e.target.closest('input[type=range]'))e.preventDefault();
  },true);
  host.addEventListener("pointerdown",e=>e.stopPropagation());
  host.addEventListener("dblclick",e=>e.stopPropagation());
  // 一组功能装进一个 .fgrp：换行只发生在组与组之间，不会把一组按钮拦腰折断
  let cur=null;
  const grp=()=>{cur=document.createElement("div");cur.className="fgrp";host.appendChild(cur);return cur};
  const btn=(html,fn,title,cls)=>{
    const x=document.createElement("button");
    x.className="fx"+(cls?" "+cls:"");x.innerHTML=html;
    if(title)x.title=title;
    x.addEventListener("click",e=>{e.stopPropagation();fn(x)});
    (cur||host).appendChild(x);return x;
  };
  const sep=()=>{const s=document.createElement("span");s.className="fsep";host.appendChild(s)};
  // 色块分成两半：点色块本身直接套用当前色（跟标准工具栏一样，划完选区一点就生效），
  // 小三角才展开弹层换色——原来整块都只会开弹层，划完选区还得再点一次色块才真的套上，
  // 等于多切换一步
  const swatchCell=(chipId,colors,apply,onMain,noneLabel,onNone,title)=>{
    const cell=document.createElement("div");cell.className="fcell split";(cur||host).appendChild(cell);
    const main=document.createElement("button");main.className="fx half";
    main.innerHTML=`<span class="chip" id="${chipId}"></span>`;
    if(title)main.title=title;
    main.addEventListener("click",e=>{e.stopPropagation();onMain()});
    cell.appendChild(main);
    const pop=document.createElement("div");pop.className="fpop";
    const trig=document.createElement("button");
    trig.className="fx caret";
    trig.innerHTML='<span class="car">\u25BE</span>';
    trig.addEventListener("click",e=>{
      e.stopPropagation();
      const was=pop.classList.contains("on");
      closeFmtPops();
      if(!was){pop.classList.add("on");trig.classList.add("on");placePop(cell,pop)}
    });
    cell.appendChild(trig);
    const sws=document.createElement("div");sws.className="sws";
    colors.forEach(v=>{
      const s=document.createElement("button");s.style.background=v||"transparent";
      if(!v)s.textContent="\u2298";
      s.addEventListener("click",e=>{e.stopPropagation();closeFmtPops();apply(v)});
      sws.appendChild(s);
    });
    pop.appendChild(sws);
    if(noneLabel){
      const n=document.createElement("button");n.className="none";n.textContent=noneLabel;
      n.addEventListener("click",e=>{e.stopPropagation();closeFmtPops();onNone()});
      pop.appendChild(n);
    }
    cell.appendChild(pop);
    return trig;
  };
  // 带弹层但内容不是色块的控件：字体、间距、模板、锁定都走这里，
  // build(pop) 里自己拼内容，跟标准工具栏 buildBar 里的 cellWith 是同一个思路。
  // **弹层永远不许是空的**：build 完一个孩子都没有（没选中段落时的间距、锁定就是这种情况），
  // 就补一句"先选中一段文字"。早先这里直接把空框弹出来，界面上凭空多两个什么都没有的
  // 白盒子，看起来像坏了——这条不要省。
  const popCell=(html,build,cls,title)=>{
    const cell=document.createElement("div");cell.className="fcell";(cur||host).appendChild(cell);
    const pop=document.createElement("div");pop.className="fpop"+(cls?" "+cls:"");
    const trig=document.createElement("button");
    trig.className="fx";trig.innerHTML=html;
    if(title)trig.title=title;
    trig.addEventListener("click",e=>{
      e.stopPropagation();
      const was=pop.classList.contains("on");
      closeFmtPops();
      if(was)return;
      pop.innerHTML="";build(pop);
      if(!pop.children.length){
        const n=document.createElement("div");n.className="fnote";n.textContent=t("fmtNeedSel");
        pop.appendChild(n);
      }
      pop.classList.add("on");trig.classList.add("on");placePop(cell,pop);
    });
    cell.appendChild(trig);cell.appendChild(pop);
    return {cell,pop,trig};
  };
  const car='<span class="car">\u25BE</span>';
  const ico=d=>`<span class="fico"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg></span>`;

  // 弹层一律向左对齐展开，但画布上的稿子有 .dwrap{overflow:hidden}，
  // 靠右的控件（间距、锁定、清除那一带）弹出来会被稿子的右边缘直接切掉一截，
  // 滑块的数值就看不见了。所以打开时量一下：探出去就改成右对齐。
  const placePop=(cell,pop)=>{
    pop.style.left="0";pop.style.right="auto";
    const box=cell.closest(".dwrap")||cell.closest("#wrbar")||document.documentElement;
    const lim=box.getBoundingClientRect().right-6;
    if(pop.getBoundingClientRect().right>lim){pop.style.left="auto";pop.style.right="0"}
  };

  /* ---------- 一、文字：字重字形与链接 ---------- */
  grp();
  btn("<b>B</b>",()=>cmd("bold"),t("fmtB"));
  btn("<i>I</i>",()=>cmd("italic"),t("fmtI"));
  btn("<u>U</u>",()=>cmd("underline"),t("fmtU"));
  btn("<s>S</s>",()=>cmd("strikeThrough"),t("fmtS"));
  // 链接原来是个彩色的 emoji 锁链，在一排线条图标里格外扎眼，改成同一套描边图标
  btn(ico('<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>'),
    setTextLink,t("link"));
  sep();

  /* ---------- 二、字体与字号 ---------- */
  grp();
  // 字体：跟标准工具栏共用同一份 FONTS 表与 setFamily，不是另写一套
  popCell(`<span class="lbl" id="wffam">Font</span>${car}`,pop=>{
    const sc=document.createElement("div");sc.className="scroll";
    const cur2=curFamily();
    ["en","zh"].forEach(g=>{
      const h=document.createElement("div");h.className="hd2";
      h.textContent=g==="en"?t("grpEn"):t("grpZh");sc.appendChild(h);
      FONTS.filter(f=>f[2]===g).forEach(f=>{
        const it=document.createElement("button");
        it.className="item"+(cur2===f[0]?" on":"");
        it.textContent=famName(f[0]);
        it.style.fontFamily=f[1];it.style.fontSize="13px";it.style.fontWeight="400";
        it.addEventListener("click",e=>{e.stopPropagation();setFamily(f[0]);closeFmtPops();syncFmtBars()});
        sc.appendChild(it);
      });
    });
    pop.appendChild(sc);
  },"wide",t("font"));
  // 字号只用加减按钮改，不做成输入框：输入框一拿到焦点，选区必丢
  btn("\u2212",()=>setSize(curSize()-1),t("fmtSmaller"));
  const szl=document.createElement("span");szl.className="fsz";cur.appendChild(szl);
  host._sz=szl;
  btn("+",()=>setSize(curSize()+1),t("fmtBigger"));
  sep();

  /* ---------- 三、颜色：文字色、荧光笔、整段底色 ----------
     三样都是"上色"，摆在一起才好找。底色原来夹在段落与模板中间，
     跟前两个隔着半条栏，改个颜色要在两处来回找。
     chip 的顺序（墨色、荧光、底色）就是 syncFmtBars 里 chips[0..2] 的顺序，改动要一起改。 */
  grp();
  swatchCell("fmtink",INK,v=>{S.lastInk=v;save();setInkColor(v);syncFmtBars()},
    ()=>{setInkColor(lastInk());syncFmtBars()},null,null,t("fmtInk"));
  swatchCell("fmthl",HLS,v=>{S.lastHL=v;save();setHighlight(v);syncFmtBars()},
    ()=>{setHighlight(lastHL());syncFmtBars()},
    t("fmtNoHL"),()=>setHighlight("none"),t("fmtHL"));
  swatchCell("fmtbg",CARDBG,v=>{if(v)S.lastBg=v;save();setCardBg(v);syncFmtBars()},
    ()=>{setCardBg(lastBg());syncFmtBars()},null,null,t("cardBg"));
  sep();

  // 指定断点：窄的时候在这里折行，"改字"与"改段"各占一行，长度也接近
  host.appendChild(Object.assign(document.createElement("span"),{className:"fbrk"}));

  /* ---------- 四、段落：对齐，以及字重/字距/行距 ----------
     对齐是三个常用动作，留成三个按钮；其余细项收进一个**有名字**的弹层。
     早先这里是一个光秃秃的小三角，既看不出是干什么的，没选中段落时点开还是个空框。 */
  grp();
  // 「间距」是固定的字，不用 .lbl 那个固定宽度（那是给会变长短的字体名/模板名用的）
  // 层级：稿子里的标题层级就是画布上的 c.level，同一套数据（侧栏目录、编号、
  // 导出的标题级别全都读它）。写作页原来只能显示层级、没法设定，
  // 想把一段改成二级标题得先回画布上去点右键菜单——这里补上。
  // 用的就是画布那套 setLevel()，不另起炉灶。
  const lvl=popCell(`<span class="lbl lvl" id="wflv">${esc(t("lvShortNone"))}</span>${car}`,pop=>{
    const c=barCard();if(!c)return;
    const o=orig(c),now=o.role?-1:(o.level||0);
    [[0,"lvShortNone"],[1,"lvShort1"],[2,"lvShort2"],[3,"lvShort3"]].forEach(([v,k])=>{
      const it=document.createElement("button");
      it.className="item"+(now===v?" on":"");
      it.textContent=t(k);
      it.addEventListener("click",e=>{e.stopPropagation();
        setLevel(v);closeFmtPops();syncFmtBars()});
      pop.appendChild(it);
    });
  },null,t("level"));
  lvl.trig.dataset.need="card";

  // 顺序：先定这一段是什么（层级），再定它怎么摆（对齐），最后才是间距细调
  ["left","center","right"].forEach(v=>btn(alSvg(v),()=>{setAlign(v);syncFmtBars()},t("fmtAlign")));
  const para=popCell(`<span>${esc(t("fmtSpacing"))}</span>${car}`,pop=>{
    const c=barCard();if(!c)return;
    const st={...DEF,...S.textDef,...(c.s||{})};
    const h2=document.createElement("div");h2.className="hd2";h2.textContent=t("weight");
    pop.appendChild(h2);
    const seg2=document.createElement("div");seg2.className="seg";
    [300,400,500,700].forEach(w=>{
      const x=document.createElement("button");x.textContent=w;
      if(+st.weight===w)x.classList.add("on");
      x.addEventListener("click",e=>{e.stopPropagation();cardSnapStyle(()=>setStyle("weight",w));
        [...seg2.children].forEach(z=>z.classList.remove("on"));x.classList.add("on");syncFmtBars()});
      seg2.appendChild(x);
    });
    pop.appendChild(seg2);
    const mkSld=(labText,min,max,step,val,fmt,fn)=>{
      const r=document.createElement("div");r.className="rowp";
      const l=document.createElement("label");l.textContent=labText;r.appendChild(l);
      const i=document.createElement("input");i.type="range";i.min=min;i.max=max;i.step=step;i.value=val;
      const v=document.createElement("span");v.className="val";v.textContent=fmt(val);
      i.addEventListener("input",()=>{v.textContent=fmt(i.value);fn(+i.value)});
      i.addEventListener("keydown",e=>e.stopPropagation());
      r.appendChild(i);r.appendChild(v);pop.appendChild(r);
    };
    mkSld(t("trackShort"),-5,40,1,Math.round(st.spacing*100),x=>(x/100).toFixed(2),
      x=>setStyle("spacing",x/100));
    mkSld(t("leadShort"),90,260,5,Math.round(st.lh*100),x=>(x/100).toFixed(2),
      x=>setStyle("lh",x/100));
  },"para",t("fmtSpacing"));
  para.trig.dataset.need="card";
  sep();

  /* ---------- 五、整段：模板与锁定 ---------- */
  grp();
  // 模板：跟标准工具栏共用同一份模板列表
  popCell(`<span class="lbl" id="wftpl">${esc(t("tplShort"))}</span>${car}`,pop=>{
    const add=(arr,head)=>{
      if(!arr.length)return;
      const h=document.createElement("div");h.className="hd2";h.textContent=head;pop.appendChild(h);
      arr.forEach(tp=>{
        const it=document.createElement("button");
        it.className="item"+((S.lastTpl===tp.id)?" on":"");
        it.textContent=tp.name;
        it.addEventListener("click",e=>{e.stopPropagation();
          S.lastTpl=tp.id;save();applyTemplate(tp);closeFmtPops();syncFmtBars()});
        pop.appendChild(it);
      });
    };
    add(S.templates||[],t("tplInFile"));
    add(GTPL,t("tplGlobal"));
    if(!(S.templates||[]).length&&!GTPL.length){
      const n=document.createElement("div");n.className="fnote";n.textContent=t("tplHowto");
      pop.appendChild(n);
    }
  },"wide",t("tplShort"));
  // 锁定在写作页只有一档：稿子里的段落是顺着读下来的，没有"位置"可锁
  // （它们的 x/y 只是拷贝时随手写的稿子左上角，画布上根本不出现）。

/* ---- 从画布导入 ---- */
// 送进稿子的是内容的拷贝，不是原卡片的另一份投影。早先这里直接把原 id 塞进 d.ids，
// 卡片因此同时活在两个地方（画布上自己的位置 + 稿子里），这正是后来一连串
// "工具栏在外部卡片上打架/消失"回归的根源：hostOfCard、syncBar 都得靠猜
// "现在到底是在编辑哪一份"，而这两份其实是同一个对象。
// 现在 wrImport 只读原卡片的内容，落地成一张全新、只属于这份稿子的卡片（wrIn 标记），
// 原卡片在画布上的位置和内容完全不受影响，稿子里的这一份也可以随便改、随便删，
// 两边彻底独立，不再需要任何"猜当前上下文"的逻辑。
// 分身/引用要的是相反的效果——跟着源卡片一起变——那条路走 wrPasteTwin，不受此影响。
// ---- 送进稿子的顺序：结构连线优先，空间位置其次 ----
// 框选得到的 sel 是 S.cards 的数组顺序（也就是卡片的创建先后），clipCards 又把它原样
// 存进 CLIP.items，于是"复制一批卡片、粘到写作页"落地的段落顺序跟画布上的结构毫无关系：
// 用结构线挂在某个二级标题后面的正文，只要它建得比标题早，就会整批浮到稿子最前面，
// 看起来就是"层级信息完全丢了"。真正该决定顺序的是结构连线，其次才是空间位置，
// 剪贴板里的先后从来都不该作数。写作页所有的入口（剪贴板粘贴、从画布导入）都走这里。
//
// 用的是树本身的顺序（buildTree().roots 的深度优先展开），**不是 .flat**：
// .flat 还额外过了一道 pullTogether——关联连线（非结构线）会把相关的正文拉到相邻位置，
// 那是导出成文时的排版意图，会把一段正文从它的结构父节点下面拽走，
// 正是这里最不该发生的事。导出路径继续用 .flat，两边各取所需，互不影响。
function wrOrderRank(ids){
  const set=new Set((ids||[]).filter(Boolean));
  const rank=new Map();
  if(set.size<2)return rank;                     // 一张卡片无所谓顺序，省掉建树
  // 画布上确实有结构连线时才值得建一次树；没有结构线就直接退回空间顺序
  if(S.outline!==false&&structLinks().length){
    const walk=l=>{
      for(const n of l){
        const id=n&&n.c&&n.c.id;
        if(id&&set.has(id)&&!rank.has(id))rank.set(id,rank.size);
        if(n&&n.children&&n.children.length)walk(n.children);
      }
    };
    walk(buildTree().roots);
  }
  // 结构线没串到的（或压根没有结构线时的全部），按画布的空间阅读顺序接在后面
  if(rank.size<set.size){
    const rest=[...set].filter(id=>!rank.has(id)).map(card).filter(Boolean);
    flow(rest).forEach(c=>{if(!rank.has(c.id))rank.set(c.id,rank.size)});
  }
  return rank;
}
const WR_TAIL=1e9;         // 画布上已经找不到的源卡片：保持原有先后，一律排在最后
function wrOrderIds(ids){
  const list=[...new Set((ids||[]).filter(Boolean))];
  if(list.length<2)return list;
  const rank=wrOrderRank(list);
  return list.map((id,i)=>({id,i,r:rank.has(id)?rank.get(id):WR_TAIL}))
    .sort((a,b)=>(a.r-b.r)||(a.i-b.i)).map(z=>z.id);
}
// 剪贴板条目同理：按各自的源卡片在大纲里的位置排。源卡片已经删掉的排不进树，
// 就保持它们原有的先后接在最后，绝不丢条目。
function wrOrderItems(items){
  if(!items||items.length<2)return items||[];
  const rank=wrOrderRank(items.map(it=>it.src));
  return items.map((it,i)=>({it,i,r:rank.has(it.src)?rank.get(it.src):WR_TAIL}))
    .sort((a,b)=>(a.r-b.r)||(a.i-b.i)).map(z=>z.it);
}
function wrCloneCard(c,d){
  const snap0=JSON.parse(JSON.stringify(cleanCard(orig(c))));
  const n={...snap0,id:uid(),x:Math.round(d.x),y:Math.round(d.y),w:c.w,
    s:{...(c.s||{})},wrIn:d.id};
  delete n.ref;delete n.lock;
  if(c.bg)n.bg=c.bg;else delete n.bg;
  return n;
}
function wrImport(ids,append,docId){
  const list=(ids&&ids.length?ids.map(card).filter(Boolean):[]);
  if(!list.length){toast(t("wrPickFirst"));return}
  let d=docs().find(z=>z.id===docId)||wrDoc()||docs()[0];
  if(!d)d=addDoc(null,null);
  const seq=wrOrderIds(list.map(c=>c.id));   // 结构连线优先，空间顺序兜底
  snap();
  const made=seq.map(id=>{
    const n=wrCloneCard(card(id),d);
    invalidateIndex();S.cards.push(n);
    return n.id;
  });
  d.ids=append?[...d.ids,...made]:made;
  save();render();
  toast(t("wrAdded").replace("{n}",made.length).replace("{d}",d.title));
}

// 正文块的 HTML，画布上的稿子与专注模式共用同一份。
// .cap 一律从"未编辑"开始：单击只是选中这一段（跟普通页面的卡片一样），
// 双击才真正进入编辑，行为由 bindBody 里的 pointerdown/dblclick 接管。
function docBodyHTML(d,extNums){
  const list=d.ids.map(card).filter(Boolean);

  if(!list.length)return `<div class="dempty">${esc(t("wrEmpty"))}</div>`;
  const ctx=d.mode==="ctx";

    const locked=isLocked(c.id);
    // 选中但未编辑的高亮直接烧进 className，跟画布卡片一致：
    // 这样任何一次重绘（比如别处打字触发的防抖刷新）都不会把选中状态悄悄丢掉，
    // 否则 backspace 会因为找不到 .blk.sel 而落到误删源卡片的那条老路上
    const selCls=(!editing&&sel.length===1&&sel[0]===c.id)?" sel":"";
    // 正文默认就是可以直接打字的：点哪里光标落哪里，跟 Word 一样，
    // 不必先双击"进入编辑"。锁定的段落仍然只读。
    const edit=(!lock&&!locked)?"true":"false";
    const body=`<div class="cap${lv?" hd lv"+Math.min(lv,4):""}"
      contenteditable="${edit}" data-id="${c.id}" data-ph="${esc(t("placeholder"))}" spellcheck="false"
      >${o.rich?safeRich(o.rich):esc(o.text||"")}</div>`;
    if(ctx){
      h+=`<div class="blk ctx${locked?" lk":""}${selCls}" data-i="${i}" data-id="${c.id}">
        <div class="wrap" style="${wrapS}">${body}</div></div>`;
      return;
    }
    const kids=wrKids(c.id);
    const openF=!!(d.open&&d.open[c.id]);
    h+=`<div class="blk${lv?" hd":""}${locked?" lk":""}${selCls}" data-i="${i}" data-id="${c.id}">
      <div class="gut">
        ${lv?`<button class="num" data-id="${c.id}" title="${esc(t("numGo"))}">${nums[i]}</button>`:""}
        ${vs.length>1?`<span class="vb">${vs.map((v,k)=>
          `<button class="vv${v.id===o.verOn?" on":""}" data-i="${i}" data-v="${v.id}"
            title="${esc(verLabel(v,k))}">${esc(verLabel(v,k))}</button>`).join("")}</span>`:""}
      </div>
      <div class="wrap" style="${wrapS}">${body}</div>
      <div class="fold${kids.length?" has":""}${openF?" on":""}" data-id="${c.id}">
        <button class="fh" data-id="${c.id}"><span class="ar">\u203A</span></button>
        <div class="fb">${kids.length?kids.map(k=>{
          const ko=orig(k);
          return `<div class="ref" data-id="${k.id}" contenteditable="false"
            >${ko.rich?safeRich(ko.rich):esc(ko.text||"")}</div>`;
        }).join(""):`<div class="rempty">${esc(t("wrRefsNone"))}</div>`}</div>
      </div>
    </div>`;
  });
  return h;
}
function bindDoc(el,d){
  // 标题跟页面框的标题一个规矩：点一下是"选中这份稿子"（随后按 Z 就能定位过去），
  // 按住可以拖动整页，右键出菜单（改名在菜单里），双击才就地改名。
  // 早先它是 contenteditable，点一下光标就进去了——想选中它反而没有办法。
  const dt=el.querySelector(".dt");
  dt.addEventListener("pointerdown",e=>{
    if(lock||e.button!==0)return;
    e.stopPropagation();
    selectDoc(d.id);
    startDocMove(e,d);
  });
  dt.addEventListener("dblclick",e=>{
    if(lock)return;e.stopPropagation();
    const v=prompt(t("wrDocRename"),d.title);
    if(v!==null){snap();d.title=v.trim()||d.title;save();renderDocs()}
  });
  el.querySelectorAll(".dtool button").forEach(b=>{
    b.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation()});
    b.addEventListener("click",e=>{
      e.stopPropagation();
      if(b.dataset.m){snap();d.mode=b.dataset.m;save();renderDocs();return}
      if(b.dataset.a==="focus"){openWrite(d.id);return}
      if(b.dataset.a==="exp")openWrExport(d,e.clientX,e.clientY);
    });
  });
  // stage 自己有一套"双击空白画布新建卡片"的逻辑，它不认识 .doc 内部的任何东西，
  // 所以这份稿子范围内的双击一律拦住，不然稿子的空白（标题栏、版本号栏、折叠框……）
  // 一双击就会在画布上凭空冒出一张新卡片
  el.addEventListener("dblclick",e=>{if(!lock)e.stopPropagation()});
  // 空白处拖动整页：只排除真正可交互的控件本身，version 号栏、折叠框的空白、
  // 侧栏空白都仍然留给拖动，不然这份稿子会变得几乎无处可抓
  el.addEventListener("pointerdown",e=>{
    if(lock){e.stopPropagation();return}
    if(e.button!==0)return;
    // 稿子内部的**任何**按下都不许冒到画布上去。
    // 早先这里对 .ref/.fold/.vv 这些控件是直接 return（不拦截），事件于是一路到 stage，
    // 在整张画布上拉起框选——表现就是"在稿子里按住一拖，蒙出一个灰色的大方框"，
    // 那是画布用来圈选卡片的东西，跟稿子里的文字选中完全是两回事。
    // 菜单该关还是要关，所以这一步单独补上（原来由 stage 的 pointerdown 顺手做）。
    closeMenus();
    e.stopPropagation();
    if(e.target.closest(".wrap,.dt,.dtool,.vv,.fh,.fold,.ref,.wrnav,.fmtbar"))return;
    startDocMove(e,d);
  });
  el.addEventListener("contextmenu",e=>{
    if(lock)return;
    e.preventDefault();e.stopPropagation();
    wrContextMenu(e,d);
  });
  // 非专注状态下的侧栏：点大纲条目滚动到对应段落，不需要打开专注模式；
  // 空白处仍然可以拖动整份稿子，只拦住大纲按钮本身
  const side=el.querySelector(".dside");
  if(side){
    side.addEventListener("pointerdown",e=>{if(e.target.closest(".wrnav"))e.stopPropagation()});
    side.addEventListener("click",e=>{
      const b=e.target.closest(".wrnav");if(!b)return;
      scrollBlockInto(el.querySelector(".dbody"),
        el.querySelector(`.dbody .blk[data-i="${b.dataset.i}"]`));
    });
  }
  bindBody(el,d);
}
// 引用框里的顺序就是 wrKids 的顺序，而 wrKids 读的是 S.cards 的数组顺序。
// 所以"调整引文顺序"= 把这几张卡片在 S.cards 里按新顺序重新摆一遍：
// 占用的还是原来那几个位置，只是内容对调，别的卡片一张都不动。
// 不新增字段，存档格式不变，SCHEMA 不用加一。
function commitRefOrder(box){
  if(!box)return;
  const ids=[...box.querySelectorAll(":scope > .ref[data-id]")].map(z=>z.dataset.id);
  const objs=ids.map(id=>card(id));
  if(!ids.length||objs.some(z=>!z))return;
  const set=new Set(ids),slots=[];
  S.cards.forEach((c,i)=>{if(set.has(c.id))slots.push(i)});
  if(slots.length!==ids.length)return;
  if(slots.every((p,i)=>S.cards[p].id===ids[i]))return;      // 顺序没变，别白存一次
  snap();
  slots.forEach((p,i)=>{S.cards[p]=objs[i]});
  invalidateIndex();save();redrawDocs();
}
// 把某一段滚进它自己的滚动容器。
// **不要用 scrollIntoView**：它会连带滚动所有祖先滚动容器，
// 而 #stage 即使写了 overflow:hidden 依然可以被脚本滚动。
// 实测点一次大纲条目就把 #stage 滚了 236px，整张画布连同稿子一起错位，
// 表现就是"点左侧条目之后写作页跳成另一种布局"。
// 这里只改目标容器的 scrollTop，别的一概不碰。
function scrollBlockInto(box,el){
  if(!box||!el)return;
  const br=box.getBoundingClientRect(),er=el.getBoundingClientRect();
  // 画布上的稿子整体带着缩放，屏幕像素要换算回内容像素才能和 scrollTop 对齐
  const sc=(box.offsetHeight&&br.height/box.offsetHeight)||1;
  const top=box.scrollTop+(er.top-br.top)/sc-12;
  const max=Math.max(0,box.scrollHeight-box.clientHeight);
  box.scrollTo({top:Math.max(0,Math.min(top,max)),behavior:"smooth"});
}
// 选中一份稿子（并清掉卡片/连线的选中，三者互斥）
function selectDoc(id){
  selDoc=id||null;
  if(selDoc){sel=[];selLink=null}
  paintDocSel();paintSel();
}
function paintDocSel(){
  const box=$("docs");if(!box)return;
  box.querySelectorAll(".doc").forEach(el=>
    el.classList.toggle("on",el.dataset.id===selDoc));
}
function startDocMove(e,d){
  // 抓住稿子的空白处就等于选中了这份稿子：跟画布上点一张卡片是同一个意思。
  // 没有这一步，稿子永远进不了任何选中状态，按 Z 自然什么都不会发生。
  selectDoc(d.id);
  const sx=e.clientX,sy=e.clientY,ox=d.x,oy=d.y;
  let moved=false;
  const mv=ev=>{
    const dx=(ev.clientX-sx)/cam.z,dy=(ev.clientY-sy)/cam.z;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<3)return;
    if(!moved){snap();moved=true}
    d.x=Math.round(ox+dx);d.y=Math.round(oy+dy);
    const el=$("docs").querySelector(`.doc[data-id="${d.id}"]`);
    if(el){el.style.left=d.x+"px";el.style.top=d.y+"px"}
  };
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    if(moved)save()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}
// 专注模式：同一份正文加一个侧栏目录，用于长时间集中写作
function drawWrite(){

  main.innerHTML=docBodyHTML(d,nums);
  main.scrollTop=scrollTop;
  wrmainCapNodes.clear();

  applyDocStyles(main);

/* ---- 交互 ---- */
let wrT,wrSideT;
// 打字停下之后把大纲跟上。**只重画侧栏**，绝不碰正文：
// 正文一旦被重建，正在打字的那个节点就没了，光标随之消失。
