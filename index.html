<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;
    font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background:#F4F4F2;color:#111}
  [contenteditable]{outline:none}
  button,select,input{font:inherit;color:inherit}

  #stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:default}
  #stage.pan{cursor:grabbing}
  #world{position:absolute;left:50%;top:50%;transform-origin:0 0;--iz:1}
  #links{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none}
  #links path.ln,#links path.hit{fill:none}
  #links path.hit{stroke:transparent;stroke-width:16px;pointer-events:stroke;cursor:pointer}

  .frame{position:absolute;border:calc(1.5px * var(--iz)) solid var(--fr);
    border-radius:calc(4px * var(--iz));background:var(--frbg);pointer-events:none}
  .frame .ttl{position:absolute;left:0;bottom:100%;margin-bottom:calc(5px * var(--iz));
    font:500 calc(12px * var(--iz))/1.2 "IBM Plex Sans","PingFang SC",sans-serif;
    color:var(--fr);white-space:pre;pointer-events:auto;cursor:move;padding:calc(2px * var(--iz)) 0}
  .frame.sel{border-color:var(--frame)}
  .frame.sel .ttl{color:var(--frame)}
  .frame .fr-rs{position:absolute;right:calc(-5px * var(--iz));bottom:calc(-5px * var(--iz));
    width:calc(11px * var(--iz));height:calc(11px * var(--iz));border-radius:50%;background:#fff;
    border:calc(1px * var(--iz)) solid var(--frame);cursor:nwse-resize;pointer-events:auto;display:none}
  .frame.sel .fr-rs{display:block}
  body.lock .frame .fr-rs{display:none !important}
  .card{position:absolute;user-select:none}
  .card img{width:100%;height:auto;display:block;border-radius:2px;pointer-events:none;
    box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .card table.tb{border-collapse:collapse;table-layout:fixed;width:100%;
    background:var(--tbbg);border-radius:2px;overflow:hidden}
  .card table.tb td{border:1px solid var(--tbln);padding:.42em .6em;vertical-align:top;
    word-break:break-word;overflow-wrap:anywhere;position:relative;
    white-space:pre-wrap}               /* 单元格内的换行要保留 */
  /* 空单元格要和有字的一样高：用一个零宽占位撑起一整行的行高，
     它是伪元素，不会进入 innerText，也不会被复制或导出 */
  .card table.tb td:empty:before{content:"\200b"}
  .card table.tb tr.hd td{font-weight:600;background:var(--tbhd)}
  .card table.tb td.hc{font-weight:600;background:var(--tbhd)}
  .card table.tb td[contenteditable=true]{outline:none;background:var(--tbedit)}
  .card table.tb td.tsel:after{content:"";position:absolute;inset:0;pointer-events:none;
    background:var(--tbmark)}
  .card table.tb td.tsel[contenteditable=true]:after{display:none}
  .card .tbwrap{position:relative}
  .card .cgrip{position:absolute;top:0;bottom:0;
    width:calc(10px * var(--iz));margin-left:calc(-5px * var(--iz));
    cursor:col-resize;z-index:6;background:transparent}
  .card .cgrip:after{content:"";position:absolute;left:50%;top:0;bottom:0;
    width:calc(3px * var(--iz));margin-left:calc(-1.5px * var(--iz));border-radius:calc(2px * var(--iz));
    background:var(--frame);opacity:0;transition:opacity .12s}
  .card.sel .cgrip:after{opacity:.22}
  .card .cgrip:hover:after,.card .cgrip.on:after{opacity:.85}
  body.lock .card .cgrip{display:none}
  .card .cap{margin-top:10px;white-space:pre-wrap;word-break:break-word;min-height:1em}
  .card .cap:empty:before{content:attr(data-ph);opacity:.28}
  .card .cap[contenteditable=true]{user-select:text;cursor:text;
    box-shadow:0 0 0 calc(1px * var(--iz)) rgba(0,0,0,.18);border-radius:2px}
  .card.sel .ring{position:absolute;inset:calc(-7px * var(--iz));pointer-events:none;
    border:calc(1px * var(--iz)) solid var(--frame)}
  .card.multi .ring{border-style:dashed}
  .card .hnd{position:absolute;width:calc(8px * var(--iz));height:calc(8px * var(--iz));
    background:#fff;border-radius:50%;border:calc(1px * var(--iz)) solid var(--frame);
    box-shadow:0 calc(1px * var(--iz)) calc(2px * var(--iz)) rgba(0,0,0,.22);
    transform:translate(-50%,-50%);display:none;z-index:5}
  .card.sel .hnd{display:block}
  .card.multi .hnd{display:none}
  .card .hnd:hover{background:var(--frame)}
  .card .hnd.nw,.card .hnd.se{cursor:nwse-resize}
  .card .hnd.ne,.card .hnd.sw{cursor:nesw-resize}
  .card .hnd.n,.card .hnd.s{cursor:ns-resize}
  .card .hnd.e,.card .hnd.w{cursor:ew-resize}
  .card .port{position:absolute;width:calc(30px * var(--iz));height:calc(30px * var(--iz));
    transform:translate(-50%,-50%);opacity:0;cursor:crosshair;z-index:3;pointer-events:none;
    display:flex;align-items:center;justify-content:center;transition:opacity .12s}
  .card .port:before{content:"";width:calc(9px * var(--iz));height:calc(9px * var(--iz));
    border-radius:50%;background:var(--frame);border:calc(1.5px * var(--iz)) solid #fff;
    box-shadow:0 0 calc(2px * var(--iz)) rgba(0,0,0,.25);transition:transform .12s}
  .card:hover .port{opacity:.9;pointer-events:auto}
  .card .port:hover{opacity:1}
  .card .port:hover:before{transform:scale(1.45)}

  /* presentation lock */
  body.lock .port,body.lock .hnd,body.lock .ring{display:none !important}
  body.lock .card{cursor:zoom-in}
  body:not(.lock) .card img{cursor:zoom-in}
  body.lock .card .cap:empty:before{content:""}

  .menu{position:fixed;z-index:80;min-width:190px;padding:5px;border-radius:10px;
    max-height:calc(100vh - 16px);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;
    background:var(--panel);color:var(--pfg);border:1px solid var(--pline);
    box-shadow:0 14px 40px rgba(0,0,0,.18);display:none;font-size:13px}
  .menu.on{display:block}
  .mi{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:none;background:none;
    border-radius:6px;cursor:pointer;text-align:left;white-space:nowrap}
  .mi:hover,.mi.open{background:var(--phi)}
  .mi .k{margin-left:auto;opacity:.4;font:400 10.5px/1 "IBM Plex Mono",monospace}
  .mi.dz{color:#C0392B}
  .msep{height:1px;background:var(--pline);margin:4px 5px}
  .mhd{font:400 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
    opacity:.42;padding:8px 9px 5px}

  .pop{position:fixed;z-index:90;width:252px;padding:12px 13px 14px;border-radius:11px;
    background:var(--panel);color:var(--pfg);border:1px solid var(--pline);
    box-shadow:0 16px 44px rgba(0,0,0,.2);display:none;font-size:12.5px}
  .pop.on{display:block}
  .pop.wide{width:312px}
  .pop .sec{font:400 9.5px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
    opacity:.4;margin:14px 0 7px}
  .pop .sec:first-of-type{margin-top:10px}
  .pop .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pop .grid button,.pop .pair button{height:32px;border:1px solid var(--pline);background:none;
    border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap;padding:0 4px}
  .pop .grid button.on,.pop .pair button.on{background:var(--pfg);color:var(--panel);border-color:var(--pfg)}
  .pop .grid button:disabled,.pop .pair button:disabled{opacity:.3;cursor:default}
  .pop .pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pop .trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .pop .opt{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;cursor:pointer}
  .pop .opt input{accent-color:var(--pfg);width:14px;height:14px;margin:0}
  .pop .go{width:100%;height:36px;margin-top:16px;border:none;border-radius:8px;cursor:pointer;
    background:var(--pfg);color:var(--panel);font-size:13px;letter-spacing:.02em}
  .pop .go:hover{opacity:.88}
  .pop .hd{display:flex;align-items:center;margin:0 0 10px}
  .pop .hd b{font:500 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.02em}
  .pop .hd button{margin-left:auto;border:none;background:none;cursor:pointer;opacity:.45;font-size:15px;padding:0 2px}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0}
  .row label{width:46px;opacity:.55;font-size:11.5px;flex:none}
  .row input[type=range]{flex:1;accent-color:var(--pfg);height:18px}
  .row .val{width:34px;text-align:right;font:400 11px/1 "IBM Plex Mono",monospace;opacity:.6}
  .row select{flex:1;height:29px;border-radius:6px;border:1px solid var(--pline);background:none;padding:0 6px}
  .seg{display:flex;flex:1;gap:3px}
  .seg button{flex:1;height:28px;border:1px solid var(--pline);background:none;border-radius:6px;cursor:pointer;font-size:12px}
  .seg button.on{background:var(--pfg);color:var(--panel);border-color:var(--pfg)}
  .sw{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  .sw button{width:20px;height:20px;border-radius:50%;border:1px solid var(--pline);cursor:pointer;padding:0}
  .sw input[type=color]{width:22px;height:22px;padding:0;border:1px solid var(--pline);border-radius:50%;background:none;cursor:pointer}

  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    font-size:13px;opacity:.32;line-height:2;pointer-events:none;z-index:5}
  body.hidecur,body.hidecur *{cursor:none !important}
  .card.lkpos .hnd{display:none !important}
  /* 锁定的卡片仍可划选文字以便复制引文，只是不能编辑 */
  /* 仅锁内容的卡片还能拖动，所以拖动用于移动，不去选文字 */

function normUrl(u){
  u=(u||"").trim();
  if(!u)return "";
  if(/^(https?|mailto|file):/i.test(u))return u;
  if(/^10\.\d{4,}\//.test(u))return "https://doi.org/"+u;   // 直接粘 DOI 也认
  return "https://"+u.replace(/^\/+/,"");
}
function shortUrl(u){

}

// 在页面里找一块空位，避免叠在已有内容上
function freeSpotIn(f,w,h){
  const inside=inFrame(f);
  const x=f.x+24;
  let y=f.y+30;
  if(inside.length)y=Math.max(y,Math.max(...inside.map(z=>z.y+hOf(z)))+36);
  if(y+h>f.y+f.h){                       // 页面装不下就把页面撑高
    f.h=Math.round(y+h-f.y+30);
  }
  return {x:Math.round(Math.min(x,f.x+f.w-w-16)),y:Math.round(y)};
}
function sendTo(target,mode){
  const cs=sel.map(card).filter(Boolean).filter(z=>!isLocked(z.id));
  if(!cs.length)return;
  snap();
  const ns=[];
  cs.forEach(c=>{
    const h=hOf(c)||120;
    const p=target==="view"
      ? (()=>{const v=toW(innerWidth/2,innerHeight/2);return {x:Math.round(v.x-c.w/2),y:Math.round(v.y-h/2)}})()
      : freeSpotIn(target,c.w,h);
    if(mode==="twin"){
      const n={id:uid(),ref:orig(c).id,x:p.x,y:p.y,w:c.w,s:{...(c.s||{})},lock:"text"};
      if(c.bg)n.bg=c.bg;
      invalidateIndex();S.cards.push(n);ns.push(n.id);
    }else{
      c.x=p.x;c.y=p.y;ns.push(c.id);
    }
  });
  sel=ns;render();save();
  const list=ns.map(card).filter(Boolean);
  if(list.length)focusOn(list,true);
  toast(mode==="twin"?t("sentTwin"):t("sentMove"));
}

function pasteClip(p){

    if(it.bg)base.bg=it.bg;

function unlinkTwin(c){

    delete n.ref;
    S.cards[S.cards.indexOf(c)]=n;

      const n={...o,id:z.id,x:z.x,y:z.y,w:z.w,s:z.s};delete n.ref;return n;
    });
  }
  render();save();
}

async function hashStr(str){
  try{
    const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
    return [...new Uint8Array(h)].slice(0,10).map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){let a=5381;for(let i=0;i<str.length;i++)a=((a<<5)+a+str.charCodeAt(i))>>>0;
    return "f"+a.toString(16)+str.length.toString(16)}
}
async function putImg(dataURL){
  const h=await hashStr(dataURL);
  if(!IMG.has(h)){
    IMG.set(h,dataURL);
    const ok=await kvPut("img:"+h,dataURL);
    if(!ok)return {h,ok:false};
  }
  return {h,ok:true};
}
async function loadImgs(cards){
  const need=[...new Set(cards.map(c=>c.ih).filter(x=>x&&!IMG.has(x)))];
  for(const h of need){const v=await kvGet("img:"+h);if(v)IMG.set(h,v)}
}
async function migrateInline(cards){
  for(const c of cards){
    if(!c.src||c.ih)continue;
    try{
      const {h,ok}=await putImg(c.src);
      c.ih=h;
      if(ok)delete c.src;          // 存盘成功才丢掉内联副本
    }catch(e){/* 保留 c.src，图片照样能显示 */}
  }
}

function lockItems(getIds){
  const ids=getIds();
  const modes=[...new Set(ids.map(i=>lockOf(i)))];
  const anyText=modes.includes("text"),anyAll=modes.includes("all"),anyFree=modes.includes(null);
  const out=[];
  if(anyFree||anyAll)out.push({label:t("lockText"),check:!anyFree&&!anyAll&&anyText,
    on:()=>setCardLock(ids,"text")});
  if(anyFree||anyText)out.push({label:t("lockAll"),check:!anyFree&&!anyText&&anyAll,
    on:()=>setCardLock(ids,"all")});
  if(anyAll)out.push({label:t("unlockPos"),on:()=>setCardLock(ids,"text")});
  if(anyText||anyAll)out.push({label:t("unlockAll"),on:()=>setCardLock(ids,null)});
  return out;
}

const SCHEMA=6;                         // 数据结构版本，只增不减
function migrate(d){
  if(!d||typeof d!=="object")return d;
  const from=+d.v||1;
  if(from>SCHEMA)console.warn("file written by a newer version:",from);
  if(from<2){                            // 1 -> 2 连线显示默认值修正
    if(!d.lvMigrated){d.linkView="all";d.lvMigrated=true}
  }
  if(from<3){                            // 2 -> 3 页面、模板字段补全
    d.frames=Array.isArray(d.frames)?d.frames:[];
    d.templates=Array.isArray(d.templates)?d.templates:[];
  }
  if(from<4){                            // 3 -> 4 编组取消，已锁定的组转为卡片自身锁定
    const locked=new Set();
    (Array.isArray(d.groups)?d.groups:[]).forEach(g=>{
      if(g&&g.locked&&Array.isArray(g.ids))g.ids.forEach(i=>locked.add(i))});
    (d.cards||[]).forEach(c=>{if(locked.has(c.id))c.lock=true});
    delete d.groups;
  }
  if(from<5){                            // 4 -> 5 锁定分两级，旧的布尔锁等同全锁
    (d.cards||[]).forEach(c=>{if(c.lock===true)c.lock="all"});
  }
  if(from<6){                            // 5 -> 6 文献条目的归属不再用连线表达
    const byId={};(d.cards||[]).forEach(c=>byId[c.id]=c);
    const keep=[];
    (d.links||[]).forEach(l=>{
      const A=byId[l.a],B=byId[l.b];
      const bib=A&&A.role==="bib"?A:(B&&B.role==="bib"?B:null);
      const other=bib===A?B:A;
      if(l.st&&bib&&other&&other.role!=="bib"){other.bib=bib.id;return}
      keep.push(l);
    });
    d.links=keep;
  }
  d.v=Math.max(from,SCHEMA);
  return d;
}

let dbP=null;
function idb(){
  if(dbP)return dbP;
  dbP=new Promise(r=>{
    let q;try{q=indexedDB.open(DB,1)}catch(e){return r(null)}
    q.onupgradeneeded=()=>{try{q.result.createObjectStore("kv")}catch(e){}};
    q.onsuccess=()=>{q.result.onclose=()=>{dbP=null};r(q.result)};
    q.onerror=()=>{dbP=null;r(null)};
    q.onblocked=()=>r(null);
  });
  return dbP;
}
function kvGet(k){return new Promise(async r=>{const db=await idb();if(!db)return r(null);
  try{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
function kvPut(k,v){return new Promise(async r=>{
  const db=await idb();if(!db)return r(0);
  try{
    const tx=db.transaction("kv","readwrite");
    tx.objectStore("kv").put(v,k);
    tx.oncomplete=()=>r(1);tx.onerror=()=>r(0);tx.onabort=()=>r(0);
  }catch(e){r(0)}
})}

function normCard(c){
  const o={...c};
  o.id=o.id||uid();
  o.x=Number.isFinite(+o.x)?+o.x:0;
  o.y=Number.isFinite(+o.y)?+o.y:0;
  o.w=Number.isFinite(+o.w)&&+o.w>20?+o.w:300;
  if(o.h!=null&&!Number.isFinite(+o.h))delete o.h;
  if(o.ar!=null&&!(+o.ar>0))delete o.ar;
  o.text=typeof o.text==="string"?o.text:"";
  if(o.rich&&typeof o.rich!=="string")delete o.rich;
  o.s=(o.s&&typeof o.s==="object")?o.s:{};
  if(o.level&&![1,2,3].includes(+o.level))delete o.level;
  if(o.role&&!["apx","aside","quote","bib"].includes(o.role))delete o.role;
  if(o.bib&&typeof o.bib!=="string")delete o.bib;
  if(o.ref&&typeof o.ref!=="string")delete o.ref;
  if(o.bg&&typeof o.bg!=="string")delete o.bg;
  if(o.url&&typeof o.url!=="string")delete o.url;
  if(o.lock===true)o.lock="all";                    // 旧数据：布尔值等同全锁
  if(o.lock!=="text"&&o.lock!=="all")delete o.lock;
  if(o.tb){
    const g=o.tb;
    if(!Array.isArray(g.rows)||!Array.isArray(g.cols)||!g.rows.length||!g.cols.length)delete o.tb;
    else{
      g.cols=g.cols.map(w=>Math.max(40,+w||120));
      g.rows=g.rows.map(r=>{
        const row=Array.isArray(r)?r.map(v=>typeof v==="string"?v:String(v==null?"":v)):[];
        while(row.length<g.cols.length)row.push("");
        row.length=g.cols.length;
        return row;
      });
      g.head=!!g.head;g.headCol=!!g.headCol;
      if(g.fmt&&typeof g.fmt==="object"){
        Object.keys(g.fmt).forEach(k=>{
          if(!/^\d+,\d+$/.test(k)||typeof g.fmt[k]!=="object")delete g.fmt[k]});
        if(!Object.keys(g.fmt).length)delete g.fmt;
      }else delete g.fmt;
    }
  }
  o.tags=Array.isArray(o.tags)?o.tags.filter(x=>typeof x==="string"):[];
  return o;
}
async function absorb(data,merge){
  const cards=(data.cards||[]).map(normCard);
  await migrateInline(cards);
  if(!merge){
    cards.forEach(c=>{if(c.ref&&!cards.some(z=>z.id===c.ref))delete c.ref});
    const ids0=new Set(cards.map(c=>c.id));
    data=migrate(data);
    S={...S,...data,cards,templates:Array.isArray(data.templates)?data.templates:[],
      frames:Array.isArray(data.frames)?data.frames:[],
      links:(data.links||[]).filter(l=>l&&ids0.has(l.a)&&ids0.has(l.b)).map(l=>({...l,id:l.id||uid()})),
  };
    await loadImgs(cards);return cards.length;
  }
  const map={},b=bbox(),ox=b?b.x+b.w+120:0,oy=b?b.y:0;
  const nb=bbox(cards)||{x:0,y:0};
  cards.forEach(c=>{const nid=uid();map[c.id]=nid;c.id=nid;
    c.x=Math.round(c.x-nb.x+ox);c.y=Math.round(c.y-nb.y+oy)});
  cards.forEach(c=>{if(c.ref)c.ref=map[c.ref]||undefined;if(c.ref===undefined)delete c.ref});
  invalidateIndex();S.cards=S.cards.concat(cards);
  (data.links||[]).forEach(l=>{if(l&&map[l.a]&&map[l.b])
    S.links.push({...l,id:uid(),a:map[l.a],b:map[l.b]})});
  (data.frames||[]).forEach(f=>{if(!f)return;
    S.frames=(S.frames||[]).concat([{...f,id:uid(),
      x:Math.round((+f.x||0)-nb.x+ox),y:Math.round((+f.y||0)-nb.y+oy),
      w:Math.max(120,+f.w||400),h:Math.max(100,+f.h||300)}])});
  await loadImgs(cards);
  return cards.length;
}

let bkT=0;
async function autoBackup(force){
  const now=Date.now();
  if(!force&&now-bkT<10*60*1000)return;     // 每十分钟最多一份
  if(!S.cards.length)return;
  bkT=now;
  try{
    const snap={t:now,n:S.cards.length,name:fileName||"",
      data:JSON.parse(JSON.stringify({...S,cards:S.cards.map(cleanCard)}))};
    await kvPut("bk:"+now,snap);
    let idx=(await kvGet("bkIndex"))||[];
    idx.unshift({t:now,n:snap.n,name:snap.name});
    const keep=[],seenDay=new Set();
    idx.forEach((it,i)=>{
      const day=new Date(it.t).toISOString().slice(0,10);
      if(i<12||!seenDay.has(day)){keep.push(it);seenDay.add(day)}
    });
    const drop=idx.filter(it=>!keep.includes(it)).slice(0, 200);
    for(const d of drop)await kvPut("bk:"+d.t,null);
    await kvPut("bkIndex",keep.slice(0,40));
    BK=keep.slice(0,40);
  }catch(e){}
}

  if(Math.abs(dx)>.05||Math.abs(dy)>.05||Math.abs(dz)>.0004){

  }

}

function bbox(list){
  const cs=list||S.cards;
  if(!cs.length)return null;
  let x=Infinity,y=Infinity,xe=-Infinity,ye=-Infinity;
  for(const c of cs){
    const cx=+c.x||0,cy=+c.y||0,cw=+c.w||0,ch=hOf(c)||0;
    if(cx<x)x=cx; if(cy<y)y=cy;
    if(cx+cw>xe)xe=cx+cw; if(cy+ch>ye)ye=cy+ch;
  }
  if(!isFinite(x))return null;
  return{x,y,w:xe-x,h:ye-y};
}
function boxTo(b,pad,maxZ,now){
  if(!b)return;const p=pad||160;
  const z=clamp(Math.min((innerWidth-p)/Math.max(40,b.w),(innerHeight-p)/Math.max(40,b.h)),.05,maxZ||1.6);
  camTo(-(b.x+b.w/2)*z,-(b.y+b.h/2)*z,z,now);
}
function fit(now){focusIdx=-1;boxTo(bbox(),170,1.6,now)}
let camBack=null,focusKey=null;
function focusOn(list,noToggle){
  const cs=(list||[]).filter(Boolean);
  if(!cs.length){fit();return}
  clearTimeout(cullT);syncCards();measure();
  const key=cs.map(c=>c.id).sort().join(",");
  if(!noToggle&&focusKey===key&&camBack){          // 再触发一次 = 退回
    camTo(camBack.x,camBack.y,camBack.z);
    camBack=null;focusKey=null;return;
  }
  if(focusKey!==key)camBack={...tgt};              // 记住来时的视角
  focusKey=key;
  boxTo(bbox(cs),lock?110:150,1);
  focusIdx=cs.length===1?S.cards.indexOf(cs[0]):-1;
}

function zoomAt(f,cx,cy){
  const nz=clamp(tgt.z*f,.06,6),ox=cx-innerWidth/2,oy=cy-innerHeight/2;

}

// 表格是卡片的一种形态：位置、选中、移动、锁定、页面归属、导出顺序全部复用卡片逻辑
const isTable=c=>!!(c&&orig(c).tb);
// 单元格选区：{id, r1,c1, r2,c2}，坐标未排序，用 tbRect 归一
let tbSel=null;
function tbRect(){
  if(!tbSel)return null;
  return {id:tbSel.id,
    r1:Math.min(tbSel.r1,tbSel.r2),r2:Math.max(tbSel.r1,tbSel.r2),
    c1:Math.min(tbSel.c1,tbSel.c2),c2:Math.max(tbSel.c1,tbSel.c2)};
}
function tbCells(){                       // 选区覆盖的所有单元格坐标
  const r=tbRect();if(!r)return [];
  const out=[];
  for(let i=r.r1;i<=r.r2;i++)for(let j=r.c1;j<=r.c2;j++)out.push([i,j]);
  return out;
}
function clearTbSel(repaint){
  if(!tbSel)return;
  tbSel=null;
  if(repaint!==false)paintTbSel();
}
function paintTbSel(){
  document.querySelectorAll(".card table.tb td.tsel").forEach(td=>td.classList.remove("tsel"));
  const r=tbRect();if(!r)return;
  const el=nodes.get(r.id);if(!el)return;
  for(let i=r.r1;i<=r.r2;i++)for(let j=r.c1;j<=r.c2;j++){
    const td=el.querySelector(`td[data-r="${i}"][data-c="${j}"]`);
    if(td)td.classList.add("tsel");
  }
}
// 单元格级格式存成稀疏表，行数据仍是纯字符串，导入导出都不受影响
function cellFmt(tb,r,c,make){
  const k=r+","+c;
  if(!tb.fmt&&make)tb.fmt={};
  if(!tb.fmt)return null;
  if(!tb.fmt[k]&&make)tb.fmt[k]={};
  return tb.fmt[k]||null;
}
function applyCellFmt(prop,val){
  const r=tbRect();if(!r)return false;
  const c=card(r.id);if(!c||isLocked(c.id))return false;
  const o=orig(c),tb=o.tb;
  snap();
  tbCells().forEach(([i,j])=>{
    const f=cellFmt(tb,i,j,true);
    if(val===null||val===undefined||val==="")delete f[prop];else f[prop]=val;
    if(!Object.keys(f).length)delete tb.fmt[i+","+j];
  });
  if(tb.fmt&&!Object.keys(tb.fmt).length)delete tb.fmt;
  render();save();
  return true;
}
function newTable(p,rows,cols){
  rows=rows||3;cols=cols||3;
  // 列宽按当前基准字号推算，保证新建时就是一个舒服的宽度，输入文字后不会再变
  const cw=Math.max(120,Math.round(baseSize()*13));
  const tb={head:true,headCol:false,cols:new Array(cols).fill(cw),
    rows:Array.from({length:rows},()=>new Array(cols).fill(""))};
  const w=cols*cw;
  const c={id:uid(),x:Math.round(p.x-w/2),y:Math.round(p.y-40),w,tb,text:"",s:newStyle()};
  snap();invalidateIndex();S.cards.push(c);invalidateIndex();sel=[c.id];render();save();
  setTimeout(()=>{const el=nodes.get(c.id);const td=el&&el.querySelector("td");
    if(td)editCell(td)},40);

// Excel 复制出来的纯文本是 TSV：含制表符、换行或引号的单元格会被引号包裹，
// 内部的引号成对出现。按字符扫描才能正确还原，简单 split 会把跨行单元格拆坏。
function parseTSV(txt){
  const rows=[];let row=[],cell="",i=0,inQ=false;
  txt=txt.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<txt.length){
    const ch=txt[i];
    if(inQ){
      if(ch==='"'){
        if(txt[i+1]==='"'){cell+='"';i+=2;continue}
        inQ=false;i++;continue;
      }
      cell+=ch;i++;continue;
    }
    if(ch==='"'&&cell===""){inQ=true;i++;continue}
    if(ch==="\t"){row.push(cell);cell="";i++;continue}
    if(ch==="\n"){row.push(cell);rows.push(row);row=[];cell="";i++;continue}
    cell+=ch;i++;
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  while(rows.length&&rows[rows.length-1].every(v=>v===""))rows.pop();
  return rows;
}
function tableTSV(c){
  const tb=orig(c).tb;if(!tb)return "";
  return tb.rows.map(r=>r.map(v=>{
    const s2=String(v==null?"":v);
    return /[\t\n"]/.test(s2)?'"'+s2.replace(/"/g,'""')+'"':s2;
  }).join("\t")).join("\n");
}
function tableHTML(c){
  const tb=orig(c).tb;if(!tb)return "";
  return "<table>"+tb.rows.map((r,ri)=>"<tr>"+r.map((v,ci)=>{
    const hd=(tb.head&&ri===0)||(tb.headCol&&ci===0);
    return `<${hd?"th":"td"}>${esc(String(v==null?"":v)).replace(/\n/g,"<br>")}</${hd?"th":"td"}>`;
  }).join("")+"</tr>").join("")+"</table>";
}
// 从剪贴板的 HTML 里读表格，比纯文本更可靠（保留空单元格与合并前的结构）
function gridFromHTML(html){
  if(!html)return null;
  const box=document.createElement("div");box.innerHTML=html;
  const tbl=box.querySelector("table");
  if(!tbl)return null;
  const rows=[...tbl.rows].map(tr=>[...tr.cells].map(td=>{
    const h=td.innerHTML.replace(/<br\s*\/?>/gi,"\n");
    const d=document.createElement("div");d.innerHTML=h;
    return (d.textContent||"").replace(/\u00a0/g," ").trim();
  }));
  return rows.length?rows:null;
}
function pasteGrid(c,tb,oc,ri,ci,grid){
  snap();
  grid.forEach((r2,dr)=>{
    const R=ri+dr;
    while(tb.rows.length<=R)tb.rows.push(new Array(tb.cols.length).fill(""));
    r2.forEach((v,dc)=>{
      const C=ci+dc;
      while(tb.cols.length<=C){tb.cols.push(Math.max(120,Math.round(baseSize()*13)));
        tb.rows.forEach(z=>z.push(""))}
      tb.rows[R][C]=v;
    });
  });
  syncTable(oc);render();save();
  toast(t("tbPasted")+" "+grid.length+"\u00D7"+Math.max(...grid.map(r=>r.length)));
}
function tableText(c){
  const tb=orig(c).tb;if(!tb)return "";
  return tb.rows.map(r=>r.join("\t")).join("\n");
}
function syncTable(c){
  const o=orig(c);
  o.text=tableText(c);
  o.w=Math.max(60,Math.round(o.tb.cols.reduce((a,b)=>a+b,0)));
}
function tbOp(c,fn){
  const o=orig(c);
  if(isLocked(c.id)){toast(t("lockedNote"));return}
  snap();fn(o.tb);syncTable(o);render();save();
}
function editCell(td){
  if(!td)return;
  editing=true;td.contentEditable="true";td.focus();
  const r=document.createRange();r.selectNodeContents(td);
  const sl=getSelection();sl.removeAllRanges();sl.addRange(r);
}
function moveCell(td,dr,dc){
  const tr=td.parentNode,tb=tr.parentNode;
  const ci=[...tr.children].indexOf(td), ri=[...tb.children].indexOf(tr);
  const nr=tb.children[ri+dr];
  if(dc){
    const target=tr.children[ci+dc];
    if(target)return editCell(target);
    const row=tb.children[ri+(dc>0?1:-1)];
    if(row)return editCell(row.children[dc>0?0:row.children.length-1]);
    return;
  }
  if(nr)editCell(nr.children[ci]);
}
function buildTable(el,c,oc,s){
  const tb=oc.tb;
  const table=document.createElement("table");table.className="tb";
  Object.assign(table.style,{fontFamily:famCSS(s.family),fontSize:s.size+"px",
    fontWeight:s.weight,lineHeight:s.lh,letterSpacing:s.spacing+"em",color:s.color,
    fontStyle:s.italic?"italic":"normal"});
  const cg=document.createElement("colgroup");
  // 行的列数与 cols 不一致时先补齐，否则会留下空列或错位

        // 表格未被选中时，第一下按普通卡片处理：选中并可直接拖动整张表。
        // 选中之后再在格子上拖动，才是框选单元格。这样"移动表格"和"选格子"不抢同一个手势。
        // 表格还没被选中时，这一下按普通卡片处理：选中并可直接拖动整张表。
        // 已经选中之后，在格子上按下才进入单元格选择。两个手势因此不冲突。
        const already=sel.length===1&&sel[0]===c.id;
        if(!already){
          clearTbSel();
          sel=[c.id];selLink=null;paintSel();
          startMove(e);

        }
        e.stopPropagation();
        if(e.shiftKey&&tbSel&&tbSel.id===oc.id){tbSel.r2=ri;tbSel.c2=ci}
        else tbSel={id:c.id,r1:ri,c1:ci,r2:ri,c2:ci};
        paintTbSel();syncBar();
        let moved=false;
        const over=ev=>{
          const t2=document.elementFromPoint(ev.clientX,ev.clientY);
          const cell2=t2&&t2.closest&&t2.closest("td");
          if(cell2&&nodes.get(c.id).contains(cell2)){
            const nr=+cell2.dataset.r,nc=+cell2.dataset.c;

          }
        };

          removeEventListener("pointermove",over);removeEventListener("pointerup",up);
          if(!moved&&!e.shiftKey&&ev.detail>=2)editCell(td);
        };
        addEventListener("pointermove",over);addEventListener("pointerup",up);
      });
      td.addEventListener("input",()=>{
        tb.rows[ri][ci]=td.innerText;

        if(!td.isContentEditable)return;

        const html=dt.getData("text/html");

        let grid=gridFromHTML(html);                 // 优先用 HTML，空单元格不会错位
        if(!grid&&/\t|\n/.test(txt))grid=parseTSV(txt);
        if(grid&&(grid.length>1||grid[0].length>1)){
          e.preventDefault();
          pasteGrid(c,tb,oc,ri,ci,grid);

      });
      td.addEventListener("keydown",e=>{
        e.stopPropagation();

        if(e.key==="Escape"){e.preventDefault();td.blur();return}
        if(e.key==="Enter"&&(e.shiftKey||e.altKey)){    // 单元格内换行
          e.preventDefault();
          document.execCommand("insertLineBreak");
          tb.rows[ri][ci]=td.innerText;
          syncTable(oc);measure();drawLinksSoon();save();
          return;
        }
        if(e.key==="Enter"){e.preventDefault();
          const last=ri===tb.rows.length-1;
          if(last){tbOp(c,g=>g.rows.push(new Array(g.cols.length).fill("")));
            setTimeout(()=>{const el2=nodes.get(c.id);
              const td2=el2&&el2.querySelector(`td[data-r="${ri+1}"][data-c="${ci}"]`);
              if(td2)editCell(td2)},30);
          }else moveCell(td,1,0);
          return;
        }
        if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){/* 交给浏览器 */}
      });

        if(!td.isContentEditable)return;

        td.contentEditable="false";editing=false;

      });
      td.addEventListener("pointerdown",e=>{if(td.isContentEditable)e.stopPropagation()});

    });

  });

  let acc=0;

    gp.style.left=acc+"px";

      if(lock||isPinned(c.id))return;

      addEventListener("pointermove",mv);addEventListener("pointerup",up);
    });
    wrap.appendChild(gp);
  });

function alignGrips(el){
  const wrap=el.querySelector(".tbwrap");if(!wrap)return;
  const tr=wrap.querySelector("tr");if(!tr)return;
  const cells=[...tr.children];
  [...wrap.querySelectorAll(".cgrip")].forEach((g,i)=>{
    const td=cells[i],nx=cells[i+1];
    // 折叠边框由相邻两格各分担一半，边界取两格之间的中点才真正居中
    if(td)g.style.left=(nx?(td.offsetLeft+td.offsetWidth+nx.offsetLeft)/2
                          :(td.offsetLeft+td.offsetWidth))+"px";
  });

  const box=$("cards"),r=viewRect(),want=new Set();

  S.cards.forEach(c=>{if(inRect(c,r))hit.push(c)});
  if(hit.length>NODE_CAP){
    // 超出上限时优先保留靠近视野中心的，远处的暂不渲染，滚过去自然会补上
    const cx=(r.x+r.x2)/2,cy=(r.y+r.y2)/2;

function pathOf(p1,p2,s1,s2,kind){
  const o=OF,a={x:p1.x+o,y:p1.y+o},b={x:p2.x+o,y:p2.y+o};
  if(kind==="straight")return `M${a.x} ${a.y} L${b.x} ${b.y}`;
  if(kind==="elbow"){
    if(H(s1)&&H(s2)){const m=(a.x+b.x)/2;return `M${a.x} ${a.y} L${m} ${a.y} L${m} ${b.y} L${b.x} ${b.y}`}

let linksDirty=true;
function markLinksDirty(){linksDirty=true;LGRID=null}
// 连线空间网格：把每条线按其包围盒登记到格子里，绘制时只取视野附近的格子。
// 连线很多时（十万卡片对应数万条线）每帧全量遍历会明显掉帧。
const LCELL=4000;
let LGRID=null,LGRIDn=-1;
function linkGrid(){
  if(LGRID&&LGRIDn===S.links.length)return LGRID;
  const idx=cardIndex();
  LGRID=new Map();
  S.links.forEach(l=>{
    const A=idx.get(l.a),B=idx.get(l.b);
    if(!A||!B)return;
    const x0=Math.floor(Math.min(A.x,B.x)/LCELL),x1=Math.floor(Math.max(A.x+A.w,B.x+B.w)/LCELL);
    const y0=Math.floor(Math.min(A.y,B.y)/LCELL),y1=Math.floor(Math.max(A.y+hOf(A),B.y+hOf(B))/LCELL);
    for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){
      const k=gx+","+gy;
      if(!LGRID.has(k))LGRID.set(k,[]);
      LGRID.get(k).push(l);
    }
  });
  LGRIDn=S.links.length;
  return LGRID;
}
function linksNear(r){
  if(S.links.length<400)return S.links;      // 数量不多时直接全量，省去建网格
  const g=linkGrid(),out=new Set();
  for(let gx=Math.floor(r.x/LCELL);gx<=Math.floor(r.x2/LCELL);gx++)
    for(let gy=Math.floor(r.y/LCELL);gy<=Math.floor(r.y2/LCELL);gy++){
      const arr=g.get(gx+","+gy);
      if(arr)arr.forEach(l=>out.add(l));
    }
  return [...out];
}
function drawLinks(){
  const idx=cardIndex();
  // 清理断头连线是 O(连线数)，只在卡片集合可能变化后做一次，不必每帧重来
  if(linksDirty){S.links=S.links.filter(l=>idx.has(l.a)&&idx.has(l.b));linksDirty=false}
  let defs="",out="";const seen={},r=viewRect(MARGIN),mark=[],arrows=[];
  const hasStruct=S.links.some(l=>l.st);
  linksNear(r).forEach(l=>{
    const A=idx.get(l.a),B=idx.get(l.b);
    if(!A||!B)return;
    const lx=Math.min(A.x,B.x),ly=Math.min(A.y,B.y);
    const lx2=Math.max(A.x+A.w,B.x+B.w),ly2=Math.max(A.y+hOf(A),B.y+hOf(B));
    if(lx2<r.x||lx>r.x2||ly2<r.y||ly>r.y2)return;
    const au=autoSides(A,B);
    const s1=l.sa||au[0],s2=l.sb||au[1];
    const d=pathOf(anchor(A,s1),anchor(B,s2),s1,s2,l.kind||"curve");
    const col=l.color||"#8A8A85";
    const ar=l.arrow===undefined?"end":l.arrow;
    const w=l.w||1.4,on=selLink===l.id&&!lock;
    const live=sel.includes(l.a)||sel.includes(l.b)||hoverId===l.a||hoverId===l.b||selLink===l.id;
    const dim=S.linkView==="focus"&&!live;
    const isSt=!!l.st;
    // 只有画布上确实用了结构连线时，才把两类连线在视觉上区分开；
    // 否则全部按用户自己设定的样式绘制，不擅自把所有线改成虚线
    const mixed=hasStruct&&!isSt;
    const dashArr=(l.dash||mixed)?`stroke-dasharray="${w*(mixed?3.2:4.5)} ${w*(mixed?3:3.5)}"`:"";
    out+=`<path class="ln${isSt?" st":""}" data-link="${l.id}" d="${d}" stroke="${col}" stroke-opacity="${dim?.38:(mixed?.75:1)}" stroke-width="${on?w+1.4:(isSt?w*1.5:w)}" stroke-linejoin="round" stroke-linecap="round" ${dashArr} fill="none"/>`;
    if(!dim&&ar!=="none")arrows.push(l);
    if(!lock&&S.linkView!=="off")out+=`<path class="hit" d="${d}" data-link="${l.id}">${l.note?`<title>${esc(l.note)}</title>`:""}</path>`;
    if(!dim&&l.note&&S.linkLabel!=="none")mark.push(l);
  });
  const svg=$("links");
  if(S.linkView==="off"){svg.innerHTML="";return}
  svg.innerHTML=`<defs>${defs}</defs>`+out;
  if(arrows.length)drawArrows(svg,arrows);
  if(mark.length)drawMarks(svg,mark);
  svg.querySelectorAll(".hit").forEach(p=>{
    p.addEventListener("pointerdown",e=>{e.stopPropagation();selLink=p.dataset.link;sel=[];paintSel()});
    p.addEventListener("contextmenu",e=>{e.preventDefault();e.stopPropagation();
      selLink=p.dataset.link;sel=[];paintSel();linkMenu(e.clientX,e.clientY)});
  });
}
// 箭头改为真实几何图形：标记引用在导出的 foreignObject 里无法解析
function drawArrows(svg,list){
  const ns="http://www.w3.org/2000/svg";
  const g=document.createElementNS(ns,"g");
  list.forEach(l=>{
    const p=svg.querySelector(`.ln[data-link="${l.id}"]`);if(!p)return;
    let len;try{len=p.getTotalLength()}catch(e){return}
    if(!len)return;
    const w=l.w||1.4,size=Math.max(7,w*4.2),col=l.color||"#8A8A85";
    const tip=(at,dir)=>{
      let a,bp;
      try{a=p.getPointAtLength(at);bp=p.getPointAtLength(clamp(at+dir*2,0,len))}catch(e){return}
      const ang=Math.atan2(a.y-bp.y,a.x-bp.x);
      const wing=(k)=>({x:a.x-size*Math.cos(ang-k),y:a.y-size*Math.sin(ang-k)});
      const w1=wing(.42),w2=wing(-.42);
      const tri=document.createElementNS(ns,"path");
      tri.setAttribute("d",`M${a.x} ${a.y}L${w1.x} ${w1.y}L${w2.x} ${w2.y}Z`);
      tri.setAttribute("fill",col);tri.style.fill=col;tri.style.stroke="none";
      g.appendChild(tri);
    };
    const ar=l.arrow===undefined?"end":l.arrow;
    if(ar==="end"||ar==="both")tip(len,-1);
    if(ar==="both")tip(0,1);
  });
  svg.appendChild(g);
}
function drawMarks(svg,list){
  const iz=1/cam.z,ns="http://www.w3.org/2000/svg";
  const g=document.createElementNS(ns,"g");
  list.forEach(l=>{
    const p=svg.querySelector(`.ln[data-link="${l.id}"]`);if(!p)return;
    let m;try{m=p.getPointAtLength(p.getTotalLength()/2)}catch(e){return}
    const col=l.color||"#8A8A85";
    const c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",m.x);c.setAttribute("cy",m.y);c.setAttribute("r",5*iz);
    c.setAttribute("fill",col);c.setAttribute("stroke",S.bg);c.setAttribute("stroke-width",2*iz);
    c.style.cursor="pointer";c.dataset.link=l.id;
    c.addEventListener("pointerdown",e=>{e.stopPropagation();selLink=l.id;sel=[];
      openLinkNote(l,e.clientX,e.clientY)});
    const ti=document.createElementNS(ns,"title");ti.textContent=l.note;c.appendChild(ti);
    g.appendChild(c);
    if(S.linkLabel==="text"){
      const tx=document.createElementNS(ns,"text");
      tx.setAttribute("x",m.x+9*iz);tx.setAttribute("y",m.y+4*iz);
      tx.setAttribute("font-size",11*iz);tx.setAttribute("fill",isDark(S.bg)?"#DDD":"#333");
      tx.setAttribute("stroke",S.bg);tx.setAttribute("stroke-width",3.5*iz);
      tx.setAttribute("paint-order","stroke");tx.style.pointerEvents="none";
      tx.setAttribute("font-family",'"IBM Plex Sans","PingFang SC",sans-serif');
      const one=(l.note||"").split(/\n/)[0];
      tx.textContent=one.length>22?one.slice(0,22)+"\u2026":one;
      g.appendChild(tx);
    }
  });
  g.style.pointerEvents="auto";
  svg.appendChild(g);
}
function openLinkNote(l,x,y){
  if(lock)return;
  $("pop").classList.remove("wide");
  const p=$("pop");
  p.innerHTML=`
    <div class="hd"><b>${t("noteTitle")}</b><button id="pcx">\u00D7</button></div>
    <textarea class="ti" id="lnote" rows="4" placeholder="${t("notePh")}"
      style="height:96px;padding:8px;line-height:1.6;resize:none">${esc(l.note||"")}</textarea>`;
  place(p,Math.min(x,innerWidth-270),Math.min(y,innerHeight-200));
  p.classList.add("on");
  const ta=p.querySelector("#lnote");
  ta.addEventListener("keydown",e=>e.stopPropagation());
  const apply=()=>{const v=ta.value.trim();
    if((l.note||"")!==v){snap();if(v)l.note=v;else delete l.note;drawLinks();save()}};
  ta.addEventListener("blur",apply);
  p.querySelector("#pcx").onclick=()=>{apply();p.classList.remove("on")};
  setTimeout(()=>ta.focus(),30);
}
function startLink(e,c,side){
  const svg=$("links");
  const tmp=document.createElementNS("http://www.w3.org/2000/svg","path");
  tmp.setAttribute("stroke",S.linkDef.color);tmp.setAttribute("stroke-width",S.linkDef.w+.4);
  tmp.setAttribute("stroke-dasharray","5 4");tmp.setAttribute("fill","none");svg.appendChild(tmp);
  const p1=anchor(c,side);
  const mv=ev=>{const p=toW(ev.clientX,ev.clientY);
    tmp.setAttribute("d",pathOf(p1,p,side,H(side)?(p.x>p1.x?"l":"r"):(p.y>p1.y?"t":"b"),S.linkDef.kind))};
  const up=ev=>{
    removeEventListener("pointermove",mv);removeEventListener("pointerup",up);tmp.remove();
    const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".card");
    if(el&&el.dataset.id!==c.id){
      snap();
      const nl={id:uid(),a:c.id,b:el.dataset.id,sa:side,...S.linkDef};
      if(!S.linkDef.st)delete nl.st;
      S.links.push(nl);
      selLink=nl.id;sel=[];paintSel();drawLinks();save();
      setTimeout(()=>{if(selLink===nl.id){selLink=null;drawLinks()}},1400);
    }
  };
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}
function finishLinkClick(c){
  if(linkFrom&&linkFrom!==c.id){snap();
    const nl={id:uid(),a:linkFrom,b:c.id,...S.linkDef};
    if(!S.linkDef.st)delete nl.st;
    S.links.push(nl);
    selLink=nl.id;save();
    setTimeout(()=>{if(selLink===nl.id){selLink=null;drawLinks()}},1400);}
  linkFrom=null;$("stage").style.cursor="";toast("");render();
}

/* ================= drag and resize ================= */
function startMove(e,onClick){
  if(lock)return;
  snap();
  const list=movableSel().map(card).filter(Boolean).map(o=>({o,x:o.x,y:o.y}));
  if(!list.length)return;
  const moving=new Set(list.map(z=>z.o.id));
  const liveLinks=S.links.filter(l=>moving.has(l.a)||moving.has(l.b));
  const sx=e.clientX,sy=e.clientY;let moved=false;
  const mv=ev=>{
    let dx=(ev.clientX-sx)/cam.z,dy=(ev.clientY-sy)/cam.z;
    if(Math.abs(dx)+Math.abs(dy)>1)moved=true;
    if(ev.shiftKey){Math.abs(dx)>Math.abs(dy)?dy=0:dx=0}
    list.forEach(({o,x,y})=>{o.x=Math.round(x+dx);o.y=Math.round(y+dy);
      const el=nodes.get(o.id);
      if(el){el.style.left=o.x+"px";el.style.top=o.y+"px"}});
    if(liveLinks.length)drawLinksSoon();     // 只有确实牵动了连线才重画
  };
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    LGRID=null;                                  // 位置变了，网格重建
    if(!moved){undo.pop();onClick&&onClick()}
    else{save();if(S.autoNum)render()}};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}
function startResize(e,c,dir){
  if(isPinned(c.id))return;
  snap();
  const tb0=orig(c).tb?[...orig(c).tb.cols]:null;   // 表格：列宽按同一比例跟随卡片宽度
  const d=dir||"se";
  const sx=e.clientX,sy=e.clientY,ow=c.w,ox=c.x,oy=c.y,oh=hOf(c)||c.w;
  const right=ox+ow,bottom=oy+oh;
  const el=nodes.get(c.id);if(!el)return;
  const mv=ev=>{
    const dx=(ev.clientX-sx)/cam.z,dy=(ev.clientY-sy)/cam.z;
    let w=ow;
    if(d.includes("e"))w=ow+dx;
    else if(d.includes("w"))w=ow-dx;
    else if(d==="s")w=ow*Math.max(.08,(oh+dy)/oh);
    else if(d==="n")w=ow*Math.max(.08,(oh-dy)/oh);
    c.w=Math.round(clamp(w,tb0?tb0.length*40:60,6000));
    if(tb0){
      const kk=c.w/tb0.reduce((a,b)=>a+b,0);
      const o=orig(c);
      o.tb.cols=tb0.map(v=>Math.max(40,Math.round(v*kk)));
      o.w=o.tb.cols.reduce((a,b)=>a+b,0);c.w=o.w;
      const cg=el.querySelector("colgroup");
      if(cg)[...cg.children].forEach((col,i)=>col.style.width=o.tb.cols[i]+"px");
    }
    if(d.includes("w"))c.x=Math.round(right-c.w);
    el.style.width=c.w+"px";el.style.left=c.x+"px";
    measure();
    if(d.includes("n")){c.y=Math.round(bottom-(hOf(c)||c.w));el.style.top=c.y+"px"}
    drawLinksSoon();
  };
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    if(tb0)syncTable(orig(c));
    measure();drawLinks();save()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}

/* ================= images ================= */
function shrink(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const max=1600,k=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      const png=/png/i.test(file.type);
      cb(cv.toDataURL(png?"image/png":"image/jpeg",.88),cv.width,cv.height)};
    im.src=fr.result};
  fr.readAsDataURL(file);
}
async function addImage(d,w,h,p,quiet){
  const cap=S.imgMax||360;
  const W=Math.round(w*Math.min(1,cap/Math.max(w,h)));
  const r=await putImg(d);
  const c={id:uid(),ih:r.h,...(r.ok?{}:{src:d}),ar:h/w,x:Math.round(p.x-W/2),y:Math.round(p.y-W*(h/w)/2),w:W,text:"",s:newStyle()};
  invalidateIndex();S.cards.push(c);if(!quiet){sel=[c.id];selLink=null}render();save();return c;
}
function addImages(files,p){
  const list=[...files].filter(f=>f.type.startsWith("image/"));
  if(!list.length||lock)return;snap();
  list.forEach((f,i)=>shrink(f,(d,w,h)=>addImage(d,w,h,{x:p.x+(i%4)*30,y:p.y+i*24},list.length>1)));
}
function addText(p){
  if(lock)return;snap();
  const c={id:uid(),src:null,x:Math.round(p.x-140),y:Math.round(p.y-14),w:280,text:t("newText"),s:newStyle()};
  invalidateIndex();S.cards.push(c);sel=[c.id];render();save();
  setTimeout(()=>editText(c),30);
}
$("imgfile").onchange=e=>{addImages(e.target.files,toW(mouse.x,mouse.y));e.target.value=""};
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{e.preventDefault();addImages(e.dataTransfer.files,toW(e.clientX,e.clientY))});
addEventListener("copy",e=>{
  if(editing||lock)return;
  const c=sel.length===1?card(sel[0]):null;
  if(!c||!isTable(c))return;
  const dt=e.clipboardData;if(!dt)return;
  e.preventDefault();
  dt.setData("text/plain",tableTSV(c));      // Excel 会按这份还原成单元格
  dt.setData("text/html",tableHTML(c));
  toast(t("tbCopied"));
});
addEventListener("paste",e=>{
  if(editing||lock)return;
  const selCard=sel.length===1?card(sel[0]):null;
  if(selCard&&isTable(selCard)&&!isLocked(selCard.id)){
    const dt=e.clipboardData;
    const grid=gridFromHTML(dt.getData("text/html"))||
      (/\t|\n/.test(dt.getData("text/plain"))?parseTSV(dt.getData("text/plain")):null);
    if(grid&&grid.length){
      e.preventDefault();
      const oc=orig(selCard);
      snap();
      const cols=Math.max(...grid.map(r=>r.length));
      const cw=Math.max(120,Math.round(baseSize()*13));
      oc.tb.cols=Array.from({length:cols},(_,i)=>oc.tb.cols[i]||cw);
      oc.tb.rows=grid.map(r=>{const row=r.slice();while(row.length<cols)row.push("");return row});
      syncTable(oc);render();save();
      toast(t("tbPasted")+" "+grid.length+"\u00D7"+cols);
      return;
    }
  }
  const items=[...(e.clipboardData?.items||[])];
  const img=items.find(x=>x.type.startsWith("image/"));
  const p=toW(mouse.x,mouse.y);
  if(img){e.preventDefault();snap();shrink(img.getAsFile(),(d,w,h)=>addImage(d,w,h,p));return}
  const htmlGrid=gridFromHTML(e.clipboardData?.getData("text/html"));
  const plain=e.clipboardData?.getData("text/plain")||"";
  const tsvGrid=htmlGrid||(/\t/.test(plain)?parseTSV(plain):null);
  if(tsvGrid&&tsvGrid.length&&Math.max(...tsvGrid.map(r=>r.length))>1){
    e.preventDefault();                       // 从 Excel 粘到空白处：直接生成一张表
    const cols=Math.max(...tsvGrid.map(r=>r.length));
    const c2=newTable(p,tsvGrid.length,cols);
    const oc=orig(c2);
    oc.tb.rows=tsvGrid.map(r=>{const row=r.slice();while(row.length<cols)row.push("");return row});
    syncTable(oc);render();save();
    toast(t("tbPasted")+" "+tsvGrid.length+"\u00D7"+cols);
    return;
  }
  const txt=plain;
  if(txt&&txt.trim()){e.preventDefault();snap();
    const c={id:uid(),src:null,x:Math.round(p.x-160),y:Math.round(p.y-16),w:320,text:txt.trim(),s:newStyle()};
    invalidateIndex();S.cards.push(c);sel=[c.id];render();save()}
});

/* ================= stage ================= */
const stage=$("stage");
addEventListener("pointermove",e=>{mouse={x:e.clientX,y:e.clientY}});
stage.addEventListener("pointerdown",e=>{
  closeMenus();
  if(linkFrom){linkFrom=null;stage.style.cursor="";toast("")}
  if(e.button===2)return;
  if(selFrame){selFrame=null;renderFrames()}
  clearTbSel();
  if(lock&&e.detail===2){fit();return}
  const wantPan=lock||e.button===1||spaceDown||e.altKey;
  if(wantPan){startPan(e);return}
  startMarquee(e);
});
function startPan(e){
  stage.classList.add("pan");
  const sx=e.clientX,sy=e.clientY,ox=tgt.x,oy=tgt.y;
  const mv=ev=>{camTo(ox+ev.clientX-sx,oy+ev.clientY-sy,tgt.z,true)};
  const up=()=>{stage.classList.remove("pan");removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}
function startMarquee(e){
  const add=e.shiftKey,base=add?[...sel]:[];
  if(!add&&(sel.length||selLink)){sel=[];selLink=null;paintSel()}
  const sx=e.clientX,sy=e.clientY,box=$("marq");let moved=false;
  const mv=ev=>{
    const x=Math.min(sx,ev.clientX),y=Math.min(sy,ev.clientY);
    const w=Math.abs(ev.clientX-sx),h=Math.abs(ev.clientY-sy);
    if(w+h>4)moved=true;
    if(!moved)return;
    box.style.display="block";
    Object.assign(box.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
    const a=toW(x,y),b=toW(x+w,y+h);
    // 锁定的卡片同样可以被框选：选中本身无害，真正的保护在每个操作里各自判断。
    // 否则锁定之后连"选中它们再一起解锁"都做不到。
    const hit=S.cards.filter(c=>{
      const ch=hOf(c);
      return c.x+c.w>a.x&&c.x<b.x&&c.y+ch>a.y&&c.y<b.y;
    }).map(c=>c.id);
    sel=[...new Set([...base,...expand(hit)])];
    paintSel();
  };
  const up=()=>{
    box.style.display="none";
    removeEventListener("pointermove",mv);removeEventListener("pointerup",up);
    if(!moved&&!add&&sel.length){sel=[];paintSel()}
  };
  addEventListener("pointermove",mv);addEventListener("pointerup",up);
}
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  const pad=e.deltaX!==0||(e.deltaMode===0&&Math.abs(e.deltaY)<16);
  if(e.ctrlKey||e.metaKey||(!pad&&!e.shiftKey)){zoomAt(Math.exp(-e.deltaY*.0022),e.clientX,e.clientY)}
  else camTo(tgt.x-e.deltaX,tgt.y-e.deltaY,tgt.z,true);
},{passive:false});
stage.addEventListener("contextmenu",e=>{e.preventDefault();

stage.addEventListener("dblclick",e=>{if(lock||e.target.closest(".card"))return;addText(toW(e.clientX,e.clientY))});
addEventListener("keyup",e=>{if(e.key===" "){spaceDown=false;stage.classList.remove("space")}});
addEventListener("blur",()=>{spaceDown=false;stage.classList.remove("space")});
addEventListener("keydown",e=>{
  if(sizeKey(e))return;
  const k=e.key.toLowerCase();
  if(e.key==="Escape"&&$("man").classList.contains("on")){$("man").classList.remove("on");return}
  if(e.key===" "&&!editing&&!e.target.isContentEditable&&!lock){spaceDown=true;stage.classList.add("space")}
  if((e.metaKey||e.ctrlKey)&&k==="s"){e.preventDefault();saveNow();return}
  if((e.metaKey||e.ctrlKey)&&k==="f"&&!lock){e.preventDefault();showFind(true);return}
  if(editing||e.target.isContentEditable){
    if(sizeEdit)return;
    if(e.key==="Escape"){document.activeElement.blur();return}
    if((e.metaKey||e.ctrlKey)&&["b","i","u"].includes(k)){
      e.preventDefault();cmd(k==="b"?"bold":k==="i"?"italic":"underline");return;
    }
    if((e.metaKey||e.ctrlKey)&&e.shiftKey&&k==="x"){e.preventDefault();cmd("strikeThrough");return}
    setTimeout(syncBar,0);                      // 撤销后同步按钮状态
    return;
  }
  if(lock){
    if(e.key==="Escape"){setLock(false);return}
    if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "){e.preventDefault();step(1)}
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();step(-1)}
    if(k==="f")fit();
  if(k==="m")toggleMap();
    return;
  }
  if((e.metaKey||e.ctrlKey)&&k==="z"){e.preventDefault();e.shiftKey?applyUndo(redo,undo):applyUndo(undo,redo);return}
  if((e.metaKey||e.ctrlKey)&&k==="a"){
    e.preventDefault();
    const one=sel.length===1?card(sel[0]):null;
    if(one&&isTable(one)){                       // 选中表格时：全选它的单元格
      const tb=orig(one).tb;
      tbSel={id:one.id,r1:0,c1:0,r2:tb.rows.length-1,c2:tb.cols.length-1};
      paintTbSel();syncBar();return;
    }
    sel=S.cards.map(c=>c.id);paintSel();return;
  }
  if((e.metaKey||e.ctrlKey)&&k==="d"){e.preventDefault();dupe();return}
  if((e.metaKey||e.ctrlKey)&&k==="l"&&sel.length){
    e.preventDefault();
    const cur=sel.map(card).filter(Boolean);
    const want=e.shiftKey?"all":"text";
    const same=cur.every(z=>z.lock===want);
    setCardLock(null,same?null:want);
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&k==="c"){e.preventDefault();clipCards("twin");return}
  if((e.metaKey||e.ctrlKey)&&e.shiftKey&&k==="v"){e.preventDefault();pasteClip(toW(mouse.x,mouse.y));return}
  if(e.key==="Escape"&&bibFocus){bibFocus=null;paintBibFocus();return}
  if(e.key==="Escape"&&tbRect()){clearTbSel();syncBar();return}
  if(e.key==="Escape"){closeMenus();sel=[];selLink=null;linkFrom=null;stage.style.cursor="";toast("");paintSel()}
  if(e.key==="Backspace"||e.key==="Delete"){
    const R2=tbRect();
    if(R2){                                       // 表格选区：清空内容而不是删卡片
      e.preventDefault();
      const c2=card(R2.id);
      if(c2&&!isLocked(c2.id))tbOp(c2,g=>{
        for(let i=R2.r1;i<=R2.r2;i++)for(let j=R2.c1;j<=R2.c2;j++)g.rows[i][j]=""});
      return;
    }
    if(sel.length||selLink){e.preventDefault();del()}
  }
  if(k==="f")fit();
  if(k==="z"&&!e.metaKey&&!e.ctrlKey)focusSel();
  if(k==="0")camTo(tgt.x,tgt.y,1);
  if(k==="t"&&sel.length)syncBar();
  if(sel.length&&e.key.startsWith("Arrow")){e.preventDefault();const d=e.shiftKey?10:1;
    movableSel().map(card).filter(Boolean).forEach(c=>{if(e.key==="ArrowUp")c.y-=d;if(e.key==="ArrowDown")c.y+=d;
      if(e.key==="ArrowLeft")c.x-=d;if(e.key==="ArrowRight")c.x+=d});
    render();save()}
});

/* ================= edits ================= */
function del(){
  if(lock)return;snap();
  if(selLink){const l0=S.links.find(z=>z.id===selLink);
    if(l0&&isLinkLocked(l0))toast(t("lockedNote"));
    else S.links=S.links.filter(l=>l.id!==selLink);
    selLink=null}
  const kill=freeSel();
  if(kill.length){
    // 源被删除时把第一个分身扶正，内容不丢
    kill.forEach(id=>{
      const o=S.cards.find(z=>z.id===id);
      if(!o||o.ref)return;
      const kids=S.cards.filter(z=>z.ref===o.id&&!kill.includes(z.id));
      if(!kids.length)return;
      const heir=kids[0];
      const n={...o,id:heir.id,x:heir.x,y:heir.y,w:heir.w,s:heir.s};delete n.ref;
      S.cards[S.cards.indexOf(heir)]=n;
      kids.slice(1).forEach(z=>z.ref=heir.id);
    });
    S.links=S.links.filter(l=>!kill.includes(l.a)&&!kill.includes(l.b));
    invalidateIndex();S.cards=S.cards.filter(c=>!kill.includes(c.id));sel=[]}
  else if(sel.length)toast(t("lockedNote"));
  render();save();
}
function dupe(){if(!sel.length||lock)return;snap();
  const ns=[];freeSel().map(card).filter(Boolean).forEach(c=>{
    const n={...JSON.parse(JSON.stringify(c)),id:uid(),x:c.x+30,y:c.y+30};invalidateIndex();S.cards.push(n);ns.push(n.id)});
  sel=ns;render();save();
}
function order(dir){if(!sel.length)return;snap();
  const picked=S.cards.filter(c=>sel.includes(c.id)),rest=S.cards.filter(c=>!sel.includes(c.id));
  S.cards=dir>0?[...rest,...picked]:[...picked,...rest];render();save();
}
function align(mode){
  if(movableSel().length<2){if(sel.length)toast(t("lockedNote"));return}
  snap();
  const cs=movableSel().map(card).filter(Boolean),hh=hOf;
  const mn=f=>cs.reduce((a,c)=>Math.min(a,f(c)),Infinity);
  const mx=f=>cs.reduce((a,c)=>Math.max(a,f(c)),-Infinity);
  if(mode==="left"){const v=mn(c=>c.x);cs.forEach(c=>c.x=v)}
  if(mode==="right"){const v=mx(c=>c.x+c.w);cs.forEach(c=>c.x=v-c.w)}
  if(mode==="cx"){const v=cs.reduce((a,c)=>a+c.x+c.w/2,0)/cs.length;cs.forEach(c=>c.x=Math.round(v-c.w/2))}
  if(mode==="top"){const v=mn(c=>c.y);cs.forEach(c=>c.y=v)}
  if(mode==="bottom"){const v=mx(c=>c.y+hh(c));cs.forEach(c=>c.y=Math.round(v-hh(c)))}
  if(mode==="cy"){const v=cs.reduce((a,c)=>a+c.y+hh(c)/2,0)/cs.length;cs.forEach(c=>c.y=Math.round(v-hh(c)/2))}
  if(mode==="rowgap"){cs.sort((a,b)=>a.x-b.x);let x=cs[0].x;cs.forEach(c=>{c.x=Math.round(x);x+=c.w+40})}
  if(mode==="colgap"){cs.sort((a,b)=>a.y-b.y);let y=cs[0].y;cs.forEach(c=>{c.y=Math.round(y);y+=hh(c)+40})}
  render();save();
}
function sizeImages(all){
  const cap=S.imgMax||360;
  const list=(all?S.cards:movableSel().map(card).filter(Boolean)).filter(c=>srcOf(c));
  if(!list.length)return;
  snap();
  list.forEach(c=>{if(isPinned(c.id))return;
    const ar=c.ar||1;
    c.w=Math.round(ar>=1?cap/ar:cap);
  });
  render();save();
}
const LVSCALE={1:[2.1,700],2:[1.55,600],3:[1.22,500]};
function levelStyle(v){
  if(S.lvStyle&&S.lvStyle[v])return {...S.lvStyle[v]};
  const base={...DEF,...S.textDef};
  if(!v)return {size:base.size,weight:base.weight,spacing:base.spacing};
  const [k,w]=LVSCALE[v];
  return {size:Math.round(base.size*k),weight:w,
    spacing:Math.max(-0.02,+(base.spacing-(v===1?0.02:v===2?0.012:0.006)).toFixed(3))};
}
// 文献条目与原文之间是归属关系，不是画布上的走向，所以用数据字段而不是连线表达。
// 原文卡片记 c.src = 文献条目 id，画布上不画任何线。
const bibOf=c=>{const o=orig(c);return o.bib?card(o.bib):null};
const bibKids=id=>S.cards.filter(c=>orig(c).bib===id);
function bindToBib(){
  const cs=sel.map(card).filter(Boolean);
  const bibs=cs.filter(c=>c.role==="bib");
  if(bibs.length!==1){toast(t("bibNeedOne"));return}
  const bib=bibs[0];
  const kids=cs.filter(c=>c!==bib&&!isLocked(c.id));
  if(!kids.length){toast(t("bibNeedQuote"));return}
  snap();
  kids.forEach(c=>{
    const o=orig(c);
    if(!o.role&&!o.level)o.role="quote";      // 没标角色的默认当作原文
    o.bib=bib.id;                             // 注意：c.src 是内联图片字段，不能复用
  });
  sel=[bib.id];bibFocus=bib.id;render();save();
  toast(t("bibBound")+" "+kids.length);
}
function unbindBib(){
  const cs=sel.map(card).filter(Boolean).filter(c=>!isLocked(c.id));
  const n=cs.filter(c=>orig(c).bib).length;
  if(!n){toast(t("bibNoBind"));return}
  snap();cs.forEach(c=>{delete orig(c).bib});
  render();save();toast(t("bibUnbound")+" "+n);
}
// 点文献条目上的小圆点：用透明度强调它名下的原文，画布其余部分淡下去
let bibFocus=null;
function setBibFocus(id){
  bibFocus=(bibFocus===id)?null:id;
  paintBibFocus();
}
function paintBibFocus(){
  const on=!!bibFocus;
  document.body.classList.toggle("bibfocus",on);
  const keep=new Set();
  if(on){
    keep.add(bibFocus);
    bibKids(bibFocus).forEach(c=>keep.add(c.id));
    S.cards.forEach(c=>{if(orig(c).id===bibFocus)keep.add(c.id)});
  }
  nodes.forEach((el,id)=>el.classList.toggle("bibon",on&&keep.has(id)));
}
function setRole(r){
  const cs=targets().filter(c=>!isLocked(c.id));if(!cs.length)return;
  snap();
  cs.forEach(c=>{
    if(c.role===r)delete c.role;else c.role=r;
    if(c.role==="apx"&&!c.level){c.level=1;c.s={...DEF,...S.textDef,...(c.s||{}),...levelStyle(1)}}
  });
  render();save();
}
function setLevel(v){
  const cs=targets().filter(c=>!isLocked(c.id));if(!cs.length)return;
  snap();
  const ls=levelStyle(v);
  cs.forEach(c=>{
    delete c.role;c.sMan=false;
    if(v)c.level=v;else delete c.level;
    c.s={...DEF,...S.textDef,...(c.s||{}),...ls};
  });
  render();save();
}
function toast(x){const e=$("toast");if(!x){e.classList.remove("on");return}
  e.textContent=x;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}

/* ================= lock mode ================= */
function setLock(v){
  lock=v;sel=[];selLink=null;editing=false;linkFrom=null;closeMenus();
  $("pop").classList.remove("on");
  render();
  if(v){toast(t("lockOn"));fit();goFS();idle();$("findq").value="";runFind()}
  else{toast("");clearTimeout(idleT);document.body.classList.remove("hidecur");if(isFS())exitFS();
    if(S.work)$("find").classList.add("on")}
}

  <p>不开启时界面完全空白，需要搜索时按 <kbd>Ctrl/Cmd</kbd> + <kbd>F</kbd> 临时唤出。</p>`],

 ["交叉引用","JIAOCHAYINYONG",`
  <p>导出文档时勾选此项，每条连线都会在正文中生成对应的引用行：起点卡片下方出现「→ 参见 §2.1（摘要）」，终点卡片下方出现「← 来自 §1.3」。</p>
  <p>连线颜色被译成关系类型：灰为一般关联，红为对立，蓝为延伸，绿为印证。所以调线色时最好按语义而非按美观。</p>
  <p class="tip">画布是图结构，文档是线性结构。交叉引用让每条边在文中出现两次，从任意一处都能追下去，不打乱叙述顺序。</p>`],

 ["放大居中","JUJIAO",`
  <p>选中一张或多张卡片后按 <kbd>Z</kbd>，镜头框住整个选区，最大放到 100%，不会放过头。多选时按外接矩形取景，适合快速看清一组卡片的整体关系。</p>
  <p>再按一次 <kbd>Z</kbd> 即退回原来的视角和缩放，所以放大是零成本的动作，看完就回，不会打断原本的浏览位置。右键菜单里也有<b>放大居中</b>入口。</p>
  <p>编辑模式下点击卡片<b>不会</b>移动镜头。单击只做选中和起拖，双击只做文字编辑，镜头完全由你用 <kbd>Z</kbd> 控制。</p>
  <p class="tip">演示锁定模式是另一套逻辑：那里点击卡片会直接放大聚焦，双击空白处回总览，方向键逐个浏览。</p>`],

 ["框选","KUANGXUAN",`
  <p>空白处按住左键拖出选框，范围内卡片全部选中。按住 <kbd>Shift</kbd> 拖动则在已有选择上追加。</p>
  <p>可以和 <kbd>Shift</kbd> 点选混用：先框一片，再点掉不要的，或再框另一片加进来。锁定组会被自动跳过。</p>`],

 ["快捷键","KUAIJIEJIAN",`
  <ul>
    <li><kbd>Ctrl/Cmd</kbd> + <kbd>V</kbd> 粘贴图片　<kbd>Ctrl/Cmd</kbd> + <kbd>S</kbd> 保存</li>
    <li><kbd>Ctrl/Cmd</kbd> + <kbd>F</kbd> 搜索　<kbd>Ctrl/Cmd</kbd> + <kbd>A</kbd> 全选</li>
    <li><kbd>Ctrl/Cmd</kbd> + <kbd>Z</kbd> 撤销　<kbd>Ctrl/Cmd</kbd> + <kbd>D</kbd> 复制</li>
    <li><kbd>T</kbd> 文字样式　<kbd>F</kbd> 适应画面　<kbd>0</kbd> 缩放归位</li>
    <li><kbd>Delete</kbd> 删除　<kbd>Esc</kbd> 取消选择或退出演示</li>
    <li>方向键微移一像素，加 <kbd>Shift</kbd> 移十像素</li>
  </ul>`],

 ["整体缩放","ZHENGTISUOFANG",`
  <p>觉得整份文档的字偏大或偏小时，用<b>视图与设置 → 按比例缩放全部内容</b>。填入新的基准字号即可，比如从 18 改成 12。</p>
  <p>缩放的是<b>整个文档的尺度</b>，不只是字号：文字大小、卡片宽度、卡片之间的间距、页面框的位置和尺寸、连线粗细、新图片的尺寸上限，全部按同一比例缩放。这是必要的，否则字变小了而间距不变，画布会变得空洞。</p>
  <p><b>手动调整过的和锁定的卡片也一并缩放</b>，所以它们与基准的相对差异得以保留：原来比正文大出一截的强调段落，缩放后依然大出同样的比例。你不需要做任何手动调整。</p>
  <p>行距和字距不参与缩放，因为它们本身就是相对量（行距是字号的倍数，字距以 em 为单位），会自动跟着字号走。</p>
  <p>缩放的同时画布视角会同步补偿，所以执行后屏幕上看起来没有任何跳变，只是此后你能在同样的视野里放下更多内容。不满意按 <kbd>Ctrl/Cmd</kbd> + <kbd>Z</kbd> 一次撤销。</p>
  <p class="tip">与分级统一的分工：分级统一是把某一层级刷成同一个样子，会抹掉差异；整体缩放是等比例改变尺度，保留全部差异。</p>`],

 ["分级统一","FENJITONGYI",`
  <p>层级在画布上由卡片左侧的竖条表示，一级最粗、逐级递减，不写 H1 这类字母。开启自动编号后竖条上方会显示编号。</p>
  <p>工具条第二行右侧用来统一某一层级的排印。做法是：先把一张卡片调成你想要的样子，再选择层级（正文 / H1 / H2 / H3），点<b>统一该层级</b>，画布上该层级的所有卡片一并采用这套字体、字号、字重、字距、行距和颜色。</p>
  <p><b>跳过手动调整过的</b>默认勾选。凡是你单独动过格式的卡片会被保护，不会被批量覆盖，适合保留特意做了标记或强调的那几张。取消勾选则是全部统一，无一例外。</p>
  <p>统一之后该层级的样式会被记住，之后新设为这个层级的卡片自动采用它；统一"正文"同时也决定新建卡片的起始格式。</p>
  <p class="tip">原先菜单里的默认文字格式已并入此处。想改新卡片的默认样式，就调好一张正文卡片然后统一正文层级。</p>`],

 ["局部文字格式","JUBUWENZI",`
  <p>选中一张卡片后，上方会浮出一条窄工具条。它作用于<b>你划选的那段文字</b>，而不是整个文字框。</p>
  <p>工具条从左到右依次是：</p>
  <ul>
    <li><b>B / I / U / S</b>：粗体、斜体、下划线、删除线，按钮会随光标位置亮起显示当前状态。编辑时也可用 <kbd>Ctrl/Cmd</kbd> + <kbd>B</kbd> / <kbd>I</kbd> / <kbd>U</kbd>，删除线为 <kbd>Ctrl/Cmd</kbd> + <kbd>Shift</kbd> + <kbd>X</kbd></li>
    <li><b>字号</b>：点数字直接敲新值，回车生效，方向键上下微调；右侧小三角展开常用档位。它不会夺走文字选区，所以划选一段文字后再调字号，改的就是那一段</li>
    <li><b>文字颜色 / 荧光笔</b>：点色块即以当前颜色套用，右侧小三角展开色板换色。换过之后按钮记住新颜色，之后连续标记只需一击。荧光笔在同色文字上再点一次即取消</li>
    <li><b>清除</b>：去掉划选部分的全部格式，包括粗斜体、下划线、颜色、字号和底色</li>
  </ul>
  <p>双击进入编辑后划选文字再点按钮，只改那一段。如果没有划选任何文字，粗体、斜体、字号、颜色会退回作用于整张卡片，等同于文字样式面板；高亮则必须划选，因为整框高亮没有意义。</p>
  <p>这些局部格式会写进导出的 Word 和 PDF 文档：粗斜体、下划线、颜色、字号都保留，高亮会映射到 Word 内置的荧光笔颜色。</p>
  <p><b>撤销</b>：编辑状态下按 <kbd>Ctrl/Cmd</kbd> + <kbd>Z</kbd> 可逐步回退加粗、高亮、改色、改字号等每一次操作，再按 <kbd>Shift</kbd> 组合可重做。退出编辑后，同样的快捷键回退的是卡片级别的改动。</p>
  <p>编辑时还可以直接用 <kbd>Ctrl/Cmd</kbd> + <kbd>B</kbd> / <kbd>I</kbd> / <kbd>U</kbd> 加粗、斜体、下划线。</p>
  <p><b>卡片底色</b>在工具栏上有独立控件（段落图标右侧的小方块）：点方块直接以当前颜色套用，右侧小三角展开色板换色，换过之后按钮记住新颜色，连续标记只需一击，支持多选批量。给整张卡片铺一层底色，用来区分内容类别，比如引文一种颜色、评注另一种。十三种可选，除纯白和深色外都是半透明的极淡色（透明度 3% 到 10%），叠在任何画布底色上都不抢眼。它与荧光笔和文字颜色是三个层次——文字颜色改字本身，荧光笔标记局部字句，卡片底色标识整张卡片的性质。底色会跟随导出到 Word 与 PDF 文档。</p>
  <p class="tip">工具条可在右键菜单的<b>文字工具条</b>关闭。粘贴进卡片的内容一律转为纯文本，不会把网页的杂乱格式带进来。</p>`],

 ["卡片模板","KAPIANMUBAN",`
  <p>把一张调好的卡片存成模板，之后一键复用。模板记住的是：<b>字体、字号、字重、字距、行距、对齐、文字颜色、卡片底色、卡片宽度</b>，不记内容。</p>
  <p>如果你的格式是用划选文字的方式设的（存在正文内部而非卡片属性里），存模板时也会被识别并吸收。套用模板时会清掉正文里的局部字体、字号、颜色，让模板真正生效，加粗、斜体、高亮这类标记则保留。</p>
  <p><b>保存</b>：选中一张卡片，右键 → 卡片模板 → 存为模板，填个名字即可，比如"报告正文""引文块""批注"。</p>
  <p><b>一键套用</b>：工具栏上有一个模板按钮，显示当前模板名，选中一张或多张卡片后点它即可套用；右侧小三角展开列表换模板，也可以从那里直接存新模板。</p>
  <p><b>右键菜单</b>：右键 → 卡片模板 → 选中某个模板，有三种用法。<b>套用到选中卡片</b>支持多选，一次统一一批；<b>用它新建卡片</b>直接在视野中央生成一张空白卡并进入编辑；<b>设为新建卡片默认</b>让之后所有新卡片都采用这套格式。</p>
  <p><b>存在哪里</b>：保存时可选两处。<b>本文件</b>随画布文件一起走，导出 json 时带着，换电脑打开或发给别人都在，适合这个项目专用的格式。<b>通用</b>存在浏览器本地，所有文件共享，但不会跟着文件走，适合你个人长期的排版习惯。同一套模板可以两处都存一份。</p>
  <p class="tip">和分级统一的分工：分级统一按层级批量刷格式，适合整理已有内容；模板是预设，适合新建内容时保持一致。</p>`],

 ["链接","LIANJIE",`
  <p>每张卡片可以挂一个来源链接。右键选<b>添加链接</b>，粘贴网址即可。卡片左下角出现一个小圆圈箭头图标，点它在新标签页打开，鼠标悬停显示完整网址。图标是固定尺寸的，画布缩放时不会跟着变大变小。</p>
  <p>三种形式都认：PDF 的直接网址、Google Scholar 的条目链接、以及直接粘贴的 DOI（会自动补成 doi.org 链接）。没写 https 前缀也会自动补全。</p>
  <p>链接内容纳入全文检索，所以可以直接搜域名找回某个来源，比如输入 scholar 就能筛出所有来自 Google Scholar 的条目。</p>
  <p>导出 Word 和 PDF 文档时，链接会作为可点击的超链接附在该段之后。分身共享源的链接。演示模式下链接依然可点，方便当场打开原文。</p>
  <p class="tip">建议配合标签使用：链接解决"去哪里找原文"，标签解决"这是什么类型的材料"。</p>`],

 ["文献条目","WENXIANTIAOMU",`
  <p>右键卡片 → <b>层级</b> → <b>文献条目</b>，把一张卡片标为一条参考文献的母信息，里面写完整的著录（作者、年份、题名、出处）。</p>
  <p><b>绑定原文</b>：选中这条文献条目，再加选若干原文卡片（按住 Shift 或框选），右键选<b>绑定到该文献条目</b>。没标角色的卡片会自动视为原文记录。</p>
  <p><b>不画连线</b>：文献与它的摘录之间是归属关系，不是画布上的走向，所以这层绑定用数据记录，画布上不会多出任何线。文献条目和它名下的原文左侧各有一个小圆点，<b>点圆点即用透明度强调这一组</b>：该文献与它的全部摘录保持清晰，画布其余部分淡下去，一眼就能看清一条文献究竟被摘了哪些句子。再点一次或按 <kbd>Esc</kbd> 恢复。从原文卡片上的圆点点进去，则是反查它出自哪条文献。</p>
  <p>绑定与位置无关，所以摘录随便怎么挪、放在哪一页都不会散。要解除就右键选<b>从文献条目解除绑定</b>。</p>
  <p><b>导出结构</b>：Word 里文献条目是悬挂缩进的加粗段落（与参考文献惯例一致），它的原文群紧随其后，逐条缩进为引文。Markdown 是加粗条目加 &gt; 引用行，HTML 是悬挂缩进的条目加引用块。呈现出来就是"一条文献 + 它的全部摘录"这种结构。</p>
  <p class="tip">配合分身：同一条摘录如果在正文某章要引用，做一个分身放到那一章之下，原处仍挂在文献条目里。导出时两处都完整呈现，你既有按文献归档的全貌，又有按论述展开的正文。</p>`],

 ["原文记录","YUANWENJILU",`
  <p>右键卡片 → <b>层级</b> → <b>原文记录</b>，把一张卡片标为原文摘录。它是最低的一层，永远排在末端，不参与编号。</p>
  <p>用途是保留观点的来源：某个论断出自哪篇文献的哪一句，原样抄在这里，随时可以回看。画布上显示为引文样式，左侧一条竖线加缩进，与正文一眼可分。</p>
  <p><b>方向自动判定</b>：原文记录的层级永远最低，所以从它连出去还是连进来都无所谓，一律挂在最近的标题之下。</p>
  <p><b>导出</b>：Word 里是缩进的斜体引文，PDF 和 HTML 是标准引用块，Markdown 是以 &gt; 开头的引用行。都能与正文明确区分。</p>
  <p class="tip">配合分身使用最顺手：同一条原文如果在多章都要引用，做几个分身放到各章之下，导出时每一处都会完整呈现原文，不是"另见某节"。</p>`],

 ["分身","FENSHEN",`
  <p>分身不是复制，而是<b>同一条内容在多处出现</b>。内容只有一个源，分身是它的投影：文字和图片共享，位置、尺寸、字号各自独立。改任意一处的文字，所有位置同步更新。</p>
  <p><b>用途</b>：想法之间距离太远时，与其拉一条横跨画布的连线，不如在需要的地方放一个分身。既保持了上下文，又不会让连线变成乱麻。</p>
  <p><b>创建与放置</b>：选中卡片后右键<b>把分身放入剪贴板</b>（或按 Ctrl/Cmd + Shift + C），然后移动到目标位置，在空白处右键<b>在此处粘贴分身</b>（或 Ctrl/Cmd + Shift + V 粘贴在鼠标处）。跨多少距离都不用拖动。多选时相对位置会保持。</p>
  <p>另有<b>移动到…</b>可以直接把选中卡片送到某个页面或视野中央，由程序在该页面里找一块空位放置，页面装不下会自动撑高。</p>
  <p>新建的分身默认为<b>仅锁定内容</b>，因为在分身上误改就是改到原文。它仍可自由移动和缩放，只是改不动文字。需要修改时到源头改，或先解锁。</p>
  <p><b>串联与溯源</b>：有分身的卡片右上角出现菱形标记，写着「2/4」表示这是四处出现中的第二处。点标记跳到下一处，按住 <kbd>Shift</kbd> 点跳回源头，右键标记打开分身菜单，可以一次选中全部出现位置。顺着标记点下去，就能走完一条信息在画布上的完整轨迹。</p>
  <p><b>与检索的关系</b>：分身共享源的文字和标签，所以天然进入检索结果。回车逐个跳转时，跳的是这条信息的所有出现位置。菜单里的<b>检索时合并分身</b>可以切换：关注内容时合并成一条，巡视位置时展开为多条。</p>
  <p><b>与导出的关系</b>：分身在每一处都<b>完整呈现原文内容</b>，因为用分身构建文献引用时，同一条引文在不同章节都应当读得到，让读者跳去别处查看并不合理。编号仍只算源，同一段不会被编两次号。</p>
  <p>如果你确实希望它写成「同一条目，另见 §2.1」那种交叉引用，导出面板里有一个开关可以切换。</p>
  <p><b>脱离</b>：右键分身选<b>脱离为独立卡片</b>，它会就地固化成一张普通卡片，此后与源各改各的。删除源时，第一个分身会自动继承内容成为新的源，内容不会丢。</p>
  <p class="tip">分身和页面、锁定互不冲突：页面管输出单元，锁定管防误碰，分身管同一内容的多处呈现。锁定的卡片同样可以创建分身。</p>`],

 ["存档与长期保存","CUNDANG",`
  <p>这是防止资料作废的核心机制。导出面板选<b>存档包</b>，得到一个 zip，里面有四样东西：</p>
  <ul>
    <li><b>pages/</b> 每个页面一份 Markdown 纯文本，标题层级、正文、标签、链接、交叉引用都在，任何编辑器、任何系统、二十年后都能打开</li>
    <li><b>assets/</b> 全部图片原件，Markdown 里按文件名引用，图片可以单独查看</li>
    <li><b>board.json</b> 完整画布数据，可重新导入本程序，保留位置、连线、分身、模板</li>
    <li><b>README.md</b> 说明包内结构</li>
  </ul>
  <p>可选勾选"同时渲染每页的图片"，再附一份 images/ 目录，保留画布的空间布局。</p>
  <p class="tip">建议每完成一个阶段就导一次存档包，放进云盘。即使本程序某天无法运行，pages 和 assets 仍是完整可读的资料，不依赖任何软件。</p>`],

 ["自动快照","ZIDONGKUAIZHAO",`
  <p>程序每十分钟自动在浏览器本地存一份结构快照，保留最近十二份，并按天各保留一份共七天。</p>
  <p>因为图片是单独存放的，快照只含结构数据，通常只有几百 KB，存几十份也不占地方。</p>
  <p>从<b>文件 → 自动快照</b>选择时间点即可回滚，列表显示时间、卡片数量和当时的文件名。回滚前会先把当前状态也存成一份快照，所以回滚本身也是可逆的。</p>
  <p class="tip">快照防的是误操作，存档包防的是程序失效，两者互补，都不能替代把文件放进云盘。</p>`],

 ["表格","BIAOGE",`
  <p>右键空白处选<b>插入表格</b>，从预设的行列数里挑一个即可。表格是卡片的一种形态，所以移动、选中、锁定、页面归属、导出顺序、整体缩放全都和普通卡片一样。</p>
  <p><b>编辑</b>：双击任意单元格进入编辑。<kbd>Tab</kbd> 移到右邻单元格，<kbd>Shift</kbd> + <kbd>Tab</kbd> 向左，行尾会自动折到下一行开头。<kbd>Enter</kbd> 移到下一行同列，在最后一行按 <kbd>Enter</kbd> 会自动新增一行，所以连续录入不用碰菜单。<kbd>Esc</kbd> 退出编辑。</p>
  <p><b>列宽</b>：每两列之间有一条贯穿整个表格高度的分隔线，在任意行的位置都能拖动，选中表格时会显出一条淡线提示位置。默认是在相邻两列之间挪动边界，表格总宽不变；按住 <kbd>Alt</kbd> 拖动则只加宽当前列，整个表格随之变宽。右键菜单里有<b>列宽均分</b>。</p>
  <p><b>整体缩放</b>：拖动卡片四周的控制点可以等比缩放整张表，所有列宽按同一比例跟随，表格不会溢出选中框。新建时的列宽按当前基准字号推算，一开始就是舒服的宽度，输入文字之后也不会再变。</p>
  <p><b>移动整张表</b>：表格未被选中时，在它上面拖动就是移动整张表，和普通卡片一样。选中之后在格子上拖动才是框选单元格，两个手势因此不冲突。删除也一样：没有单元格选区时按 <kbd>Delete</kbd> 删掉整张表，有选区时则只清空选中格子的内容，按 <kbd>Esc</kbd> 可取消选区。</p>
  <p><b>选中单元格</b>：表格选中后在单元格上拖动即可框选一片区域，<kbd>Shift</kbd> 点击扩展选区，选中表格后按 <kbd>Ctrl/Cmd</kbd> + <kbd>A</kbd> 选中全部单元格。右键菜单里有<b>选中整行</b>和<b>选中整列</b>。选中的格子会有淡蓝底色，按 <kbd>Esc</kbd> 取消。</p>
  <p><b>逐格排版</b>：有选区时，工具栏的对齐、加粗、斜体、文字颜色、底色都只作用于选中的格子，所以可以让数字列居中、否定项标红、重点行加底色。没有选区时这些操作作用于整张表。<b>清除</b>会去掉选中格子的全部逐格设定。</p>
  <p><b>增删行列</b>：右键某个单元格，可在其上下左右插入或删除。若当前有选区，插入和删除会按选区的行列数批量进行，比如选中三行后删除即一次删掉三行。菜单里另有<b>清空选中单元格</b>，只清内容不动结构；直接按 <kbd>Delete</kbd> 效果相同。</p>
  <p><b>标题栏</b>：右键菜单里可分别开关<b>标题行</b>和<b>标题列</b>，两者可以同时开启。标题会加粗并带浅底色，导出时映射为真正的表头。</p>
  <p><b>单元格内换行</b>：<kbd>Shift</kbd> + <kbd>Enter</kbd> 或 <kbd>Alt</kbd> + <kbd>Enter</kbd>。单独按 <kbd>Enter</kbd> 是移到下一行的单元格。</p>
  <p><b>与 Excel 互通</b>：从 Excel、Word 或网页表格复制的内容，粘进任意单元格会自动铺开成多行多列，行列不够自动补齐；粘在画布空白处则直接生成一张新表。含换行、制表符或引号的单元格都能正确还原，不会串行。</p>
  <p>反向也通：选中表格（不进入编辑）按 <kbd>Ctrl/Cmd</kbd> + <kbd>C</kbd>，或用右键菜单的<b>复制整张表格</b>，粘进 Excel 就是规规矩矩的单元格，不是一整坨文字。</p>
  <p><b>导出</b>：Word 里是真正的表格对象，可继续编辑；PDF 和 HTML 是标准表格标签；Markdown 是管道表格，能被任何 Markdown 编辑器识别。逐格设定的对齐会一并带过去（Markdown 写在分隔行里，取每列的第一个设定）。表格内容也纳入全文检索。</p>
  <p>右键菜单底部的<b>转为纯文字</b>可以把表格拆回普通文字卡片，内容以制表符分隔保留。</p>
  <p class="tip">与页面的区别：页面管的是输出单元的划分，表格管的是结构化内容本身。文献对照、方法比较、时间线这类信息用表格比用一堆卡片清楚得多。</p>`],

 ["页面地图","YEMIANDITU",`
  <p>页面多了之后靠平移找位置会很慢。按 <kbd>M</kbd> 或从右键菜单打开<b>页面地图</b>，右下角浮出一张全局缩略图。</p>
  <p>地图是按真实比例和布局绘制的预览：方框是页面，灰色小块是卡片，密度即内容分布。地图里不写文字，因为缩略之后文字必然被截断，反而干扰对布局的判断，名称交给悬停提示。</p>
  <p><b>点页面方框</b>跳过去并框住整页，同时该页在地图上成为选中态，底色略深、描边加粗，你能一眼看出刚才去的是哪一页。<b>点空白处</b>平移到该位置并取消选中。</p>
  <p><b>鼠标悬停</b>在任意页面上会浮出完整标题，名称再长、方框再小都能确认是哪一页；悬停的页面同时会有一层更淡的底色作为呼应。</p>
  <p>底部输入框可按名称筛选页面：匹配的加粗描边，其余淡出，右侧显示"匹配数 / 总数"。回车直接跳到第一个匹配的页面。</p>
  <p>地图用的是缩略图而不是列表，因为页面在画布上的相对位置本身就是记忆线索，列表会把这个信息丢掉。开关状态随文件保存。</p>
  <p><b>放大与平移</b>：页面积累到几百个时，全览下每一页会小到无法辨认（三百页时每页只有十几像素宽）。在地图上滚动滚轮即可放大，拖动空白处平移，双击或点右下角的全览按钮回到整体视图。放大后右下角显示当前倍率。</p>
  <p><b>面板可以拉大</b>：拖动地图左上角的小三角可以调整面板尺寸，最大到九百像素宽。尺寸随文件保存。</p>
  <p class="tip">实测四百个页面、两万张卡片时地图绘制只需十几毫秒，放大状态下只绘制可见部分，所以可以一直开着不用担心拖慢。</p>`],

 ["页面","YEMIAN",`
  <p>页面是画布上一块有名字的矩形区域，用来划分输出单元。选中若干卡片后右键<b>新建页面</b>，会自动框住它们；不选任何东西直接新建，则在视野中央生成一个空页面，之后把卡片拖进去即可。</p>
  <p><b>归属靠位置，不靠名单。</b>卡片中心落在框内就属于这一页，拖出去就自动脱离，不需要任何手动维护，也不会出现名单与实际位置对不上的情况。</p>
  <p>拖动页面左上角的标题即可整体移动，框内卡片一起走；右下角小圆点调整大小。双击标题重命名。右键标题打开页面菜单：重命名、选中本页全部内容、收拢到内容大小、单独导出本页、删除页框（保留卡片）、连同卡片一起删除。</p>
  <p><b>与阅读顺序的关系</b>：导出时先按页面排序，页面之间的先后由它们的位置决定；页面内部再按你设定的按列或按行规则排。不属于任何页面的卡片排在所有页面之后。</p>
  <p><b>与分级标题的关系</b>：导出文档时可选<b>页面标题作为最高级标题</b>（默认开启）。此时页面标题占据最高一级，卡片的一级标题顺延为第二级，编号相应变成 1.1、1.2、2.1 这样，跨页连续不重复。这正好还原你摆卡片时的心理结构：你想的是"这一章里的一级标题"，而不是"全文的一级标题"。</p>
  <p>关掉该选项则回到平铺结构，页面只用于分组和分页导出，不进入文档层级。</p>
  <p>标题层级不再限定三级，需要更细时可继续往下推，导出时自动映射到 Word 的第四、五、六级标题。</p>
  <p class="tip">页面回答的是"这些属于同一个输出单元"，是产出期的结构，与锁定、分身各管各的事，互不冲突。</p>`],

 ["连线备注","LIANXIANBEIZHU",`
  <p>右键点在线上选<b>连线备注…</b>，可以写下这条关联意味着什么。</p>
  <p>写了备注的连线，中点会出现一个实心小圆点。悬停显示完整内容，点击圆点直接打开编辑框。内容默认不占画面，所以备注再多也不会把画布变成一团字。</p>
  <p>需要通览时，把<b>连线显示</b>里的批注标记切到<b>简短标签</b>，第一行文字会显示在线上；切到<b>不显示</b>则连圆点也隐藏。</p>
  <p>备注会写进导出的文档，附在对应的交叉引用行后面，附录关系表里也有独立一列。</p>`],

 ["连线显示","LIANXIANXIANSHI",`
  <p>右键空白处的<b>连线显示</b>控制连线的可见程度，用来解决线多了干扰阅读的问题。</p>
  <ul>
    <li><b>聚焦时显示</b>（默认）：所有线常态压得很淡，鼠标悬停或选中某张卡片时，与它相关的线才亮起</li>
    <li><b>始终显示</b>：全部保持完整不透明度</li>
    <li><b>隐藏</b>：完全不画，数据仍然保留</li>
  </ul>
  <p class="tip">一个想法关联很多条时，聚焦显示尤其有用：点中枢纽卡片，它的全部关联一次亮出，其余全暗，比在线团里找线头快得多。</p>`],

 ["结构连线","JIEGOULIANXIAN",`
  <p>连线有两种含义，右键某条连线，在<b>这条连线的含义</b>里切换：</p>
  <ul>
    <li><b>结构</b>：指向的是下级。这类连线决定文档大纲，画成实线、略粗、颜色更实。</li>
    <li><b>关联</b>：两者只是相关。这类连线不参与层级，画成虚线、略淡，导出时作为交叉引用出现。</li>
  </ul>
  <p>之所以要明确标记而不是靠样式约定，是因为这两者的语义完全不同：一个决定文档骨架，一个是横向参照。靠看线的样子去猜迟早会混。</p>
  <p><b>大纲跟随连线</b>：只要画布上存在结构连线，编号和导出层级就由连线的树形关系决定，而不再依赖卡片的空间位置。所以你可以随意挪动卡片，编号不会乱。同级之间按位置从上到下、从左到右排序。</p>
  <p><b>方向由标题层级决定，不看你怎么画的</b>：一级标题永远是上级，二级在它之下，以此类推；没有标层级的卡片永远是末端内容。所以连线时完全不用管从哪头拉到哪头，也不需要箭头。只有两端层级相同时，才会退回到按连线本身的方向判断。</p>
  <p><b>批量转换</b>：右键页面标题的<b>本页的连线</b>，可以把这一页内部的连线一次全部设为结构连线或关联连线。只影响两端都在本页内的连线，跨页的连线不受影响。</p>
  <p>规则是：有下级的卡片、或自己标了层级的卡片算标题，参与编号；纯末端且没标层级的卡片算正文内容，挂在上级标题之下。没有被任何结构连线串起来的卡片，仍按原来的空间顺序接在文档后面，不会丢失。</p>
  <p><b>关联连线的含义是"这两处属于一起"</b>：导出时程序会把相连的内容拉到相邻位置，而不是写一行"另见某节"，也不重复输出。所以你在画布上把有关的两段连起来，导出的文档里它们就是挨着的。这比让读者跳去别处查看要顺畅得多。</p>
  <p>只有标题不会被拉动，因为那是文档骨架。可以在视图菜单里用<b>关联的内容排在一起</b>关掉这个行为。</p>
  <p>两类连线都不再产生"另见"：结构连线已经体现为层级，关联连线已经体现为相邻排列。</p>
  <p>右键空白处的<b>默认连线样式</b>里可以设定新连线默认是哪一种。整套机制可以在视图菜单里用<b>大纲跟随连线</b>关掉，关掉后回到按空间位置推断层级的老办法。</p>
  <p class="tip">这样画布本身就是一张思维导图，导出的 Word 文档结构与你在画布上看到的完全一致。</p>`],

 ["连线","LIANXIAN",`
  <p>鼠标悬停卡片时四边出现小圆点，从圆点拖到另一张卡片即可连线。也可用右键的<b>从这里连线</b>，再点目标。</p>
  <p>右键点在线上可调整：线型（曲线、折线、直线）、实线或虚线、粗细、箭头（无、单向、双向）、颜色、反转方向、删除。</p>
  <p>右键空白处的<b>默认连线样式</b>决定新连线的初始外观，新连线默认不带箭头。该子菜单底部的<b>套用到全部连线</b>可以把当前这套样式一次刷到画布上所有连线，适合统一风格或批量去掉箭头。</p>`],

 ["平移与缩放","PINGYI",`
  <p>平移：按住空格拖动、按住 <kbd>Alt</kbd> 拖动、或中键拖动。左键拖空白处是框选，不是平移。</p>
  <p>缩放：滚轮或触控板捏合，以光标位置为中心。<kbd>F</kbd> 适应全部内容，<kbd>0</kbd> 回到 100%。</p>`],

 ["全屏","QUANPING",`
  <p>右键菜单的<b>全屏显示</b>去掉浏览器所有外壳。进入演示模式时会自动全屏，退出时自动还原。</p>
  <p class="tip">想双击图标就直接进入无边框窗口，可以做一个用 --app 参数启动 Chrome 的快捷方式。</p>`],

 ["删除","SHANCHU",`
  <p>选中后按 <kbd>Delete</kbd> 或 <kbd>Backspace</kbd>。删除卡片时与之相连的连线一并移除。锁定组内的内容不受影响。</p>`],

 ["搜索","SOUSUO",`
  <p><kbd>Ctrl/Cmd</kbd> + <kbd>F</kbd> 唤出，或开启工作模式让它常驻。左侧小按钮切换两种范围：</p>
  <ul>
    <li><b>全文</b>：正文和标签一起搜</li>
    <li><b>标签</b>：只匹配标签，支持前缀部分匹配，输「方法」能命中 #方法论</li>
  </ul>
  <p>输入即时过滤，命中项加虚线框，其余淡出但保留位置，画布结构依然可见。回车逐个跳转并居中，<kbd>Shift</kbd> + 回车反向。输入框带自动补全。</p>`],

 ["锁定","SUODING",`
  <p>用来保护已经定稿的内容，避免整理其他材料时误碰。分两级，都在右键菜单的<b>锁定</b>子菜单里：</p>
  <ul>
    <li><b>仅锁定内容</b>：改不动文字、格式、层级，也删不掉，但仍可移动、缩放、连线。适合已经写定但位置还要调的内容。</li>
    <li><b>锁定内容与位置</b>：连位置和尺寸也钉住，缩放控制点不再出现，完全不动。适合已经排好版、不希望再有任何变化的部分。</li>
  </ul>
  <p><b>解锁同样分两级</b>：<b>解除位置锁定</b>降回仅锁内容，方便临时挪一挪；<b>完全解锁</b>则彻底放开。</p>
  <p>快捷键 <kbd>Ctrl/Cmd</kbd> + <kbd>L</kbd> 切换仅锁内容，加 <kbd>Shift</kbd> 切换锁内容与位置。</p>
  <p>锁定没有任何视觉标注，因为一旦动不了你自然就知道它锁着了。</p>
  <p><b>拖动的含义随锁定级别而变</b>：仅锁定内容时卡片还能移动，所以在卡片上拖动就是移动它；锁定内容与位置之后卡片挪不动了，此时拖动改为划选文字，方便复制引用。两者不会互相干扰。</p>
  <p>从空白处拖出的框选依然能选中锁定的卡片，因为选中本身不改变任何东西，真正的保护在每一项操作里各自判断。这样你才能框选一批锁定的内容一起解锁，或者把仅锁定内容的一批卡片一起挪走。</p>
  <p><b>相关的连线也随之锁定</b>：只要连线的任意一端被锁，这条线就不能删除、不能改样式，但仍可写备注。</p>
  <p><b>整页锁定</b>：右键页面标题的<b>锁定本页</b>，两级模式与解锁选项同样齐全，一次作用于页内全部卡片。需要改其中一张时单独解锁，改完再整页锁一次即可全部锁回，不必记住谁被解过。</p>

/* ================= ZIP 打包（无压缩，纯自写，不依赖任何库） ================= */
const CRCT=(()=>{const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}

function zipMake(files){

    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);

    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,now.t,true);ch.setUint16(14,now.d,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);

function outlineForest(list){
  const set=new Set((list||S.cards).map(c=>c.id));

  if(!ls.length)return null;

      counters.length=n.lv;
      n.num=(prefix?prefix+".":"")+counters.map(x=>x||0).join(".");
      n.sec=n.num;
    }
    else n.sec=n.parent?n.parent.sec:"";
    n.out=n.lv?n.lv+shift:0;
    walk(n.children);
  });
  walk(roots);
  const flatten=l=>l.forEach(n=>{flat.push(n);flatten(n.children)});
  flatten(roots);
  flat=attachBibKids(pullTogether(flat));
  const byId={};flat.forEach(n=>{byId[n.c.id]=n;
    if(!n.isRef&&!byId[orig(n.c).id])byId[orig(n.c).id]=n});
  return {roots,flat,byId};
}
function secTag(n){
  if(!n)return "";
  if(n.apx||(n.parent&&n.parent.apx))return t("apxLabel")+" "+(n.num||n.sec)+" ";
  return n.num?("\u00A7"+n.num+" "):(n.sec?("\u00A7"+n.sec+" "):"");
}
function refLabel(n){return secTag(n)+snippet(orig(n.c),26)}
function relName(l){return t(RELMAP[l.color]||"relPlain")+(l.arrow==="both"?" / "+t("relBoth"):"")}
function relationsFor(id,byId){
  // 结构连线已经体现为文档层级，不再重复写成"另见"

  const out=[],inn=[];
  S.links.forEach(l=>{
    if(l.st&&S.outline!==false)return;        // 结构连线已体现为层级
    if(!l.st&&S.relAdjacent!==false)return;   // 关联连线已体现为相邻排列
    if(l.a===id&&byId[l.b])out.push({n:byId[l.b],l});
    if(l.b===id&&byId[l.a])inn.push({n:byId[l.a],l});
  });
  return {out,inn};
}

async function exportArchive(o){
  const files=[];
  const groups=pageGroups(null);
  const stamp=new Date().toISOString().slice(0,16).replace("T"," ");
  // 1) 每页一份 Markdown
  const index=["# "+o.title,"","导出时间 "+stamp,"",
    "本压缩包的结构：","","- `pages/` 每个页面一份 Markdown，纯文本，任何编辑器都能打开",
    "- `assets/` 全部图片原件，Markdown 中按文件名引用",
    "- `board.json` 完整画布数据，可重新导入本程序",
    "- 若本程序某天无法使用，`pages/` 和 `assets/` 依然是完整可读的资料",""];
  groups.forEach((g,i)=>{
    const nm=safeName(g.title,i+1);
    const tree=buildTree(g.cards);
    files.push({name:"pages/"+nm+".md",data:docMD({...o,title:g.title},tree)});
    index.push("- pages/"+nm+".md　"+g.cards.length+t("bkCards"));
  });
  files.push({name:"README.md",data:index.join("\n")});
  // 2) 图片原件
  const used=new Set();
  S.cards.forEach(c=>{const o2=orig(c);if(o2.ih&&IMG.has(o2.ih))used.add(o2.ih)});
  used.forEach(h=>{
    const u=IMG.get(h);
    files.push({name:"assets/"+h+"."+extOf(u),data:dataURLtoBytes(u)});
  });
  // 3) 完整数据
  files.push({name:"board.json",data:JSON.stringify(bundle(null),null,1)});
  // 4) 可选：每页一张渲染图
  if(o.shots){
    for(let i=0;i<groups.length;i++){
      try{
        const cv=await captureCanvas(o.scale||2,groups[i].cards);
        files.push({name:"images/"+safeName(groups[i].title,i+1)+".jpg",
          data:dataURLtoBytes(cv.toDataURL("image/jpeg",.92))});
      }catch(e){}
    }
  }
  dl(zipMake(files),o.title+".zip");
  toast(t("expDone"));
}

async function doExport(o){
  const list=exportSet(o);
  if(o.scope==="sel"&&!list){toast(t("needSel"));return}
  if(o.fmt==="json"){download(bundle(list),o.title+".json");return}
  if(o.fmt==="md"){
    const tree=buildTree(list);
    dl(new Blob([docMD(o,tree)],{type:"text/markdown;charset=utf-8"}),o.title+".md");
    toast(t("expDone"));return;
  }
  if(o.fmt==="zip"){try{await exportArchive(o)}catch(e){toast(((e&&e.message)||"")+" "+t("errShot"))}return}
  if(o.fmt==="jpg"||o.fmt==="pdfview"){
    try{
      if(o.byPage){
        if(o.fmt==="jpg")await exportPageShots(o);else await exportPagePDF(o);
        toast(o.fmt==="jpg"?t("expDone"):t("expPrint"));
        return;
      }
      const cv=await captureCanvas(o.scale,list);
      if(o.fmt==="jpg"){cv.toBlob(b=>dl(b,o.title+".jpg"),"image/jpeg",.93);toast(t("expDone"))}
      else{printImage(cv.toDataURL("image/jpeg",.94),o.title);toast(t("expPrint"))}
    }catch(e){toast(((e&&e.message)||"")+" "+t("errShot"))}
    return;
  }
  const tree=buildTree(list);
  if(o.fmt==="pdfdoc"){printHTML(docHTML(o,tree,true),o.title);toast(t("expPrint"));return}
  try{const D=await loadDocx();await exportDocx(D,o,tree)}
  catch(e){exportDocHTML(o,tree)}
  toast(t("expDone"));
}
function loadDocx(){
  if(window.docx)return Promise.resolve(window.docx);

    const el=document.createElement("script");
    el.src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js";
    el.onload=()=>window.docx?res(window.docx):rej();el.onerror=rej;
    document.head.appendChild(el);
    setTimeout(()=>{window.docx?res(window.docx):rej()},9000);
